      а доверять их Тебе. Напомни мне, что Ты заботишься обо мне и держишь мою жизнь в Своих
      руках. Наполни мое сердце миром и уверенностью в Твоей любви. Во имя Иисуса Христа.
      Аминь.
- id: day_034
  ref: 1co:16:13
  title:
    ru: Духовная бдительность
    en: Духовная бдительность
    es: Духовная бдительность
    uk: Духовная бдительность
  text:
    ru: Господи, помоги мне бодрствовать и хранить свое сердце. Не дай мне привыкнуть к греху
      или стать равнодушным к Твоему голосу. Укрепляй меня в вере и помогай ежедневно искать
      Тебя. Пусть моя жизнь будет наполнена духовной трезвостью и посвящением Тебе. Аминь.
    en: Господи, помоги мне бодрствовать и хранить свое сердце. Не дай мне привыкнуть к греху
      или стать равнодушным к Твоему голосу. Укрепляй меня в вере и помогай ежедневно искать
      Тебя. Пусть моя жизнь будет наполнена духовной трезвостью и посвящением Тебе. Аминь.
    es: Господи, помоги мне бодрствовать и хранить свое сердце. Не дай мне привыкнуть к греху
      или стать равнодушным к Твоему голосу. Укрепляй меня в вере и помогай ежедневно искать
      Тебя. Пусть моя жизнь будет наполнена духовной трезвостью и посвящением Тебе. Аминь.
    uk: Господи, помоги мне бодрствовать и хранить свое сердце. Не дай мне привыкнуть к греху
      или стать равнодушным к Твоему голосу. Укрепляй меня в вере и помогай ежедневно искать
      Тебя. Пусть моя жизнь будет наполнена духовной трезвостью и посвящением Тебе. Аминь.
- id: day_035
  ref: act:1:8
  title:
    ru: Сила Святого Духа
    en: Сила Святого Духа
    es: Сила Святого Духа
    uk: Сила Святого Духа
  text:
    ru: Дух Святой, благодарю Тебя за Твое присутствие в моей жизни. Наполняй меня Своей силой,
      мудростью и водительством. Помоги мне жить так, чтобы мои мысли, слова и поступки были
      угодны Богу. Веди меня по пути истины и укрепляй в каждом испытании. Во имя Иисуса Христа.
      Аминь.
    en: Дух Святой, благодарю Тебя за Твое присутствие в моей жизни. Наполняй меня Своей силой,
      мудростью и водительством. Помоги мне жить так, чтобы мои мысли, слова и поступки были
      угодны Богу. Веди меня по пути истины и укрепляй в каждом испытании. Во имя Иисуса Христа.
      Аминь.
    es: Дух Святой, благодарю Тебя за Твое присутствие в моей жизни. Наполняй меня Своей силой,
      мудростью и водительством. Помоги мне жить так, чтобы мои мысли, слова и поступки были
      угодны Богу. Веди меня по пути истины и укрепляй в каждом испытании. Во имя Иисуса Христа.
      Аминь.
    uk: Дух Святой, благодарю Тебя за Твое присутствие в моей жизни. Наполняй меня Своей силой,
      мудростью и водительством. Помоги мне жить так, чтобы мои мысли, слова и поступки были
      угодны Богу. Веди меня по пути истины и укрепляй в каждом испытании. Во имя Иисуса Христа.
      Аминь.
- id: day_036
  ref: eph:4:32
  title:
    ru: Прощение обид
    en: Прощение обид
    es: Прощение обид
    uk: Прощение обид
  text:
    ru: Господи, иногда мне трудно прощать тех, кто причинил мне боль. Но Ты простил меня
      гораздо больше. Помоги мне отпустить обиду и не хранить горечь в сердце. Дай мне любовь
      и милость по отношению к людям. Пусть мое сердце будет свободным от непрощения. Во имя
      Иисуса Христа. Аминь.
    en: Господи, иногда мне трудно прощать тех, кто причинил мне боль. Но Ты простил меня
      гораздо больше. Помоги мне отпустить обиду и не хранить горечь в сердце. Дай мне любовь
      и милость по отношению к людям. Пусть мое сердце будет свободным от непрощения. Во имя
      Иисуса Христа. Аминь.
    es: Господи, иногда мне трудно прощать тех, кто причинил мне боль. Но Ты простил меня
      гораздо больше. Помоги мне отпустить обиду и не хранить горечь в сердце. Дай мне любовь
      и милость по отношению к людям. Пусть мое сердце будет свободным от непрощения. Во имя
      Иисуса Христа. Аминь.
