- id: day_038
  ref: ps:145:3
  title:
    ru: Благодарность за Божью верность
    en: Благодарность за Божью верность
    es: Благодарность за Божью верность
    uk: Благодарность за Божью верность
  text:
    ru: Господи, благодарю Тебя за то, что Ты никогда не оставляешь меня. Даже когда я был
      слаб, Ты поддерживал меня. Даже когда я сомневался, Ты оставался верным. Помоги мне
      помнить Твои благодеяния и жить с благодарным сердцем. Во имя Иисуса Христа. Аминь.
    en: Господи, благодарю Тебя за то, что Ты никогда не оставляешь меня. Даже когда я был
      слаб, Ты поддерживал меня. Даже когда я сомневался, Ты оставался верным. Помоги мне
      помнить Твои благодеяния и жить с благодарным сердцем. Во имя Иисуса Христа. Аминь.
    es: Господи, благодарю Тебя за то, что Ты никогда не оставляешь меня. Даже когда я был
      слаб, Ты поддерживал меня. Даже когда я сомневался, Ты оставался верным. Помоги мне
      помнить Твои благодеяния и жить с благодарным сердцем. Во имя Иисуса Христа. Аминь.
    uk: Господи, благодарю Тебя за то, что Ты никогда не оставляешь меня. Даже когда я был
      слаб, Ты поддерживал меня. Даже когда я сомневался, Ты оставался верным. Помоги мне
