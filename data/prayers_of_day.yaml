      Иисуса Христа. Аминь.
- id: day_037
  ref: ph:4:8
  title:
    ru: Чистота мыслей
    en: Чистота мыслей
    es: Чистота мыслей
    uk: Чистота мыслей
  text:
    ru: Отец Небесный, помоги мне хранить свои мысли в чистоте. Удали все, что не приносит
      славы Тебе. Научи меня размышлять о том, что истинно, честно и достойно похвалы. Пусть
      мой разум будет обновляться через Твое Слово каждый день. Аминь.
    en: Отец Небесный, помоги мне хранить свои мысли в чистоте. Удали все, что не приносит
      славы Тебе. Научи меня размышлять о том, что истинно, честно и достойно похвалы. Пусть
      мой разум будет обновляться через Твое Слово каждый день. Аминь.
    es: Отец Небесный, помоги мне хранить свои мысли в чистоте. Удали все, что не приносит
