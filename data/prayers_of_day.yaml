# Молитвы на каждый день года (366 дней; 366-я — для високосного года).
# Молитва дня выбирается по номеру дня в году (см. services/prayer_service.py).
# Эти же молитвы используются как пул «Случайная молитва».
# Поля:
#   id    — day_NNN (NNN = номер дня года)
#   ref   — канонический (масоретский) стих «abbrev:chapter:verse»
#   title — заголовок молитвы на 4 языках
#   text  — текст молитвы на 4 языках
# Сгенерировано scripts/build_prayers_of_day.py — не редактировать вручную.
- id: day_001
  ref: jm:1:5
  title:
    ru: Мудрость на каждый день
    en: Wisdom for Every Day
    es: Sabiduría para Cada Día
    uk: Мудрість на кожен день
  text:
    ru: Господи, благодарю Тебя за новый день, который Ты мне даровал. Прошу Тебя, направляй
      мои мысли, слова и поступки. Дай мне мудрость принимать правильные решения и не уклоняться
      от Твоих путей. Помоги видеть обстоятельства так, как видишь их Ты, и доверять Тебе
      даже тогда, когда я не понимаю происходящего. Пусть моя жизнь сегодня прославляет Тебя.
      Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for the new day You have given me. I ask You to guide my thoughts,
      words, and actions. Give me wisdom to make right decisions and not to stray from Your
      ways. Help me to see circumstances as You see them, and to trust You even when I do
      not understand what is happening. May my life glorify You today. In the name of Jesus
      Christ. Amen.
    es: Señor, te doy gracias por el nuevo día que me has regalado. Te pido que guíes mis
      pensamientos, mis palabras y mis actos. Dame sabiduría para tomar decisiones correctas
      y no apartarme de Tus caminos. Ayúdame a ver las circunstancias como Tú las ves, y a
      confiar en Ti aun cuando no entiendo lo que sucede. Que mi vida te glorifique hoy. En
      el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за новий день, який Ти мені дарував. Прошу Тебе, скеровуй мої
      думки, слова й вчинки. Дай мені мудрість приймати правильні рішення і не ухилятися від
      Твоїх доріг. Допоможи бачити обставини так, як бачиш їх Ти, і довіряти Тобі навіть тоді,
      коли я не розумію того, що відбувається. Нехай моє життя сьогодні прославляє Тебе. В
      ім'я Ісуса Христа. Амінь.
- id: day_002
  ref: prv:3:5
  title:
    ru: Доверие Богу
    en: Trust in God
    es: Confianza en Dios
    uk: Довіра Богові
  text:
    ru: Небесный Отец, сегодня я доверяю свою жизнь в Твои руки. Помоги мне не полагаться
      только на собственное понимание, но искать Твою волю во всех делах. Когда появляются
      сомнения и тревоги, напоминай мне о Своей верности. Укрепи мою веру и научи следовать
      за Тобой с открытым сердцем. Благодарю Тебя за заботу и любовь. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, today I place my life into Your hands. Help me not to lean only on
      my own understanding, but to seek Your will in everything. When doubts and worries arise,
      remind me of Your faithfulness. Strengthen my faith and teach me to follow You with
      an open heart. Thank You for Your care and love. In the name of Jesus Christ. Amen.
    es: Padre celestial, hoy pongo mi vida en Tus manos. Ayúdame a no apoyarme solo en mi
      propio entendimiento, sino a buscar Tu voluntad en todo. Cuando surjan las dudas y las
      preocupaciones, recuérdame Tu fidelidad. Fortalece mi fe y enséñame a seguirte con el
      corazón abierto. Gracias por Tu cuidado y Tu amor. En el nombre de Jesucristo. Amén.
    uk: Небесний Отче, сьогодні я довіряю своє життя у Твої руки. Допоможи мені не покладатися
      лише на власне розуміння, а шукати Твою волю в усьому. Коли з'являються сумніви й тривоги,
      нагадуй мені про Свою вірність. Зміцни мою віру й навчи йти за Тобою з відкритим серцем.
      Дякую Тобі за турботу й любов. В ім'я Ісуса Христа. Амінь.
- id: day_003
  ref: ph:4:6
  title:
    ru: Мир в сердце
    en: Peace in the Heart
    es: Paz en el Corazón
    uk: Мир у серці
  text:
    ru: Господи, Ты источник истинного мира. Прошу Тебя, успокой мое сердце и удали всякий
      страх. Помоги мне помнить, что Ты рядом и держишь всё под Своим контролем. Научи меня
      приносить Тебе все заботы в молитве и не позволять тревогам управлять моей жизнью. Наполни
      меня Своим присутствием и дай покой душе моей. Во имя Иисуса Христа. Аминь.
    en: Lord, You are the source of true peace. I ask You to calm my heart and take away every
      fear. Help me to remember that You are near and hold everything under Your control.
      Teach me to bring all my cares to You in prayer and not to let worry rule my life. Fill
      me with Your presence and give rest to my soul. In the name of Jesus Christ. Amen.
    es: Señor, Tú eres la fuente de la verdadera paz. Te pido que calmes mi corazón y quites
      todo temor. Ayúdame a recordar que estás cerca y que tienes todo bajo Tu control. Enséñame
      a traerte todas mis preocupaciones en oración y a no dejar que la inquietud gobierne
      mi vida. Lléname de Tu presencia y da descanso a mi alma. En el nombre de Jesucristo.
      Amén.
    uk: Господи, Ти — джерело справжнього миру. Прошу Тебе, заспокой моє серце й віджени всякий
      страх. Допоможи мені пам'ятати, що Ти поруч і тримаєш усе під Своїм контролем. Навчи
      мене приносити Тобі всі турботи в молитві й не дозволяти тривозі керувати моїм життям.
      Наповни мене Своєю присутністю й дай спокій моїй душі. В ім'я Ісуса Христа. Амінь.
- id: day_004
  ref: 1ts:5:18
  title:
    ru: Благодарное сердце
    en: A Grateful Heart
    es: Un Corazón Agradecido
    uk: Вдячне серце
  text:
    ru: Отец Небесный, благодарю Тебя за все благословения, которые Ты посылаешь в мою жизнь.
      Помоги мне замечать Твою руку не только в радостях, но и в испытаниях. Научи меня быть
      благодарным человеком и не принимать Твои дары как должное. Пусть хвала и благодарение
      всегда живут в моем сердце. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for all the blessings You send into my life. Help me to
      notice Your hand not only in joys but also in trials. Teach me to be a grateful person
      and not to take Your gifts for granted. May praise and thanksgiving always live in my
      heart. In the name of Jesus Christ. Amen.
    es: Padre celestial, te doy gracias por todas las bendiciones que envías a mi vida. Ayúdame
      a reconocer Tu mano no solo en las alegrías, sino también en las pruebas. Enséñame a
      ser una persona agradecida y a no dar por sentados Tus dones. Que la alabanza y la gratitud
      vivan siempre en mi corazón. En el nombre de Jesucristo. Amén.
    uk: Небесний Отче, дякую Тобі за всі благословення, які Ти посилаєш у моє життя. Допоможи
      мені помічати Твою руку не лише в радощах, а й у випробуваннях. Навчи мене бути вдячною
      людиною й не сприймати Твої дари як належне. Нехай хвала й подяка завжди живуть у моєму
      серці. В ім'я Ісуса Христа. Амінь.
- id: day_005
  ref: ph:4:13
  title:
    ru: Сила для испытаний
    en: Strength for Trials
    es: Fuerza para las Pruebas
    uk: Сила для випробувань
  text:
    ru: Господи, иногда трудности кажутся слишком большими для меня. Но я знаю, что Ты силен
      поддержать и укрепить меня. Помоги мне не унывать и не терять надежду. Дай мне мужество
      пройти через все испытания, сохраняя верность Тебе. Пусть Твоя сила совершается в моей
      немощи. Во имя Иисуса Христа. Аминь.
    en: Lord, sometimes the difficulties seem too great for me. But I know that You are able
      to uphold and strengthen me. Help me not to lose heart or give up hope. Give me the
      courage to walk through every trial while staying faithful to You. May Your strength
      be made perfect in my weakness. In the name of Jesus Christ. Amen.
    es: Señor, a veces las dificultades me parecen demasiado grandes. Pero sé que Tú eres
      capaz de sostenerme y fortalecerme. Ayúdame a no desanimarme ni perder la esperanza.
      Dame valor para atravesar cada prueba permaneciendo fiel a Ti. Que Tu fuerza se perfeccione
      en mi debilidad. En el nombre de Jesucristo. Amén.
    uk: Господи, іноді труднощі здаються мені надто великими. Але я знаю, що Ти здатен підтримати
      й зміцнити мене. Допоможи мені не занепадати духом і не втрачати надію. Дай мені мужність
      пройти крізь усі випробування, залишаючись вірним Тобі. Нехай Твоя сила вдосконалюється
      в моїй немочі. В ім'я Ісуса Христа. Амінь.
- id: day_006
  ref: jo:13:34
  title:
    ru: Любовь к людям
    en: Love for People
    es: Amor por las Personas
    uk: Любов до людей
  text:
    ru: Господи, наполни мое сердце Твоей любовью. Помоги мне относиться к людям с добротой,
      терпением и милосердием. Научи меня прощать обиды и искать мира с окружающими. Пусть
      через мои слова и поступки другие увидят Твою любовь. Во имя Иисуса Христа. Аминь.
    en: Lord, fill my heart with Your love. Help me to treat people with kindness, patience,
      and mercy. Teach me to forgive offenses and to seek peace with those around me. May
      others see Your love through my words and actions. In the name of Jesus Christ. Amen.
    es: Señor, llena mi corazón de Tu amor. Ayúdame a tratar a las personas con bondad, paciencia
      y misericordia. Enséñame a perdonar las ofensas y a buscar la paz con quienes me rodean.
      Que los demás vean Tu amor a través de mis palabras y mis actos. En el nombre de Jesucristo.
      Amén.
    uk: Господи, наповни моє серце Своєю любов'ю. Допоможи мені ставитися до людей із добротою,
      терпінням і милосердям. Навчи мене прощати образи й шукати миру з тими, хто навколо.
      Нехай через мої слова й вчинки інші побачать Твою любов. В ім'я Ісуса Христа. Амінь.
- id: day_007
  ref: ps:32:8
  title:
    ru: Божье водительство
    en: God's Guidance
    es: La Guía de Dios
    uk: Боже провадження
  text:
    ru: Отец, я нуждаюсь в Твоем руководстве. Покажи мне путь, по которому следует идти. Закрой
      двери, которые не от Тебя, и открой те, которые соответствуют Твоей воле. Помоги мне
      слышать Твой голос и быть послушным Твоим наставлениям. Во имя Иисуса Христа. Аминь.
    en: Father, I need Your guidance. Show me the path I should take. Close the doors that
      are not from You, and open those that match Your will. Help me to hear Your voice and
      to be obedient to Your instruction. In the name of Jesus Christ. Amen.
    es: Padre, necesito Tu guía. Muéstrame el camino que debo seguir. Cierra las puertas que
      no son de Ti y abre aquellas que concuerdan con Tu voluntad. Ayúdame a oír Tu voz y
      a ser obediente a Tus instrucciones. En el nombre de Jesucristo. Amén.
    uk: Отче, я потребую Твого провадження. Покажи мені шлях, яким маю йти. Зачини двері,
      які не від Тебе, і відчини ті, що відповідають Твоїй волі. Допоможи мені чути Твій голос
      і бути слухняним Твоїм настановам. В ім'я Ісуса Христа. Амінь.
- id: day_008
  ref: is:41:10
  title:
    ru: Победа над страхом
    en: Victory over Fear
    es: Victoria sobre el Miedo
    uk: Перемога над страхом
  text:
    ru: Господи, когда страх пытается овладеть мной, напоминай мне о Твоем присутствии. Помоги
      мне смотреть не на обстоятельства, а на Тебя. Укрепи мое сердце верой и наполни уверенностью
      в Твоих обещаниях. Благодарю Тебя за то, что Ты никогда не оставляешь Своих детей. Во
      имя Иисуса Христа. Аминь.
    en: Lord, when fear tries to take hold of me, remind me of Your presence. Help me to look
      not at the circumstances but at You. Strengthen my heart with faith and fill me with
      confidence in Your promises. Thank You that You never leave Your children. In the name
      of Jesus Christ. Amen.
    es: Señor, cuando el miedo intenta apoderarse de mí, recuérdame Tu presencia. Ayúdame
      a mirar no las circunstancias, sino a Ti. Fortalece mi corazón con fe y lléname de confianza
      en Tus promesas. Gracias porque Tú nunca abandonas a Tus hijos. En el nombre de Jesucristo.
      Amén.
    uk: Господи, коли страх намагається оволодіти мною, нагадуй мені про Свою присутність.
      Допоможи мені дивитися не на обставини, а на Тебе. Зміцни моє серце вірою й наповни
      впевненістю у Твоїх обітницях. Дякую Тобі за те, що Ти ніколи не залишаєш Своїх дітей.
      В ім'я Ісуса Христа. Амінь.
- id: day_009
  ref: ps:51:10
  title:
    ru: Чистое сердце
    en: A Pure Heart
    es: Un Corazón Puro
    uk: Чисте серце
  text:
    ru: Господи, исследуй мое сердце и покажи всё, что неугодно Тебе. Очисти меня от греха
      и обнови мой внутренний мир. Помоги мне стремиться к святости и жить жизнью, которая
      радует Тебя. Благодарю за прощение, которое я имею через Иисуса Христа. Аминь.
    en: Lord, search my heart and show me all that is displeasing to You. Cleanse me from
      sin and renew my inner world. Help me to strive for holiness and to live a life that
      pleases You. Thank You for the forgiveness I have through Jesus Christ. Amen.
    es: Señor, examina mi corazón y muéstrame todo lo que te desagrada. Límpiame del pecado
      y renueva mi mundo interior. Ayúdame a buscar la santidad y a vivir una vida que te
      agrade. Gracias por el perdón que tengo por medio de Jesucristo. Amén.
    uk: Господи, досліди моє серце й покажи все, що не до вподоби Тобі. Очисти мене від гріха
      й онови мій внутрішній світ. Допоможи мені прагнути святості й жити життям, яке радує
      Тебе. Дякую за прощення, яке я маю через Ісуса Христа. Амінь.
- id: day_010
  ref: ph:4:4
  title:
    ru: Радость в Господе
    en: Joy in the Lord
    es: Gozo en el Señor
    uk: Радість у Господі
  text:
    ru: Отец Небесный, наполни меня радостью, которая не зависит от обстоятельств. Помоги
      мне находить утешение и надежду в Тебе. Пусть моя радость будет свидетельством Твоей
      благости и верности. Благодарю Тебя за спасение и новую жизнь во Христе. Аминь.
    en: Heavenly Father, fill me with a joy that does not depend on circumstances. Help me
      to find comfort and hope in You. May my joy be a witness to Your goodness and faithfulness.
      Thank You for salvation and new life in Christ. Amen.
    es: Padre celestial, lléname de un gozo que no dependa de las circunstancias. Ayúdame
      a encontrar consuelo y esperanza en Ti. Que mi gozo sea testimonio de Tu bondad y Tu
      fidelidad. Gracias por la salvación y la nueva vida en Cristo. Amén.
    uk: Небесний Отче, наповни мене радістю, яка не залежить від обставин. Допоможи мені знаходити
      втіху й надію в Тобі. Нехай моя радість буде свідченням Твоєї доброти й вірності. Дякую
      Тобі за спасіння й нове життя у Христі. Амінь.
- id: day_011
  ref: lk:16:10
  title:
    ru: Верность в малом
    en: Faithful in Little
    es: Fiel en lo Poco
    uk: Вірність у малому
  text:
    ru: Господи, научи меня быть верным в маленьких делах каждого дня. Помоги исполнять свои
      обязанности честно и добросовестно. Пусть я не ищу человеческой похвалы, но стремлюсь
      угождать Тебе во всем. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to be faithful in the small things of each day. Help me to carry out
      my duties honestly and conscientiously. May I not seek the praise of people, but strive
      to please You in everything. In the name of Jesus Christ. Amen.
    es: Señor, enséñame a ser fiel en las pequeñas cosas de cada día. Ayúdame a cumplir mis
      responsabilidades con honestidad y dedicación. Que no busque la alabanza de las personas,
      sino que procure agradarte a Ti en todo. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене бути вірним у малих справах кожного дня. Допоможи виконувати свої
      обов'язки чесно й сумлінно. Нехай я не шукаю людської похвали, а прагну догоджати Тобі
      в усьому. В ім'я Ісуса Христа. Амінь.
- id: day_012
  ref: ps:121:7
  title:
    ru: Божья защита
    en: God's Protection
    es: La Protección de Dios
    uk: Божий захист
  text:
    ru: Небесный Отец, благодарю Тебя за Твою охрану и заботу. Прошу Тебя, защищай меня и
      моих близких от всякого зла. Даруй мудрость в опасных ситуациях и помоги всегда искать
      убежище в Тебе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your protection and care. I ask You to guard me and
      my loved ones from all evil. Grant wisdom in dangerous situations and help me always
      to seek refuge in You. In the name of Jesus Christ. Amen.
    es: Padre celestial, te doy gracias por Tu protección y Tu cuidado. Te pido que nos guardes
      a mí y a mis seres queridos de todo mal. Concede sabiduría en las situaciones peligrosas
      y ayúdame a buscar siempre refugio en Ti. En el nombre de Jesucristo. Amén.
    uk: Небесний Отче, дякую Тобі за Твою охорону й турботу. Прошу Тебе, захищай мене й моїх
      близьких від усякого зла. Даруй мудрість у небезпечних ситуаціях і допоможи завжди шукати
      притулку в Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_013
  ref: jm:4:6
  title:
    ru: Смирение перед Богом
    en: Humility before God
    es: Humildad ante Dios
    uk: Смирення перед Богом
  text:
    ru: Господи, сохрани меня от гордости и самонадеянности. Напоминай мне, что всё доброе
      в моей жизни приходит от Тебя. Научи меня служить другим с кротостью и любовью. Пусть
      Твоя воля будет важнее моих желаний. Во имя Иисуса Христа. Аминь.
    en: Lord, keep me from pride and self-reliance. Remind me that everything good in my life
      comes from You. Teach me to serve others with gentleness and love. May Your will be
      more important than my own desires. In the name of Jesus Christ. Amen.
    es: Señor, guárdame del orgullo y de la autosuficiencia. Recuérdame que todo lo bueno
      en mi vida viene de Ti. Enséñame a servir a los demás con mansedumbre y amor. Que Tu
      voluntad sea más importante que mis propios deseos. En el nombre de Jesucristo. Amén.
    uk: Господи, збережи мене від гордості й самовпевненості. Нагадуй мені, що все добре в
      моєму житті приходить від Тебе. Навчи мене служити іншим з лагідністю й любов'ю. Нехай
      Твоя воля буде важливішою за мої бажання. В ім'я Ісуса Христа. Амінь.
- id: day_014
  ref: ps:27:14
  title:
    ru: Терпение
    en: Patience
    es: Paciencia
    uk: Терпіння
  text:
    ru: Отец, помоги мне быть терпеливым в ожидании Твоих ответов. Научи доверять Твоему времени
      и не торопить события. Когда мне трудно ждать, напоминай о Своей верности. Укрепи меня
      и сохрани от ропота. Во имя Иисуса Христа. Аминь.
    en: Father, help me to be patient as I wait for Your answers. Teach me to trust Your timing
      and not to rush ahead of events. When it is hard for me to wait, remind me of Your faithfulness.
      Strengthen me and keep me from complaining. In the name of Jesus Christ. Amen.
    es: Padre, ayúdame a ser paciente mientras espero Tus respuestas. Enséñame a confiar en
      Tus tiempos y a no adelantarme a los acontecimientos. Cuando me resulte difícil esperar,
      recuérdame Tu fidelidad. Fortaléceme y guárdame de quejarme. En el nombre de Jesucristo.
      Amén.
    uk: Отче, допоможи мені бути терплячим, очікуючи Твоїх відповідей. Навчи довіряти Твоєму
      часу й не квапити подій. Коли мені важко чекати, нагадуй про Свою вірність. Зміцни мене
      й збережи від нарікання. В ім'я Ісуса Христа. Амінь.
- id: day_015
  ref: jm:4:8
  title:
    ru: Близость с Богом
    en: Closeness to God
    es: Cercanía con Dios
    uk: Близькість з Богом
  text:
    ru: Господи, я хочу быть ближе к Тебе. Помоги мне находить время для молитвы и чтения
      Твоего Слова. Открой мое сердце для Твоего присутствия и научи жить в постоянном общении
      с Тобой. Пусть моя любовь к Тебе возрастает каждый день. Во имя Иисуса Христа. Аминь.
    en: Lord, I want to be closer to You. Help me to find time for prayer and for reading
      Your Word. Open my heart to Your presence and teach me to live in constant fellowship
      with You. May my love for You grow every day. In the name of Jesus Christ. Amen.
    es: Señor, quiero estar más cerca de Ti. Ayúdame a encontrar tiempo para la oración y
      para la lectura de Tu Palabra. Abre mi corazón a Tu presencia y enséñame a vivir en
      comunión constante contigo. Que mi amor por Ti crezca cada día. En el nombre de Jesucristo.
      Amén.
    uk: Господи, я хочу бути ближче до Тебе. Допоможи мені знаходити час для молитви й читання
      Твого Слова. Відкрий моє серце для Твоєї присутності й навчи жити в постійному спілкуванні
      з Тобою. Нехай моя любов до Тебе зростає щодня. В ім'я Ісуса Христа. Амінь.
- id: day_016
  ref: jo:14:15
  title:
    ru: Послушание Богу
    en: Obedience to God
    es: Obediencia a Dios
    uk: Послух Богові
  text:
    ru: Господи, помоги мне быть послушным Тебе во всем. Научи меня исполнять Твою волю не
      только тогда, когда это легко, но и тогда, когда это требует жертвы. Дай мне сердце,
      готовое следовать за Тобой и доверять Твоим путям. Пусть моя жизнь будет свидетельством
      любви к Тебе через послушание Твоему Слову. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be obedient to You in everything. Teach me to do Your will not only
      when it is easy, but also when it requires sacrifice. Give me a heart ready to follow
      You and to trust Your ways. May my life be a witness of love for You through obedience
      to Your Word. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a obedecerte en todo. Enséñame a hacer Tu voluntad no solo cuando es
      fácil, sino también cuando exige sacrificio. Dame un corazón dispuesto a seguirte y
      a confiar en Tus caminos. Que mi vida sea testimonio de amor por Ti mediante la obediencia
      a Tu Palabra. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бути слухняним Тобі в усьому. Навчи мене виконувати Твою волю
      не лише тоді, коли це легко, а й тоді, коли це вимагає жертви. Дай мені серце, готове
      йти за Тобою й довіряти Твоїм дорогам. Нехай моє життя буде свідченням любові до Тебе
      через послух Твоєму Слову. В ім'я Ісуса Христа. Амінь.
- id: day_017
  ref: eph:2:8
  title:
    ru: Божья благодать
    en: God's Grace
    es: La Gracia de Dios
    uk: Божа благодать
  text:
    ru: Отец Небесный, благодарю Тебя за благодать, которую я не заслужил. Спасибо за прощение,
      милость и спасение через Иисуса Христа. Помоги мне жить в осознании Твоей благости и
      не надеяться на собственные заслуги. Пусть Твоя благодать изменяет мое сердце и делает
      меня похожим на Христа. Аминь.
    en: Heavenly Father, thank You for the grace I did not earn. Thank You for forgiveness,
      mercy, and salvation through Jesus Christ. Help me to live in awareness of Your goodness
      and not to rely on my own merits. May Your grace change my heart and make me like Christ.
      Amen.
    es: Padre celestial, te doy gracias por la gracia que no merecí. Gracias por el perdón,
      la misericordia y la salvación por medio de Jesucristo. Ayúdame a vivir consciente de
      Tu bondad y a no confiar en mis propios méritos. Que Tu gracia transforme mi corazón
      y me haga semejante a Cristo. Amén.
    uk: Небесний Отче, дякую Тобі за благодать, якої я не заслужив. Дякую за прощення, милість
      і спасіння через Ісуса Христа. Допоможи мені жити в усвідомленні Твоєї доброти й не
      покладатися на власні заслуги. Нехай Твоя благодать змінює моє серце й робить мене подібним
      до Христа. Амінь.
- id: day_018
  ref: hb:10:23
  title:
    ru: Верность Божьим обещаниям
    en: Faithfulness to God's Promises
    es: Fidelidad a las Promesas de Dios
    uk: Вірність Божим обітницям
  text:
    ru: Господи, когда обстоятельства кажутся трудными, помоги мне помнить Твои обещания.
      Укрепи мою веру и научи держаться за Твое Слово. Напоминай мне, что Ты никогда не нарушаешь
      Своих обетований и всегда остаешься верным. Благодарю Тебя за надежду, которую имею
      в Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, when circumstances seem difficult, help me to remember Your promises. Strengthen
      my faith and teach me to hold fast to Your Word. Remind me that You never break Your
      promises and always remain faithful. Thank You for the hope I have in You. In the name
      of Jesus Christ. Amen.
    es: Señor, cuando las circunstancias parezcan difíciles, ayúdame a recordar Tus promesas.
      Fortalece mi fe y enséñame a aferrarme a Tu Palabra. Recuérdame que Tú nunca quebrantas
      Tus promesas y siempre permaneces fiel. Gracias por la esperanza que tengo en Ti. En
      el nombre de Jesucristo. Amén.
    uk: Господи, коли обставини здаються важкими, допоможи мені пам'ятати Твої обітниці. Зміцни
      мою віру й навчи триматися за Твоє Слово. Нагадуй мені, що Ти ніколи не порушуєш Своїх
      обітниць і завжди залишаєшся вірним. Дякую Тобі за надію, яку маю в Тобі. В ім'я Ісуса
      Христа. Амінь.
- id: day_019
  ref: js:24:15
  title:
    ru: Благословение для семьи
    en: Blessing for the Family
    es: Bendición para la Familia
    uk: Благословення для родини
  text:
    ru: Небесный Отец, благослови мою семью. Наполни наш дом миром, любовью и взаимопониманием.
      Помоги нам поддерживать друг друга, прощать ошибки и вместе искать Тебя. Защищай моих
      близких и веди нас Своими путями. Пусть наш дом будет местом, где прославляется Твое
      имя. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, bless my family. Fill our home with peace, love, and understanding.
      Help us to support one another, to forgive mistakes, and to seek You together. Protect
      my loved ones and lead us in Your ways. May our home be a place where Your name is glorified.
      In the name of Jesus Christ. Amen.
    es: Padre celestial, bendice a mi familia. Llena nuestro hogar de paz, amor y comprensión.
      Ayúdanos a apoyarnos unos a otros, a perdonar los errores y a buscarte juntos. Protege
      a mis seres queridos y guíanos por Tus caminos. Que nuestro hogar sea un lugar donde
      Tu nombre sea glorificado. En el nombre de Jesucristo. Amén.
    uk: Небесний Отче, благослови мою родину. Наповни наш дім миром, любов'ю і взаєморозумінням.
      Допоможи нам підтримувати одне одного, прощати помилки й разом шукати Тебе. Захищай
      моїх близьких і веди нас Своїми дорогами. Нехай наш дім буде місцем, де прославляється
      Твоє ім'я. В ім'я Ісуса Христа. Амінь.
- id: day_020
  ref: 1co:10:13
  title:
    ru: Победа над искушением
    en: Victory over Temptation
    es: Victoria sobre la Tentación
    uk: Перемога над спокусою
  text:
    ru: Господи, Ты знаешь мои слабости. Помоги мне противостоять искушениям и не уступать
      греху. Дай мне силы выбирать то, что угодно Тебе. Напоминай мне о Твоем Слове и укрепляй
      меня Духом Святым. Благодарю Тебя за путь избавления, который Ты всегда даешь Своим
      детям. Во имя Иисуса Христа. Аминь.
    en: Lord, You know my weaknesses. Help me to withstand temptation and not to give in to
      sin. Give me the strength to choose what is pleasing to You. Remind me of Your Word
      and strengthen me by the Holy Spirit. Thank You for the way of escape that You always
      give Your children. In the name of Jesus Christ. Amen.
    es: Señor, Tú conoces mis debilidades. Ayúdame a resistir la tentación y a no ceder al
      pecado. Dame fuerzas para elegir lo que te agrada. Recuérdame Tu Palabra y fortaléceme
      por el Espíritu Santo. Gracias por la salida que siempre das a Tus hijos. En el nombre
      de Jesucristo. Amén.
    uk: Господи, Ти знаєш мої слабкості. Допоможи мені протистояти спокусам і не піддаватися
      гріху. Дай мені сили обирати те, що до вподоби Тобі. Нагадуй мені про Твоє Слово й зміцнюй
      мене Духом Святим. Дякую Тобі за вихід, який Ти завжди даєш Своїм дітям. В ім'я Ісуса
      Христа. Амінь.
- id: day_021
  ref: 1pe:4:10
  title:
    ru: Служение людям
    en: Serving People
    es: Servir a los Demás
    uk: Служіння людям
  text:
    ru: Отец Небесный, открой мои глаза на нужды окружающих меня людей. Помоги мне быть готовым
      служить, поддерживать и помогать тем, кто нуждается в утешении и заботе. Научи меня
      любить не только словами, но и делами. Пусть через мою жизнь люди видят Твою доброту.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, open my eyes to the needs of the people around me. Help me to be
      ready to serve, support, and help those who need comfort and care. Teach me to love
      not only with words but with deeds. May people see Your kindness through my life. In
      the name of Jesus Christ. Amen.
    es: Padre celestial, abre mis ojos a las necesidades de las personas que me rodean. Ayúdame
      a estar dispuesto a servir, apoyar y ayudar a quienes necesitan consuelo y cuidado.
      Enséñame a amar no solo con palabras, sino con hechos. Que las personas vean Tu bondad
      a través de mi vida. En el nombre de Jesucristo. Amén.
    uk: Небесний Отче, відкрий мої очі на потреби людей навколо мене. Допоможи мені бути готовим
      служити, підтримувати й допомагати тим, хто потребує втіхи й турботи. Навчи мене любити
      не лише словами, а й ділами. Нехай через моє життя люди бачать Твою доброту. В ім'я
      Ісуса Христа. Амінь.
- id: day_022
  ref: hb:10:23
  title:
    ru: Надежда среди трудностей
    en: Hope amid Hardship
    es: Esperanza en la Adversidad
    uk: Надія серед труднощів
  text:
    ru: Господи, даже когда путь становится тяжелым, помоги мне не терять надежды. Напоминай
      мне, что Ты действуешь даже тогда, когда я не вижу результата. Укрепляй мое сердце и
      направляй мой взгляд к вечным ценностям. Благодарю Тебя за уверенность, которую дает
      Твое присутствие. Аминь.
    en: Lord, even when the road becomes hard, help me not to lose hope. Remind me that You
      are at work even when I see no result. Strengthen my heart and turn my gaze toward eternal
      values. Thank You for the assurance that Your presence gives. Amen.
    es: Señor, aun cuando el camino se vuelva difícil, ayúdame a no perder la esperanza. Recuérdame
      que Tú obras incluso cuando no veo el resultado. Fortalece mi corazón y dirige mi mirada
      hacia los valores eternos. Gracias por la seguridad que da Tu presencia. Amén.
    uk: Господи, навіть коли дорога стає важкою, допоможи мені не втрачати надію. Нагадуй
      мені, що Ти дієш навіть тоді, коли я не бачу результату. Зміцнюй моє серце й спрямовуй
      мій погляд до вічних цінностей. Дякую Тобі за впевненість, яку дає Твоя присутність.
      Амінь.
- id: day_023
  ref: lk:19:10
  title:
    ru: Благодарность за спасение
    en: Thankful for Salvation
    es: Gratitud por la Salvación
    uk: Вдячність за спасіння
  text:
    ru: Господь Иисус, благодарю Тебя за крест и за жертву, которую Ты принес ради моего спасения.
      Спасибо за прощение грехов и за новую жизнь, которую я получил через веру в Тебя. Помоги
      мне никогда не забывать цену моего искупления и жить достойно Твоего призвания. Аминь.
    en: Lord Jesus, thank You for the cross and for the sacrifice You made for my salvation.
      Thank You for the forgiveness of sins and for the new life I have received through faith
      in You. Help me never to forget the price of my redemption and to live worthy of Your
      calling. Amen.
    es: Señor Jesús, te doy gracias por la cruz y por el sacrificio que hiciste por mi salvación.
      Gracias por el perdón de los pecados y por la nueva vida que he recibido mediante la
      fe en Ti. Ayúdame a no olvidar nunca el precio de mi redención y a vivir digno de Tu
      llamado. Amén.
    uk: Господи Ісусе, дякую Тобі за хрест і за жертву, яку Ти приніс заради мого спасіння.
      Дякую за прощення гріхів і за нове життя, яке я отримав через віру в Тебе. Допоможи
      мені ніколи не забувати ціну мого викуплення й жити гідно Твого покликання. Амінь.
- id: day_024
  ref: mt:11:29
  title:
    ru: Кротость сердца
    en: Meekness of Heart
    es: Mansedumbre de Corazón
    uk: Лагідність серця
  text:
    ru: Господи, научи меня быть кротким и смиренным. Помоги мне не отвечать злом на зло и
      не искать собственной славы. Дай мне мудрость говорить слова, которые приносят мир и
      назидание. Пусть характер Христа отражается в моей жизни каждый день. Во имя Иисуса
      Христа. Аминь.
    en: Lord, teach me to be meek and humble. Help me not to repay evil with evil and not
      to seek my own glory. Give me the wisdom to speak words that bring peace and edification.
      May the character of Christ be reflected in my life every day. In the name of Jesus
      Christ. Amen.
    es: Señor, enséñame a ser manso y humilde. Ayúdame a no devolver mal por mal ni a buscar
      mi propia gloria. Dame sabiduría para decir palabras que traigan paz y edificación.
      Que el carácter de Cristo se refleje en mi vida cada día. En el nombre de Jesucristo.
      Amén.
    uk: Господи, навчи мене бути лагідним і смиренним. Допоможи мені не відповідати злом на
      зло й не шукати власної слави. Дай мені мудрість говорити слова, що приносять мир і
      повчання. Нехай характер Христа відображається в моєму житті щодня. В ім'я Ісуса Христа.
      Амінь.
- id: day_025
  ref: ps:51:12
  title:
    ru: Радость спасения
    en: The Joy of Salvation
    es: El Gozo de la Salvación
    uk: Радість спасіння
  text:
    ru: Отец Небесный, обнови во мне радость спасения. Не позволь суете и заботам заглушить
      благодарность за то, что Ты сделал для меня. Наполни мое сердце восхищением Твоей любовью
      и милостью. Пусть моя радость будет основана не на обстоятельствах, а на Тебе. Аминь.
    en: Heavenly Father, restore in me the joy of salvation. Do not let the bustle and cares
      drown out my gratitude for what You have done for me. Fill my heart with wonder at Your
      love and mercy. May my joy be founded not on circumstances, but on You. Amen.
    es: Padre celestial, restaura en mí el gozo de la salvación. No permitas que el ajetreo
      y las preocupaciones ahoguen mi gratitud por lo que has hecho por mí. Llena mi corazón
      de asombro ante Tu amor y Tu misericordia. Que mi gozo se funde no en las circunstancias,
      sino en Ti. Amén.
    uk: Небесний Отче, віднови в мені радість спасіння. Не дозволь, щоб метушня й турботи
      заглушили мою вдячність за те, що Ти зробив для мене. Наповни моє серце захопленням
      Твоєю любов'ю й милістю. Нехай моя радість ґрунтується не на обставинах, а на Тобі.
      Амінь.
- id: day_026
  ref: eph:4:2
  title:
    ru: Терпение к людям
    en: Patience with People
    es: Paciencia con los Demás
    uk: Терпіння до людей
  text:
    ru: Господи, помоги мне быть терпеливым к окружающим. Научи меня понимать слабости других
      так же, как Ты терпеливо относишься ко мне. Удали раздражение и поспешные суждения.
      Наполни мое сердце любовью и состраданием. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be patient with those around me. Teach me to understand the weaknesses
      of others just as You patiently bear with me. Take away irritation and hasty judgments.
      Fill my heart with love and compassion. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a ser paciente con quienes me rodean. Enséñame a comprender las debilidades
      de los demás así como Tú me soportas con paciencia. Quita la irritación y los juicios
      apresurados. Llena mi corazón de amor y compasión. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бути терплячим до тих, хто навколо. Навчи мене розуміти слабкості
      інших так само, як Ти терпляче ставишся до мене. Віджени роздратування й поспішні судження.
      Наповни моє серце любов'ю й співчуттям. В ім'я Ісуса Христа. Амінь.
- id: day_027
  ref: mt:5:16
  title:
    ru: Свет для окружающих
    en: A Light to Others
    es: Luz para los Demás
    uk: Світло для оточуючих
  text:
    ru: Господи, помоги мне быть светом в этом мире. Пусть мои слова, поступки и отношение
      к людям отражают Твою любовь и истину. Дай мне смелость свидетельствовать о Тебе и жить
      так, чтобы другие могли увидеть Твою работу в моей жизни. Аминь.
    en: Lord, help me to be a light in this world. May my words, actions, and attitude toward
      people reflect Your love and truth. Give me the courage to bear witness about You and
      to live in such a way that others may see Your work in my life. Amen.
    es: Señor, ayúdame a ser luz en este mundo. Que mis palabras, mis actos y mi actitud hacia
      las personas reflejen Tu amor y Tu verdad. Dame el valor de dar testimonio de Ti y de
      vivir de tal manera que los demás puedan ver Tu obra en mi vida. Amén.
    uk: Господи, допоможи мені бути світлом у цьому світі. Нехай мої слова, вчинки й ставлення
      до людей відображають Твою любов і правду. Дай мені сміливість свідчити про Тебе й жити
      так, щоб інші могли побачити Твою працю в моєму житті. Амінь.
- id: day_028
  ref: cl:4:2
  title:
    ru: Верность в молитве
    en: Faithful in Prayer
    es: Fiel en la Oración
    uk: Вірність у молитві
  text:
    ru: Отец, научи меня быть постоянным в молитве. Помоги мне искать Тебя не только в трудностях,
      но и в обычные дни. Дай мне желание общаться с Тобой и возрастать в доверии к Тебе.
      Благодарю за то, что Ты слышишь каждую искреннюю молитву. Во имя Иисуса Христа. Аминь.
    en: Father, teach me to be constant in prayer. Help me to seek You not only in hardship,
      but also on ordinary days. Give me a desire to commune with You and to grow in trust
      toward You. Thank You that You hear every sincere prayer. In the name of Jesus Christ.
      Amen.
    es: Padre, enséñame a ser constante en la oración. Ayúdame a buscarte no solo en la dificultad,
      sino también en los días corrientes. Dame el deseo de tener comunión contigo y de crecer
      en la confianza en Ti. Gracias porque escuchas toda oración sincera. En el nombre de
      Jesucristo. Amén.
    uk: Отче, навчи мене бути постійним у молитві. Допоможи мені шукати Тебе не лише в труднощах,
      а й у звичайні дні. Дай мені бажання спілкуватися з Тобою й зростати в довірі до Тебе.
      Дякую за те, що Ти чуєш кожну щиру молитву. В ім'я Ісуса Христа. Амінь.
- id: day_029
  ref: cl:3:23
  title:
    ru: Божья помощь в работе
    en: God's Help in Work
    es: La Ayuda de Dios en el Trabajo
    uk: Божа допомога в праці
  text:
    ru: Господи, благослови мой труд сегодня. Дай мне усердие, честность и мудрость в исполнении
      моих обязанностей. Помоги работать так, чтобы через мои дела прославлялось Твое имя.
      Сохрани меня от лености и недовольства. Во имя Иисуса Христа. Аминь.
    en: Lord, bless my work today. Give me diligence, honesty, and wisdom in carrying out
      my duties. Help me to work in such a way that Your name is glorified through my deeds.
      Keep me from laziness and discontent. In the name of Jesus Christ. Amen.
    es: Señor, bendice mi trabajo hoy. Dame diligencia, honestidad y sabiduría para cumplir
      mis responsabilidades. Ayúdame a trabajar de tal manera que Tu nombre sea glorificado
      a través de mis actos. Guárdame de la pereza y el descontento. En el nombre de Jesucristo.
      Amén.
    uk: Господи, благослови мою працю сьогодні. Дай мені старанність, чесність і мудрість
      у виконанні моїх обов'язків. Допоможи працювати так, щоб через мої справи прославлялося
      Твоє ім'я. Збережи мене від лінощів і невдоволення. В ім'я Ісуса Христа. Амінь.
- id: day_030
  ref: 1co:10:31
  title:
    ru: Жизнь во славу Божью
    en: A Life to God's Glory
    es: Una Vida para la Gloria de Dios
    uk: Життя на славу Божу
  text:
    ru: Отец Небесный, помоги мне прожить этот день так, чтобы Ты был прославлен. Пусть мои
      решения, слова и поступки отражают Твою любовь и истину. Научи меня помнить, что моя
      жизнь принадлежит Тебе. Благодарю Тебя за честь быть Твоим ребенком. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, help me to live this day in such a way that You are glorified. May
      my decisions, words, and actions reflect Your love and truth. Teach me to remember that
      my life belongs to You. Thank You for the honor of being Your child. In the name of
      Jesus Christ. Amen.
    es: Padre celestial, ayúdame a vivir este día de tal manera que Tú seas glorificado. Que
      mis decisiones, mis palabras y mis actos reflejen Tu amor y Tu verdad. Enséñame a recordar
      que mi vida te pertenece. Gracias por el honor de ser Tu hijo. En el nombre de Jesucristo.
      Amén.
    uk: Небесний Отче, допоможи мені прожити цей день так, щоб Ти був прославлений. Нехай
      мої рішення, слова й вчинки відображають Твою любов і правду. Навчи мене пам'ятати,
      що моє життя належить Тобі. Дякую Тобі за честь бути Твоєю дитиною. В ім'я Ісуса Христа.
      Амінь.
- id: day_031
  ref: 1jo:1:9
  title:
    ru: Покаяние и обновление
    en: Repentance and Renewal
    es: Arrepentimiento y Renovación
    uk: Покаяння й оновлення
  text:
    ru: Господи, я прихожу к Тебе с открытым сердцем. Прости мне мои грехи, ошибки и все то,
      чем я огорчил Тебя. Очисти меня Своей милостью и обнови мой дух. Помоги мне оставить
      все, что удаляет меня от Тебя, и идти путем праведности. Благодарю Тебя за прощение,
      которое я имею через Иисуса Христа. Аминь.
    en: Lord, I come to You with an open heart. Forgive me my sins, my failures, and all by
      which I have grieved You. Cleanse me by Your mercy and renew my spirit. Help me to leave
      behind everything that draws me away from You, and to walk the path of righteousness.
      Thank You for the forgiveness I have through Jesus Christ. Amen.
    es: Señor, vengo a Ti con el corazón abierto. Perdona mis pecados, mis errores y todo
      aquello con lo que te he entristecido. Límpiame con Tu misericordia y renueva mi espíritu.
      Ayúdame a dejar todo lo que me aparta de Ti y a andar por el camino de la justicia.
      Te doy gracias por el perdón que tengo por medio de Jesucristo. Amén.
    uk: Господи, я приходжу до Тебе з відкритим серцем. Прости мені мої гріхи, помилки і все,
      чим я засмутив Тебе. Очисти мене Своєю милістю й онови мій дух. Допоможи мені залишити
      все, що віддаляє мене від Тебе, і йти шляхом праведності. Дякую Тобі за прощення, яке
      я маю через Ісуса Христа. Амінь.
- id: day_032
  ref: ps:119:105
  title:
    ru: Жажда Божьего Слова
    en: Hunger for God's Word
    es: Sed de la Palabra de Dios
    uk: Спрага за Божим Словом
  text:
    ru: Отец Небесный, вложи в мое сердце любовь к Твоему Слову. Помоги мне не только читать
      его, но и исполнять. Открывай мне истину и направляй через Писание каждый день. Пусть
      Твое Слово станет светом на моем пути и основанием для всех моих решений. Во имя Иисуса
      Христа. Аминь.
    en: Heavenly Father, put in my heart a love for Your Word. Help me not only to read it
      but also to live by it. Reveal Your truth to me and guide me through the Scriptures
      each day. May Your Word be a light on my path and the foundation for all my decisions.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, pon en mi corazón amor por Tu Palabra. Ayúdame no solo a leerla,
      sino también a cumplirla. Revélame Tu verdad y guíame cada día por medio de las Escrituras.
      Que Tu Palabra sea luz en mi camino y fundamento de todas mis decisiones. En el nombre
      de Jesucristo. Amén.
    uk: Отче Небесний, поклади в моє серце любов до Твого Слова. Допоможи мені не лише читати
      його, а й виконувати. Відкривай мені істину й скеровуй через Писання щодня. Нехай Твоє
      Слово стане світлом на моєму шляху й основою для всіх моїх рішень. В ім'я Ісуса Христа.
      Амінь.
- id: day_033
  ref: 1pe:5:7
  title:
    ru: Победа над тревогой
    en: Victory over Anxiety
    es: Victoria sobre la Ansiedad
    uk: Перемога над тривогою
  text:
    ru: Господи, Ты знаешь все мои переживания и заботы. Помоги мне не носить их в одиночку,
      а доверять их Тебе. Напомни мне, что Ты заботишься обо мне и держишь мою жизнь в Своих
      руках. Наполни мое сердце миром и уверенностью в Твоей любви. Во имя Иисуса Христа.
      Аминь.
    en: Lord, You know all my worries and cares. Help me not to carry them alone but to entrust
      them to You. Remind me that You care for me and hold my life in Your hands. Fill my
      heart with peace and with confidence in Your love. In the name of Jesus Christ. Amen.
    es: Señor, Tú conoces todas mis preocupaciones e inquietudes. Ayúdame a no llevarlas solo,
      sino a confiártelas a Ti. Recuérdame que Tú cuidas de mí y sostienes mi vida en Tus
      manos. Llena mi corazón de paz y de confianza en Tu amor. En el nombre de Jesucristo.
      Amén.
    uk: Господи, Ти знаєш усі мої переживання й турботи. Допоможи мені не нести їх самотужки,
      а довіряти їх Тобі. Нагадай мені, що Ти дбаєш про мене й тримаєш моє життя у Своїх руках.
      Наповни моє серце миром і впевненістю у Твоїй любові. В ім'я Ісуса Христа. Амінь.
- id: day_034
  ref: 1co:16:13
  title:
    ru: Духовная бдительность
    en: Spiritual Watchfulness
    es: Vigilancia Espiritual
    uk: Духовна пильність
  text:
    ru: Господи, помоги мне бодрствовать и хранить свое сердце. Не дай мне привыкнуть к греху
      или стать равнодушным к Твоему голосу. Укрепляй меня в вере и помогай ежедневно искать
      Тебя. Пусть моя жизнь будет наполнена духовной трезвостью и посвящением Тебе. Аминь.
    en: Lord, help me to stay awake and to guard my heart. Do not let me grow used to sin
      or become indifferent to Your voice. Strengthen me in faith and help me to seek You
      each day. May my life be filled with spiritual sobriety and devotion to You. Amen.
    es: Señor, ayúdame a velar y a guardar mi corazón. No permitas que me acostumbre al pecado
      ni que me vuelva indiferente a Tu voz. Fortaléceme en la fe y ayúdame a buscarte cada
      día. Que mi vida esté llena de sobriedad espiritual y entrega a Ti. Amén.
    uk: Господи, допоможи мені пильнувати й берегти своє серце. Не дай мені звикнути до гріха
      чи стати байдужим до Твого голосу. Зміцнюй мене у вірі й допомагай щодня шукати Тебе.
      Нехай моє життя буде сповнене духовної тверезості й посвяти Тобі. Амінь.
- id: day_035
  ref: act:1:8
  title:
    ru: Сила Святого Духа
    en: The Power of the Holy Spirit
    es: El Poder del Espíritu Santo
    uk: Сила Святого Духа
  text:
    ru: Дух Святой, благодарю Тебя за Твое присутствие в моей жизни. Наполняй меня Своей силой,
      мудростью и водительством. Помоги мне жить так, чтобы мои мысли, слова и поступки были
      угодны Богу. Веди меня по пути истины и укрепляй в каждом испытании. Во имя Иисуса Христа.
      Аминь.
    en: Holy Spirit, thank You for Your presence in my life. Fill me with Your power, wisdom,
      and guidance. Help me to live so that my thoughts, words, and actions are pleasing to
      God. Lead me in the way of truth and strengthen me in every trial. In the name of Jesus
      Christ. Amen.
    es: Espíritu Santo, te doy gracias por Tu presencia en mi vida. Lléname de Tu poder, sabiduría
      y dirección. Ayúdame a vivir de modo que mis pensamientos, palabras y actos sean agradables
      a Dios. Guíame por el camino de la verdad y fortaléceme en cada prueba. En el nombre
      de Jesucristo. Amén.
    uk: Душе Святий, дякую Тобі за Твою присутність у моєму житті. Наповнюй мене Своєю силою,
      мудрістю й проводом. Допоможи мені жити так, щоб мої думки, слова й вчинки були до вподоби
      Богові. Веди мене дорогою істини й зміцнюй у кожному випробуванні. В ім'я Ісуса Христа.
      Амінь.
- id: day_036
  ref: eph:4:32
  title:
    ru: Прощение обид
    en: Forgiving Offenses
    es: Perdonar las Ofensas
    uk: Прощення образ
  text:
    ru: Господи, иногда мне трудно прощать тех, кто причинил мне боль. Но Ты простил меня
      гораздо больше. Помоги мне отпустить обиду и не хранить горечь в сердце. Дай мне любовь
      и милость по отношению к людям. Пусть мое сердце будет свободным от непрощения. Во имя
      Иисуса Христа. Аминь.
    en: Lord, sometimes it is hard for me to forgive those who have hurt me. Yet You have
      forgiven me far more. Help me to let go of the offense and not to hold bitterness in
      my heart. Give me love and mercy toward others. May my heart be free from unforgiveness.
      In the name of Jesus Christ. Amen.
    es: Señor, a veces me cuesta perdonar a quienes me han hecho daño. Pero Tú me has perdonado
      mucho más. Ayúdame a soltar la ofensa y a no guardar amargura en mi corazón. Dame amor
      y misericordia hacia los demás. Que mi corazón quede libre de toda falta de perdón.
      En el nombre de Jesucristo. Amén.
    uk: Господи, інколи мені важко прощати тих, хто завдав мені болю. Але Ти простив мені
      набагато більше. Допоможи мені відпустити образу й не тримати гіркоти в серці. Дай мені
      любов і милість до людей. Нехай моє серце буде вільним від непрощення. В ім'я Ісуса
      Христа. Амінь.
- id: day_037
  ref: ph:4:8
  title:
    ru: Чистота мыслей
    en: Purity of Mind
    es: Pureza de Pensamiento
    uk: Чистота думок
  text:
    ru: Отец Небесный, помоги мне хранить свои мысли в чистоте. Удали все, что не приносит
      славы Тебе. Научи меня размышлять о том, что истинно, честно и достойно похвалы. Пусть
      мой разум будет обновляться через Твое Слово каждый день. Аминь.
    en: Heavenly Father, help me to keep my thoughts pure. Remove everything that does not
      bring You glory. Teach me to dwell on whatever is true, honorable, and worthy of praise.
      May my mind be renewed through Your Word each day. Amen.
    es: Padre Celestial, ayúdame a guardar mis pensamientos en pureza. Quita todo lo que no
      te glorifica. Enséñame a meditar en todo lo que es verdadero, honesto y digno de alabanza.
      Que mi mente se renueve cada día por medio de Tu Palabra. Amén.
    uk: Отче Небесний, допоможи мені берегти свої думки в чистоті. Усунь усе, що не приносить
      Тобі слави. Навчи мене роздумувати про те, що істинне, чесне й гідне похвали. Нехай
      мій розум оновлюється через Твоє Слово щодня. Амінь.
- id: day_038
  ref: ps:145:3
  title:
    ru: Благодарность за Божью верность
    en: Thanks for God's Faithfulness
    es: Gratitud por la Fidelidad de Dios
    uk: Подяка за Божу вірність
  text:
    ru: Господи, благодарю Тебя за то, что Ты никогда не оставляешь меня. Даже когда я был
      слаб, Ты поддерживал меня. Даже когда я сомневался, Ты оставался верным. Помоги мне
      помнить Твои благодеяния и жить с благодарным сердцем. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that You never forsake me. Even when I was weak, You upheld me. Even
      when I doubted, You remained faithful. Help me to remember Your kindnesses and to live
      with a grateful heart. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque nunca me abandonas. Aun cuando estaba débil, me sostuviste.
      Aun cuando dudaba, permaneciste fiel. Ayúdame a recordar Tus bondades y a vivir con
      un corazón agradecido. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти ніколи не покидаєш мене. Навіть коли я був слабким,
      Ти підтримував мене. Навіть коли я сумнівався, Ти залишався вірним. Допоможи мені пам'ятати
      Твої добродійства й жити з вдячним серцем. В ім'я Ісуса Христа. Амінь.
- id: day_039
  ref: js:1:9
  title:
    ru: Мужество перед трудностями
    en: Courage in the Face of Hardship
    es: Valor ante las Dificultades
    uk: Мужність перед труднощами
  text:
    ru: Господи, когда я сталкиваюсь с препятствиями и испытаниями, дай мне мужество не отступать.
      Напоминай мне, что Ты идешь рядом со мной. Помоги смотреть на трудности глазами веры
      и помнить, что для Тебя нет ничего невозможного. Во имя Иисуса Христа. Аминь.
    en: Lord, when I face obstacles and trials, give me the courage not to retreat. Remind
      me that You walk beside me. Help me to look at difficulties through the eyes of faith
      and to remember that nothing is impossible for You. In the name of Jesus Christ. Amen.
    es: Señor, cuando enfrento obstáculos y pruebas, dame el valor de no retroceder. Recuérdame
      que Tú caminas a mi lado. Ayúdame a mirar las dificultades con ojos de fe y a recordar
      que para Ti nada es imposible. En el nombre de Jesucristo. Amén.
    uk: Господи, коли я стикаюся з перешкодами й випробуваннями, дай мені мужність не відступати.
      Нагадуй мені, що Ти йдеш поруч зі мною. Допоможи дивитися на труднощі очима віри й пам'ятати,
      що для Тебе немає нічого неможливого. В ім'я Ісуса Христа. Амінь.
- id: day_040
  ref: mk:10:45
  title:
    ru: Сердце служителя
    en: A Servant's Heart
    es: Un Corazón de Siervo
    uk: Серце служителя
  text:
    ru: Отец Небесный, научи меня служить другим с искренней любовью. Помоги замечать нужды
      людей и быть готовым помочь там, где это необходимо. Сохрани меня от эгоизма и желания
      искать собственной выгоды. Пусть через мое служение прославляется Твое имя. Аминь.
    en: Heavenly Father, teach me to serve others with sincere love. Help me to notice people's
      needs and to be ready to help wherever it is needed. Keep me from selfishness and from
      seeking my own gain. May Your name be glorified through my service. Amen.
    es: Padre Celestial, enséñame a servir a los demás con amor sincero. Ayúdame a notar las
      necesidades de las personas y a estar dispuesto a ayudar donde haga falta. Guárdame
      del egoísmo y de buscar mi propio provecho. Que Tu nombre sea glorificado por medio
      de mi servicio. Amén.
    uk: Отче Небесний, навчи мене служити іншим зі щирою любов'ю. Допоможи помічати потреби
      людей і бути готовим допомогти там, де це потрібно. Збережи мене від егоїзму й бажання
      шукати власної вигоди. Нехай через моє служіння прославляється Твоє ім'я. Амінь.
- id: day_041
  ref: hb:11:1
  title:
    ru: Укрепление веры
    en: Strengthening of Faith
    es: Fortalecimiento de la Fe
    uk: Зміцнення віри
  text:
    ru: Господи, укрепляй мою веру каждый день. Когда я сталкиваюсь с сомнениями, напоминай
      мне о Твоих обещаниях. Помоги мне доверять Тебе больше, чем своим чувствам или обстоятельствам.
      Пусть моя вера возрастает через общение с Тобой и через Твое Слово. Во имя Иисуса Христа.
      Аминь.
    en: Lord, strengthen my faith each day. When I face doubts, remind me of Your promises.
      Help me to trust You more than my feelings or my circumstances. May my faith grow through
      fellowship with You and through Your Word. In the name of Jesus Christ. Amen.
    es: Señor, fortalece mi fe cada día. Cuando enfrente dudas, recuérdame Tus promesas. Ayúdame
      a confiar en Ti más que en mis sentimientos o mis circunstancias. Que mi fe crezca por
      medio de la comunión contigo y de Tu Palabra. En el nombre de Jesucristo. Amén.
    uk: Господи, зміцнюй мою віру щодня. Коли я стикаюся з сумнівами, нагадуй мені про Твої
      обітниці. Допоможи мені довіряти Тобі більше, ніж своїм почуттям чи обставинам. Нехай
      моя віра зростає через спілкування з Тобою і через Твоє Слово. В ім'я Ісуса Христа.
      Амінь.
- id: day_042
  ref: ps:16:11
  title:
    ru: Радость в Божьем присутствии
    en: Joy in God's Presence
    es: Gozo en la Presencia de Dios
    uk: Радість у Божій присутності
  text:
    ru: Господи, благодарю Тебя за привилегию быть рядом с Тобой. Наполни мое сердце радостью,
      которая рождается из общения с Тобой. Помоги мне искать Твое лицо больше, чем земные
      удовольствия и достижения. Пусть Твое присутствие будет моей главной ценностью. Аминь.
    en: Lord, thank You for the privilege of being near You. Fill my heart with the joy that
      is born of fellowship with You. Help me to seek Your face more than earthly pleasures
      and achievements. May Your presence be my greatest treasure. Amen.
    es: Señor, te doy gracias por el privilegio de estar cerca de Ti. Llena mi corazón del
      gozo que nace de la comunión contigo. Ayúdame a buscar Tu rostro más que los placeres
      y los logros de esta tierra. Que Tu presencia sea mi mayor tesoro. Amén.
    uk: Господи, дякую Тобі за привілей бути поруч із Тобою. Наповни моє серце радістю, що
      народжується зі спілкування з Тобою. Допоможи мені шукати Твого обличчя більше, ніж
      земних утіх і досягнень. Нехай Твоя присутність буде моєю найбільшою цінністю. Амінь.
- id: day_043
  ref: rm:1:16
  title:
    ru: Смелость свидетельствовать
    en: Boldness to Witness
    es: Valentía para Testificar
    uk: Сміливість свідчити
  text:
    ru: Господи, дай мне смелость говорить о Тебе людям вокруг меня. Помоги не стыдиться Евангелия
      и быть верным свидетелем Твоей любви и истины. Открывай возможности рассказывать другим
      о спасении во Христе и давай мудрость использовать эти возможности. Аминь.
    en: Lord, give me boldness to speak of You to the people around me. Help me not to be
      ashamed of the Gospel and to be a faithful witness of Your love and truth. Open opportunities
      to tell others about salvation in Christ, and give me wisdom to use them. Amen.
    es: Señor, dame valentía para hablar de Ti a las personas que me rodean. Ayúdame a no
      avergonzarme del Evangelio y a ser un testigo fiel de Tu amor y de Tu verdad. Abre oportunidades
      para hablar a otros de la salvación en Cristo y dame sabiduría para aprovecharlas. Amén.
    uk: Господи, дай мені сміливість говорити про Тебе людям навколо мене. Допоможи не соромитися
      Євангелії й бути вірним свідком Твоєї любові та істини. Відкривай можливості розповідати
      іншим про спасіння у Христі й давай мудрість використовувати ці можливості. Амінь.
- id: day_044
  ref: re:2:10
  title:
    ru: Верность до конца
    en: Faithfulness to the End
    es: Fidelidad hasta el Fin
    uk: Вірність до кінця
  text:
    ru: Отец Небесный, помоги мне оставаться верным Тебе на протяжении всей жизни. Когда придут
      испытания или разочарования, укрепляй меня и не позволяй свернуть с Твоего пути. Пусть
      мое сердце будет посвящено Тебе до последнего дня. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to remain faithful to You throughout my whole life. When
      trials or disappointments come, strengthen me and do not let me turn from Your path.
      May my heart be devoted to You to my last day. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a permanecer fiel a Ti durante toda mi vida. Cuando lleguen
      las pruebas o las decepciones, fortaléceme y no permitas que me aparte de Tu camino.
      Que mi corazón esté consagrado a Ti hasta el último día. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, допоможи мені залишатися вірним Тобі впродовж усього життя. Коли прийдуть
      випробування чи розчарування, зміцнюй мене й не дай зійти з Твоєї дороги. Нехай моє
      серце буде посвячене Тобі до останнього дня. В ім'я Ісуса Христа. Амінь.
- id: day_045
  ref: is:40:31
  title:
    ru: Ожидание Господа
    en: Waiting on the Lord
    es: Esperar en el Señor
    uk: Очікування на Господа
  text:
    ru: Господи, научи меня терпеливо ожидать Твоих ответов. Помоги мне доверять Твоему времени
      и не торопить события. Когда мне кажется, что Ты молчишь, напомни, что Ты продолжаешь
      действовать. Укрепляй мое сердце надеждой и верой. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to wait patiently for Your answers. Help me to trust Your timing and
      not to rush ahead. When it seems to me that You are silent, remind me that You are still
      at work. Strengthen my heart with hope and faith. In the name of Jesus Christ. Amen.
    es: Señor, enséñame a esperar con paciencia Tus respuestas. Ayúdame a confiar en Tu tiempo
      y a no apresurar las cosas. Cuando me parezca que callas, recuérdame que sigues obrando.
      Fortalece mi corazón con esperanza y fe. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене терпляче очікувати Твоїх відповідей. Допоможи мені довіряти Твоєму
      часу й не квапити подій. Коли мені здається, що Ти мовчиш, нагадай, що Ти продовжуєш
      діяти. Зміцнюй моє серце надією й вірою. В ім'я Ісуса Христа. Амінь.
- id: day_046
  ref: jm:4:10
  title:
    ru: Победа над гордостью
    en: Victory over Pride
    es: Victoria sobre el Orgullo
    uk: Перемога над гордістю
  text:
    ru: Господи, сохрани мое сердце от гордости и превозношения. Напоминай мне, что все доброе
      в моей жизни приходит от Тебя. Помоги мне видеть свои недостатки прежде, чем замечать
      ошибки других. Научи меня ходить в смирении и полностью зависеть от Твоей благодати.
      Во имя Иисуса Христа. Аминь.
    en: Lord, keep my heart from pride and self-exaltation. Remind me that everything good
      in my life comes from You. Help me to see my own faults before I notice the faults of
      others. Teach me to walk in humility and to depend wholly on Your grace. In the name
      of Jesus Christ. Amen.
    es: Señor, guarda mi corazón del orgullo y la altivez. Recuérdame que todo lo bueno en
      mi vida viene de Ti. Ayúdame a ver mis propias faltas antes de notar los errores de
      los demás. Enséñame a andar en humildad y a depender por completo de Tu gracia. En el
      nombre de Jesucristo. Amén.
    uk: Господи, збережи моє серце від гордості й вивищення. Нагадуй мені, що все добре в
      моєму житті приходить від Тебе. Допоможи мені бачити свої вади перш, ніж помічати помилки
      інших. Навчи мене ходити в смиренні й цілком залежати від Твоєї благодаті. В ім'я Ісуса
      Христа. Амінь.
- id: day_047
  ref: 1jo:3:1
  title:
    ru: Божья любовь
    en: God's Love
    es: El Amor de Dios
    uk: Божа любов
  text:
    ru: Отец Небесный, благодарю Тебя за Твою безусловную любовь. Даже когда я ошибаюсь, Ты
      продолжаешь звать меня к Себе. Помоги мне глубже понимать Твою любовь и отражать ее
      в отношениях с людьми. Пусть мое сердце будет наполнено благодарностью за Твою милость.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your unconditional love. Even when I fail, You keep
      calling me to Yourself. Help me to understand Your love more deeply and to reflect it
      in my relationships with others. May my heart be filled with gratitude for Your mercy.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu amor incondicional. Aun cuando me equivoco,
      sigues llamándome hacia Ti. Ayúdame a comprender más hondamente Tu amor y a reflejarlo
      en mis relaciones con los demás. Que mi corazón se llene de gratitud por Tu misericordia.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твою безумовну любов. Навіть коли я помиляюся, Ти продовжуєш
      кликати мене до Себе. Допоможи мені глибше розуміти Твою любов і відображати її у стосунках
      з людьми. Нехай моє серце буде сповнене вдячності за Твою милість. В ім'я Ісуса Христа.
      Амінь.
- id: day_048
  ref: gl:5:22
  title:
    ru: Плод Духа Святого
    en: The Fruit of the Holy Spirit
    es: El Fruto del Espíritu Santo
    uk: Плід Святого Духа
  text:
    ru: Дух Святой, совершай Свою работу во мне. Пусть в моей жизни возрастает любовь, радость,
      мир, долготерпение, благость и верность. Изменяй мой характер и делай меня более похожим
      на Иисуса Христа. Помоги мне приносить плод, который прославляет Бога. Аминь.
    en: Holy Spirit, do Your work within me. May love, joy, peace, patience, kindness, and
      faithfulness grow in my life. Change my character and make me more like Jesus Christ.
      Help me to bear fruit that glorifies God. Amen.
    es: Espíritu Santo, realiza Tu obra en mí. Que en mi vida crezcan el amor, el gozo, la
      paz, la paciencia, la bondad y la fidelidad. Transforma mi carácter y hazme más semejante
      a Jesucristo. Ayúdame a llevar fruto que glorifique a Dios. Amén.
    uk: Душе Святий, звершуй Свою працю в мені. Нехай у моєму житті зростають любов, радість,
      мир, довготерпіння, доброта й вірність. Змінюй мій характер і роби мене подібнішим до
      Ісуса Христа. Допоможи мені приносити плід, який прославляє Бога. Амінь.
- id: day_049
  ref: rm:8:28
  title:
    ru: Благодарность в испытаниях
    en: Gratitude in Trials
    es: Gratitud en las Pruebas
    uk: Подяка у випробуваннях
  text:
    ru: Господи, не всегда легко благодарить Тебя во время трудностей. Но я знаю, что Ты способен
      обратить даже испытания во благо. Помоги мне сохранять доверие и благодарность независимо
      от обстоятельств. Научи меня видеть Твою руку даже в самые непростые дни. Во имя Иисуса
      Христа. Аминь.
    en: Lord, it is not always easy to thank You in times of hardship. Yet I know that You
      are able to turn even trials into good. Help me to keep my trust and gratitude regardless
      of the circumstances. Teach me to see Your hand even in the hardest days. In the name
      of Jesus Christ. Amen.
    es: Señor, no siempre es fácil darte gracias en medio de las dificultades. Pero sé que
      Tú puedes convertir incluso las pruebas en bien. Ayúdame a mantener la confianza y la
      gratitud sin importar las circunstancias. Enséñame a ver Tu mano aun en los días más
      difíciles. En el nombre de Jesucristo. Amén.
    uk: Господи, не завжди легко дякувати Тобі під час труднощів. Але я знаю, що Ти здатний
      обернути навіть випробування на добро. Допоможи мені зберігати довіру й вдячність незалежно
      від обставин. Навчи мене бачити Твою руку навіть у найскладніші дні. В ім'я Ісуса Христа.
      Амінь.
- id: day_050
  ref: mt:5:7
  title:
    ru: Милосердие к ближним
    en: Mercy toward Others
    es: Misericordia hacia el Prójimo
    uk: Милосердя до ближніх
  text:
    ru: Отец Небесный, дай мне сердце, наполненное состраданием. Помоги замечать боль других
      людей и быть готовым поддержать их словом, молитвой или делом. Научи меня проявлять
      милосердие так же, как Ты ежедневно проявляешь его ко мне. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, give me a heart filled with compassion. Help me to notice the pain
      of others and to be ready to support them with a word, a prayer, or a deed. Teach me
      to show mercy just as You show it to me each day. In the name of Jesus Christ. Amen.
    es: Padre Celestial, dame un corazón lleno de compasión. Ayúdame a notar el dolor de los
      demás y a estar dispuesto a sostenerlos con una palabra, una oración o una obra. Enséñame
      a mostrar misericordia así como Tú la muestras conmigo cada día. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, дай мені серце, сповнене співчуття. Допоможи помічати біль інших людей
      і бути готовим підтримати їх словом, молитвою чи ділом. Навчи мене виявляти милосердя
      так само, як Ти щодня виявляєш його до мене. В ім'я Ісуса Христа. Амінь.
- id: day_051
  ref: ps:42:5
  title:
    ru: Победа над унынием
    en: Victory over Despondency
    es: Victoria sobre el Desánimo
    uk: Перемога над зневірою
  text:
    ru: Господи, когда мое сердце наполняется печалью и унынием, напоминай мне о Твоих обещаниях.
      Подними мой взгляд выше обстоятельств и помоги видеть надежду в Тебе. Наполни меня Своей
      радостью и укрепи мой дух. Во имя Иисуса Христа. Аминь.
    en: Lord, when my heart is filled with sorrow and despondency, remind me of Your promises.
      Lift my gaze above my circumstances and help me to see hope in You. Fill me with Your
      joy and strengthen my spirit. In the name of Jesus Christ. Amen.
    es: Señor, cuando mi corazón se llene de tristeza y desánimo, recuérdame Tus promesas.
      Eleva mi mirada por encima de las circunstancias y ayúdame a ver la esperanza en Ti.
      Lléname de Tu gozo y fortalece mi espíritu. En el nombre de Jesucristo. Amén.
    uk: Господи, коли моє серце наповнюється смутком і зневірою, нагадуй мені про Твої обітниці.
      Підніми мій погляд понад обставини й допоможи бачити надію в Тобі. Наповни мене Своєю
      радістю та зміцни мій дух. В ім'я Ісуса Христа. Амінь.
- id: day_052
  ref: ps:19:14
  title:
    ru: Мудрость в словах
    en: Wisdom in Words
    es: Sabiduría en las Palabras
    uk: Мудрість у словах
  text:
    ru: Господи, помоги мне быть осторожным в своих словах. Научи говорить то, что приносит
      мир, утешение и назидание. Удерживай меня от поспешных высказываний, осуждения и раздражения.
      Пусть мои слова будут угодны Тебе и полезны окружающим. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be careful with my words. Teach me to say what brings peace, comfort,
      and edification. Keep me from hasty speech, from judging, and from irritation. May my
      words be pleasing to You and helpful to those around me. In the name of Jesus Christ.
      Amen.
    es: Señor, ayúdame a ser cuidadoso con mis palabras. Enséñame a decir lo que trae paz,
      consuelo y edificación. Guárdame de hablar con prisa, de juzgar y de irritarme. Que
      mis palabras te agraden a Ti y sean de provecho para quienes me rodean. En el nombre
      de Jesucristo. Amén.
    uk: Господи, допоможи мені бути обережним у своїх словах. Навчи говорити те, що приносить
      мир, утіху й повчання. Стримуй мене від поспішних висловлювань, осуду й роздратування.
      Нехай мої слова будуть до вподоби Тобі й корисні для оточення. В ім'я Ісуса Христа.
      Амінь.
- id: day_053
  ref: mk:8:34
  title:
    ru: Посвящение Христу
    en: Devotion to Christ
    es: Consagración a Cristo
    uk: Посвята Христу
  text:
    ru: Господь Иисус, я вновь посвящаю свою жизнь Тебе. Помоги мне следовать за Тобой всем
      сердцем и не разделять свою преданность между Тобой и этим миром. Пусть мои цели, желания
      и решения будут подчинены Твоей воле. Аминь.
    en: Lord Jesus, I again dedicate my life to You. Help me to follow You with all my heart
      and not to divide my loyalty between You and this world. May my goals, desires, and
      decisions be submitted to Your will. Amen.
    es: Señor Jesús, de nuevo consagro mi vida a Ti. Ayúdame a seguirte con todo mi corazón
      y a no dividir mi lealtad entre Tú y este mundo. Que mis metas, mis deseos y mis decisiones
      estén sometidos a Tu voluntad. Amén.
    uk: Господи Ісусе, я знову посвячую своє життя Тобі. Допоможи мені йти за Тобою всім серцем
      і не розділяти своєї відданості між Тобою і цим світом. Нехай мої цілі, бажання й рішення
      будуть підкорені Твоїй волі. Амінь.
- id: day_054
  ref: ps:51:6
  title:
    ru: Честность перед Богом
    en: Honesty before God
    es: Sinceridad delante de Dios
    uk: Чесність перед Богом
  text:
    ru: Отец Небесный, помоги мне быть искренним перед Тобой и людьми. Не допускай лицемерия
      в моей жизни. Дай мне мужество признавать свои ошибки и жить в истине. Пусть моя жизнь
      будет прозрачной и честной перед Твоим лицом. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be sincere before You and before others. Allow no hypocrisy
      in my life. Give me the courage to admit my mistakes and to live in truth. May my life
      be transparent and honest before Your face. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a ser sincero delante de Ti y de los demás. No permitas la
      hipocresía en mi vida. Dame el valor de reconocer mis errores y de vivir en la verdad.
      Que mi vida sea transparente y honesta delante de Tu rostro. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, допоможи мені бути щирим перед Тобою й людьми. Не допускай лицемірства
      в моєму житті. Дай мені мужність визнавати свої помилки й жити в істині. Нехай моє життя
      буде прозорим і чесним перед Твоїм обличчям. В ім'я Ісуса Христа. Амінь.
- id: day_055
  ref: mt:24:35
  title:
    ru: Надежда на Божьи обещания
    en: Hope in God's Promises
    es: Esperanza en las Promesas de Dios
    uk: Надія на Божі обітниці
  text:
    ru: Господи, укрепи меня надеждой на Твои обетования. Когда я не вижу выхода, напоминай
      мне о Своей верности. Помоги мне ждать с верой и не поддаваться отчаянию. Благодарю
      Тебя за то, что каждое Твое слово истинно. Аминь.
    en: Lord, strengthen me with hope in Your promises. When I see no way out, remind me of
      Your faithfulness. Help me to wait in faith and not to give in to despair. Thank You
      that every word of Yours is true. Amen.
    es: Señor, fortaléceme con la esperanza en Tus promesas. Cuando no vea salida, recuérdame
      Tu fidelidad. Ayúdame a esperar con fe y a no ceder a la desesperación. Te doy gracias
      porque cada palabra Tuya es verdadera. Amén.
    uk: Господи, зміцни мене надією на Твої обітниці. Коли я не бачу виходу, нагадуй мені
      про Свою вірність. Допоможи мені чекати з вірою й не піддаватися відчаю. Дякую Тобі
      за те, що кожне Твоє слово істинне. Амінь.
- id: day_056
  ref: ps:103:2
  title:
    ru: Дух благодарения
    en: A Spirit of Thanksgiving
    es: Espíritu de Gratitud
    uk: Дух подяки
  text:
    ru: Господи, научи меня быть благодарным не только за великие благословения, но и за каждодневные
      проявления Твоей заботы. Открой мои глаза на Твои дары и сохрани меня от недовольства.
      Пусть благодарность станет образом моей жизни. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to be thankful not only for great blessings but also for the daily
      tokens of Your care. Open my eyes to Your gifts and keep me from discontent. May thanksgiving
      become the pattern of my life. In the name of Jesus Christ. Amen.
    es: Señor, enséñame a ser agradecido no solo por las grandes bendiciones, sino también
      por las muestras diarias de Tu cuidado. Abre mis ojos a Tus dones y guárdame del descontento.
      Que la gratitud llegue a ser el estilo de mi vida. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене бути вдячним не лише за великі благословення, а й за щоденні вияви
      Твоєї турботи. Відкрий мої очі на Твої дари й збережи мене від невдоволення. Нехай вдячність
      стане способом мого життя. В ім'я Ісуса Христа. Амінь.
- id: day_057
  ref: mt:5:9
  title:
    ru: Миротворец
    en: A Peacemaker
    es: Pacificador
    uk: Миротворець
  text:
    ru: Отец Небесный, помоги мне быть человеком мира. Научи меня избегать ссор и искать примирения.
      Дай мудрость в общении с людьми и помоги строить отношения, основанные на любви и истине.
      Пусть через меня распространяется Твой мир. Аминь.
    en: Heavenly Father, help me to be a person of peace. Teach me to avoid quarrels and to
      seek reconciliation. Give me wisdom in dealing with others and help me to build relationships
      founded on love and truth. May Your peace spread through me. Amen.
    es: Padre Celestial, ayúdame a ser una persona de paz. Enséñame a evitar las contiendas
      y a buscar la reconciliación. Dame sabiduría en el trato con los demás y ayúdame a construir
      relaciones fundadas en el amor y la verdad. Que por medio de mí se extienda Tu paz.
      Amén.
    uk: Отче Небесний, допоможи мені бути людиною миру. Навчи мене уникати сварок і шукати
      примирення. Дай мудрість у спілкуванні з людьми й допоможи будувати стосунки, засновані
      на любові та істині. Нехай через мене поширюється Твій мир. Амінь.
- id: day_058
  ref: 1pe:1:16
  title:
    ru: Святость жизни
    en: Holiness of Life
    es: Santidad de Vida
    uk: Святість життя
  text:
    ru: Господи, Ты призвал меня к святой жизни. Помоги мне удаляться от всего, что огорчает
      Тебя. Очисти мои мысли, желания и поступки. Пусть каждый день я становлюсь ближе к тому
      образу, который Ты приготовил для Своих детей. Во имя Иисуса Христа. Аминь.
    en: Lord, You have called me to a holy life. Help me to turn away from everything that
      grieves You. Cleanse my thoughts, my desires, and my actions. May I grow each day nearer
      to the likeness You have prepared for Your children. In the name of Jesus Christ. Amen.
    es: Señor, Tú me has llamado a una vida santa. Ayúdame a apartarme de todo lo que te entristece.
      Limpia mis pensamientos, mis deseos y mis actos. Que cada día me acerque más a la imagen
      que has preparado para Tus hijos. En el nombre de Jesucristo. Amén.
    uk: Господи, Ти покликав мене до святого життя. Допоможи мені віддалятися від усього,
      що засмучує Тебе. Очисти мої думки, бажання й вчинки. Нехай щодня я стаю ближчим до
      того образу, який Ти приготував для Своїх дітей. В ім'я Ісуса Христа. Амінь.
- id: day_059
  ref: 1sm:7:12
  title:
    ru: Божья верность в прошлом
    en: God's Faithfulness in the Past
    es: La Fidelidad de Dios en el Pasado
    uk: Божа вірність у минулому
  text:
    ru: Господи, благодарю Тебя за все случаи, когда Ты помогал мне раньше. Напоминая о Твоей
      верности в прошлом, укрепляй мою веру в настоящем. Помоги мне не забывать Твои чудеса
      и милости. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for every time You have helped me in the past. As I remember Your
      faithfulness then, strengthen my faith now. Help me never to forget Your wonders and
      Your mercies. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por todas las veces que me ayudaste en el pasado. Al recordar
      Tu fidelidad de entonces, fortalece mi fe en el presente. Ayúdame a no olvidar Tus maravillas
      y Tus misericordias. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за всі випадки, коли Ти допомагав мені раніше. Згадуючи Твою вірність
      у минулому, зміцнюй мою віру в теперішньому. Допоможи мені не забувати Твоїх чудес і
      милостей. В ім'я Ісуса Христа. Амінь.
- id: day_060
  ref: ph:3:20
  title:
    ru: Надежда на вечность
    en: Hope of Eternity
    es: Esperanza de la Eternidad
    uk: Надія на вічність
  text:
    ru: Отец Небесный, благодарю Тебя за надежду вечной жизни через Иисуса Христа. Помоги
      мне жить так, чтобы помнить о вечности и не привязываться чрезмерно к временному. Направляй
      мои мысли к небесному и укрепляй мое ожидание встречи с Тобой. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, thank You for the hope of eternal life through Jesus Christ. Help
      me to live mindful of eternity and not to cling too tightly to what is temporary. Direct
      my thoughts to what is heavenly and strengthen my longing to meet You. In the name of
      Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la esperanza de la vida eterna por medio de Jesucristo.
      Ayúdame a vivir recordando la eternidad y a no aferrarme en exceso a lo temporal. Dirige
      mis pensamientos a lo celestial y fortalece mi anhelo de encontrarme contigo. En el
      nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за надію вічного життя через Ісуса Христа. Допоможи мені
      жити так, щоб пам'ятати про вічність і не прив'язуватися надмірно до тимчасового. Скеровуй
      мої думки до небесного й зміцнюй моє очікування зустрічі з Тобою. В ім'я Ісуса Христа.
      Амінь.
- id: day_061
  ref: jo:4:24
  title:
    ru: Сердце поклонника
    en: A Worshiper's Heart
    es: Un Corazón Adorador
    uk: Серце поклонника
  text:
    ru: Господи, Ты достоин всей славы, чести и поклонения. Помоги мне поклоняться Тебе не
      только словами, но и всей своей жизнью. Пусть мои мысли, поступки и решения прославляют
      Тебя. Научи меня радоваться Твоему присутствию больше, чем земным благословениям. Во
      имя Иисуса Христа. Аминь.
    en: Lord, You are worthy of all glory, honor, and worship. Help me to worship You not
      only with words but with my whole life. May my thoughts, actions, and decisions glorify
      You. Teach me to rejoice in Your presence more than in earthly blessings. In the name
      of Jesus Christ. Amen.
    es: Señor, Tú eres digno de toda gloria, honra y adoración. Ayúdame a adorarte no solo
      con palabras, sino con toda mi vida. Que mis pensamientos, mis actos y mis decisiones
      te glorifiquen. Enséñame a gozarme en Tu presencia más que en las bendiciones terrenales.
      En el nombre de Jesucristo. Amén.
    uk: Господи, Ти достойний усієї слави, честі й поклоніння. Допоможи мені поклонятися Тобі
      не лише словами, а й усім своїм життям. Нехай мої думки, вчинки й рішення прославляють
      Тебе. Навчи мене радіти Твоїй присутності більше, ніж земним благословенням. В ім'я
      Ісуса Христа. Амінь.
- id: day_062
  ref: lk:16:10
  title:
    ru: Верность в малых делах
    en: Faithfulness in Small Things
    es: Fidelidad en lo Pequeño
    uk: Вірність у малих справах
  text:
    ru: Отец Небесный, помоги мне быть ответственным и верным в том, что Ты доверил мне сегодня.
      Научи не пренебрегать малым и помнить, что Ты видишь каждое дело, совершенное для Тебя.
      Дай мне усердие и постоянство в ежедневных обязанностях. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be responsible and faithful in what You have entrusted
      to me today. Teach me not to neglect what is small and to remember that You see every
      deed done for You. Give me diligence and constancy in my daily duties. In the name of
      Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a ser responsable y fiel en lo que me has confiado hoy. Enséñame
      a no despreciar lo pequeño y a recordar que Tú ves cada obra hecha para Ti. Dame diligencia
      y constancia en mis deberes diarios. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені бути відповідальним і вірним у тому, що Ти довірив мені
      сьогодні. Навчи не нехтувати малим і пам'ятати, що Ти бачиш кожну справу, звершену для
      Тебе. Дай мені старанність і постійність у щоденних обов'язках. В ім'я Ісуса Христа.
      Амінь.
- id: day_063
  ref: ps:34:18
  title:
    ru: Божье утешение
    en: God's Comfort
    es: El Consuelo de Dios
    uk: Боже втішення
  text:
    ru: Господи, когда мое сердце скорбит или переживает трудности, будь моим утешением. Напомни
      мне, что Ты близок к сокрушенным сердцем и понимаешь каждую боль. Помоги мне находить
      покой в Твоем присутствии и доверять Тебе даже в слезах. Аминь.
    en: Lord, when my heart grieves or goes through hardship, be my comfort. Remind me that
      You are near to the brokenhearted and understand every pain. Help me to find rest in
      Your presence and to trust You even in tears. Amen.
    es: Señor, cuando mi corazón se aflige o atraviesa dificultades, sé Tú mi consuelo. Recuérdame
      que estás cerca de los quebrantados de corazón y comprendes cada dolor. Ayúdame a hallar
      descanso en Tu presencia y a confiar en Ti aun entre lágrimas. Amén.
    uk: Господи, коли моє серце сумує чи переживає труднощі, будь моїм утішенням. Нагадай
      мені, що Ти близький до зламаних серцем і розумієш кожен біль. Допоможи мені знаходити
      спокій у Твоїй присутності й довіряти Тобі навіть у сльозах. Амінь.
- id: day_064
  ref: lm:3:23
  title:
    ru: Благодарность за новый день
    en: Thanks for a New Day
    es: Gratitud por un Nuevo Día
    uk: Подяка за новий день
  text:
    ru: Отец Небесный, благодарю Тебя за этот день и за дыхание жизни. Спасибо за Твою милость,
      которая обновляется каждое утро. Помоги мне использовать сегодняшний день мудро и прожить
      его так, чтобы он принес славу Тебе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for this day and for the breath of life. Thank You for
      Your mercy, which is new every morning. Help me to use today wisely and to live it in
      a way that brings You glory. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por este día y por el aliento de vida. Gracias por
      Tu misericordia, que es nueva cada mañana. Ayúdame a aprovechar el día de hoy con sabiduría
      y a vivirlo de modo que te dé gloria. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за цей день і за подих життя. Дякую за Твою милість, яка
      оновлюється щоранку. Допоможи мені використати сьогоднішній день мудро й прожити його
      так, щоб він приніс славу Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_065
  ref: gl:6:10
  title:
    ru: Смелость делать добро
    en: Courage to Do Good
    es: Valor para Hacer el Bien
    uk: Сміливість робити добро
  text:
    ru: Господи, помоги мне не проходить мимо возможностей сделать добро. Научи меня замечать
      нужды людей и откликаться на них с любовью. Дай мне смелость поступать правильно даже
      тогда, когда это требует жертвы. Во имя Иисуса Христа. Аминь.
    en: Lord, help me not to pass by opportunities to do good. Teach me to notice people's
      needs and to respond to them with love. Give me the courage to do what is right even
      when it requires sacrifice. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a no pasar por alto las oportunidades de hacer el bien. Enséñame a
      notar las necesidades de las personas y a responder a ellas con amor. Dame el valor
      de obrar rectamente aun cuando exija sacrificio. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені не проходити повз нагоди зробити добро. Навчи мене помічати
      потреби людей і відгукуватися на них з любов'ю. Дай мені сміливість чинити правильно
      навіть тоді, коли це вимагає жертви. В ім'я Ісуса Христа. Амінь.
- id: day_066
  ref: mt:26:41
  title:
    ru: Защита от искушений
    en: Protection from Temptation
    es: Protección ante la Tentación
    uk: Захист від спокус
  text:
    ru: Господи, сохрани меня от всего, что может удалить мое сердце от Тебя. Дай мне духовную
      мудрость распознавать искушения и силу отвергать их. Помоги мне искать Тебя прежде всего
      и хранить верность Твоему Слову. Во имя Иисуса Христа. Аминь.
    en: Lord, keep me from everything that could draw my heart away from You. Give me the
      spiritual wisdom to recognize temptations and the strength to reject them. Help me to
      seek You above all and to keep faithful to Your Word. In the name of Jesus Christ. Amen.
    es: Señor, guárdame de todo lo que pueda apartar mi corazón de Ti. Dame sabiduría espiritual
      para reconocer las tentaciones y fuerza para rechazarlas. Ayúdame a buscarte ante todo
      y a guardar fidelidad a Tu Palabra. En el nombre de Jesucristo. Amén.
    uk: Господи, збережи мене від усього, що може віддалити моє серце від Тебе. Дай мені духовну
      мудрість розпізнавати спокуси й силу відкидати їх. Допоможи мені шукати Тебе передусім
      і берегти вірність Твоєму Слову. В ім'я Ісуса Христа. Амінь.
- id: day_067
  ref: ph:4:7
  title:
    ru: Божий мир
    en: God's Peace
    es: La Paz de Dios
    uk: Божий мир
  text:
    ru: Отец Небесный, наполни мое сердце Твоим миром. Когда вокруг беспокойство и неопределенность,
      помоги мне помнить, что Ты остаешься Царем над всем. Научи меня отдыхать в Твоих обещаниях
      и не поддаваться страху. Аминь.
    en: Heavenly Father, fill my heart with Your peace. When there is anxiety and uncertainty
      all around, help me to remember that You remain King over all. Teach me to rest in Your
      promises and not to give in to fear. Amen.
    es: Padre Celestial, llena mi corazón de Tu paz. Cuando alrededor hay inquietud e incertidumbre,
      ayúdame a recordar que Tú sigues siendo Rey sobre todo. Enséñame a descansar en Tus
      promesas y a no ceder al temor. Amén.
    uk: Отче Небесний, наповни моє серце Твоїм миром. Коли довкола неспокій і невизначеність,
      допоможи мені пам'ятати, що Ти залишаєшся Царем над усім. Навчи мене спочивати у Твоїх
      обітницях і не піддаватися страхові. Амінь.
- id: day_068
  ref: jm:1:22
  title:
    ru: Послушание Слову
    en: Obedience to the Word
    es: Obediencia a la Palabra
    uk: Послух Слову
  text:
    ru: Господи, помоги мне быть не только слушателем Твоего Слова, но и исполнителем. Показывай
      мне области жизни, которые нуждаются в изменении. Дай мне решимость следовать истине,
      даже когда это трудно. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be not only a hearer of Your Word but also a doer of it. Show me
      the areas of my life that need to change. Give me the resolve to follow the truth even
      when it is hard. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a ser no solo oidor de Tu Palabra, sino también hacedor de ella. Muéstrame
      las áreas de mi vida que necesitan cambiar. Dame la determinación de seguir la verdad
      aun cuando sea difícil. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бути не лише слухачем Твого Слова, а й виконавцем. Показуй
      мені ділянки життя, які потребують зміни. Дай мені рішучість іти за істиною навіть тоді,
      коли це важко. В ім'я Ісуса Христа. Амінь.
- id: day_069
  ref: gl:6:2
  title:
    ru: Забота о ближних
    en: Care for Others
    es: Cuidado del Prójimo
    uk: Турбота про ближніх
  text:
    ru: Отец, открой мои глаза на нужды людей вокруг меня. Помоги мне быть внимательным к
      тем, кто нуждается в поддержке, добром слове или молитве. Научи меня любить людей так,
      как Ты любишь меня. Аминь.
    en: Father, open my eyes to the needs of the people around me. Help me to be attentive
      to those who need support, a kind word, or a prayer. Teach me to love people as You
      love me. Amen.
    es: Padre, abre mis ojos a las necesidades de las personas que me rodean. Ayúdame a estar
      atento a quienes necesitan apoyo, una palabra amable o una oración. Enséñame a amar
      a los demás como Tú me amas a mí. Amén.
    uk: Отче, відкрий мої очі на потреби людей навколо мене. Допоможи мені бути уважним до
      тих, хто потребує підтримки, доброго слова чи молитви. Навчи мене любити людей так,
      як Ти любиш мене. Амінь.
- id: day_070
  ref: is:58:11
  title:
    ru: Благодарность за Божье водительство
    en: Thanks for God's Guidance
    es: Gratitud por la Guía de Dios
    uk: Подяка за Боже провідництво
  text:
    ru: Господи, благодарю Тебя за то, что Ты ведешь меня по жизни. Даже когда я не понимаю
      Твоих путей, я знаю, что они совершенны. Помоги мне доверять Твоему руководству и не
      уклоняться от Твоей воли. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for leading me through life. Even when I do not understand Your ways,
      I know they are perfect. Help me to trust Your guidance and not to turn aside from Your
      will. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque me guías a lo largo de la vida. Aunque no entienda Tus
      caminos, sé que son perfectos. Ayúdame a confiar en Tu dirección y a no apartarme de
      Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти ведеш мене життям. Навіть коли я не розумію Твоїх
      доріг, я знаю, що вони досконалі. Допоможи мені довіряти Твоєму керівництву й не ухилятися
      від Твоєї волі. В ім'я Ісуса Христа. Амінь.
- id: day_071
  ref: js:1:7
  title:
    ru: Мужество в вере
    en: Courage in Faith
    es: Valor en la Fe
    uk: Мужність у вірі
  text:
    ru: Господи, укрепи меня быть смелым в своей вере. Помоги не скрывать свою принадлежность
      к Тебе и не бояться мнения людей. Дай мне твердость стоять за истину с любовью и мудростью.
      Во имя Иисуса Христа. Аминь.
    en: Lord, strengthen me to be bold in my faith. Help me not to hide that I belong to You
      and not to fear people's opinions. Give me firmness to stand for the truth with love
      and wisdom. In the name of Jesus Christ. Amen.
    es: Señor, fortaléceme para ser valiente en mi fe. Ayúdame a no ocultar que te pertenezco
      y a no temer la opinión de los demás. Dame firmeza para defender la verdad con amor
      y sabiduría. En el nombre de Jesucristo. Amén.
    uk: Господи, зміцни мене бути сміливим у своїй вірі. Допоможи не приховувати своєї належності
      до Тебе й не боятися думки людей. Дай мені твердість стояти за істину з любов'ю та мудрістю.
      В ім'я Ісуса Христа. Амінь.
- id: day_072
  ref: mt:5:8
  title:
    ru: Чистота сердца
    en: Purity of Heart
    es: Pureza de Corazón
    uk: Чистота серця
  text:
    ru: Отец Небесный, очищай мое сердце от всего, что неугодно Тебе. Помоги мне хранить свои
      мысли, желания и мотивы в святости. Пусть моя жизнь будет отражением Твоей чистоты и
      любви. Аминь.
    en: Heavenly Father, cleanse my heart from everything that displeases You. Help me to
      keep my thoughts, desires, and motives in holiness. May my life be a reflection of Your
      purity and love. Amen.
    es: Padre Celestial, limpia mi corazón de todo lo que te desagrada. Ayúdame a guardar
      en santidad mis pensamientos, deseos y motivos. Que mi vida sea un reflejo de Tu pureza
      y de Tu amor. Amén.
    uk: Отче Небесний, очищай моє серце від усього, що неугодне Тобі. Допоможи мені берегти
      свої думки, бажання й спонукання у святості. Нехай моє життя буде відображенням Твоєї
      чистоти й любові. Амінь.
- id: day_073
  ref: ps:100:2
  title:
    ru: Радость служения
    en: The Joy of Service
    es: El Gozo de Servir
    uk: Радість служіння
  text:
    ru: Господи, помоги мне служить Тебе с радостью, а не по обязанности. Пусть каждое доброе
      дело будет выражением любви к Тебе. Научи меня видеть ценность в служении людям и не
      искать человеческой похвалы. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to serve You with joy and not out of duty. May every good deed be an
      expression of love for You. Teach me to see the worth in serving others and not to seek
      the praise of people. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a servirte con gozo y no por obligación. Que cada buena obra sea una
      expresión de amor hacia Ti. Enséñame a ver el valor de servir a los demás y a no buscar
      la alabanza de los hombres. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені служити Тобі з радістю, а не з обов'язку. Нехай кожна добра
      справа буде виявом любові до Тебе. Навчи мене бачити цінність у служінні людям і не
      шукати людської похвали. В ім'я Ісуса Христа. Амінь.
- id: day_074
  ref: prv:17:17
  title:
    ru: Благословение для друзей
    en: A Blessing for Friends
    es: Bendición para los Amigos
    uk: Благословення для друзів
  text:
    ru: Отец Небесный, благодарю Тебя за людей, которых Ты привел в мою жизнь. Благослови
      моих друзей, укрепи их веру и помоги им во всех обстоятельствах. Научи меня быть верным
      другом и поддержкой для окружающих. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the people You have brought into my life. Bless my
      friends, strengthen their faith, and help them in every circumstance. Teach me to be
      a faithful friend and a support to those around me. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por las personas que has traído a mi vida. Bendice
      a mis amigos, fortalece su fe y ayúdalos en toda circunstancia. Enséñame a ser un amigo
      fiel y un apoyo para quienes me rodean. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за людей, яких Ти привів у моє життя. Благослови моїх друзів,
      зміцни їхню віру й допоможи їм за всіх обставин. Навчи мене бути вірним другом і підтримкою
      для оточення. В ім'я Ісуса Христа. Амінь.
- id: day_075
  ref: mt:5:16
  title:
    ru: Жизнь для Божьей славы
    en: A Life for God's Glory
    es: Una Vida para la Gloria de Dios
    uk: Життя для Божої слави
  text:
    ru: Господи, помоги мне помнить, что моя жизнь принадлежит Тебе. Пусть мои слова, решения
      и поступки прославляют Твое имя. Направляй меня сегодня и каждый день, чтобы через мою
      жизнь люди могли видеть Твою любовь и истину. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to remember that my life belongs to You. May my words, decisions, and
      actions glorify Your name. Guide me today and every day, so that through my life people
      may see Your love and truth. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a recordar que mi vida te pertenece. Que mis palabras, decisiones y
      actos glorifiquen Tu nombre. Guíame hoy y cada día, para que por medio de mi vida las
      personas puedan ver Tu amor y Tu verdad. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені пам'ятати, що моє життя належить Тобі. Нехай мої слова, рішення
      й вчинки прославляють Твоє ім'я. Скеровуй мене сьогодні й кожного дня, щоб через моє
      життя люди могли бачити Твою любов та істину. В ім'я Ісуса Христа. Амінь.
- id: day_076
  ref: ps:103:17
  title:
    ru: Благодарность за Божью милость
    en: Thanks for God's Mercy
    es: Gratitud por la Misericordia de Dios
    uk: Подяка за Божу милість
  text:
    ru: Господи, благодарю Тебя за Твою милость, которая сопровождает меня каждый день. Я
      не заслуживаю Твоей благости, но Ты продолжаешь любить, прощать и поддерживать меня.
      Помоги мне никогда не привыкать к Твоим дарам и всегда помнить о Твоей доброте. Во имя
      Иисуса Христа. Аминь.
    en: Lord, thank You for Your mercy, which accompanies me every day. I do not deserve Your
      goodness, yet You keep loving, forgiving, and upholding me. Help me never to take Your
      gifts for granted and always to remember Your kindness. In the name of Jesus Christ.
      Amen.
    es: Señor, te doy gracias por Tu misericordia, que me acompaña cada día. No merezco Tu
      bondad, pero sigues amándome, perdonándome y sosteniéndome. Ayúdame a no acostumbrarme
      nunca a Tus dones y a recordar siempre Tu bondad. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за Твою милість, яка супроводжує мене щодня. Я не заслуговую на
      Твою доброту, але Ти продовжуєш любити, прощати й підтримувати мене. Допоможи мені ніколи
      не звикати до Твоїх дарів і завжди пам'ятати про Твою доброту. В ім'я Ісуса Христа.
      Амінь.
- id: day_077
  ref: ps:28:7
  title:
    ru: Господь — моя крепость
    en: The Lord Is My Stronghold
    es: El Señor Es mi Fortaleza
    uk: Господь — моя твердиня
  text:
    ru: Отец Небесный, когда я чувствую себя слабым, напоминай мне, что моя сила в Тебе. Ты
      моя крепость, защита и убежище. Помоги мне не надеяться только на собственные возможности,
      но искать поддержку в Тебе. Укрепи меня для всех задач и испытаний этого дня. Аминь.
    en: Heavenly Father, when I feel weak, remind me that my strength is in You. You are my
      stronghold, my defense, and my refuge. Help me not to rely on my own abilities alone,
      but to seek support in You. Strengthen me for all the tasks and trials of this day.
      Amen.
    es: Padre Celestial, cuando me sienta débil, recuérdame que mi fuerza está en Ti. Tú eres
      mi fortaleza, mi defensa y mi refugio. Ayúdame a no confiar solo en mis propias capacidades,
      sino a buscar apoyo en Ti. Fortaléceme para todas las tareas y pruebas de este día.
      Amén.
    uk: Отче Небесний, коли я почуваюся слабким, нагадуй мені, що моя сила в Тобі. Ти моя
      твердиня, захист і пристановище. Допоможи мені не покладатися лише на власні можливості,
      а шукати підтримки в Тобі. Зміцни мене для всіх завдань і випробувань цього дня. Амінь.
- id: day_078
  ref: jo:3:16
  title:
    ru: Благодарность за спасение
    en: Thanks for Salvation
    es: Gratitud por la Salvación
    uk: Подяка за спасіння
  text:
    ru: Господь Иисус, благодарю Тебя за спасение, которое Ты подарил мне через Свою жертву
      на кресте. Спасибо за прощение грехов и новую жизнь. Помоги мне жить достойно этого
      великого дара и никогда не забывать цену моего искупления. Во имя Твое. Аминь.
    en: Lord Jesus, thank You for the salvation You have given me through Your sacrifice on
      the cross. Thank You for the forgiveness of sins and for new life. Help me to live worthy
      of this great gift and never to forget the price of my redemption. In Your name. Amen.
    es: Señor Jesús, te doy gracias por la salvación que me regalaste por medio de Tu sacrificio
      en la cruz. Gracias por el perdón de los pecados y por la vida nueva. Ayúdame a vivir
      de manera digna de este gran regalo y a no olvidar nunca el precio de mi redención.
      En Tu nombre. Amén.
    uk: Господи Ісусе, дякую Тобі за спасіння, яке Ти подарував мені через Свою жертву на
      хресті. Дякую за прощення гріхів і нове життя. Допоможи мені жити гідно цього великого
      дару й ніколи не забувати ціну мого викуплення. В ім'я Твоє. Амінь.
- id: day_079
  ref: ps:37:5
  title:
    ru: Доверие в неопределенности
    en: Trust in Uncertainty
    es: Confianza en la Incertidumbre
    uk: Довіра в невизначеності
  text:
    ru: Господи, бывают моменты, когда я не знаю, что ждет меня впереди. Но Ты знаешь конец
      от начала. Помоги мне доверять Тебе даже тогда, когда путь кажется неясным. Наполни
      мое сердце уверенностью в том, что Ты ведешь меня лучшим путем. Аминь.
    en: Lord, there are moments when I do not know what lies ahead. But You know the end from
      the beginning. Help me to trust You even when the way seems unclear. Fill my heart with
      the assurance that You are leading me by the best path. Amen.
    es: Señor, hay momentos en que no sé lo que me espera por delante. Pero Tú conoces el
      fin desde el principio. Ayúdame a confiar en Ti aun cuando el camino parezca incierto.
      Llena mi corazón con la certeza de que me conduces por el mejor camino. Amén.
    uk: Господи, бувають моменти, коли я не знаю, що чекає на мене попереду. Але Ти знаєш
      кінець від початку. Допоможи мені довіряти Тобі навіть тоді, коли шлях видається неясним.
      Наповни моє серце впевненістю, що Ти ведеш мене найкращою дорогою. Амінь.
- id: day_080
  ref: ps:143:10
  title:
    ru: Сердце ученика
    en: A Disciple's Heart
    es: Un Corazón de Discípulo
    uk: Серце учня
  text:
    ru: Отец Небесный, научи меня быть учеником Христа каждый день. Помоги мне быть готовым
      учиться, исправляться и возрастать в вере. Дай мне смирение принимать Твои наставления
      и мудрость применять их в жизни. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, teach me to be a disciple of Christ each day. Help me to be ready
      to learn, to correct my ways, and to grow in faith. Give me the humility to receive
      Your instruction and the wisdom to apply it in my life. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, enséñame a ser discípulo de Cristo cada día. Ayúdame a estar dispuesto
      a aprender, a corregirme y a crecer en la fe. Dame humildad para recibir Tus enseñanzas
      y sabiduría para aplicarlas en mi vida. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, навчи мене бути учнем Христа щодня. Допоможи мені бути готовим учитися,
      виправлятися й зростати у вірі. Дай мені смирення приймати Твої настанови й мудрість
      застосовувати їх у житті. В ім'я Ісуса Христа. Амінь.
- id: day_081
  ref: ps:34:19
  title:
    ru: Верность в испытаниях
    en: Faithfulness in Trials
    es: Fidelidad en las Pruebas
    uk: Вірність у випробуваннях
  text:
    ru: Господи, когда приходят трудности, помоги мне оставаться верным Тебе. Не позволь обстоятельствам
      охладить мою веру или лишить меня надежды. Укрепи меня и напомни, что Ты рядом даже
      в самые темные дни. Аминь.
    en: Lord, when difficulties come, help me to remain faithful to You. Do not let circumstances
      cool my faith or rob me of hope. Strengthen me and remind me that You are near even
      in the darkest days. Amen.
    es: Señor, cuando lleguen las dificultades, ayúdame a permanecer fiel a Ti. No permitas
      que las circunstancias enfríen mi fe ni me quiten la esperanza. Fortaléceme y recuérdame
      que estás cerca aun en los días más oscuros. Amén.
    uk: Господи, коли приходять труднощі, допоможи мені залишатися вірним Тобі. Не дозволь
      обставинам охолодити мою віру чи позбавити мене надії. Зміцни мене й нагадай, що Ти
      поруч навіть у найтемніші дні. Амінь.
- id: day_082
  ref: mt:5:44
  title:
    ru: Любовь к врагам
    en: Love for Enemies
    es: Amor a los Enemigos
    uk: Любов до ворогів
  text:
    ru: Господи, Ты призвал меня любить даже тех, кто причиняет мне боль. Это нелегко, но
      я прошу Тебя наполнить мое сердце Твоей любовью. Помоги мне благословлять, а не проклинать,
      прощать, а не мстить. Сделай меня похожим на Христа. Аминь.
    en: Lord, You have called me to love even those who cause me pain. It is not easy, but
      I ask You to fill my heart with Your love. Help me to bless rather than curse, to forgive
      rather than take revenge. Make me like Christ. Amen.
    es: Señor, Tú me has llamado a amar incluso a quienes me causan dolor. No es fácil, pero
      te pido que llenes mi corazón de Tu amor. Ayúdame a bendecir en vez de maldecir, a perdonar
      en vez de vengarme. Hazme semejante a Cristo. Amén.
    uk: Господи, Ти покликав мене любити навіть тих, хто завдає мені болю. Це нелегко, але
      я прошу Тебе наповнити моє серце Твоєю любов'ю. Допоможи мені благословляти, а не проклинати,
      прощати, а не мститися. Зроби мене подібним до Христа. Амінь.
- id: day_083
  ref: ps:145:13
  title:
    ru: Божья верность каждый день
    en: God's Faithfulness Every Day
    es: La Fidelidad de Dios Cada Día
    uk: Божа вірність щодня
  text:
    ru: Отец Небесный, благодарю Тебя за то, что Твоя верность не зависит от обстоятельств.
      Когда я слаб, Ты остаешься сильным. Когда я сомневаюсь, Ты остаешься неизменным. Помоги
      мне помнить это и жить с доверием к Тебе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that Your faithfulness does not depend on circumstances.
      When I am weak, You remain strong. When I doubt, You remain unchanging. Help me to remember
      this and to live in trust toward You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias porque Tu fidelidad no depende de las circunstancias.
      Cuando soy débil, Tú permaneces fuerte. Cuando dudo, Tú permaneces inmutable. Ayúdame
      a recordarlo y a vivir confiando en Ti. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те, що Твоя вірність не залежить від обставин. Коли я
      слабкий, Ти залишаєшся сильним. Коли я сумніваюся, Ти залишаєшся незмінним. Допоможи
      мені пам'ятати це й жити з довірою до Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_084
  ref: prv:3:6
  title:
    ru: Мудрость в решениях
    en: Wisdom in Decisions
    es: Sabiduría en las Decisiones
    uk: Мудрість у рішеннях
  text:
    ru: Господи, сегодня мне предстоит принимать решения. Прошу Тебя, направляй мои мысли
      и не позволяй мне руководствоваться только эмоциями или человеческой мудростью. Покажи
      мне путь, который угоден Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, today I have decisions to make. I ask You to guide my thoughts and not to let
      me be ruled only by emotions or human wisdom. Show me the way that is pleasing to You.
      In the name of Jesus Christ. Amen.
    es: Señor, hoy debo tomar decisiones. Te pido que guíes mis pensamientos y no permitas
      que me deje llevar solo por las emociones o la sabiduría humana. Muéstrame el camino
      que te agrada. En el nombre de Jesucristo. Amén.
    uk: Господи, сьогодні мені належить приймати рішення. Прошу Тебе, скеровуй мої думки й
      не дозволь керуватися лише емоціями чи людською мудрістю. Покажи мені шлях, угодний
      Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_085
  ref: hb:10:24
  title:
    ru: Благодарность за Церковь
    en: Thanks for the Church
    es: Gratitud por la Iglesia
    uk: Подяка за Церкву
  text:
    ru: Отец Небесный, благодарю Тебя за Церковь Христову и за верующих, которых Ты поставил
      рядом со мной. Помоги мне быть полезным для Твоего народа, поддерживать братьев и сестер
      и хранить единство духа в союзе мира. Аминь.
    en: Heavenly Father, thank You for the Church of Christ and for the believers You have
      placed beside me. Help me to be useful to Your people, to support my brothers and sisters,
      and to keep the unity of the Spirit in the bond of peace. Amen.
    es: Padre Celestial, te doy gracias por la Iglesia de Cristo y por los creyentes que has
      puesto a mi lado. Ayúdame a ser útil para Tu pueblo, a apoyar a mis hermanos y hermanas
      y a guardar la unidad del Espíritu en el vínculo de la paz. Amén.
    uk: Отче Небесний, дякую Тобі за Церкву Христову і за віруючих, яких Ти поставив поруч
      зі мною. Допоможи мені бути корисним для Твого народу, підтримувати братів і сестер
      та берегти єдність духа в союзі миру. Амінь.
- id: day_086
  ref: ps:23:1
  title:
    ru: Господь — мой Пастырь
    en: The Lord Is My Shepherd
    es: El Señor Es mi Pastor
    uk: Господь — мій Пастир
  text:
    ru: Господи, благодарю Тебя за Твою заботу. Как добрый Пастырь, Ты ведешь меня, питаешь
      и защищаешь. Помоги мне следовать за Тобой и не искать собственных путей. Дай мне покой
      в уверенности, что я нахожусь в Твоих руках. Аминь.
    en: Lord, thank You for Your care. As a good Shepherd, You lead me, feed me, and protect
      me. Help me to follow You and not to seek my own ways. Give me peace in the assurance
      that I am in Your hands. Amen.
    es: Señor, te doy gracias por Tu cuidado. Como buen Pastor, Tú me guías, me alimentas
      y me proteges. Ayúdame a seguirte y a no buscar mis propios caminos. Dame paz en la
      certeza de que estoy en Tus manos. Amén.
    uk: Господи, дякую Тобі за Твою турботу. Як добрий Пастир, Ти ведеш мене, годуєш і захищаєш.
      Допоможи мені йти за Тобою й не шукати власних доріг. Дай мені спокій у впевненості,
      що я перебуваю у Твоїх руках. Амінь.
- id: day_087
  ref: lm:3:26
  title:
    ru: Терпение в ожидании
    en: Patience in Waiting
    es: Paciencia en la Espera
    uk: Терпіння в очікуванні
  text:
    ru: Отец, научи меня терпеливо ждать Твоего времени. Когда ответы не приходят сразу, помоги
      мне не унывать и не терять веру. Укрепляй мое сердце и напоминай, что Ты всегда действуешь
      во благо Своих детей. Во имя Иисуса Христа. Аминь.
    en: Father, teach me to wait patiently for Your timing. When answers do not come at once,
      help me not to lose heart or lose faith. Strengthen my heart and remind me that You
      always work for the good of Your children. In the name of Jesus Christ. Amen.
    es: Padre, enséñame a esperar con paciencia Tu tiempo. Cuando las respuestas no lleguen
      de inmediato, ayúdame a no desanimarme ni a perder la fe. Fortalece mi corazón y recuérdame
      que siempre obras para el bien de Tus hijos. En el nombre de Jesucristo. Amén.
    uk: Отче, навчи мене терпляче чекати Твого часу. Коли відповіді не приходять одразу, допоможи
      мені не занепадати духом і не втрачати віри. Зміцнюй моє серце й нагадуй, що Ти завжди
      дієш на благо Своїх дітей. В ім'я Ісуса Христа. Амінь.
- id: day_088
  ref: 2pe:3:18
  title:
    ru: Духовный рост
    en: Spiritual Growth
    es: Crecimiento Espiritual
    uk: Духовне зростання
  text:
    ru: Господи, помоги мне возрастать в познании Тебя. Не позволь мне остановиться в духовном
      развитии. Учи меня через Твое Слово, обстоятельства и действие Святого Духа. Пусть моя
      вера становится крепче с каждым днем. Аминь.
    en: Lord, help me to grow in the knowledge of You. Do not let me stand still in my spiritual
      development. Teach me through Your Word, through circumstances, and through the working
      of the Holy Spirit. May my faith grow stronger each day. Amen.
    es: Señor, ayúdame a crecer en el conocimiento de Ti. No permitas que me detenga en mi
      desarrollo espiritual. Enséñame por medio de Tu Palabra, las circunstancias y la obra
      del Espíritu Santo. Que mi fe se haga más firme cada día. Amén.
    uk: Господи, допоможи мені зростати в пізнанні Тебе. Не дозволь мені зупинитися в духовному
      розвитку. Навчай мене через Твоє Слово, обставини й дію Святого Духа. Нехай моя віра
      міцнішає з кожним днем. Амінь.
- id: day_089
  ref: jo:8:12
  title:
    ru: Свет Христов
    en: The Light of Christ
    es: La Luz de Cristo
    uk: Світло Христове
  text:
    ru: Господь Иисус, помоги мне отражать Твой свет в этом мире. Пусть моя жизнь указывает
      людям на Тебя. Дай мне мудрость, доброту и верность, чтобы окружающие могли увидеть
      Твою любовь через мои дела. Аминь.
    en: Lord Jesus, help me to reflect Your light in this world. May my life point people
      to You. Give me wisdom, kindness, and faithfulness, so that those around me may see
      Your love through my deeds. Amen.
    es: Señor Jesús, ayúdame a reflejar Tu luz en este mundo. Que mi vida señale a las personas
      hacia Ti. Dame sabiduría, bondad y fidelidad, para que quienes me rodean puedan ver
      Tu amor por medio de mis obras. Amén.
    uk: Господи Ісусе, допоможи мені відображати Твоє світло в цьому світі. Нехай моє життя
      вказує людям на Тебе. Дай мені мудрість, доброту й вірність, щоб оточення могло побачити
      Твою любов через мої справи. Амінь.
- id: day_090
  ref: 1pe:1:3
  title:
    ru: Надежда во Христе
    en: Hope in Christ
    es: Esperanza en Cristo
    uk: Надія у Христі
  text:
    ru: Отец Небесный, благодарю Тебя за надежду, которую я имею во Христе. Когда мир вокруг
      меняется, Ты остаешься неизменным. Помоги мне строить свою жизнь на Тебе и находить
      уверенность не в обстоятельствах, а в Твоих обещаниях. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the hope I have in Christ. When the world around me
      changes, You remain unchanging. Help me to build my life on You and to find my assurance
      not in circumstances but in Your promises. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la esperanza que tengo en Cristo. Cuando el mundo
      a mi alrededor cambia, Tú permaneces inmutable. Ayúdame a edificar mi vida sobre Ti
      y a hallar mi seguridad no en las circunstancias, sino en Tus promesas. En el nombre
      de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за надію, яку я маю у Христі. Коли світ навколо мене змінюється,
      Ти залишаєшся незмінним. Допоможи мені будувати своє життя на Тобі й знаходити впевненість
      не в обставинах, а у Твоїх обітницях. В ім'я Ісуса Христа. Амінь.
- id: day_091
  ref: ps:63:1
  title:
    ru: Жажда Божьего присутствия
    en: Thirst for God's Presence
    es: Sed de la Presencia de Dios
    uk: Спрага за Божою присутністю
  text:
    ru: Господи, больше всего я нуждаюсь в Тебе. Не позволяй земным заботам и суете отвлекать
      меня от общения с Тобой. Разожги во мне желание искать Твое лицо каждый день. Пусть
      мое сердце стремится к Тебе больше, чем к любым благословениям. Во имя Иисуса Христа.
      Аминь.
    en: Lord, more than anything I need You. Do not let earthly cares and busyness distract
      me from fellowship with You. Kindle in me a desire to seek Your face each day. May my
      heart long for You more than for any blessing. In the name of Jesus Christ. Amen.
    es: Señor, más que nada te necesito a Ti. No permitas que las preocupaciones y el ajetreo
      terrenales me aparten de la comunión contigo. Enciende en mí el deseo de buscar Tu rostro
      cada día. Que mi corazón te anhele más que cualquier bendición. En el nombre de Jesucristo.
      Amén.
    uk: Господи, найбільше я потребую Тебе. Не дозволь земним турботам і метушні відволікати
      мене від спілкування з Тобою. Розпали в мені бажання шукати Твого обличчя щодня. Нехай
      моє серце прагне Тебе більше, ніж будь-яких благословень. В ім'я Ісуса Христа. Амінь.
- id: day_092
  ref: 2co:12:9
  title:
    ru: Сила в слабости
    en: Strength in Weakness
    es: Fuerza en la Debilidad
    uk: Сила в слабкості
  text:
    ru: Господи, я признаю, что своими силами не могу пройти жизненный путь. Благодарю Тебя
      за то, что именно в моей слабости проявляется Твоя сила. Помоги мне не полагаться на
      себя, а искать помощи у Тебя. Укрепи меня сегодня для всего, что ожидает впереди. Аминь.
    en: Lord, I confess that by my own strength I cannot walk the path of life. Thank You
      that it is precisely in my weakness that Your power is shown. Help me not to rely on
      myself but to seek help in You. Strengthen me today for all that lies ahead. Amen.
    es: Señor, reconozco que con mis propias fuerzas no puedo recorrer el camino de la vida.
      Te doy gracias porque es justamente en mi debilidad donde se manifiesta Tu poder. Ayúdame
      a no confiar en mí mismo, sino a buscar ayuda en Ti. Fortaléceme hoy para todo lo que
      me espera. Amén.
    uk: Господи, я визнаю, що власними силами не можу пройти життєву дорогу. Дякую Тобі за
      те, що саме в моїй слабкості виявляється Твоя сила. Допоможи мені не покладатися на
      себе, а шукати допомоги в Тебе. Зміцни мене сьогодні для всього, що чекає попереду.
      Амінь.
- id: day_093
  ref: hb:3:15
  title:
    ru: Сердце, открытое для Бога
    en: A Heart Open to God
    es: Un Corazón Abierto a Dios
    uk: Серце, відкрите для Бога
  text:
    ru: Отец Небесный, сделай мое сердце мягким и восприимчивым к Твоему голосу. Помоги мне
      не ожесточаться из-за трудностей или разочарований. Научи меня принимать Твои наставления
      с доверием и послушанием. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, make my heart soft and receptive to Your voice. Help me not to grow
      hardened because of hardships or disappointments. Teach me to receive Your instruction
      with trust and obedience. In the name of Jesus Christ. Amen.
    es: Padre Celestial, haz que mi corazón sea blando y receptivo a Tu voz. Ayúdame a no
      endurecerme a causa de las dificultades o las decepciones. Enséñame a recibir Tus enseñanzas
      con confianza y obediencia. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, зроби моє серце м'яким і чутливим до Твого голосу. Допоможи мені не
      зачерствіти через труднощі чи розчарування. Навчи мене приймати Твої настанови з довірою
      й послухом. В ім'я Ісуса Христа. Амінь.
- id: day_094
  ref: cl:1:14
  title:
    ru: Благодарность за прощение
    en: Thanks for Forgiveness
    es: Gratitud por el Perdón
    uk: Подяка за прощення
  text:
    ru: Господи, благодарю Тебя за то, что Ты прощаешь мои грехи. Спасибо, что через кровь
      Иисуса Христа я имею оправдание и мир с Богом. Помоги мне жить в свободе, которую Ты
      даровал, и не возвращаться к прежней жизни. Аминь.
    en: Lord, thank You for forgiving my sins. Thank You that through the blood of Jesus Christ
      I have justification and peace with God. Help me to live in the freedom You have given
      and not to return to my former life. Amen.
    es: Señor, te doy gracias por perdonar mis pecados. Gracias porque por medio de la sangre
      de Jesucristo tengo justificación y paz con Dios. Ayúdame a vivir en la libertad que
      me has dado y a no volver a mi vida anterior. Amén.
    uk: Господи, дякую Тобі за те, що Ти прощаєш мої гріхи. Дякую, що через кров Ісуса Христа
      я маю виправдання й мир з Богом. Допоможи мені жити у свободі, яку Ти дарував, і не
      повертатися до колишнього життя. Амінь.
- id: day_095
  ref: 1ts:5:17
  title:
    ru: Верность в молитве
    en: Faithfulness in Prayer
    es: Fidelidad en la Oración
    uk: Вірність у молитві
  text:
    ru: Отец Небесный, помоги мне не ослабевать в молитве. Даже когда я не вижу быстрых ответов,
      укрепляй мою веру и напоминай, что Ты слышишь каждое обращение к Тебе. Научи меня искать
      прежде всего Твою волю. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me not to grow weak in prayer. Even when I see no quick answers,
      strengthen my faith and remind me that You hear every cry to You. Teach me to seek above
      all Your will. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a no desfallecer en la oración. Aun cuando no vea respuestas
      rápidas, fortalece mi fe y recuérdame que escuchas cada clamor que te dirijo. Enséñame
      a buscar ante todo Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені не слабнути в молитві. Навіть коли я не бачу швидких
      відповідей, зміцнюй мою віру й нагадуй, що Ти чуєш кожне звернення до Тебе. Навчи мене
      шукати передусім Твоєї волі. В ім'я Ісуса Христа. Амінь.
- id: day_096
  ref: ps:34:7
  title:
    ru: Благодарность за Божью защиту
    en: Thanks for God's Protection
    es: Gratitud por la Protección de Dios
    uk: Подяка за Божий захист
  text:
    ru: Господи, благодарю Тебя за все случаи, когда Ты хранил меня, даже когда я этого не
      замечал. Спасибо за Твою невидимую защиту и постоянную заботу. Помоги мне жить с уверенностью,
      что моя жизнь находится в Твоих руках. Аминь.
    en: Lord, thank You for every time You have kept me, even when I did not notice it. Thank
      You for Your unseen protection and Your constant care. Help me to live with the assurance
      that my life is in Your hands. Amen.
    es: Señor, te doy gracias por todas las veces que me has guardado, aun cuando no lo percibía.
      Gracias por Tu protección invisible y por Tu cuidado constante. Ayúdame a vivir con
      la certeza de que mi vida está en Tus manos. Amén.
    uk: Господи, дякую Тобі за всі випадки, коли Ти зберігав мене, навіть коли я цього не
      помічав. Дякую за Твій невидимий захист і постійну турботу. Допоможи мені жити з упевненістю,
      що моє життя перебуває у Твоїх руках. Амінь.
- id: day_097
  ref: mt:6:34
  title:
    ru: Победа над страхом будущего
    en: Victory over Fear of the Future
    es: Victoria sobre el Temor al Futuro
    uk: Перемога над страхом майбутнього
  text:
    ru: Господи, иногда меня тревожит то, что ожидает впереди. Но Ты уже находишься в моем
      будущем и знаешь каждый день моей жизни. Помоги мне доверять Тебе и не жить в постоянном
      беспокойстве. Наполни мое сердце миром и надеждой. Во имя Иисуса Христа. Аминь.
    en: Lord, at times I am troubled by what lies ahead. But You are already in my future
      and know every day of my life. Help me to trust You and not to live in constant anxiety.
      Fill my heart with peace and hope. In the name of Jesus Christ. Amen.
    es: Señor, a veces me inquieta lo que me espera por delante. Pero Tú ya estás en mi futuro
      y conoces cada día de mi vida. Ayúdame a confiar en Ti y a no vivir en constante ansiedad.
      Llena mi corazón de paz y esperanza. En el nombre de Jesucristo. Amén.
    uk: Господи, інколи мене тривожить те, що чекає попереду. Але Ти вже перебуваєш у моєму
      майбутньому й знаєш кожен день мого життя. Допоможи мені довіряти Тобі й не жити в постійному
      неспокої. Наповни моє серце миром і надією. В ім'я Ісуса Христа. Амінь.
- id: day_098
  ref: prv:22:6
  title:
    ru: Благословение для детей
    en: A Blessing for Children
    es: Bendición para los Niños
    uk: Благословення для дітей
  text:
    ru: Отец Небесный, благослови детей и молодое поколение. Сохрани их сердца от зла и направь
      их к познанию истины. Даруй им мудрость, защиту и желание следовать за Тобой. Пусть
      они возрастут в любви к Богу и людям. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, bless the children and the young generation. Guard their hearts from
      evil and direct them to the knowledge of truth. Grant them wisdom, protection, and a
      desire to follow You. May they grow up in love for God and for people. In the name of
      Jesus Christ. Amen.
    es: Padre Celestial, bendice a los niños y a la nueva generación. Guarda sus corazones
      del mal y dirígelos al conocimiento de la verdad. Concédeles sabiduría, protección y
      deseo de seguirte. Que crezcan en amor a Dios y al prójimo. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, благослови дітей і молоде покоління. Збережи їхні серця від зла й спрямуй
      їх до пізнання істини. Даруй їм мудрість, захист і бажання йти за Тобою. Нехай вони
      зростають у любові до Бога й людей. В ім'я Ісуса Христа. Амінь.
- id: day_099
  ref: ph:4:4
  title:
    ru: Радость в Господе
    en: Joy in the Lord
    es: Gozo en el Señor
    uk: Радість у Господі
  text:
    ru: Господи, помоги мне находить радость в Тебе независимо от обстоятельств. Напоминай
      мне о Твоей любви, милости и верности. Пусть моя радость будет основана не на успехах
      или достижениях, а на отношениях с Тобой. Аминь.
    en: Lord, help me to find joy in You regardless of circumstances. Remind me of Your love,
      mercy, and faithfulness. May my joy be founded not on successes or achievements but
      on my relationship with You. Amen.
    es: Señor, ayúdame a hallar gozo en Ti sin importar las circunstancias. Recuérdame Tu
      amor, Tu misericordia y Tu fidelidad. Que mi gozo no se funde en los éxitos ni en los
      logros, sino en mi relación contigo. Amén.
    uk: Господи, допоможи мені знаходити радість у Тобі незалежно від обставин. Нагадуй мені
      про Твою любов, милість і вірність. Нехай моя радість буде заснована не на успіхах чи
      досягненнях, а на стосунках з Тобою. Амінь.
- id: day_100
  ref: hb:13:8
  title:
    ru: Благодарность за Божью верность
    en: Thanks for God's Faithfulness
    es: Gratitud por la Fidelidad de Dios
    uk: Подяка за Божу вірність
  text:
    ru: Отец Небесный, сегодня я вспоминаю все пути, которыми Ты вел меня. Благодарю Тебя
      за ответы на молитвы, за поддержку в трудностях и за Твою неизменную верность. Помоги
      мне доверять Тебе так же в будущем, как Ты был верен в прошлом. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, today I remember all the ways You have led me. Thank You for answered
      prayers, for support in hardship, and for Your unchanging faithfulness. Help me to trust
      You in the future just as You were faithful in the past. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, hoy recuerdo todos los caminos por los que me has guiado. Te doy
      gracias por las oraciones respondidas, por el sostén en las dificultades y por Tu fidelidad
      inmutable. Ayúdame a confiar en Ti en el futuro tal como fuiste fiel en el pasado. En
      el nombre de Jesucristo. Amén.
    uk: Отче Небесний, сьогодні я згадую всі дороги, якими Ти вів мене. Дякую Тобі за відповіді
      на молитви, за підтримку в труднощах і за Твою незмінну вірність. Допоможи мені довіряти
      Тобі в майбутньому так само, як Ти був вірним у минулому. В ім'я Ісуса Христа. Амінь.
- id: day_101
  ref: eph:4:29
  title:
    ru: Мудрость в словах
    en: Wisdom in Words
    es: Sabiduría en las Palabras
    uk: Мудрість у словах
  text:
    ru: Господи, поставь стражу у моих уст. Помоги мне говорить слова, которые созидают, утешают
      и приносят мир. Удерживай меня от осуждения, раздражения и пустых разговоров. Пусть
      моя речь прославляет Тебя. Аминь.
    en: Lord, set a guard over my lips. Help me to speak words that build up, comfort, and
      bring peace. Keep me from judging, from irritation, and from idle talk. May my speech
      glorify You. Amen.
    es: Señor, pon guarda a mi boca. Ayúdame a decir palabras que edifiquen, consuelen y traigan
      paz. Guárdame del juicio, de la irritación y de las conversaciones vanas. Que mi hablar
      te glorifique. Amén.
    uk: Господи, постав сторожу біля моїх уст. Допоможи мені говорити слова, які зміцнюють,
      утішають і приносять мир. Стримуй мене від осуду, роздратування й порожніх розмов. Нехай
      моя мова прославляє Тебе. Амінь.
- id: day_102
  ref: 1co:7:17
  title:
    ru: Верность Божьему призванию
    en: Faithfulness to God's Calling
    es: Fidelidad al Llamado de Dios
    uk: Вірність Божому покликанню
  text:
    ru: Отец Небесный, помоги мне исполнять то призвание, которое Ты приготовил для меня.
      Не позволь мне отвлекаться на второстепенное или жить без цели. Направляй меня и используй
      мою жизнь для Твоей славы. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to fulfill the calling You have prepared for me. Do not let
      me be distracted by the secondary or live without purpose. Guide me and use my life
      for Your glory. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a cumplir el llamado que has preparado para mí. No permitas
      que me distraiga con lo secundario ni que viva sin propósito. Guíame y usa mi vida para
      Tu gloria. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені виконувати те покликання, яке Ти приготував для мене.
      Не дозволь мені відволікатися на другорядне чи жити без мети. Скеровуй мене й використовуй
      моє життя для Твоєї слави. В ім'я Ісуса Христа. Амінь.
- id: day_103
  ref: rm:12:18
  title:
    ru: Мир в семье
    en: Peace in the Family
    es: Paz en la Familia
    uk: Мир у сім'ї
  text:
    ru: Господи, благослови мой дом и моих близких. Помоги нам проявлять любовь, терпение
      и уважение друг к другу. Исцеляй раны, убирай недоразумения и укрепляй семейные отношения.
      Пусть Ты будешь центром нашего дома. Аминь.
    en: Lord, bless my home and my loved ones. Help us to show love, patience, and respect
      toward one another. Heal wounds, remove misunderstandings, and strengthen our family
      relationships. May You be the center of our home. Amen.
    es: Señor, bendice mi hogar y a mis seres queridos. Ayúdanos a mostrar amor, paciencia
      y respeto unos a otros. Sana las heridas, quita los malentendidos y fortalece nuestras
      relaciones familiares. Que Tú seas el centro de nuestro hogar. Amén.
    uk: Господи, благослови мій дім і моїх близьких. Допоможи нам виявляти любов, терпіння
      й повагу одне до одного. Зціляй рани, усувай непорозуміння й зміцнюй сімейні стосунки.
      Нехай Ти будеш центром нашого дому. Амінь.
- id: day_104
  ref: ps:119:130
  title:
    ru: Благодарность за Божье Слово
    en: Thanks for God's Word
    es: Gratitud por la Palabra de Dios
    uk: Подяка за Боже Слово
  text:
    ru: Отец Небесный, благодарю Тебя за Библию, через которую Ты говоришь ко мне. Помоги
      мне любить Твое Слово, изучать его и применять в жизни. Пусть оно формирует мой характер
      и направляет мои решения. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the Bible, through which You speak to me. Help me to
      love Your Word, to study it, and to apply it in my life. May it shape my character and
      guide my decisions. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la Biblia, por medio de la cual me hablas. Ayúdame
      a amar Tu Palabra, a estudiarla y a aplicarla en mi vida. Que ella forme mi carácter
      y guíe mis decisiones. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Біблію, через яку Ти говориш до мене. Допоможи мені любити
      Твоє Слово, вивчати його й застосовувати в житті. Нехай воно формує мій характер і скеровує
      мої рішення. В ім'я Ісуса Христа. Амінь.
- id: day_105
  ref: jr:17:7
  title:
    ru: Надежда на Господа
    en: Hope in the Lord
    es: Esperanza en el Señor
    uk: Надія на Господа
  text:
    ru: Господи, помоги мне возлагать надежду только на Тебя. Мир меняется, люди подводят,
      обстоятельства приходят и уходят, но Ты остаешься неизменным. Укрепи мою веру и научи
      меня полностью доверять Твоей любви и мудрости. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to place my hope in You alone. The world changes, people fail, circumstances
      come and go, but You remain unchanging. Strengthen my faith and teach me to trust fully
      in Your love and wisdom. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a poner mi esperanza solo en Ti. El mundo cambia, las personas fallan,
      las circunstancias vienen y van, pero Tú permaneces inmutable. Fortalece mi fe y enséñame
      a confiar plenamente en Tu amor y Tu sabiduría. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені покладати надію лише на Тебе. Світ змінюється, люди підводять,
      обставини приходять і відходять, але Ти залишаєшся незмінним. Зміцни мою віру й навчи
      мене цілком довіряти Твоїй любові й мудрості. В ім'я Ісуса Христа. Амінь.
- id: day_106
  ref: hb:12:2
  title:
    ru: Взирая на Христа
    en: Looking unto Christ
    es: Puestos los Ojos en Cristo
    uk: Дивлячись на Христа
  text:
    ru: Господь Иисус, среди множества забот и отвлекающих вещей помоги мне не терять Тебя
      из виду. Направляй мой взгляд на Твою жизнь, Твои слова и Твой пример. Когда я устаю,
      напоминай мне, что Ты прошел этот путь прежде меня. Помоги мне следовать за Тобой с
      верностью и любовью. Аминь.
    en: Lord Jesus, amid the many cares and distractions, help me not to lose sight of You.
      Direct my gaze to Your life, Your words, and Your example. When I grow tired, remind
      me that You walked this path before me. Help me to follow You with faithfulness and
      love. Amen.
    es: Señor Jesús, en medio de tantas preocupaciones y distracciones, ayúdame a no perderte
      de vista. Dirige mi mirada a Tu vida, Tus palabras y Tu ejemplo. Cuando me canse, recuérdame
      que Tú recorriste este camino antes que yo. Ayúdame a seguirte con fidelidad y amor.
      Amén.
    uk: Господи Ісусе, серед безлічі турбот і відволікань допоможи мені не втрачати Тебе з
      поля зору. Скеровуй мій погляд на Твоє життя, Твої слова й Твій приклад. Коли я втомлююся,
      нагадуй мені, що Ти пройшов цю дорогу раніше за мене. Допоможи мені йти за Тобою з вірністю
      й любов'ю. Амінь.
- id: day_107
  ref: 1pe:2:24
  title:
    ru: Благодарность за крест
    en: Thanks for the Cross
    es: Gratitud por la Cruz
    uk: Подяка за хрест
  text:
    ru: Господь Иисус, благодарю Тебя за крест, на котором Ты понес мои грехи. Спасибо за
      любовь, которая привела Тебя на Голгофу ради моего спасения. Помоги мне никогда не относиться
      легкомысленно к Твоей жертве и жить в благодарности за искупление. Во имя Твое. Аминь.
    en: Lord Jesus, thank You for the cross on which You bore my sins. Thank You for the love
      that led You to Calvary for my salvation. Help me never to treat Your sacrifice lightly
      and to live in gratitude for my redemption. In Your name. Amen.
    es: Señor Jesús, te doy gracias por la cruz en la que llevaste mis pecados. Gracias por
      el amor que te llevó al Calvario por mi salvación. Ayúdame a no tratar nunca con ligereza
      Tu sacrificio y a vivir agradecido por mi redención. En Tu nombre. Amén.
    uk: Господи Ісусе, дякую Тобі за хрест, на якому Ти поніс мої гріхи. Дякую за любов, яка
      привела Тебе на Голгофу заради мого спасіння. Допоможи мені ніколи не ставитися легковажно
      до Твоєї жертви й жити у вдячності за викуплення. В ім'я Твоє. Амінь.
- id: day_108
  ref: jo:12:26
  title:
    ru: Следовать за Христом
    en: Following Christ
    es: Seguir a Cristo
    uk: Іти за Христом
  text:
    ru: Господи, помоги мне быть не просто слушателем Твоих слов, но настоящим последователем.
      Научи меня отвергать то, что мешает близости с Тобой, и выбирать путь послушания. Дай
      мне силы ежедневно брать свой крест и идти за Тобой. Аминь.
    en: Lord, help me to be not merely a hearer of Your words but a true follower. Teach me
      to reject what hinders closeness with You and to choose the path of obedience. Give
      me strength to take up my cross daily and follow You. Amen.
    es: Señor, ayúdame a no ser solo oidor de Tus palabras, sino un verdadero seguidor. Enséñame
      a rechazar lo que estorba la cercanía contigo y a elegir el camino de la obediencia.
      Dame fuerzas para tomar mi cruz cada día y seguirte. Amén.
    uk: Господи, допоможи мені бути не просто слухачем Твоїх слів, а справжнім послідовником.
      Навчи мене відкидати те, що заважає близькості з Тобою, і обирати шлях послуху. Дай
      мені сили щодня брати свій хрест і йти за Тобою. Амінь.
- id: day_109
  ref: mk:10:45
  title:
    ru: Смирение Христа
    en: The Humility of Christ
    es: La Humildad de Cristo
    uk: Смирення Христа
  text:
    ru: Господь Иисус, Ты показал пример совершенного смирения. Научи и меня не искать собственной
      славы и превосходства над другими. Помоги служить людям с любовью и кротостью, помня
      о Твоем примере. Во имя Иисуса Христа. Аминь.
    en: Lord Jesus, You showed an example of perfect humility. Teach me too not to seek my
      own glory or superiority over others. Help me to serve people with love and gentleness,
      remembering Your example. In the name of Jesus Christ. Amen.
    es: Señor Jesús, Tú diste ejemplo de perfecta humildad. Enséñame también a no buscar mi
      propia gloria ni la superioridad sobre los demás. Ayúdame a servir a las personas con
      amor y mansedumbre, recordando Tu ejemplo. En el nombre de Jesucristo. Amén.
    uk: Господи Ісусе, Ти показав приклад досконалого смирення. Навчи й мене не шукати власної
      слави чи вищості над іншими. Допоможи служити людям з любов'ю й лагідністю, пам'ятаючи
      про Твій приклад. В ім'я Ісуса Христа. Амінь.
- id: day_110
  ref: jo:14:27
  title:
    ru: Христос — мой мир
    en: Christ Is My Peace
    es: Cristo Es mi Paz
    uk: Христос — мій мир
  text:
    ru: Господи, благодарю Тебя за мир, который Ты даруешь Своим детям. Когда вокруг тревога
      и беспокойство, помоги мне находить покой в Тебе. Напоминай мне, что Ты держишь все
      под Своим контролем. Аминь.
    en: Lord, thank You for the peace You give to Your children. When there is anxiety and
      unrest all around, help me to find rest in You. Remind me that You hold everything under
      Your control. Amen.
    es: Señor, te doy gracias por la paz que das a Tus hijos. Cuando alrededor hay angustia
      e inquietud, ayúdame a hallar descanso en Ti. Recuérdame que Tú tienes todo bajo Tu
      control. Amén.
    uk: Господи, дякую Тобі за мир, який Ти даруєш Своїм дітям. Коли довкола тривога й неспокій,
      допоможи мені знаходити спокій у Тобі. Нагадуй мені, що Ти тримаєш усе під Своїм контролем.
      Амінь.
- id: day_111
  ref: rm:5:8
  title:
    ru: Любовь Спасителя
    en: The Savior's Love
    es: El Amor del Salvador
    uk: Любов Спасителя
  text:
    ru: Господь Иисус, помоги мне глубже понимать Твою любовь. Когда я чувствую себя недостойным
      или одиноким, напоминай мне о том, что Ты доказал Свою любовь на кресте. Пусть эта истина
      укрепляет меня каждый день. Аминь.
    en: Lord Jesus, help me to understand Your love more deeply. When I feel unworthy or alone,
      remind me that You proved Your love on the cross. May this truth strengthen me each
      day. Amen.
    es: Señor Jesús, ayúdame a comprender más hondamente Tu amor. Cuando me sienta indigno
      o solo, recuérdame que demostraste Tu amor en la cruz. Que esta verdad me fortalezca
      cada día. Amén.
    uk: Господи Ісусе, допоможи мені глибше розуміти Твою любов. Коли я почуваюся негідним
      чи самотнім, нагадуй мені про те, що Ти довів Свою любов на хресті. Нехай ця істина
      зміцнює мене щодня. Амінь.
- id: day_112
  ref: jo:11:25
  title:
    ru: Благодарность за воскресение
    en: Thanks for the Resurrection
    es: Gratitud por la Resurrección
    uk: Подяка за воскресіння
  text:
    ru: Господи, благодарю Тебя за победу над смертью. Через Твое воскресение я имею надежду,
      жизнь и уверенность в будущем. Помоги мне жить в свете этой великой истины и помнить,
      что смерть не имеет последнего слова для тех, кто принадлежит Тебе. Аминь.
    en: Lord, thank You for the victory over death. Through Your resurrection I have hope,
      life, and assurance about the future. Help me to live in the light of this great truth
      and to remember that death has no final word for those who belong to You. Amen.
    es: Señor, te doy gracias por la victoria sobre la muerte. Por medio de Tu resurrección
      tengo esperanza, vida y certeza acerca del futuro. Ayúdame a vivir a la luz de esta
      gran verdad y a recordar que la muerte no tiene la última palabra para quienes te pertenecen.
      Amén.
    uk: Господи, дякую Тобі за перемогу над смертю. Через Твоє воскресіння я маю надію, життя
      й упевненість у майбутньому. Допоможи мені жити у світлі цієї великої істини й пам'ятати,
      що смерть не має останнього слова для тих, хто належить Тобі. Амінь.
- id: day_113
  ref: mt:11:29
  title:
    ru: Учиться у Христа
    en: Learning from Christ
    es: Aprender de Cristo
    uk: Учитися у Христа
  text:
    ru: Господи Иисус, научи меня жить так, как жил Ты. Помоги мне любить людей, говорить
      истину, проявлять сострадание и оставаться верным Отцу. Пусть Твой характер все больше
      отражается в моей жизни. Во имя Иисуса Христа. Аминь.
    en: Lord Jesus, teach me to live as You lived. Help me to love people, to speak the truth,
      to show compassion, and to remain faithful to the Father. May Your character be reflected
      more and more in my life. In the name of Jesus Christ. Amen.
    es: Señor Jesús, enséñame a vivir como Tú viviste. Ayúdame a amar a las personas, a decir
      la verdad, a mostrar compasión y a permanecer fiel al Padre. Que Tu carácter se refleje
      cada vez más en mi vida. En el nombre de Jesucristo. Amén.
    uk: Господи Ісусе, навчи мене жити так, як жив Ти. Допоможи мені любити людей, говорити
      істину, виявляти співчуття й залишатися вірним Отцеві. Нехай Твій характер усе більше
      відображається в моєму житті. В ім'я Ісуса Христа. Амінь.
- id: day_114
  ref: jo:10:11
  title:
    ru: Христос — мой Пастырь
    en: Christ Is My Shepherd
    es: Cristo Es mi Pastor
    uk: Христос — мій Пастир
  text:
    ru: Господи, благодарю Тебя за то, что Ты ведешь меня через все обстоятельства жизни.
      Даже когда путь становится трудным, я могу доверять Твоему водительству. Помоги мне
      слышать Твой голос и следовать за Тобой. Аминь.
    en: Lord, thank You for leading me through all the circumstances of life. Even when the
      way becomes hard, I can trust Your guidance. Help me to hear Your voice and to follow
      You. Amen.
    es: Señor, te doy gracias por guiarme a través de todas las circunstancias de la vida.
      Aun cuando el camino se vuelve difícil, puedo confiar en Tu dirección. Ayúdame a oír
      Tu voz y a seguirte. Amén.
    uk: Господи, дякую Тобі за те, що Ти ведеш мене через усі обставини життя. Навіть коли
      дорога стає важкою, я можу довіряти Твоєму керівництву. Допоможи мені чути Твій голос
      і йти за Тобою. Амінь.
- id: day_115
  ref: jo:15:4
  title:
    ru: Верность Христу
    en: Faithfulness to Christ
    es: Fidelidad a Cristo
    uk: Вірність Христу
  text:
    ru: Господи, помоги мне оставаться верным Тебе независимо от обстоятельств. Когда приходят
      испытания, укрепляй мою веру. Не позволь мне отступить от Твоей истины и охладеть в
      любви к Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to remain faithful to You regardless of circumstances. When trials come,
      strengthen my faith. Do not let me turn from Your truth or grow cold in my love for
      You. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a permanecer fiel a Ti sin importar las circunstancias. Cuando lleguen
      las pruebas, fortalece mi fe. No permitas que me aparte de Tu verdad ni que se enfríe
      mi amor por Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені залишатися вірним Тобі незалежно від обставин. Коли приходять
      випробування, зміцнюй мою віру. Не дозволь мені відступити від Твоєї істини чи охолонути
      в любові до Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_116
  ref: eph:2:8
  title:
    ru: Благодарность за благодать
    en: Thanks for Grace
    es: Gratitud por la Gracia
    uk: Подяка за благодать
  text:
    ru: Отец Небесный, благодарю Тебя за благодать, явленную во Христе. Спасибо, что спасение
      основано не на моих заслугах, а на Твоей любви и милости. Помоги мне жить с благодарным
      сердцем и прославлять Тебя за этот дар. Аминь.
    en: Heavenly Father, thank You for the grace revealed in Christ. Thank You that salvation
      rests not on my merits but on Your love and mercy. Help me to live with a grateful heart
      and to glorify You for this gift. Amen.
    es: Padre Celestial, te doy gracias por la gracia manifestada en Cristo. Gracias porque
      la salvación no se basa en mis méritos, sino en Tu amor y Tu misericordia. Ayúdame a
      vivir con un corazón agradecido y a glorificarte por este don. Amén.
    uk: Отче Небесний, дякую Тобі за благодать, явлену у Христі. Дякую, що спасіння засноване
      не на моїх заслугах, а на Твоїй любові й милості. Допоможи мені жити з вдячним серцем
      і прославляти Тебе за цей дар. Амінь.
- id: day_117
  ref: mt:5:14
  title:
    ru: Свет Христов во мне
    en: The Light of Christ in Me
    es: La Luz de Cristo en Mí
    uk: Світло Христове в мені
  text:
    ru: Господи Иисус, пусть Твой свет сияет через мою жизнь. Помоги мне быть примером любви,
      честности и доброты для окружающих. Используй меня, чтобы люди могли увидеть Тебя и
      узнать о Твоей благости. Аминь.
    en: Lord Jesus, may Your light shine through my life. Help me to be an example of love,
      honesty, and kindness to those around me. Use me so that people may see You and come
      to know Your goodness. Amen.
    es: Señor Jesús, que Tu luz brille a través de mi vida. Ayúdame a ser ejemplo de amor,
      honestidad y bondad para quienes me rodean. Úsame para que las personas puedan verte
      y conocer Tu bondad. Amén.
    uk: Господи Ісусе, нехай Твоє світло сяє через моє життя. Допоможи мені бути прикладом
      любові, чесності й доброти для оточення. Використовуй мене, щоб люди могли побачити
      Тебе й дізнатися про Твою доброту. Амінь.
- id: day_118
  ref: cl:1:27
  title:
    ru: Христос — моя надежда
    en: Christ Is My Hope
    es: Cristo Es mi Esperanza
    uk: Христос — моя надія
  text:
    ru: Господи, когда обстоятельства кажутся безнадежными, напоминай мне, что моя надежда
      находится в Тебе. Помоги мне смотреть дальше временных трудностей и доверять Твоим обещаниям.
      Во имя Иисуса Христа. Аминь.
    en: Lord, when circumstances seem hopeless, remind me that my hope is in You. Help me
      to look beyond temporary difficulties and to trust Your promises. In the name of Jesus
      Christ. Amen.
    es: Señor, cuando las circunstancias parezcan desesperadas, recuérdame que mi esperanza
      está en Ti. Ayúdame a mirar más allá de las dificultades temporales y a confiar en Tus
      promesas. En el nombre de Jesucristo. Amén.
    uk: Господи, коли обставини видаються безнадійними, нагадуй мені, що моя надія перебуває
      в Тобі. Допоможи мені дивитися далі тимчасових труднощів і довіряти Твоїм обітницям.
      В ім'я Ісуса Христа. Амінь.
- id: day_119
  ref: jo:1:12
  title:
    ru: Благодарность за Божье усыновление
    en: Thanks for God's Adoption
    es: Gratitud por la Adopción de Dios
    uk: Подяка за Боже всиновлення
  text:
    ru: Отец Небесный, благодарю Тебя за то, что через Иисуса Христа я стал Твоим ребенком.
      Спасибо за любовь Отца, за принятие и за право обращаться к Тебе в молитве. Помоги мне
      жить достойно этого великого призвания. Аминь.
    en: Heavenly Father, thank You that through Jesus Christ I have become Your child. Thank
      You for a Father's love, for acceptance, and for the right to come to You in prayer.
      Help me to live worthy of this great calling. Amen.
    es: Padre Celestial, te doy gracias porque por medio de Jesucristo he llegado a ser Tu
      hijo. Gracias por el amor de Padre, por la aceptación y por el derecho de acercarme
      a Ti en oración. Ayúdame a vivir de manera digna de este gran llamado. Amén.
    uk: Отче Небесний, дякую Тобі за те, що через Ісуса Христа я став Твоєю дитиною. Дякую
      за любов Отця, за прийняття й за право звертатися до Тебе в молитві. Допоможи мені жити
      гідно цього великого покликання. Амінь.
- id: day_120
  ref: ph:1:21
  title:
    ru: Христос — центр моей жизни
    en: Christ Is the Center of My Life
    es: Cristo Es el Centro de mi Vida
    uk: Христос — центр мого життя
  text:
    ru: Господи Иисус, помоги мне ставить Тебя на первое место во всех сферах моей жизни.
      Пусть мои цели, желания и решения будут подчинены Твоей воле. Научи меня искать прежде
      всего Твое Царство и жить для Твоей славы. Во имя Иисуса Христа. Аминь.
    en: Lord Jesus, help me to put You first in every area of my life. May my goals, desires,
      and decisions be submitted to Your will. Teach me to seek first Your Kingdom and to
      live for Your glory. In the name of Jesus Christ. Amen.
    es: Señor Jesús, ayúdame a ponerte en primer lugar en todas las áreas de mi vida. Que
      mis metas, mis deseos y mis decisiones estén sometidos a Tu voluntad. Enséñame a buscar
      primero Tu Reino y a vivir para Tu gloria. En el nombre de Jesucristo. Amén.
    uk: Господи Ісусе, допоможи мені ставити Тебе на перше місце в усіх сферах мого життя.
      Нехай мої цілі, бажання й рішення будуть підкорені Твоїй волі. Навчи мене шукати передусім
      Твого Царства й жити для Твоєї слави. В ім'я Ісуса Христа. Амінь.
- id: day_121
  ref: rm:8:14
  title:
    ru: Божье водительство
    en: God's Guidance
    es: La Guía de Dios
    uk: Боже провідництво
  text:
    ru: Отец Небесный, благодарю Тебя за то, что Ты не оставляешь меня одного на жизненном
      пути. Направляй мои шаги и помогай принимать решения, которые соответствуют Твоей воле.
      Когда я стою перед выбором, дай мне мудрость различать правильный путь. Пусть мое сердце
      будет послушным Тебе и открытым для Твоих наставлений. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that You do not leave me alone on the path of life. Direct
      my steps and help me to make decisions that align with Your will. When I stand before
      a choice, give me the wisdom to discern the right way. May my heart be obedient to You
      and open to Your instruction. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias porque no me dejas solo en el camino de la vida. Dirige
      mis pasos y ayúdame a tomar decisiones conforme a Tu voluntad. Cuando esté ante una
      elección, dame sabiduría para discernir el camino correcto. Que mi corazón sea obediente
      a Ti y abierto a Tus enseñanzas. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те, що Ти не залишаєш мене самого на життєвій дорозі.
      Скеровуй мої кроки й допомагай приймати рішення, які відповідають Твоїй волі. Коли я
      стою перед вибором, дай мені мудрість розрізняти правильний шлях. Нехай моє серце буде
      слухняним Тобі й відкритим для Твоїх настанов. В ім'я Ісуса Христа. Амінь.
- id: day_122
  ref: eph:5:18
  title:
    ru: Наполнение Божьей силой
    en: Filled with God's Strength
    es: Lleno del Poder de Dios
    uk: Наповнення Божою силою
  text:
    ru: Отец Небесный, я нуждаюсь не только в собственных силах, но прежде всего в Твоей помощи.
      Наполняй меня Святым Духом и укрепляй для исполнения Твоей воли. Когда приходит усталость
      или разочарование, обновляй мое сердце и напоминай о Своей верности. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, I need not only my own strength but above all Your help. Fill me
      with the Holy Spirit and strengthen me to do Your will. When weariness or disappointment
      comes, renew my heart and remind me of Your faithfulness. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, no necesito solo mis propias fuerzas, sino ante todo Tu ayuda. Lléname
      del Espíritu Santo y fortaléceme para cumplir Tu voluntad. Cuando lleguen el cansancio
      o la decepción, renueva mi corazón y recuérdame Tu fidelidad. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, я потребую не лише власних сил, а передусім Твоєї допомоги. Наповнюй
      мене Святим Духом і зміцнюй для виконання Твоєї волі. Коли приходить утома чи розчарування,
      онови моє серце й нагадай про Свою вірність. В ім'я Ісуса Христа. Амінь.
- id: day_123
  ref: jo:16:13
  title:
    ru: Любовь к истине
    en: Love for the Truth
    es: Amor por la Verdad
    uk: Любов до істини
  text:
    ru: Господи, сохрани меня от заблуждений и ложных путей. Помоги мне любить Твое Слово
      и искать истину во всем. Просвещай мой разум и открывай мне то, что угодно Тебе. Пусть
      моя жизнь будет основана на истине, а не на мнениях этого мира. Во имя Иисуса Христа.
      Аминь.
    en: Lord, keep me from error and false paths. Help me to love Your Word and to seek truth
      in everything. Enlighten my mind and reveal to me what is pleasing to You. May my life
      be founded on truth and not on the opinions of this world. In the name of Jesus Christ.
      Amen.
    es: Señor, guárdame del error y de los caminos falsos. Ayúdame a amar Tu Palabra y a buscar
      la verdad en todo. Ilumina mi mente y revélame lo que te agrada. Que mi vida se funde
      en la verdad y no en las opiniones de este mundo. En el nombre de Jesucristo. Amén.
    uk: Господи, збережи мене від оман і хибних доріг. Допоможи мені любити Твоє Слово й шукати
      істину в усьому. Просвітлюй мій розум і відкривай мені те, що угодне Тобі. Нехай моє
      життя буде засноване на істині, а не на думках цього світу. В ім'я Ісуса Христа. Амінь.
- id: day_124
  ref: 2co:1:3
  title:
    ru: Божье утешение
    en: God's Comfort
    es: El Consuelo de Dios
    uk: Боже втішення
  text:
    ru: Отец Небесный, когда мое сердце скорбит или утомлено, благодарю Тебя за Твое утешение.
      Напомни мне, что Ты рядом и понимаешь каждую мою боль. Поддержи меня в трудностях и
      наполни душу миром, который невозможно найти нигде, кроме Тебя. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, when my heart grieves or grows weary, thank You for Your comfort.
      Remind me that You are near and understand every pain of mine. Sustain me in hardship
      and fill my soul with a peace that can be found nowhere but in You. In the name of Jesus
      Christ. Amen.
    es: Padre Celestial, cuando mi corazón se aflige o se cansa, te doy gracias por Tu consuelo.
      Recuérdame que estás cerca y comprendes cada uno de mis dolores. Sostenme en las dificultades
      y llena mi alma de una paz que no se puede hallar en ningún lugar sino en Ti. En el
      nombre de Jesucristo. Amén.
    uk: Отче Небесний, коли моє серце сумує чи втомлене, дякую Тобі за Твоє втішення. Нагадай
      мені, що Ти поруч і розумієш кожен мій біль. Підтримай мене в труднощах і наповни душу
      миром, який неможливо знайти ніде, крім Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_125
  ref: act:1:8
  title:
    ru: Сила для служения
    en: Power for Service
    es: Poder para el Servicio
    uk: Сила для служіння
  text:
    ru: Господи, используй мою жизнь для Твоей славы. Помоги мне служить людям с любовью,
      терпением и искренностью. Дай мне силы исполнять то дело, которое Ты поручил мне, и
      не искать собственной выгоды или похвалы. Во имя Иисуса Христа. Аминь.
    en: Lord, use my life for Your glory. Help me to serve people with love, patience, and
      sincerity. Give me strength to carry out the work You have entrusted to me and not to
      seek my own gain or praise. In the name of Jesus Christ. Amen.
    es: Señor, usa mi vida para Tu gloria. Ayúdame a servir a las personas con amor, paciencia
      y sinceridad. Dame fuerzas para cumplir la obra que me has encomendado y para no buscar
      mi propio provecho ni alabanza. En el nombre de Jesucristo. Amén.
    uk: Господи, використовуй моє життя для Твоєї слави. Допоможи мені служити людям з любов'ю,
      терпінням і щирістю. Дай мені сили виконувати ту справу, яку Ти доручив мені, і не шукати
      власної вигоди чи похвали. В ім'я Ісуса Христа. Амінь.
- id: day_126
  ref: gl:5:22
  title:
    ru: Плод благочестивой жизни
    en: The Fruit of a Godly Life
    es: El Fruto de una Vida Piadosa
    uk: Плід побожного життя
  text:
    ru: Отец Небесный, совершай Свою работу в моем сердце. Пусть в моей жизни возрастает любовь,
      радость, мир, долготерпение, милосердие и верность. Изменяй меня так, чтобы окружающие
      могли видеть действие Твоей благодати. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, do Your work in my heart. May love, joy, peace, patience, mercy,
      and faithfulness grow in my life. Change me so that those around me may see the working
      of Your grace. In the name of Jesus Christ. Amen.
    es: Padre Celestial, realiza Tu obra en mi corazón. Que en mi vida crezcan el amor, el
      gozo, la paz, la paciencia, la misericordia y la fidelidad. Transfórmame para que quienes
      me rodean puedan ver la obra de Tu gracia. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, звершуй Свою працю в моєму серці. Нехай у моєму житті зростають любов,
      радість, мир, довготерпіння, милосердя й вірність. Змінюй мене так, щоб оточення могло
      бачити дію Твоєї благодаті. В ім'я Ісуса Христа. Амінь.
- id: day_127
  ref: rm:8:26
  title:
    ru: Помощь в молитве
    en: Help in Prayer
    es: Ayuda en la Oración
    uk: Допомога в молитві
  text:
    ru: Отец Небесный, иногда я не знаю, как правильно молиться и о чем просить. Благодарю
      Тебя за то, что Ты понимаешь даже невысказанные переживания моего сердца. Помоги мне
      искать Твою волю и доверять Твоим ответам. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, sometimes I do not know how to pray rightly or what to ask. Thank
      You that You understand even the unspoken longings of my heart. Help me to seek Your
      will and to trust Your answers. In the name of Jesus Christ. Amen.
    es: Padre Celestial, a veces no sé orar como debiera ni qué pedir. Te doy gracias porque
      comprendes incluso los anhelos no expresados de mi corazón. Ayúdame a buscar Tu voluntad
      y a confiar en Tus respuestas. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, інколи я не знаю, як правильно молитися й про що просити. Дякую Тобі
      за те, що Ти розумієш навіть невисловлені прагнення мого серця. Допоможи мені шукати
      Твоєї волі й довіряти Твоїм відповідям. В ім'я Ісуса Христа. Амінь.
- id: day_128
  ref: hb:3:15
  title:
    ru: Чуткое сердце
    en: A Sensitive Heart
    es: Un Corazón Sensible
    uk: Чуйне серце
  text:
    ru: Господи, сделай мое сердце внимательным к Твоему голосу. Не позволь заботам, шуму
      и суете заглушить Твои наставления. Помоги мне останавливаться перед Тобой и искать
      Твоего руководства каждый день. Во имя Иисуса Христа. Аминь.
    en: Lord, make my heart attentive to Your voice. Do not let cares, noise, and busyness
      drown out Your instruction. Help me to pause before You and to seek Your guidance each
      day. In the name of Jesus Christ. Amen.
    es: Señor, haz que mi corazón esté atento a Tu voz. No permitas que las preocupaciones,
      el ruido y el ajetreo ahoguen Tus enseñanzas. Ayúdame a detenerme ante Ti y a buscar
      Tu dirección cada día. En el nombre de Jesucristo. Amén.
    uk: Господи, зроби моє серце уважним до Твого голосу. Не дозволь турботам, шуму й метушні
      заглушити Твої настанови. Допоможи мені зупинятися перед Тобою й шукати Твого керівництва
      щодня. В ім'я Ісуса Христа. Амінь.
- id: day_129
  ref: jm:1:5
  title:
    ru: Мудрость свыше
    en: Wisdom from Above
    es: Sabiduría de lo Alto
    uk: Мудрість згори
  text:
    ru: Отец Небесный, даруй мне мудрость, которая приходит от Тебя. Помоги принимать решения
      не по эмоциям или человеческой логике, а согласно Твоей воле. Научи меня смотреть на
      обстоятельства глазами веры и доверия Тебе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, grant me the wisdom that comes from You. Help me to make decisions
      not by emotions or human logic but according to Your will. Teach me to look at circumstances
      through the eyes of faith and trust in You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, concédeme la sabiduría que viene de Ti. Ayúdame a tomar decisiones
      no por las emociones ni la lógica humana, sino conforme a Tu voluntad. Enséñame a mirar
      las circunstancias con ojos de fe y de confianza en Ti. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, даруй мені мудрість, яка приходить від Тебе. Допоможи приймати рішення
      не за емоціями чи людською логікою, а згідно з Твоєю волею. Навчи мене дивитися на обставини
      очима віри й довіри до Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_130
  ref: 1pe:1:16
  title:
    ru: Освящение сердца
    en: Sanctification of the Heart
    es: Santificación del Corazón
    uk: Освячення серця
  text:
    ru: Господи, очисти меня от всего, что неугодно Тебе. Покажи мне области жизни, которые
      нуждаются в изменении, и дай силы оставить грех. Помоги мне возрастать в святости и
      становиться все более похожим на Иисуса Христа. Аминь.
    en: Lord, cleanse me from everything that displeases You. Show me the areas of my life
      that need to change, and give me strength to forsake sin. Help me to grow in holiness
      and to become more and more like Jesus Christ. Amen.
    es: Señor, límpiame de todo lo que te desagrada. Muéstrame las áreas de mi vida que necesitan
      cambiar y dame fuerzas para dejar el pecado. Ayúdame a crecer en santidad y a parecerme
      cada vez más a Jesucristo. Amén.
    uk: Господи, очисти мене від усього, що неугодне Тобі. Покажи мені ділянки життя, які
      потребують зміни, і дай сили залишити гріх. Допоможи мені зростати у святості й ставати
      все подібнішим до Ісуса Христа. Амінь.
- id: day_131
  ref: eph:4:3
  title:
    ru: Единство верующих
    en: The Unity of Believers
    es: La Unidad de los Creyentes
    uk: Єдність віруючих
  text:
    ru: Отец Небесный, помоги мне хранить любовь и мир в отношениях с другими христианами.
      Научи меня прощать, проявлять терпение и заботиться о единстве Церкви. Пусть наши отношения
      прославляют Тебя и свидетельствуют о Твоей любви. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to keep love and peace in my relationships with other Christians.
      Teach me to forgive, to show patience, and to care for the unity of the Church. May
      our relationships glorify You and bear witness to Your love. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, ayúdame a guardar el amor y la paz en mis relaciones con otros cristianos.
      Enséñame a perdonar, a mostrar paciencia y a cuidar la unidad de la Iglesia. Que nuestras
      relaciones te glorifiquen y den testimonio de Tu amor. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені берегти любов і мир у стосунках з іншими християнами.
      Навчи мене прощати, виявляти терпіння й дбати про єдність Церкви. Нехай наші стосунки
      прославляють Тебе й свідчать про Твою любов. В ім'я Ісуса Христа. Амінь.
- id: day_132
  ref: rm:1:16
  title:
    ru: Смелость свидетельствовать
    en: Boldness to Witness
    es: Valentía para Testificar
    uk: Сміливість свідчити
  text:
    ru: Господи, дай мне мудрость и смелость рассказывать другим о Тебе. Помоги не стыдиться
      Евангелия и быть готовым поделиться надеждой, которую я имею во Христе. Открывай сердца
      людей для принятия Твоей истины. Аминь.
    en: Lord, give me wisdom and boldness to tell others about You. Help me not to be ashamed
      of the Gospel and to be ready to share the hope I have in Christ. Open people's hearts
      to receive Your truth. Amen.
    es: Señor, dame sabiduría y valentía para hablar a otros de Ti. Ayúdame a no avergonzarme
      del Evangelio y a estar dispuesto a compartir la esperanza que tengo en Cristo. Abre
      los corazones de las personas para recibir Tu verdad. Amén.
    uk: Господи, дай мені мудрість і сміливість розповідати іншим про Тебе. Допоможи не соромитися
      Євангелії й бути готовим поділитися надією, яку я маю у Христі. Відкривай серця людей
      для прийняття Твоєї істини. Амінь.
- id: day_133
  ref: eph:3:16
  title:
    ru: Укрепление внутреннего человека
    en: Strengthening the Inner Person
    es: Fortalecimiento del Hombre Interior
    uk: Зміцнення внутрішньої людини
  text:
    ru: Отец Небесный, укрепи мой дух в дни испытаний и трудностей. Когда я чувствую слабость,
      напоминай мне, что моя сила находится в Тебе. Помоги мне возрастать в вере и сохранять
      надежду независимо от обстоятельств. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, strengthen my spirit in days of trial and hardship. When I feel weak,
      remind me that my strength is in You. Help me to grow in faith and to keep hope regardless
      of circumstances. In the name of Jesus Christ. Amen.
    es: Padre Celestial, fortalece mi espíritu en los días de prueba y dificultad. Cuando
      me sienta débil, recuérdame que mi fuerza está en Ti. Ayúdame a crecer en la fe y a
      mantener la esperanza sin importar las circunstancias. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, зміцни мій дух у дні випробувань і труднощів. Коли я почуваюся слабким,
      нагадуй мені, що моя сила в Тобі. Допоможи мені зростати у вірі й зберігати надію незалежно
      від обставин. В ім'я Ісуса Христа. Амінь.
- id: day_134
  ref: hb:13:5
  title:
    ru: Благодарность за Божье присутствие
    en: Thanks for God's Presence
    es: Gratitud por la Presencia de Dios
    uk: Подяка за Божу присутність
  text:
    ru: Господи, благодарю Тебя за то, что Ты всегда рядом. Спасибо за Твою любовь, руководство
      и заботу. Помоги мне жить в осознании Твоего присутствия и не забывать, что Ты сопровождаешь
      меня в каждом дне моей жизни. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that You are always near. Thank You for Your love, Your guidance,
      and Your care. Help me to live aware of Your presence and never to forget that You accompany
      me in every day of my life. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque siempre estás cerca. Gracias por Tu amor, Tu dirección
      y Tu cuidado. Ayúdame a vivir consciente de Tu presencia y a no olvidar nunca que me
      acompañas en cada día de mi vida. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти завжди поруч. Дякую за Твою любов, керівництво й
      турботу. Допоможи мені жити в усвідомленні Твоєї присутності й не забувати, що Ти супроводжуєш
      мене в кожному дні мого життя. В ім'я Ісуса Христа. Амінь.
- id: day_135
  ref: gl:5:25
  title:
    ru: Жизнь по воле Божьей
    en: Living by God's Will
    es: Vivir Conforme a la Voluntad de Dios
    uk: Життя за Божою волею
  text:
    ru: Отец Небесный, помоги мне жить так, чтобы моя жизнь была угодна Тебе. Направляй мои
      желания, планы и решения. Научи меня искать прежде всего Твое Царство и доверять Твоему
      руководству во всех обстоятельствах. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to live in a way that pleases You. Direct my desires, my
      plans, and my decisions. Teach me to seek first Your Kingdom and to trust Your guidance
      in all circumstances. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a vivir de modo que mi vida te agrade. Dirige mis deseos,
      mis planes y mis decisiones. Enséñame a buscar primero Tu Reino y a confiar en Tu dirección
      en toda circunstancia. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені жити так, щоб моє життя було угодне Тобі. Скеровуй мої
      бажання, плани й рішення. Навчи мене шукати передусім Твого Царства й довіряти Твоєму
      керівництву за всіх обставин. В ім'я Ісуса Христа. Амінь.
- id: day_136
  ref: ps:46:1
  title:
    ru: Господь — мое убежище
    en: The Lord Is My Refuge
    es: El Señor Es mi Refugio
    uk: Господь — моє пристановище
  text:
    ru: Отец Небесный, благодарю Тебя за то, что в Тебе я нахожу безопасность и покой. Когда
      приходят тревоги, страхи или испытания, помоги мне не полагаться на собственные силы,
      но искать защиты у Тебя. Напоминай мне, что Ты всегда рядом и способен сохранить меня
      на любом пути. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that in You I find safety and rest. When anxieties, fears,
      or trials come, help me not to rely on my own strength but to seek shelter in You. Remind
      me that You are always near and able to keep me on any road. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, te doy gracias porque en Ti encuentro seguridad y descanso. Cuando
      lleguen las inquietudes, los temores o las pruebas, ayúdame a no confiar en mis propias
      fuerzas, sino a buscar refugio en Ti. Recuérdame que siempre estás cerca y eres capaz
      de guardarme en cualquier camino. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те, що в Тобі я знаходжу безпеку й спокій. Коли приходять
      тривоги, страхи чи випробування, допоможи мені не покладатися на власні сили, а шукати
      захисту в Тебе. Нагадуй мені, що Ти завжди поруч і здатний зберегти мене на будь-якій
      дорозі. В ім'я Ісуса Христа. Амінь.
- id: day_137
  ref: ps:5:3
  title:
    ru: Утреннее посвящение
    en: Morning Dedication
    es: Consagración Matutina
    uk: Ранкова посвята
  text:
    ru: Господи, благодарю Тебя за новый день. Прежде чем начать свои дела, я посвящаю его
      Тебе. Направляй мои мысли, слова и поступки. Помоги мне прожить этот день так, чтобы
      он принес славу Твоему имени и пользу окружающим людям. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for a new day. Before I begin my tasks, I dedicate it to You. Direct
      my thoughts, words, and actions. Help me to live this day so that it brings glory to
      Your name and good to the people around me. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por un nuevo día. Antes de comenzar mis tareas, te lo consagro.
      Dirige mis pensamientos, palabras y actos. Ayúdame a vivir este día de modo que dé gloria
      a Tu nombre y bien a las personas que me rodean. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за новий день. Перш ніж розпочати свої справи, я посвячую його
      Тобі. Скеровуй мої думки, слова й вчинки. Допоможи мені прожити цей день так, щоб він
      приніс славу Твоєму імені й користь людям навколо. В ім'я Ісуса Христа. Амінь.
- id: day_138
  ref: ps:37:5
  title:
    ru: Доверие в трудностях
    en: Trust in Hardship
    es: Confianza en las Dificultades
    uk: Довіра в труднощах
  text:
    ru: Отец Небесный, когда обстоятельства становятся тяжелыми, помоги мне не терять веру.
      Напоминай мне, что Ты видишь всю мою жизнь и заботишься обо мне. Научи меня доверять
      Тебе даже тогда, когда я не понимаю происходящего. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, when circumstances become heavy, help me not to lose faith. Remind
      me that You see my whole life and care for me. Teach me to trust You even when I do
      not understand what is happening. In the name of Jesus Christ. Amen.
    es: Padre Celestial, cuando las circunstancias se vuelvan pesadas, ayúdame a no perder
      la fe. Recuérdame que Tú ves toda mi vida y cuidas de mí. Enséñame a confiar en Ti aun
      cuando no entienda lo que sucede. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, коли обставини стають важкими, допоможи мені не втрачати віри. Нагадуй
      мені, що Ти бачиш усе моє життя й дбаєш про мене. Навчи мене довіряти Тобі навіть тоді,
      коли я не розумію того, що відбувається. В ім'я Ісуса Христа. Амінь.
- id: day_139
  ref: ps:136:1
  title:
    ru: Благодарное сердце
    en: A Grateful Heart
    es: Un Corazón Agradecido
    uk: Вдячне серце
  text:
    ru: Господи, благодарю Тебя за Твою любовь, милость и заботу. Помоги мне замечать Твои
      благословения каждый день и не сосредотачиваться на недостатках или трудностях. Пусть
      благодарность станет постоянным состоянием моего сердца. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for Your love, mercy, and care. Help me to notice Your blessings each
      day and not to dwell on shortcomings or difficulties. May gratitude become the constant
      condition of my heart. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por Tu amor, Tu misericordia y Tu cuidado. Ayúdame a notar Tus
      bendiciones cada día y a no concentrarme en las carencias o las dificultades. Que la
      gratitud llegue a ser el estado constante de mi corazón. En el nombre de Jesucristo.
      Amén.
    uk: Господи, дякую Тобі за Твою любов, милість і турботу. Допоможи мені помічати Твої
      благословення щодня й не зосереджуватися на нестачах чи труднощах. Нехай вдячність стане
      постійним станом мого серця. В ім'я Ісуса Христа. Амінь.
- id: day_140
  ref: ps:51:10
  title:
    ru: Обновление сердца
    en: Renewal of the Heart
    es: Renovación del Corazón
    uk: Оновлення серця
  text:
    ru: Отец Небесный, исследуй мое сердце и покажи мне все, что требует изменения. Очисти
      меня от греха и помоги жить в искренности перед Тобой. Обнови мой разум и укрепи мое
      стремление следовать за Христом. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, search my heart and show me all that needs to change. Cleanse me
      from sin and help me to live in sincerity before You. Renew my mind and strengthen my
      desire to follow Christ. In the name of Jesus Christ. Amen.
    es: Padre Celestial, examina mi corazón y muéstrame todo lo que necesita cambiar. Límpiame
      del pecado y ayúdame a vivir en sinceridad delante de Ti. Renueva mi mente y fortalece
      mi deseo de seguir a Cristo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, досліди моє серце й покажи мені все, що потребує зміни. Очисти мене
      від гріха й допоможи жити у щирості перед Тобою. Онови мій розум і зміцни моє прагнення
      йти за Христом. В ім'я Ісуса Христа. Амінь.
- id: day_141
  ref: ps:23:1
  title:
    ru: Господь — мой Пастырь
    en: The Lord Is My Shepherd
    es: El Señor Es mi Pastor
    uk: Господь — мій Пастир
  text:
    ru: Господи, благодарю Тебя за Твою постоянную заботу. Ты ведешь меня по жизни и знаешь
      все мои нужды. Помоги мне доверять Твоему водительству и не уклоняться на собственные
      пути. Пусть мое сердце следует за Тобой с верой и послушанием. Аминь.
    en: Lord, thank You for Your constant care. You lead me through life and know all my needs.
      Help me to trust Your guidance and not to turn aside to my own ways. May my heart follow
      You with faith and obedience. Amen.
    es: Señor, te doy gracias por Tu cuidado constante. Tú me guías a través de la vida y
      conoces todas mis necesidades. Ayúdame a confiar en Tu dirección y a no desviarme por
      mis propios caminos. Que mi corazón te siga con fe y obediencia. Amén.
    uk: Господи, дякую Тобі за Твою постійну турботу. Ти ведеш мене життям і знаєш усі мої
      потреби. Допоможи мені довіряти Твоєму керівництву й не ухилятися на власні дороги.
      Нехай моє серце йде за Тобою з вірою й послухом. Амінь.
- id: day_142
  ref: ps:27:14
  title:
    ru: Надежда на Господа
    en: Hope in the Lord
    es: Esperanza en el Señor
    uk: Надія на Господа
  text:
    ru: Отец Небесный, когда мои силы ослабевают, помоги мне находить надежду в Тебе. Напоминай
      мне о Твоих обещаниях и о Твоей неизменной верности. Укрепи мое сердце и научи терпеливо
      ожидать Твоего времени. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, when my strength weakens, help me to find hope in You. Remind me
      of Your promises and of Your unchanging faithfulness. Strengthen my heart and teach
      me to wait patiently for Your timing. In the name of Jesus Christ. Amen.
    es: Padre Celestial, cuando mis fuerzas se debiliten, ayúdame a hallar esperanza en Ti.
      Recuérdame Tus promesas y Tu fidelidad inmutable. Fortalece mi corazón y enséñame a
      esperar con paciencia Tu tiempo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, коли мої сили слабнуть, допоможи мені знаходити надію в Тобі. Нагадуй
      мені про Твої обітниці й про Твою незмінну вірність. Зміцни моє серце й навчи терпляче
      очікувати Твого часу. В ім'я Ісуса Христа. Амінь.
- id: day_143
  ref: ps:51:12
  title:
    ru: Радость спасения
    en: The Joy of Salvation
    es: El Gozo de la Salvación
    uk: Радість спасіння
  text:
    ru: Господи, обнови во мне радость спасения. Не позволь повседневным заботам затмить величие
      того, что Ты сделал для меня через Иисуса Христа. Наполни мое сердце благодарностью
      и желанием жить для Тебя. Во имя Иисуса Христа. Аминь.
    en: Lord, renew in me the joy of salvation. Do not let everyday cares overshadow the greatness
      of what You have done for me through Jesus Christ. Fill my heart with gratitude and
      a desire to live for You. In the name of Jesus Christ. Amen.
    es: Señor, renueva en mí el gozo de la salvación. No permitas que las preocupaciones cotidianas
      opaquen la grandeza de lo que has hecho por mí por medio de Jesucristo. Llena mi corazón
      de gratitud y del deseo de vivir para Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, онови в мені радість спасіння. Не дозволь повсякденним турботам затьмарити
      велич того, що Ти зробив для мене через Ісуса Христа. Наповни моє серце вдячністю й
      бажанням жити для Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_144
  ref: ps:121:7
  title:
    ru: Божья защита
    en: God's Protection
    es: La Protección de Dios
    uk: Божий захист
  text:
    ru: Отец Небесный, благодарю Тебя за Твою охрану. Сохраняй меня и моих близких от зла,
      направляй наши пути и помогай принимать мудрые решения. Пусть моя уверенность будет
      основана не на обстоятельствах, а на Твоей верности. Аминь.
    en: Heavenly Father, thank You for Your watch over me. Keep me and my loved ones from
      evil, direct our ways, and help us to make wise decisions. May my assurance rest not
      on circumstances but on Your faithfulness. Amen.
    es: Padre Celestial, te doy gracias por Tu protección. Guárdanos a mí y a mis seres queridos
      del mal, dirige nuestros caminos y ayúdanos a tomar decisiones sabias. Que mi seguridad
      no descanse en las circunstancias, sino en Tu fidelidad. Amén.
    uk: Отче Небесний, дякую Тобі за Твою охорону. Зберігай мене й моїх близьких від зла,
      скеровуй наші дороги й допомагай приймати мудрі рішення. Нехай моя впевненість буде
      заснована не на обставинах, а на Твоїй вірності. Амінь.
- id: day_145
  ref: ps:63:1
  title:
    ru: Жажда Бога
    en: Thirst for God
    es: Sed de Dios
    uk: Спрага за Богом
  text:
    ru: Господи, пусть мое сердце всегда стремится к Тебе. Не позволяй мне довольствоваться
      поверхностной верой или редким общением с Тобой. Разожги во мне желание искать Тебя
      через молитву, Писание и послушание. Во имя Иисуса Христа. Аминь.
    en: Lord, may my heart always long for You. Do not let me be content with a shallow faith
      or with rare fellowship with You. Kindle in me a desire to seek You through prayer,
      the Scriptures, and obedience. In the name of Jesus Christ. Amen.
    es: Señor, que mi corazón anhele siempre por Ti. No permitas que me conforme con una fe
      superficial o con una comunión escasa contigo. Enciende en mí el deseo de buscarte por
      medio de la oración, las Escrituras y la obediencia. En el nombre de Jesucristo. Amén.
    uk: Господи, нехай моє серце завжди прагне Тебе. Не дозволь мені вдовольнятися поверховою
      вірою чи рідким спілкуванням з Тобою. Розпали в мені бажання шукати Тебе через молитву,
      Писання й послух. В ім'я Ісуса Христа. Амінь.
- id: day_146
  ref: ps:145:13
  title:
    ru: Божья верность
    en: God's Faithfulness
    es: La Fidelidad de Dios
    uk: Божа вірність
  text:
    ru: Отец Небесный, благодарю Тебя за Твою неизменность. Люди меняются, обстоятельства
      приходят и уходят, но Ты остаешься тем же. Помоги мне строить свою жизнь на Твоих обещаниях
      и доверять Тебе во всякое время. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your unchangeableness. People change, circumstances
      come and go, but You remain the same. Help me to build my life on Your promises and
      to trust You at all times. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu inmutabilidad. Las personas cambian, las circunstancias
      vienen y van, pero Tú permaneces el mismo. Ayúdame a edificar mi vida sobre Tus promesas
      y a confiar en Ti en todo tiempo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твою незмінність. Люди змінюються, обставини приходять
      і відходять, але Ти залишаєшся тим самим. Допоможи мені будувати своє життя на Твоїх
      обітницях і довіряти Тобі повсякчас. В ім'я Ісуса Христа. Амінь.
- id: day_147
  ref: ps:62:1
  title:
    ru: Мир среди бурь
    en: Peace amid Storms
    es: Paz en Medio de las Tormentas
    uk: Мир серед бур
  text:
    ru: Господи, когда вокруг беспокойство и неопределенность, наполни мое сердце миром. Помоги
      мне помнить, что Ты царствуешь над всеми обстоятельствами. Укрепи мою веру и научи меня
      покоиться в Твоих руках. Аминь.
    en: Lord, when there is anxiety and uncertainty all around, fill my heart with peace.
      Help me to remember that You reign over all circumstances. Strengthen my faith and teach
      me to rest in Your hands. Amen.
    es: Señor, cuando alrededor haya inquietud e incertidumbre, llena mi corazón de paz. Ayúdame
      a recordar que Tú reinas sobre todas las circunstancias. Fortalece mi fe y enséñame
      a descansar en Tus manos. Amén.
    uk: Господи, коли довкола неспокій і невизначеність, наповни моє серце миром. Допоможи
      мені пам'ятати, що Ти царюєш над усіма обставинами. Зміцни мою віру й навчи мене спочивати
      у Твоїх руках. Амінь.
- id: day_148
  ref: ps:103:8
  title:
    ru: Благодарность за милость
    en: Thanks for Mercy
    es: Gratitud por la Misericordia
    uk: Подяка за милість
  text:
    ru: Отец Небесный, благодарю Тебя за милость, которую Ты проявляешь ко мне каждый день.
      Спасибо за прощение, терпение и любовь. Помоги мне также проявлять милость к окружающим
      людям. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the mercy You show me each day. Thank You for forgiveness,
      patience, and love. Help me also to show mercy to the people around me. In the name
      of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la misericordia que me muestras cada día. Gracias
      por el perdón, la paciencia y el amor. Ayúdame a mostrar también misericordia a las
      personas que me rodean. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за милість, яку Ти виявляєш до мене щодня. Дякую за прощення,
      терпіння й любов. Допоможи мені також виявляти милість до людей навколо. В ім'я Ісуса
      Христа. Амінь.
- id: day_149
  ref: ps:135:3
  title:
    ru: Хвала Богу
    en: Praise to God
    es: Alabanza a Dios
    uk: Хвала Богові
  text:
    ru: Господи, Ты достоин всей хвалы и поклонения. Благодарю Тебя за Твою силу, мудрость
      и благость. Помоги мне прославлять Тебя не только словами, но и всей своей жизнью. Пусть
      каждый мой день приносит честь Твоему имени. Аминь.
    en: Lord, You are worthy of all praise and worship. Thank You for Your power, wisdom,
      and goodness. Help me to glorify You not only with words but with my whole life. May
      each of my days bring honor to Your name. Amen.
    es: Señor, Tú eres digno de toda alabanza y adoración. Gracias por Tu poder, Tu sabiduría
      y Tu bondad. Ayúdame a glorificarte no solo con palabras, sino con toda mi vida. Que
      cada uno de mis días traiga honra a Tu nombre. Amén.
    uk: Господи, Ти достойний усієї хвали й поклоніння. Дякую Тобі за Твою силу, мудрість
      і доброту. Допоможи мені прославляти Тебе не лише словами, а й усім своїм життям. Нехай
      кожен мій день приносить честь Твоєму імені. Амінь.
- id: day_150
  ref: ps:103:2
  title:
    ru: Благословение Господне
    en: The Lord's Blessing
    es: La Bendición del Señor
    uk: Господнє благословення
  text:
    ru: Отец Небесный, благодарю Тебя за все благословения, которыми Ты наполняешь мою жизнь.
      Помоги мне использовать их мудро и во славу Твою. Пусть моя жизнь станет благословением
      для других людей и свидетельством Твоей доброты. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for all the blessings with which You fill my life. Help
      me to use them wisely and for Your glory. May my life become a blessing to others and
      a testimony of Your goodness. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por todas las bendiciones con que llenas mi vida.
      Ayúdame a usarlas con sabiduría y para Tu gloria. Que mi vida llegue a ser una bendición
      para los demás y un testimonio de Tu bondad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за всі благословення, якими Ти наповнюєш моє життя. Допоможи
      мені використовувати їх мудро й на славу Твою. Нехай моє життя стане благословенням
      для інших людей і свідченням Твоєї доброти. В ім'я Ісуса Христа. Амінь.
- id: day_151
  ref: jm:4:10
  title:
    ru: Смиренное сердце
    en: A Humble Heart
    es: Un Corazón Humilde
    uk: Смиренне серце
  text:
    ru: Отец Небесный, помоги мне ходить перед Тобой в смирении. Сохрани меня от гордости,
      самоуверенности и желания возвышать себя над другими. Напоминай мне, что все доброе
      в моей жизни приходит от Тебя. Научи меня служить людям с кротостью и любовью. Во имя
      Иисуса Христа. Аминь.
    en: Heavenly Father, help me to walk before You in humility. Keep me from pride, self-confidence,
      and the desire to exalt myself over others. Remind me that everything good in my life
      comes from You. Teach me to serve people with gentleness and love. In the name of Jesus
      Christ. Amen.
    es: Padre Celestial, ayúdame a andar delante de Ti en humildad. Guárdame del orgullo,
      la autosuficiencia y el deseo de exaltarme sobre los demás. Recuérdame que todo lo bueno
      en mi vida viene de Ti. Enséñame a servir a las personas con mansedumbre y amor. En
      el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені ходити перед Тобою в смиренні. Збережи мене від гордості,
      самовпевненості й бажання вивищувати себе над іншими. Нагадуй мені, що все добре в моєму
      житті приходить від Тебе. Навчи мене служити людям з лагідністю й любов'ю. В ім'я Ісуса
      Христа. Амінь.
- id: day_152
  ref: lk:21:19
  title:
    ru: Терпение в ожидании
    en: Patience in Waiting
    es: Paciencia en la Espera
    uk: Терпіння в очікуванні
  text:
    ru: Господи, научи меня терпеливо ожидать Твоего времени. Когда ответы на молитвы задерживаются,
      помоги мне не роптать и не терять надежду. Укрепляй мою веру и напоминай, что Ты всегда
      действуешь во благо Своих детей. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to wait patiently for Your timing. When answers to prayer are delayed,
      help me not to complain or to lose hope. Strengthen my faith and remind me that You
      always work for the good of Your children. In the name of Jesus Christ. Amen.
    es: Señor, enséñame a esperar con paciencia Tu tiempo. Cuando las respuestas a la oración
      se demoren, ayúdame a no murmurar ni a perder la esperanza. Fortalece mi fe y recuérdame
      que siempre obras para el bien de Tus hijos. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене терпляче очікувати Твого часу. Коли відповіді на молитви затримуються,
      допоможи мені не нарікати й не втрачати надії. Зміцнюй мою віру й нагадуй, що Ти завжди
      дієш на благо Своїх дітей. В ім'я Ісуса Христа. Амінь.
- id: day_153
  ref: lk:16:10
  title:
    ru: Верность в малом
    en: Faithfulness in Little
    es: Fidelidad en lo Poco
    uk: Вірність у малому
  text:
    ru: Отец Небесный, помоги мне быть верным в повседневных обязанностях. Научи меня добросовестно
      исполнять даже те дела, которые кажутся незначительными. Пусть моя верность в малом
      прославляет Тебя и готовит меня к большему служению. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be faithful in my daily duties. Teach me to carry out
      conscientiously even the tasks that seem insignificant. May my faithfulness in little
      glorify You and prepare me for greater service. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a ser fiel en mis deberes diarios. Enséñame a cumplir con
      esmero incluso las tareas que parecen insignificantes. Que mi fidelidad en lo poco te
      glorifique y me prepare para un servicio mayor. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені бути вірним у повсякденних обов'язках. Навчи мене сумлінно
      виконувати навіть ті справи, які видаються незначними. Нехай моя вірність у малому прославляє
      Тебе й готує мене до більшого служіння. В ім'я Ісуса Христа. Амінь.
- id: day_154
  ref: mt:11:29
  title:
    ru: Кротость Христова
    en: The Gentleness of Christ
    es: La Mansedumbre de Cristo
    uk: Лагідність Христова
  text:
    ru: Господи, научи меня отвечать на трудности и несправедливость с кротостью. Помоги мне
      не поддаваться раздражению и гневу. Пусть в моих словах и поступках отражается характер
      Иисуса Христа. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to respond to difficulties and injustice with gentleness. Help me not
      to give in to irritation and anger. May the character of Jesus Christ be reflected in
      my words and actions. In the name of Jesus Christ. Amen.
    es: Señor, enséñame a responder a las dificultades y a la injusticia con mansedumbre.
      Ayúdame a no ceder a la irritación y la ira. Que el carácter de Jesucristo se refleje
      en mis palabras y mis actos. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене відповідати на труднощі й несправедливість з лагідністю. Допоможи
      мені не піддаватися роздратуванню й гніву. Нехай у моїх словах і вчинках відображається
      характер Ісуса Христа. В ім'я Ісуса Христа. Амінь.
- id: day_155
  ref: ps:51:6
  title:
    ru: Честность перед Богом
    en: Honesty before God
    es: Sinceridad delante de Dios
    uk: Чесність перед Богом
  text:
    ru: Отец Небесный, помоги мне жить в истине и искренности. Сохрани меня от лицемерия и
      двойной жизни. Пусть мои слова, мысли и поступки будут честными перед Тобой и людьми.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to live in truth and sincerity. Keep me from hypocrisy and
      a double life. May my words, thoughts, and actions be honest before You and before people.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a vivir en la verdad y la sinceridad. Guárdame de la hipocresía
      y de la doble vida. Que mis palabras, pensamientos y actos sean honestos delante de
      Ti y de las personas. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені жити в істині та щирості. Збережи мене від лицемірства
      й подвійного життя. Нехай мої слова, думки й вчинки будуть чесними перед Тобою й людьми.
      В ім'я Ісуса Христа. Амінь.
- id: day_156
  ref: mt:5:7
  title:
    ru: Милосердие к ближним
    en: Mercy toward Others
    es: Misericordia hacia el Prójimo
    uk: Милосердя до ближніх
  text:
    ru: Господи, наполни мое сердце состраданием к людям. Помоги мне замечать нужды окружающих
      и быть готовым помочь словом, делом или молитвой. Научи меня проявлять милосердие так
      же, как Ты ежедневно проявляешь его ко мне. Во имя Иисуса Христа. Аминь.
    en: Lord, fill my heart with compassion for people. Help me to notice the needs of those
      around me and to be ready to help with a word, a deed, or a prayer. Teach me to show
      mercy just as You show it to me each day. In the name of Jesus Christ. Amen.
    es: Señor, llena mi corazón de compasión por las personas. Ayúdame a notar las necesidades
      de quienes me rodean y a estar dispuesto a ayudar con una palabra, una obra o una oración.
      Enséñame a mostrar misericordia así como Tú la muestras conmigo cada día. En el nombre
      de Jesucristo. Amén.
    uk: Господи, наповни моє серце співчуттям до людей. Допоможи мені помічати потреби оточення
      й бути готовим допомогти словом, ділом чи молитвою. Навчи мене виявляти милосердя так
      само, як Ти щодня виявляєш його до мене. В ім'я Ісуса Христа. Амінь.
- id: day_157
  ref: prv:25:28
  title:
    ru: Самообладание
    en: Self-Control
    es: Dominio Propio
    uk: Самовладання
  text:
    ru: Отец Небесный, помоги мне контролировать свои слова, мысли и поступки. Когда приходят
      искушения или сильные эмоции, дай мне мудрость поступать правильно. Укрепляй мой характер
      и учи меня жить по Твоей воле. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to control my words, thoughts, and actions. When temptations
      or strong emotions come, give me the wisdom to act rightly. Strengthen my character
      and teach me to live according to Your will. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a dominar mis palabras, pensamientos y actos. Cuando lleguen
      las tentaciones o las emociones fuertes, dame sabiduría para obrar rectamente. Fortalece
      mi carácter y enséñame a vivir conforme a Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені контролювати свої слова, думки й вчинки. Коли приходять
      спокуси чи сильні емоції, дай мені мудрість чинити правильно. Зміцнюй мій характер і
      навчи мене жити за Твоєю волею. В ім'я Ісуса Христа. Амінь.
- id: day_158
  ref: jm:1:19
  title:
    ru: Мудрость в общении
    en: Wisdom in Communication
    es: Sabiduría al Comunicar
    uk: Мудрість у спілкуванні
  text:
    ru: Господи, помоги мне говорить слова, которые приносят мир и назидание. Удерживай меня
      от поспешных выводов, осуждения и пустословия. Научи меня слушать других внимательно
      и отвечать с любовью и мудростью. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to speak words that bring peace and edification. Keep me from hasty
      conclusions, from judging, and from idle talk. Teach me to listen to others carefully
      and to answer with love and wisdom. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a decir palabras que traigan paz y edificación. Guárdame de las conclusiones
      apresuradas, del juicio y de la palabrería vana. Enséñame a escuchar a los demás con
      atención y a responder con amor y sabiduría. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені говорити слова, які приносять мир і повчання. Стримуй мене
      від поспішних висновків, осуду й марнослів'я. Навчи мене слухати інших уважно й відповідати
      з любов'ю та мудрістю. В ім'я Ісуса Христа. Амінь.
- id: day_159
  ref: js:1:9
  title:
    ru: Мужество поступать правильно
    en: Courage to Do Right
    es: Valor para Obrar Rectamente
    uk: Мужність чинити правильно
  text:
    ru: Отец Небесный, дай мне смелость поступать правильно даже тогда, когда это трудно.
      Помоги не идти за большинством, если это противоречит Твоей истине. Укрепи меня быть
      верным Тебе во всех обстоятельствах. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, give me the courage to do right even when it is hard. Help me not
      to follow the crowd when it contradicts Your truth. Strengthen me to be faithful to
      You in all circumstances. In the name of Jesus Christ. Amen.
    es: Padre Celestial, dame el valor de obrar rectamente aun cuando sea difícil. Ayúdame
      a no seguir a la mayoría cuando esto contradice Tu verdad. Fortaléceme para ser fiel
      a Ti en toda circunstancia. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дай мені сміливість чинити правильно навіть тоді, коли це важко. Допоможи
      не йти за більшістю, якщо це суперечить Твоїй істині. Зміцни мене бути вірним Тобі за
      всіх обставин. В ім'я Ісуса Христа. Амінь.
- id: day_160
  ref: jo:13:34
  title:
    ru: Любовь к людям
    en: Love for People
    es: Amor por las Personas
    uk: Любов до людей
  text:
    ru: Господи, научи меня любить людей так, как Ты любишь меня. Помоги быть терпеливым к
      чужим недостаткам, прощать обиды и искать мира. Пусть Твоя любовь наполняет мое сердце
      и проявляется в каждом дне моей жизни. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to love people as You love me. Help me to be patient with others' shortcomings,
      to forgive offenses, and to seek peace. May Your love fill my heart and be shown in
      each day of my life. In the name of Jesus Christ. Amen.
    es: Señor, enséñame a amar a las personas como Tú me amas. Ayúdame a ser paciente con
      las faltas de los demás, a perdonar las ofensas y a buscar la paz. Que Tu amor llene
      mi corazón y se manifieste en cada día de mi vida. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене любити людей так, як Ти любиш мене. Допоможи бути терплячим до
      чужих вад, прощати образи й шукати миру. Нехай Твоя любов наповнює моє серце й виявляється
      в кожному дні мого життя. В ім'я Ісуса Христа. Амінь.
- id: day_161
  ref: 1ts:5:18
  title:
    ru: Дух благодарности
    en: A Spirit of Gratitude
    es: Espíritu de Gratitud
    uk: Дух вдячності
  text:
    ru: Отец Небесный, сохрани меня от недовольства и ропота. Научи замечать Твои благословения
      и благодарить Тебя за все, что Ты допускаешь в моей жизни. Пусть благодарность станет
      частью моего характера. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, keep me from discontent and grumbling. Teach me to notice Your blessings
      and to thank You for all that You allow in my life. May gratitude become part of my
      character. In the name of Jesus Christ. Amen.
    es: Padre Celestial, guárdame del descontento y de la murmuración. Enséñame a notar Tus
      bendiciones y a agradecerte por todo lo que permites en mi vida. Que la gratitud llegue
      a ser parte de mi carácter. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, збережи мене від невдоволення й нарікання. Навчи помічати Твої благословення
      й дякувати Тобі за все, що Ти допускаєш у моєму житті. Нехай вдячність стане частиною
      мого характеру. В ім'я Ісуса Христа. Амінь.
- id: day_162
  ref: mt:5:37
  title:
    ru: Верность обещаниям
    en: Faithfulness to Promises
    es: Fidelidad a las Promesas
    uk: Вірність обіцянкам
  text:
    ru: Господи, помоги мне быть человеком слова. Научи исполнять данные обещания и поступать
      честно во всех обстоятельствах. Пусть мои слова заслуживают доверия и отражают Твой
      характер. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be a person of my word. Teach me to keep the promises I make and
      to act honestly in all circumstances. May my words be trustworthy and reflect Your character.
      In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a ser una persona de palabra. Enséñame a cumplir las promesas que hago
      y a obrar con honestidad en toda circunstancia. Que mis palabras sean dignas de confianza
      y reflejen Tu carácter. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бути людиною слова. Навчи виконувати дані обіцянки й чинити
      чесно за всіх обставин. Нехай мої слова заслуговують на довіру й відображають Твій характер.
      В ім'я Ісуса Христа. Амінь.
- id: day_163
  ref: mt:5:9
  title:
    ru: Миротворец
    en: A Peacemaker
    es: Pacificador
    uk: Миротворець
  text:
    ru: Отец Небесный, помоги мне приносить мир туда, где есть конфликты и непонимание. Научи
      меня искать примирения и не разжигать споры. Пусть через мою жизнь люди видят Твой мир
      и любовь. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to bring peace where there is conflict and misunderstanding.
      Teach me to seek reconciliation and not to stir up quarrels. May people see Your peace
      and love through my life. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a llevar paz donde hay conflicto e incomprensión. Enséñame
      a buscar la reconciliación y a no avivar las contiendas. Que las personas vean Tu paz
      y Tu amor por medio de mi vida. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені приносити мир туди, де є конфлікти й непорозуміння. Навчи
      мене шукати примирення й не розпалювати суперечки. Нехай через моє життя люди бачать
      Твій мир і любов. В ім'я Ісуса Христа. Амінь.
- id: day_164
  ref: mk:10:45
  title:
    ru: Сердце служителя
    en: A Servant's Heart
    es: Un Corazón de Siervo
    uk: Серце служителя
  text:
    ru: Господи, освободи меня от эгоизма и желания жить только для себя. Помоги замечать
      нужды других людей и быть готовым послужить им. Научи меня следовать примеру Иисуса
      Христа, Который пришел служить. Во имя Иисуса Христа. Аминь.
    en: Lord, free me from selfishness and from the desire to live only for myself. Help me
      to notice the needs of others and to be ready to serve them. Teach me to follow the
      example of Jesus Christ, who came to serve. In the name of Jesus Christ. Amen.
    es: Señor, líbrame del egoísmo y del deseo de vivir solo para mí mismo. Ayúdame a notar
      las necesidades de los demás y a estar dispuesto a servirles. Enséñame a seguir el ejemplo
      de Jesucristo, que vino a servir. En el nombre de Jesucristo. Amén.
    uk: Господи, звільни мене від егоїзму й бажання жити лише для себе. Допоможи помічати
      потреби інших людей і бути готовим послужити їм. Навчи мене йти за прикладом Ісуса Христа,
      Який прийшов служити. В ім'я Ісуса Христа. Амінь.
- id: day_165
  ref: 2pe:3:18
  title:
    ru: Возрастание во Христе
    en: Growing in Christ
    es: Crecer en Cristo
    uk: Зростання у Христі
  text:
    ru: Отец Небесный, благодарю Тебя за работу, которую Ты совершаешь в моей жизни. Помоги
      мне не останавливаться в духовном росте, но каждый день становиться ближе к Тебе. Формируй
      мой характер и делай меня более похожим на Иисуса Христа. Во имя Его. Аминь.
    en: Heavenly Father, thank You for the work You are doing in my life. Help me not to stand
      still in my spiritual growth but to draw nearer to You each day. Shape my character
      and make me more like Jesus Christ. In His name. Amen.
    es: Padre Celestial, te doy gracias por la obra que realizas en mi vida. Ayúdame a no
      detenerme en mi crecimiento espiritual, sino a acercarme más a Ti cada día. Forma mi
      carácter y hazme más semejante a Jesucristo. En Su nombre. Amén.
    uk: Отче Небесний, дякую Тобі за працю, яку Ти звершуєш у моєму житті. Допоможи мені не
      зупинятися в духовному зростанні, а щодня ставати ближчим до Тебе. Формуй мій характер
      і роби мене подібнішим до Ісуса Христа. В ім'я Його. Амінь.
- id: day_166
  ref: js:24:15
  title:
    ru: Благословение для семьи
    en: A Blessing for the Family
    es: Bendición para la Familia
    uk: Благословення для сім'ї
  text:
    ru: Отец Небесный, благодарю Тебя за семью, которую Ты мне дал. Благослови моих близких,
      укрепи нас в любви, взаимопонимании и уважении друг к другу. Помоги нашему дому быть
      местом мира, радости и Твоего присутствия. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the family You have given me. Bless my loved ones,
      strengthen us in love, mutual understanding, and respect for one another. Help our home
      to be a place of peace, joy, and Your presence. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la familia que me has dado. Bendice a mis seres
      queridos, fortalécenos en el amor, el entendimiento mutuo y el respeto unos por otros.
      Ayuda a nuestro hogar a ser un lugar de paz, gozo y de Tu presencia. En el nombre de
      Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за сім'ю, яку Ти мені дав. Благослови моїх близьких, зміцни
      нас у любові, взаєморозумінні й повазі одне до одного. Допоможи нашому дому бути місцем
      миру, радості й Твоєї присутності. В ім'я Ісуса Христа. Амінь.
- id: day_167
  ref: cl:3:14
  title:
    ru: Любовь в семье
    en: Love in the Family
    es: Amor en la Familia
    uk: Любов у сім'ї
  text:
    ru: Господи, научи меня проявлять любовь к своим близким не только словами, но и делами.
      Помоги мне быть внимательным, терпеливым и заботливым. Пусть в нашей семье царит любовь,
      которая исходит от Тебя. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to show love to my loved ones not only with words but also with deeds.
      Help me to be attentive, patient, and caring. May love that comes from You reign in
      our family. In the name of Jesus Christ. Amen.
    es: Señor, enséñame a mostrar amor a mis seres queridos no solo con palabras, sino también
      con obras. Ayúdame a ser atento, paciente y cuidadoso. Que en nuestra familia reine
      el amor que viene de Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене виявляти любов до своїх близьких не лише словами, а й ділами.
      Допоможи мені бути уважним, терплячим і дбайливим. Нехай у нашій сім'ї панує любов,
      що походить від Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_168
  ref: prv:22:6
  title:
    ru: Мудрость для родителей
    en: Wisdom for Parents
    es: Sabiduría para los Padres
    uk: Мудрість для батьків
  text:
    ru: Отец Небесный, даруй родителям мудрость в воспитании детей. Помоги наставлять их в
      истине, показывать добрый пример и окружать любовью. Дай терпение в трудные моменты
      и веру доверять детей Твоим рукам. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, grant parents wisdom in raising their children. Help them to instruct
      their children in truth, to set a good example, and to surround them with love. Give
      them patience in hard moments and the faith to entrust their children to Your hands.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, concede a los padres sabiduría para criar a sus hijos. Ayúdalos a
      instruirlos en la verdad, a darles buen ejemplo y a rodearlos de amor. Dales paciencia
      en los momentos difíciles y fe para confiar a sus hijos en Tus manos. En el nombre de
      Jesucristo. Amén.
    uk: Отче Небесний, даруй батькам мудрість у вихованні дітей. Допоможи наставляти їх в
      істині, показувати добрий приклад і оточувати любов'ю. Дай терпіння у важкі моменти
      й віру довіряти дітей Твоїм рукам. В ім'я Ісуса Христа. Амінь.
- id: day_169
  ref: is:54:13
  title:
    ru: Благословение для детей
    en: A Blessing for Children
    es: Bendición para los Niños
    uk: Благословення для дітей
  text:
    ru: Господи, благослови детей и молодых людей. Сохрани их сердца от зла и направь их к
      познанию Тебя. Помоги им возрастать в мудрости, любви и послушании Твоей воле. Во имя
      Иисуса Христа. Аминь.
    en: Lord, bless children and young people. Guard their hearts from evil and direct them
      to the knowledge of You. Help them to grow in wisdom, love, and obedience to Your will.
      In the name of Jesus Christ. Amen.
    es: Señor, bendice a los niños y a los jóvenes. Guarda sus corazones del mal y dirígelos
      al conocimiento de Ti. Ayúdalos a crecer en sabiduría, amor y obediencia a Tu voluntad.
      En el nombre de Jesucristo. Amén.
    uk: Господи, благослови дітей і молодих людей. Збережи їхні серця від зла й спрямуй їх
      до пізнання Тебе. Допоможи їм зростати в мудрості, любові й послуху Твоїй волі. В ім'я
      Ісуса Христа. Амінь.
- id: day_170
  ref: ex:20:12
  title:
    ru: Почтение к родителям
    en: Honor for Parents
    es: Honra a los Padres
    uk: Шанування батьків
  text:
    ru: Отец Небесный, помоги мне проявлять уважение и благодарность к родителям. Напоминай
      мне о том добре, которое они сделали для меня. Научи меня заботиться о них и относиться
      к ним с любовью и почтением. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to show respect and gratitude to my parents. Remind me of
      the good they have done for me. Teach me to care for them and to treat them with love
      and honor. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a mostrar respeto y gratitud a mis padres. Recuérdame el
      bien que han hecho por mí. Enséñame a cuidar de ellos y a tratarlos con amor y honra.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені виявляти повагу й вдячність до батьків. Нагадуй мені
      про те добро, яке вони зробили для мене. Навчи мене дбати про них і ставитися до них
      з любов'ю та шаною. В ім'я Ісуса Христа. Амінь.
- id: day_171
  ref: rm:12:18
  title:
    ru: Мир в доме
    en: Peace in the Home
    es: Paz en el Hogar
    uk: Мир у домі
  text:
    ru: Господи, пусть Твой мир царствует в нашем доме. Удали ссоры, раздражение и непонимание.
      Научи нас слушать друг друга, прощать и стремиться к единству. Пусть наши отношения
      прославляют Тебя. Во имя Иисуса Христа. Аминь.
    en: Lord, may Your peace reign in our home. Remove quarrels, irritation, and misunderstanding.
      Teach us to listen to one another, to forgive, and to strive for unity. May our relationships
      glorify You. In the name of Jesus Christ. Amen.
    es: Señor, que Tu paz reine en nuestro hogar. Quita las contiendas, la irritación y la
      incomprensión. Enséñanos a escucharnos unos a otros, a perdonar y a procurar la unidad.
      Que nuestras relaciones te glorifiquen. En el nombre de Jesucristo. Amén.
    uk: Господи, нехай Твій мир царює в нашому домі. Усунь сварки, роздратування й непорозуміння.
      Навчи нас слухати одне одного, прощати й прагнути єдності. Нехай наші стосунки прославляють
      Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_172
  ref: prv:17:17
  title:
    ru: Верные друзья
    en: Faithful Friends
    es: Amigos Fieles
    uk: Вірні друзі
  text:
    ru: Отец Небесный, благодарю Тебя за друзей, которых Ты посылаешь в жизнь. Помоги мне
      самому быть верным другом, готовым поддержать, ободрить и помочь в трудную минуту. Благослови
      мои дружеские отношения и сохрани их в истине. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the friends You send into my life. Help me also to
      be a faithful friend, ready to support, encourage, and help in a hard moment. Bless
      my friendships and keep them in truth. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por los amigos que envías a mi vida. Ayúdame a ser
      yo también un amigo fiel, dispuesto a apoyar, animar y ayudar en los momentos difíciles.
      Bendice mis amistades y guárdalas en la verdad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за друзів, яких Ти посилаєш у життя. Допоможи мені й самому
      бути вірним другом, готовим підтримати, підбадьорити й допомогти у важку хвилину. Благослови
      мої дружні стосунки й збережи їх в істині. В ім'я Ісуса Христа. Амінь.
- id: day_173
  ref: eph:4:32
  title:
    ru: Прощение в отношениях
    en: Forgiveness in Relationships
    es: Perdón en las Relaciones
    uk: Прощення у стосунках
  text:
    ru: Господи, помоги мне быстро прощать обиды и не хранить горечь в сердце. Научи меня
      проявлять милость к людям так же, как Ты проявляешь милость ко мне. Пусть прощение приносит
      мир и исцеление в отношения. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to forgive offenses quickly and not to hold bitterness in my heart.
      Teach me to show mercy to people just as You show mercy to me. May forgiveness bring
      peace and healing into relationships. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a perdonar las ofensas pronto y a no guardar amargura en mi corazón.
      Enséñame a mostrar misericordia a las personas así como Tú me la muestras a mí. Que
      el perdón traiga paz y sanidad a las relaciones. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені швидко прощати образи й не тримати гіркоти в серці. Навчи мене
      виявляти милість до людей так само, як Ти виявляєш милість до мене. Нехай прощення приносить
      мир і зцілення у стосунки. В ім'я Ісуса Христа. Амінь.
- id: day_174
  ref: prv:15:1
  title:
    ru: Мудрость в словах
    en: Wisdom in Words
    es: Sabiduría en las Palabras
    uk: Мудрість у словах
  text:
    ru: Отец Небесный, помоги мне говорить слова, которые укрепляют и ободряют близких. Сохрани
      меня от резкости, осуждения и необдуманных высказываний. Пусть мои слова будут наполнены
      любовью и мудростью. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to speak words that strengthen and encourage my loved ones.
      Keep me from harshness, from judging, and from thoughtless remarks. May my words be
      filled with love and wisdom. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a decir palabras que fortalezcan y animen a mis seres queridos.
      Guárdame de la dureza, del juicio y de los comentarios irreflexivos. Que mis palabras
      estén llenas de amor y sabiduría. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені говорити слова, які зміцнюють і підбадьорюють близьких.
      Збережи мене від різкості, осуду й необдуманих висловлювань. Нехай мої слова будуть
      сповнені любові й мудрості. В ім'я Ісуса Христа. Амінь.
- id: day_175
  ref: mk:10:8
  title:
    ru: Единство супругов
    en: The Unity of Spouses
    es: La Unidad de los Esposos
    uk: Єдність подружжя
  text:
    ru: Господи, благослови семьи и супружеские отношения. Помоги мужьям и женам любить, уважать
      и поддерживать друг друга. Укрепляй браки и помогай преодолевать трудности с верой и
      терпением. Во имя Иисуса Христа. Аминь.
    en: Lord, bless families and marriage relationships. Help husbands and wives to love,
      respect, and support one another. Strengthen marriages and help them to overcome difficulties
      with faith and patience. In the name of Jesus Christ. Amen.
    es: Señor, bendice a las familias y las relaciones matrimoniales. Ayuda a los esposos
      y a las esposas a amarse, respetarse y apoyarse mutuamente. Fortalece los matrimonios
      y ayúdalos a superar las dificultades con fe y paciencia. En el nombre de Jesucristo.
      Amén.
    uk: Господи, благослови сім'ї та подружні стосунки. Допоможи чоловікам і дружинам любити,
      поважати й підтримувати одне одного. Зміцнюй шлюби й допомагай долати труднощі з вірою
      та терпінням. В ім'я Ісуса Христа. Амінь.
- id: day_176
  ref: gl:6:2
  title:
    ru: Забота о ближних
    en: Care for Others
    es: Cuidado del Prójimo
    uk: Турбота про ближніх
  text:
    ru: Отец Небесный, открой мои глаза на нужды людей вокруг меня. Помоги мне не быть равнодушным
      к тем, кто нуждается в поддержке, помощи или добром слове. Сделай меня проводником Твоей
      любви. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, open my eyes to the needs of the people around me. Help me not to
      be indifferent to those who need support, help, or a kind word. Make me a channel of
      Your love. In the name of Jesus Christ. Amen.
    es: Padre Celestial, abre mis ojos a las necesidades de las personas que me rodean. Ayúdame
      a no ser indiferente a quienes necesitan apoyo, ayuda o una palabra amable. Hazme un
      canal de Tu amor. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, відкрий мої очі на потреби людей навколо мене. Допоможи мені не бути
      байдужим до тих, хто потребує підтримки, допомоги чи доброго слова. Зроби мене провідником
      Твоєї любові. В ім'я Ісуса Христа. Амінь.
- id: day_177
  ref: eph:4:3
  title:
    ru: Единство Церкви
    en: The Unity of the Church
    es: La Unidad de la Iglesia
    uk: Єдність Церкви
  text:
    ru: Господи, благослови Твою Церковь. Помоги верующим хранить единство, любовь и мир.
      Удали разделения и гордость, научи нас служить друг другу и вместе прославлять Тебя.
      Во имя Иисуса Христа. Аминь.
    en: Lord, bless Your Church. Help believers to keep unity, love, and peace. Remove divisions
      and pride, teach us to serve one another and together to glorify You. In the name of
      Jesus Christ. Amen.
    es: Señor, bendice a Tu Iglesia. Ayuda a los creyentes a guardar la unidad, el amor y
      la paz. Quita las divisiones y el orgullo, enséñanos a servirnos unos a otros y a glorificarte
      juntos. En el nombre de Jesucristo. Amén.
    uk: Господи, благослови Твою Церкву. Допоможи віруючим берегти єдність, любов і мир. Усунь
      розділення й гордість, навчи нас служити одне одному й разом прославляти Тебе. В ім'я
      Ісуса Христа. Амінь.
- id: day_178
  ref: 1pe:4:9
  title:
    ru: Гостеприимство
    en: Hospitality
    es: Hospitalidad
    uk: Гостинність
  text:
    ru: Отец Небесный, помоги мне быть открытым и добрым к людям. Научи принимать других с
      любовью и радушием. Пусть мой дом и мое сердце будут местом, где люди могут увидеть
      Твою доброту. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be open and kind to people. Teach me to receive others
      with love and warmth. May my home and my heart be a place where people can see Your
      goodness. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a ser abierto y bondadoso con las personas. Enséñame a recibir
      a los demás con amor y calidez. Que mi hogar y mi corazón sean un lugar donde las personas
      puedan ver Tu bondad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені бути відкритим і добрим до людей. Навчи приймати інших
      з любов'ю та привітністю. Нехай мій дім і моє серце будуть місцем, де люди можуть побачити
      Твою доброту. В ім'я Ісуса Христа. Амінь.
- id: day_179
  ref: ps:41:1
  title:
    ru: Забота о нуждающихся
    en: Care for the Needy
    es: Cuidado de los Necesitados
    uk: Турбота про нужденних
  text:
    ru: Господи, помоги мне замечать тех, кто переживает трудности. Дай мне щедрое сердце
      и готовность делиться тем, что Ты доверил мне. Научи меня отражать Твою заботу через
      конкретные дела любви. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to notice those who are going through hardship. Give me a generous heart
      and a readiness to share what You have entrusted to me. Teach me to reflect Your care
      through concrete deeds of love. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a notar a quienes atraviesan dificultades. Dame un corazón generoso
      y disposición para compartir lo que me has confiado. Enséñame a reflejar Tu cuidado
      por medio de obras concretas de amor. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені помічати тих, хто переживає труднощі. Дай мені щедре серце
      й готовність ділитися тим, що Ти довірив мені. Навчи мене відображати Твою турботу через
      конкретні діла любові. В ім'я Ісуса Христа. Амінь.
- id: day_180
  ref: ps:127:1
  title:
    ru: Дом, основанный на Христе
    en: A Home Built on Christ
    es: Un Hogar Edificado sobre Cristo
    uk: Дім, заснований на Христі
  text:
    ru: Отец Небесный, помоги нашей семье строить жизнь на Твоем Слове. Пусть Иисус Христос
      будет центром нашего дома, наших решений и отношений. Укрепляй нас в вере и веди по
      пути, который прославляет Тебя. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help our family to build our life on Your Word. May Jesus Christ
      be the center of our home, our decisions, and our relationships. Strengthen us in faith
      and lead us on the path that glorifies You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayuda a nuestra familia a edificar nuestra vida sobre Tu Palabra.
      Que Jesucristo sea el centro de nuestro hogar, de nuestras decisiones y de nuestras
      relaciones. Fortalécenos en la fe y guíanos por el camino que te glorifica. En el nombre
      de Jesucristo. Amén.
    uk: Отче Небесний, допоможи нашій сім'ї будувати життя на Твоєму Слові. Нехай Ісус Христос
      буде центром нашого дому, наших рішень і стосунків. Зміцнюй нас у вірі й веди дорогою,
      яка прославляє Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_181
  ref: ps:34:19
  title:
    ru: Доверие во время испытаний
    en: Trust in Times of Trial
    es: Confianza en Tiempos de Prueba
    uk: Довіра під час випробувань
  text:
    ru: Отец Небесный, когда в моей жизни приходят испытания, помоги мне не терять доверия
      к Тебе. Напоминай мне, что Ты остаешься рядом даже в самые трудные дни. Укрепи мою веру
      и научи видеть Твою руку там, где я пока не вижу выхода. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, when trials come into my life, help me not to lose my trust in You.
      Remind me that You remain near even on the hardest days. Strengthen my faith and teach
      me to see Your hand where I cannot yet see a way out. In the name of Jesus Christ. Amen.
    es: Padre Celestial, cuando lleguen pruebas a mi vida, ayúdame a no perder la confianza
      en Ti. Recuérdame que permaneces cerca aun en los días más difíciles. Fortalece mi fe
      y enséñame a ver Tu mano donde aún no veo salida. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, коли в моє життя приходять випробування, допоможи мені не втрачати
      довіри до Тебе. Нагадуй мені, що Ти залишаєшся поруч навіть у найважчі дні. Зміцни мою
      віру й навчи бачити Твою руку там, де я поки не бачу виходу. В ім'я Ісуса Христа. Амінь.
- id: day_182
  ref: ps:56:3
  title:
    ru: Победа над страхом
    en: Victory over Fear
    es: Victoria sobre el Temor
    uk: Перемога над страхом
  text:
    ru: Господи, освободи мое сердце от страха. Когда тревожные мысли пытаются овладеть мной,
      напоминай мне о Твоем могуществе и любви. Помоги мне смотреть не на обстоятельства,
      а на Тебя. Во имя Иисуса Христа. Аминь.
    en: Lord, free my heart from fear. When anxious thoughts try to overtake me, remind me
      of Your might and love. Help me to look not at my circumstances but at You. In the name
      of Jesus Christ. Amen.
    es: Señor, libra mi corazón del temor. Cuando los pensamientos de angustia traten de dominarme,
      recuérdame Tu poder y Tu amor. Ayúdame a mirar no a mis circunstancias, sino a Ti. En
      el nombre de Jesucristo. Amén.
    uk: Господи, звільни моє серце від страху. Коли тривожні думки намагаються заволодіти
      мною, нагадуй мені про Твою могутність і любов. Допоможи мені дивитися не на обставини,
      а на Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_183
  ref: ps:55:22
  title:
    ru: Мир среди тревог
    en: Peace amid Anxieties
    es: Paz en Medio de las Inquietudes
    uk: Мир серед тривог
  text:
    ru: Отец Небесный, Ты знаешь все мои переживания и заботы. Помоги мне приносить их к Тебе
      в молитве, а не носить в одиночку. Наполни мое сердце миром и уверенностью в Твоей заботе.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, You know all my worries and cares. Help me to bring them to You in
      prayer rather than carry them alone. Fill my heart with peace and with confidence in
      Your care. In the name of Jesus Christ. Amen.
    es: Padre Celestial, Tú conoces todas mis preocupaciones e inquietudes. Ayúdame a traerlas
      a Ti en oración en vez de llevarlas solo. Llena mi corazón de paz y de confianza en
      Tu cuidado. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, Ти знаєш усі мої переживання й турботи. Допоможи мені приносити їх
      до Тебе в молитві, а не нести самотужки. Наповни моє серце миром і впевненістю у Твоїй
      турботі. В ім'я Ісуса Христа. Амінь.
- id: day_184
  ref: ps:41:3
  title:
    ru: Божья помощь в болезни
    en: God's Help in Sickness
    es: La Ayuda de Dios en la Enfermedad
    uk: Божа допомога у хворобі
  text:
    ru: Господи, благодарю Тебя за то, что Ты заботишься не только о душе, но и о теле. Прошу
      Тебя, укрепи меня во время болезни и дай терпение проходить этот период с верой. Помоги
      мне полностью доверять Тебе и Твоей воле. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that You care not only for the soul but also for the body. I ask You
      to strengthen me in time of sickness and to give me patience to go through this period
      with faith. Help me to trust You and Your will completely. In the name of Jesus Christ.
      Amen.
    es: Señor, te doy gracias porque cuidas no solo del alma, sino también del cuerpo. Te
      pido que me fortalezcas en tiempo de enfermedad y que me des paciencia para atravesar
      este período con fe. Ayúdame a confiar plenamente en Ti y en Tu voluntad. En el nombre
      de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти дбаєш не лише про душу, а й про тіло. Прошу Тебе,
      зміцни мене під час хвороби й дай терпіння пройти цей період з вірою. Допоможи мені
      цілком довіряти Тобі й Твоїй волі. В ім'я Ісуса Христа. Амінь.
- id: day_185
  ref: hb:13:5
  title:
    ru: Когда чувствуешь себя одиноким
    en: When You Feel Lonely
    es: Cuando Te Sientes Solo
    uk: Коли почуваєшся самотнім
  text:
    ru: Отец Небесный, бывают моменты, когда я чувствую себя одиноким и непонятым. Благодарю
      Тебя за обещание никогда не оставлять Своих детей. Напомни мне о Своем присутствии и
      наполни мое сердце уверенностью в Твоей любви. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, there are moments when I feel lonely and misunderstood. Thank You
      for the promise never to forsake Your children. Remind me of Your presence and fill
      my heart with confidence in Your love. In the name of Jesus Christ. Amen.
    es: Padre Celestial, hay momentos en que me siento solo e incomprendido. Te doy gracias
      por la promesa de nunca abandonar a Tus hijos. Recuérdame Tu presencia y llena mi corazón
      de confianza en Tu amor. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, бувають моменти, коли я почуваюся самотнім і незрозумілим. Дякую Тобі
      за обіцянку ніколи не покидати Своїх дітей. Нагадай мені про Свою присутність і наповни
      моє серце впевненістю у Твоїй любові. В ім'я Ісуса Христа. Амінь.
- id: day_186
  ref: lm:3:26
  title:
    ru: Ожидание Божьего ответа
    en: Waiting for God's Answer
    es: Esperar la Respuesta de Dios
    uk: Очікування Божої відповіді
  text:
    ru: Господи, иногда мне трудно ждать Твоего ответа. Помоги мне не терять терпения и не
      искать собственных решений там, где нужно довериться Тебе. Научи меня ожидать с верой
      и надеждой. Во имя Иисуса Христа. Аминь.
    en: Lord, sometimes it is hard for me to wait for Your answer. Help me not to lose patience
      and not to seek my own solutions where I need to trust You. Teach me to wait with faith
      and hope. In the name of Jesus Christ. Amen.
    es: Señor, a veces me cuesta esperar Tu respuesta. Ayúdame a no perder la paciencia y
      a no buscar mis propias soluciones donde debo confiar en Ti. Enséñame a esperar con
      fe y esperanza. En el nombre de Jesucristo. Amén.
    uk: Господи, інколи мені важко чекати Твоєї відповіді. Допоможи мені не втрачати терпіння
      й не шукати власних рішень там, де потрібно довіритися Тобі. Навчи мене чекати з вірою
      й надією. В ім'я Ісуса Христа. Амінь.
- id: day_187
  ref: ph:4:19
  title:
    ru: Божье обеспечение
    en: God's Provision
    es: La Provisión de Dios
    uk: Боже забезпечення
  text:
    ru: Отец Небесный, Ты знаешь все мои нужды. Помоги мне не жить в постоянном беспокойстве
      о завтрашнем дне. Научи меня доверять Твоему обеспечению и быть благодарным за все,
      что Ты посылаешь. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, You know all my needs. Help me not to live in constant worry about
      tomorrow. Teach me to trust Your provision and to be thankful for all that You send.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, Tú conoces todas mis necesidades. Ayúdame a no vivir en constante
      preocupación por el mañana. Enséñame a confiar en Tu provisión y a ser agradecido por
      todo lo que envías. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, Ти знаєш усі мої потреби. Допоможи мені не жити в постійному неспокої
      про завтрашній день. Навчи мене довіряти Твоєму забезпеченню й бути вдячним за все,
      що Ти посилаєш. В ім'я Ісуса Христа. Амінь.
- id: day_188
  ref: 2co:12:9
  title:
    ru: Сила в немощи
    en: Strength in Weakness
    es: Fuerza en la Flaqueza
    uk: Сила в немочі
  text:
    ru: Господи, когда мои силы заканчиваются, напоминай мне, что Твоя сила не имеет предела.
      Помоги мне опираться не на собственные возможности, а на Твою благодать. Укрепляй меня
      и веди вперед. Во имя Иисуса Христа. Аминь.
    en: Lord, when my strength runs out, remind me that Your power has no limit. Help me to
      lean not on my own abilities but on Your grace. Strengthen me and lead me forward. In
      the name of Jesus Christ. Amen.
    es: Señor, cuando mis fuerzas se agoten, recuérdame que Tu poder no tiene límite. Ayúdame
      a apoyarme no en mis propias capacidades, sino en Tu gracia. Fortaléceme y guíame hacia
      adelante. En el nombre de Jesucristo. Amén.
    uk: Господи, коли мої сили вичерпуються, нагадуй мені, що Твоя сила не має меж. Допоможи
      мені спиратися не на власні можливості, а на Твою благодать. Зміцнюй мене й веди вперед.
      В ім'я Ісуса Христа. Амінь.
- id: day_189
  ref: mt:19:26
  title:
    ru: Надежда среди трудностей
    en: Hope amid Difficulties
    es: Esperanza en Medio de las Dificultades
    uk: Надія серед труднощів
  text:
    ru: Отец Небесный, даже если обстоятельства выглядят безнадежными, помоги мне помнить,
      что для Тебя нет ничего невозможного. Наполни мое сердце надеждой и укрепи веру в Твои
      обещания. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, even when circumstances look hopeless, help me to remember that nothing
      is impossible for You. Fill my heart with hope and strengthen my faith in Your promises.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, aun cuando las circunstancias parezcan desesperadas, ayúdame a recordar
      que para Ti nada es imposible. Llena mi corazón de esperanza y fortalece mi fe en Tus
      promesas. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, навіть коли обставини видаються безнадійними, допоможи мені пам'ятати,
      що для Тебе немає нічого неможливого. Наповни моє серце надією й зміцни мою віру в Твої
      обітниці. В ім'я Ісуса Христа. Амінь.
- id: day_190
  ref: ps:42:5
  title:
    ru: Защита от уныния
    en: Protection from Despondency
    es: Protección ante el Desánimo
    uk: Захист від зневіри
  text:
    ru: Господи, сохрани мое сердце от отчаяния и уныния. Когда мне трудно радоваться, напоминай
      о Твоей верности и любви. Помоги мне поднимать взгляд к Тебе и находить утешение в Твоем
      присутствии. Во имя Иисуса Христа. Аминь.
    en: Lord, keep my heart from despair and despondency. When it is hard for me to rejoice,
      remind me of Your faithfulness and love. Help me to lift my gaze to You and to find
      comfort in Your presence. In the name of Jesus Christ. Amen.
    es: Señor, guarda mi corazón de la desesperación y el desánimo. Cuando me cueste alegrarme,
      recuérdame Tu fidelidad y Tu amor. Ayúdame a elevar mi mirada hacia Ti y a hallar consuelo
      en Tu presencia. En el nombre de Jesucristo. Amén.
    uk: Господи, збережи моє серце від відчаю й зневіри. Коли мені важко радіти, нагадуй про
      Твою вірність і любов. Допоможи мені підносити погляд до Тебе й знаходити втіху у Твоїй
      присутності. В ім'я Ісуса Христа. Амінь.
- id: day_191
  ref: js:1:9
  title:
    ru: Мужество в борьбе
    en: Courage in the Struggle
    es: Valor en la Lucha
    uk: Мужність у боротьбі
  text:
    ru: Отец Небесный, дай мне мужество не сдаваться перед трудностями. Когда испытания кажутся
      слишком тяжелыми, укрепляй мое сердце и напоминай, что Ты идешь рядом со мной. Во имя
      Иисуса Христа. Аминь.
    en: Heavenly Father, give me the courage not to give up in the face of difficulties. When
      trials seem too heavy, strengthen my heart and remind me that You walk beside me. In
      the name of Jesus Christ. Amen.
    es: Padre Celestial, dame el valor de no rendirme ante las dificultades. Cuando las pruebas
      parezcan demasiado pesadas, fortalece mi corazón y recuérdame que caminas a mi lado.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дай мені мужність не здаватися перед труднощами. Коли випробування
      видаються надто важкими, зміцнюй моє серце й нагадуй, що Ти йдеш поруч зі мною. В ім'я
      Ісуса Христа. Амінь.
- id: day_192
  ref: 1co:1:9
  title:
    ru: Божья верность в скорбях
    en: God's Faithfulness in Sorrows
    es: La Fidelidad de Dios en las Tristezas
    uk: Божа вірність у скорботах
  text:
    ru: Господи, благодарю Тебя за то, что даже в скорбях Ты остаешься верным. Помоги мне
      видеть Твою заботу и поддержку в каждом дне. Укрепляй мою веру и учи меня доверять Тебе
      без условий. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that even in sorrows You remain faithful. Help me to see Your care
      and support in each day. Strengthen my faith and teach me to trust You without conditions.
      In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque aun en las tristezas permaneces fiel. Ayúdame a ver Tu
      cuidado y Tu sostén en cada día. Fortalece mi fe y enséñame a confiar en Ti sin condiciones.
      En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що навіть у скорботах Ти залишаєшся вірним. Допоможи мені
      бачити Твою турботу й підтримку в кожному дні. Зміцнюй мою віру й навчи мене довіряти
      Тобі без умов. В ім'я Ісуса Христа. Амінь.
- id: day_193
  ref: mt:6:34
  title:
    ru: Победа над беспокойством
    en: Victory over Worry
    es: Victoria sobre la Preocupación
    uk: Перемога над неспокоєм
  text:
    ru: Отец Небесный, освободи меня от чрезмерного беспокойства о будущем. Помоги мне помнить,
      что моя жизнь находится в Твоих руках. Научи меня жить сегодняшним днем и доверять Тебе
      завтрашний. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, free me from excessive worry about the future. Help me to remember
      that my life is in Your hands. Teach me to live in today and to entrust tomorrow to
      You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, líbrame de la preocupación excesiva por el futuro. Ayúdame a recordar
      que mi vida está en Tus manos. Enséñame a vivir el día de hoy y a confiarte el mañana.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, звільни мене від надмірного неспокою про майбутнє. Допоможи мені пам'ятати,
      що моє життя перебуває у Твоїх руках. Навчи мене жити сьогоднішнім днем і довіряти Тобі
      завтрашній. В ім'я Ісуса Христа. Амінь.
- id: day_194
  ref: ps:27:1
  title:
    ru: Свет в темные времена
    en: Light in Dark Times
    es: Luz en Tiempos Oscuros
    uk: Світло в темні часи
  text:
    ru: Господи, когда вокруг темнота и неопределенность, будь моим светом. Направляй мои
      шаги и помогай не уклоняться от Твоего пути. Напоминай мне, что Твой свет сильнее любой
      тьмы. Во имя Иисуса Христа. Аминь.
    en: Lord, when there is darkness and uncertainty all around, be my light. Direct my steps
      and help me not to turn aside from Your path. Remind me that Your light is stronger
      than any darkness. In the name of Jesus Christ. Amen.
    es: Señor, cuando alrededor haya oscuridad e incertidumbre, sé Tú mi luz. Dirige mis pasos
      y ayúdame a no apartarme de Tu camino. Recuérdame que Tu luz es más fuerte que cualquier
      oscuridad. En el nombre de Jesucristo. Amén.
    uk: Господи, коли довкола темрява й невизначеність, будь моїм світлом. Скеровуй мої кроки
      й допоможи не ухилятися від Твоєї дороги. Нагадуй мені, що Твоє світло сильніше за будь-яку
      темряву. В ім'я Ісуса Христа. Амінь.
- id: day_195
  ref: 1ts:5:18
  title:
    ru: Благодарность посреди испытаний
    en: Gratitude amid Trials
    es: Gratitud en Medio de las Pruebas
    uk: Подяка посеред випробувань
  text:
    ru: Отец Небесный, даже в трудные времена я благодарю Тебя за Твое присутствие и заботу.
      Помоги мне видеть Твою работу в моей жизни и не терять надежды. Пусть испытания приближают
      меня к Тебе и укрепляют мою веру. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, even in hard times I thank You for Your presence and care. Help me
      to see Your work in my life and not to lose hope. May trials draw me nearer to You and
      strengthen my faith. In the name of Jesus Christ. Amen.
    es: Padre Celestial, aun en los tiempos difíciles te doy gracias por Tu presencia y Tu
      cuidado. Ayúdame a ver Tu obra en mi vida y a no perder la esperanza. Que las pruebas
      me acerquen más a Ti y fortalezcan mi fe. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, навіть у важкі часи я дякую Тобі за Твою присутність і турботу. Допоможи
      мені бачити Твою працю в моєму житті й не втрачати надії. Нехай випробування наближають
      мене до Тебе й зміцнюють мою віру. В ім'я Ісуса Христа. Амінь.
- id: day_196
  ref: mt:24:35
  title:
    ru: Божьи обещания неизменны
    en: God's Promises Are Unchanging
    es: Las Promesas de Dios Son Inmutables
    uk: Божі обітниці незмінні
  text:
    ru: Отец Небесный, благодарю Тебя за то, что Твои обещания надежны и неизменны. Когда
      обстоятельства меняются, помоги мне помнить, что Твое Слово остается твердым основанием.
      Укрепляй мою веру и учи меня доверять каждому Твоему слову. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that Your promises are reliable and unchanging. When circumstances
      change, help me to remember that Your Word remains a firm foundation. Strengthen my
      faith and teach me to trust every word of Yours. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias porque Tus promesas son seguras e inmutables. Cuando
      las circunstancias cambien, ayúdame a recordar que Tu Palabra permanece como fundamento
      firme. Fortalece mi fe y enséñame a confiar en cada palabra Tuya. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, дякую Тобі за те, що Твої обітниці надійні й незмінні. Коли обставини
      змінюються, допоможи мені пам'ятати, що Твоє Слово залишається твердою основою. Зміцнюй
      мою віру й навчи мене довіряти кожному Твоєму слову. В ім'я Ісуса Христа. Амінь.
- id: day_197
  ref: jr:17:7
  title:
    ru: Надежда в Господе
    en: Hope in the Lord
    es: Esperanza en el Señor
    uk: Надія в Господі
  text:
    ru: Господи, помоги мне возлагать надежду не на людей и обстоятельства, а на Тебя. Когда
      я не вижу выхода, напоминай мне, что Ты уже приготовил путь. Укрепи мое сердце уверенностью
      в Твоей любви и верности. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to place my hope not in people and circumstances but in You. When I
      see no way out, remind me that You have already prepared a path. Strengthen my heart
      with confidence in Your love and faithfulness. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a poner mi esperanza no en las personas ni en las circunstancias, sino
      en Ti. Cuando no vea salida, recuérdame que Tú ya has preparado un camino. Fortalece
      mi corazón con la certeza de Tu amor y Tu fidelidad. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені покладати надію не на людей і обставини, а на Тебе. Коли я
      не бачу виходу, нагадуй мені, що Ти вже приготував дорогу. Зміцни моє серце впевненістю
      у Твоїй любові й вірності. В ім'я Ісуса Христа. Амінь.
- id: day_198
  ref: is:41:10
  title:
    ru: Бог всегда рядом
    en: God Is Always Near
    es: Dios Está Siempre Cerca
    uk: Бог завжди поруч
  text:
    ru: Отец Небесный, благодарю Тебя за обещание быть рядом со Своими детьми. Даже когда
      я чувствую себя слабым или одиноким, напоминай мне о Своем присутствии. Помоги мне жить
      с уверенностью, что Ты никогда не оставишь меня. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the promise to be near Your children. Even when I feel
      weak or alone, remind me of Your presence. Help me to live with the assurance that You
      will never forsake me. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la promesa de estar cerca de Tus hijos. Aun cuando
      me sienta débil o solo, recuérdame Tu presencia. Ayúdame a vivir con la certeza de que
      nunca me abandonarás. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за обіцянку бути поруч зі Своїми дітьми. Навіть коли я почуваюся
      слабким чи самотнім, нагадуй мені про Свою присутність. Допоможи мені жити з упевненістю,
      що Ти ніколи не покинеш мене. В ім'я Ісуса Христа. Амінь.
- id: day_199
  ref: prv:3:6
  title:
    ru: Господь направляет мои шаги
    en: The Lord Directs My Steps
    es: El Señor Dirige mis Pasos
    uk: Господь скеровує мої кроки
  text:
    ru: Господи, благодарю Тебя за обещание вести меня по правильному пути. Помоги мне доверять
      Твоему руководству и не полагаться только на собственное понимание. Направляй мои решения
      и помогай исполнять Твою волю. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for the promise to lead me on the right path. Help me to trust Your
      guidance and not to rely only on my own understanding. Direct my decisions and help
      me to do Your will. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por la promesa de guiarme por el camino correcto. Ayúdame a
      confiar en Tu dirección y a no apoyarme solo en mi propia prudencia. Dirige mis decisiones
      y ayúdame a cumplir Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за обіцянку вести мене правильною дорогою. Допоможи мені довіряти
      Твоєму керівництву й не покладатися лише на власне розуміння. Скеровуй мої рішення й
      допомагай виконувати Твою волю. В ім'я Ісуса Христа. Амінь.
- id: day_200
  ref: jo:14:27
  title:
    ru: Мир, который дает Бог
    en: The Peace That God Gives
    es: La Paz que Da Dios
    uk: Мир, який дає Бог
  text:
    ru: Отец Небесный, благодарю Тебя за мир, который Ты обещал Своим детям. Когда сердце
      тревожится, помоги мне вспоминать Твои обещания и успокаиваться в Твоем присутствии.
      Наполни меня уверенностью в Твоей заботе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the peace You have promised to Your children. When
      my heart is troubled, help me to recall Your promises and to be calmed in Your presence.
      Fill me with confidence in Your care. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la paz que has prometido a Tus hijos. Cuando mi
      corazón se turbe, ayúdame a recordar Tus promesas y a serenarme en Tu presencia. Lléname
      de confianza en Tu cuidado. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за мир, який Ти обіцяв Своїм дітям. Коли серце тривожиться,
      допоможи мені згадувати Твої обітниці й заспокоюватися у Твоїй присутності. Наповни
      мене впевненістю у Твоїй турботі. В ім'я Ісуса Христа. Амінь.
- id: day_201
  ref: jr:33:3
  title:
    ru: Бог слышит молитвы
    en: God Hears Prayers
    es: Dios Escucha las Oraciones
    uk: Бог чує молитви
  text:
    ru: Господи, благодарю Тебя за то, что Ты слышишь каждую искреннюю молитву. Даже когда
      ответ приходит не сразу, помоги мне продолжать доверять Тебе. Укрепляй мою веру и учи
      меня ожидать Твоего времени. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that You hear every sincere prayer. Even when the answer does not
      come at once, help me to keep trusting You. Strengthen my faith and teach me to wait
      for Your timing. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque escuchas cada oración sincera. Aun cuando la respuesta
      no llegue de inmediato, ayúdame a seguir confiando en Ti. Fortalece mi fe y enséñame
      a esperar Tu tiempo. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти чуєш кожну щиру молитву. Навіть коли відповідь приходить
      не одразу, допоможи мені продовжувати довіряти Тобі. Зміцнюй мою віру й навчи мене очікувати
      Твого часу. В ім'я Ісуса Христа. Амінь.
- id: day_202
  ref: is:40:31
  title:
    ru: Господь дает силу
    en: The Lord Gives Strength
    es: El Señor Da Fuerzas
    uk: Господь дає силу
  text:
    ru: Отец Небесный, благодарю Тебя за обещание укреплять меня в трудностях. Когда я чувствую
      усталость или бессилие, напоминай мне, что источник моей силы находится в Тебе. Помоги
      мне полностью полагаться на Твою помощь. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the promise to strengthen me in difficulties. When
      I feel weary or powerless, remind me that the source of my strength is in You. Help
      me to rely fully on Your help. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la promesa de fortalecerme en las dificultades.
      Cuando me sienta cansado o sin fuerzas, recuérdame que la fuente de mi fuerza está en
      Ti. Ayúdame a apoyarme por completo en Tu ayuda. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за обіцянку зміцнювати мене в труднощах. Коли я відчуваю
      втому чи безсилля, нагадуй мені, що джерело моєї сили перебуває в Тобі. Допоможи мені
      цілком покладатися на Твою допомогу. В ім'я Ісуса Христа. Амінь.
- id: day_203
  ref: mt:6:32
  title:
    ru: Божья забота о нуждах
    en: God's Care for Our Needs
    es: El Cuidado de Dios por Nuestras Necesidades
    uk: Божа турбота про потреби
  text:
    ru: Господи, благодарю Тебя за Твою заботу обо всех моих нуждах. Научи меня не жить в
      постоянном беспокойстве, но доверять Твоему обеспечению. Помоги мне быть благодарным
      за все, что Ты посылаешь в мою жизнь. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for Your care for all my needs. Teach me not to live in constant worry
      but to trust Your provision. Help me to be thankful for all that You send into my life.
      In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por Tu cuidado de todas mis necesidades. Enséñame a no vivir
      en constante preocupación, sino a confiar en Tu provisión. Ayúdame a ser agradecido
      por todo lo que envías a mi vida. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за Твою турботу про всі мої потреби. Навчи мене не жити в постійному
      неспокої, а довіряти Твоєму забезпеченню. Допоможи мені бути вдячним за все, що Ти посилаєш
      у моє життя. В ім'я Ісуса Христа. Амінь.
- id: day_204
  ref: rm:8:28
  title:
    ru: Бог совершает доброе
    en: God Works for Good
    es: Dios Obra para Bien
    uk: Бог чинить добре
  text:
    ru: Отец Небесный, даже когда я не понимаю происходящего, помоги мне помнить, что Ты действуешь
      во благо Своих детей. Укрепи мою веру и научи доверять Твоему замыслу больше, чем собственным
      чувствам. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, even when I do not understand what is happening, help me to remember
      that You work for the good of Your children. Strengthen my faith and teach me to trust
      Your design more than my own feelings. In the name of Jesus Christ. Amen.
    es: Padre Celestial, aun cuando no entienda lo que sucede, ayúdame a recordar que obras
      para el bien de Tus hijos. Fortalece mi fe y enséñame a confiar en Tu propósito más
      que en mis propios sentimientos. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, навіть коли я не розумію того, що відбувається, допоможи мені пам'ятати,
      що Ти дієш на благо Своїх дітей. Зміцни мою віру й навчи довіряти Твоєму задумові більше,
      ніж власним почуттям. В ім'я Ісуса Христа. Амінь.
- id: day_205
  ref: rm:8:37
  title:
    ru: Победа во Христе
    en: Victory in Christ
    es: Victoria en Cristo
    uk: Перемога у Христі
  text:
    ru: Господи, благодарю Тебя за победу, которую я имею через Иисуса Христа. Помоги мне
      не жить как побежденному человеку, но помнить о Твоей силе и благодати. Укрепляй меня
      в ежедневной борьбе с грехом и искушениями. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for the victory I have through Jesus Christ. Help me not to live as
      a defeated person but to remember Your power and grace. Strengthen me in the daily struggle
      against sin and temptation. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por la victoria que tengo por medio de Jesucristo. Ayúdame a
      no vivir como un derrotado, sino a recordar Tu poder y Tu gracia. Fortaléceme en la
      lucha diaria contra el pecado y la tentación. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за перемогу, яку я маю через Ісуса Христа. Допоможи мені не жити
      як переможена людина, а пам'ятати про Твою силу й благодать. Зміцнюй мене в щоденній
      боротьбі з гріхом і спокусами. В ім'я Ісуса Христа. Амінь.
- id: day_206
  ref: ps:121:7
  title:
    ru: Господь хранит меня
    en: The Lord Keeps Me
    es: El Señor Me Guarda
    uk: Господь береже мене
  text:
    ru: Отец Небесный, благодарю Тебя за Твою защиту и охрану. Сохраняй меня на всех путях
      и помогай жить в уверенности, что моя жизнь находится в Твоих руках. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, thank You for Your protection and watch over me. Keep me on all my
      ways and help me to live with the assurance that my life is in Your hands. In the name
      of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu protección y Tu cuidado. Guárdame en todos
      mis caminos y ayúdame a vivir con la certeza de que mi vida está en Tus manos. En el
      nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твій захист і охорону. Зберігай мене на всіх дорогах
      і допоможи жити з упевненістю, що моє життя перебуває у Твоїх руках. В ім'я Ісуса Христа.
      Амінь.
- id: day_207
  ref: jr:31:3
  title:
    ru: Божья любовь неизменна
    en: God's Love Is Unchanging
    es: El Amor de Dios Es Inmutable
    uk: Божа любов незмінна
  text:
    ru: Господи, благодарю Тебя за любовь, которая не зависит от моих успехов или неудач.
      Напоминай мне каждый день, что я любим Тобой. Помоги мне жить в этой уверенности и отражать
      Твою любовь другим людям. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for a love that does not depend on my successes or failures. Remind
      me each day that I am loved by You. Help me to live in this assurance and to reflect
      Your love to others. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por un amor que no depende de mis éxitos ni de mis fracasos.
      Recuérdame cada día que soy amado por Ti. Ayúdame a vivir en esa certeza y a reflejar
      Tu amor a los demás. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за любов, яка не залежить від моїх успіхів чи невдач. Нагадуй
      мені щодня, що я любий Тобі. Допоможи мені жити в цій упевненості й відображати Твою
      любов іншим людям. В ім'я Ісуса Христа. Амінь.
- id: day_208
  ref: 2co:12:9
  title:
    ru: Благодать на каждый день
    en: Grace for Every Day
    es: Gracia para Cada Día
    uk: Благодать на кожен день
  text:
    ru: Отец Небесный, благодарю Тебя за благодать, которой Ты поддерживаешь меня ежедневно.
      Когда я ошибаюсь или падаю, помоги мне не отчаиваться, но приходить к Тебе за прощением
      и помощью. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the grace by which You sustain me each day. When I
      err or fall, help me not to despair but to come to You for forgiveness and help. In
      the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la gracia con que me sostienes cada día. Cuando
      me equivoque o caiga, ayúdame a no desesperar, sino a acudir a Ti en busca de perdón
      y ayuda. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за благодать, якою Ти підтримуєш мене щодня. Коли я помиляюся
      чи падаю, допоможи мені не впадати у відчай, а приходити до Тебе за прощенням і допомогою.
      В ім'я Ісуса Христа. Амінь.
- id: day_209
  ref: ph:1:6
  title:
    ru: Господь завершит начатое
    en: The Lord Will Finish What He Began
    es: El Señor Terminará lo que Comenzó
    uk: Господь завершить розпочате
  text:
    ru: Господи, благодарю Тебя за то, что Ты не оставляешь Свою работу незавершенной. Продолжай
      менять мое сердце и формировать мой характер. Помоги мне доверять Тебе даже тогда, когда
      я не вижу быстрых перемен. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that You do not leave Your work unfinished. Keep changing my heart
      and shaping my character. Help me to trust You even when I do not see quick changes.
      In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque no dejas Tu obra sin terminar. Sigue cambiando mi corazón
      y formando mi carácter. Ayúdame a confiar en Ti aun cuando no vea cambios rápidos. En
      el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти не залишаєш Свою працю незавершеною. Продовжуй змінювати
      моє серце й формувати мій характер. Допоможи мені довіряти Тобі навіть тоді, коли я
      не бачу швидких змін. В ім'я Ісуса Христа. Амінь.
- id: day_210
  ref: 1pe:1:3
  title:
    ru: Живая надежда
    en: A Living Hope
    es: Una Esperanza Viva
    uk: Жива надія
  text:
    ru: Отец Небесный, благодарю Тебя за живую надежду, которую я имею через Иисуса Христа.
      Помоги мне смотреть дальше временных трудностей и помнить о вечной жизни, приготовленной
      для Твоих детей. Укрепляй мое сердце этой надеждой каждый день. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, thank You for the living hope I have through Jesus Christ. Help me
      to look beyond temporary difficulties and to remember the eternal life prepared for
      Your children. Strengthen my heart with this hope each day. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, te doy gracias por la esperanza viva que tengo por medio de Jesucristo.
      Ayúdame a mirar más allá de las dificultades temporales y a recordar la vida eterna
      preparada para Tus hijos. Fortalece mi corazón con esta esperanza cada día. En el nombre
      de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за живу надію, яку я маю через Ісуса Христа. Допоможи мені
      дивитися далі тимчасових труднощів і пам'ятати про вічне життя, приготоване для Твоїх
      дітей. Зміцнюй моє серце цією надією щодня. В ім'я Ісуса Христа. Амінь.
- id: day_211
  ref: cl:3:23
  title:
    ru: Труд во славу Божью
    en: Work for God's Glory
    es: Trabajo para la Gloria de Dios
    uk: Праця на славу Божу
  text:
    ru: Отец Небесный, благодарю Тебя за возможность трудиться и приносить пользу. Помоги
      мне выполнять свою работу добросовестно, честно и с благодарным сердцем. Пусть мой труд
      прославляет Тебя и становится благословением для других людей. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, thank You for the opportunity to work and to be useful. Help me to
      do my work conscientiously, honestly, and with a grateful heart. May my labor glorify
      You and become a blessing to others. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la oportunidad de trabajar y de ser útil. Ayúdame
      a hacer mi trabajo con esmero, honestidad y un corazón agradecido. Que mi labor te glorifique
      y sea una bendición para los demás. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за можливість працювати й приносити користь. Допоможи мені
      виконувати свою роботу сумлінно, чесно й з вдячним серцем. Нехай моя праця прославляє
      Тебе й стає благословенням для інших людей. В ім'я Ісуса Христа. Амінь.
- id: day_212
  ref: jm:1:5
  title:
    ru: Мудрость в решениях
    en: Wisdom in Decisions
    es: Sabiduría en las Decisiones
    uk: Мудрість у рішеннях
  text:
    ru: Господи, сегодня мне предстоит принимать решения. Даруй мне мудрость видеть правильный
      путь и не руководствоваться только своими чувствами. Помоги искать Твою волю прежде
      собственных желаний и доверять Твоему руководству. Во имя Иисуса Христа. Аминь.
    en: Lord, today I have decisions to make. Grant me wisdom to see the right way and not
      to be guided only by my feelings. Help me to seek Your will before my own desires and
      to trust Your guidance. In the name of Jesus Christ. Amen.
    es: Señor, hoy debo tomar decisiones. Concédeme sabiduría para ver el camino correcto
      y para no guiarme solo por mis sentimientos. Ayúdame a buscar Tu voluntad antes que
      mis propios deseos y a confiar en Tu dirección. En el nombre de Jesucristo. Amén.
    uk: Господи, сьогодні мені належить приймати рішення. Даруй мені мудрість бачити правильний
      шлях і не керуватися лише своїми почуттями. Допоможи шукати Твою волю перш за власні
      бажання й довіряти Твоєму керівництву. В ім'я Ісуса Христа. Амінь.
- id: day_213
  ref: 1co:7:17
  title:
    ru: Верность призванию
    en: Faithfulness to One's Calling
    es: Fidelidad al Llamado
    uk: Вірність покликанню
  text:
    ru: Отец Небесный, благодарю Тебя за то место и те возможности, которые Ты дал мне. Помоги
      мне быть верным в своем призвании и использовать свои способности для Твоей славы. Научи
      меня служить Тебе там, где Ты меня поставил. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the place and the opportunities You have given me.
      Help me to be faithful in my calling and to use my abilities for Your glory. Teach me
      to serve You where You have placed me. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por el lugar y las oportunidades que me has dado.
      Ayúdame a ser fiel en mi llamado y a usar mis capacidades para Tu gloria. Enséñame a
      servirte donde me has puesto. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те місце й ті можливості, які Ти дав мені. Допоможи мені
      бути вірним у своєму покликанні й використовувати свої здібності для Твоєї слави. Навчи
      мене служити Тобі там, де Ти мене поставив. В ім'я Ісуса Христа. Амінь.
- id: day_214
  ref: prv:11:1
  title:
    ru: Честность в делах
    en: Honesty in Affairs
    es: Honradez en los Negocios
    uk: Чесність у справах
  text:
    ru: Господи, помоги мне быть честным и справедливым во всех моих делах. Сохрани меня от
      обмана, лукавства и стремления к нечестной выгоде. Пусть мои поступки отражают Твою
      праведность и истину. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be honest and just in all my dealings. Keep me from deceit, cunning,
      and the pursuit of dishonest gain. May my actions reflect Your righteousness and truth.
      In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a ser honrado y justo en todos mis asuntos. Guárdame del engaño, la
      astucia y la búsqueda de ganancias deshonestas. Que mis actos reflejen Tu justicia y
      Tu verdad. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бути чесним і справедливим у всіх моїх справах. Збережи мене
      від обману, лукавства й прагнення нечесної вигоди. Нехай мої вчинки відображають Твою
      праведність та істину. В ім'я Ісуса Христа. Амінь.
- id: day_215
  ref: lk:12:48
  title:
    ru: Благодарность за возможности
    en: Thanks for Opportunities
    es: Gratitud por las Oportunidades
    uk: Подяка за можливості
  text:
    ru: Отец Небесный, благодарю Тебя за способности, время и возможности, которые Ты даровал
      мне. Помоги не растрачивать их напрасно, но использовать мудро и ответственно. Научи
      меня быть хорошим управителем всего, что Ты доверил мне. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the abilities, the time, and the opportunities You
      have given me. Help me not to waste them in vain but to use them wisely and responsibly.
      Teach me to be a good steward of all You have entrusted to me. In the name of Jesus
      Christ. Amen.
    es: Padre Celestial, te doy gracias por las capacidades, el tiempo y las oportunidades
      que me has dado. Ayúdame a no malgastarlos en vano, sino a usarlos con sabiduría y responsabilidad.
      Enséñame a ser buen administrador de todo lo que me has confiado. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, дякую Тобі за здібності, час і можливості, які Ти дарував мені. Допоможи
      не розтрачувати їх марно, а використовувати мудро й відповідально. Навчи мене бути добрим
      управителем усього, що Ти довірив мені. В ім'я Ісуса Христа. Амінь.
- id: day_216
  ref: ec:9:10
  title:
    ru: Усердие в труде
    en: Diligence in Work
    es: Diligencia en el Trabajo
    uk: Старанність у праці
  text:
    ru: Господи, избавь меня от лености и безразличия. Помоги мне трудиться с усердием и постоянством,
      даже когда работа кажется трудной или незаметной. Укрепляй меня и напоминай, что всякий
      честный труд имеет ценность перед Тобой. Во имя Иисуса Христа. Аминь.
    en: Lord, deliver me from laziness and indifference. Help me to work with diligence and
      constancy, even when the task seems hard or unnoticed. Strengthen me and remind me that
      all honest labor has worth before You. In the name of Jesus Christ. Amen.
    es: Señor, líbrame de la pereza y la indiferencia. Ayúdame a trabajar con diligencia y
      constancia, aun cuando la tarea parezca difícil o pase inadvertida. Fortaléceme y recuérdame
      que todo trabajo honrado tiene valor delante de Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, визволи мене від лінощів і байдужості. Допоможи мені працювати зі старанністю
      й постійністю, навіть коли робота видається важкою чи непомітною. Зміцнюй мене й нагадуй,
      що всяка чесна праця має цінність перед Тобою. В ім'я Ісуса Христа. Амінь.
- id: day_217
  ref: ps:32:8
  title:
    ru: Доверие Божьему руководству
    en: Trust in God's Guidance
    es: Confianza en la Guía de Dios
    uk: Довіра Божому керівництву
  text:
    ru: Отец Небесный, когда я не знаю, какой путь выбрать, помоги мне доверять Твоему водительству.
      Закрывай двери, которые не от Тебя, и открывай те, которые соответствуют Твоей воле.
      Веди меня Своими путями. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, when I do not know which way to choose, help me to trust Your guidance.
      Close the doors that are not from You and open those that align with Your will. Lead
      me in Your ways. In the name of Jesus Christ. Amen.
    es: Padre Celestial, cuando no sepa qué camino elegir, ayúdame a confiar en Tu dirección.
      Cierra las puertas que no son de Ti y abre las que están conforme a Tu voluntad. Guíame
      por Tus caminos. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, коли я не знаю, яку дорогу обрати, допоможи мені довіряти Твоєму керівництву.
      Зачиняй двері, які не від Тебе, і відчиняй ті, що відповідають Твоїй волі. Веди мене
      Своїми дорогами. В ім'я Ісуса Христа. Амінь.
- id: day_218
  ref: gl:5:13
  title:
    ru: Служение другим
    en: Serving Others
    es: Servir a los Demás
    uk: Служіння іншим
  text:
    ru: Господи, помоги мне видеть в своей работе возможность служить людям. Удали из моего
      сердца эгоизм и стремление только к собственной выгоде. Научи меня приносить пользу
      окружающим и быть благословением для них. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to see in my work an opportunity to serve people. Remove from my heart
      selfishness and the pursuit of my own gain alone. Teach me to be of use to those around
      me and to be a blessing to them. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a ver en mi trabajo una oportunidad de servir a las personas. Quita
      de mi corazón el egoísmo y la búsqueda solo de mi propio provecho. Enséñame a ser útil
      a quienes me rodean y a ser una bendición para ellos. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бачити у своїй роботі можливість служити людям. Усунь з мого
      серця егоїзм і прагнення лише власної вигоди. Навчи мене приносити користь оточенню
      й бути для них благословенням. В ім'я Ісуса Христа. Амінь.
- id: day_219
  ref: ph:4:6
  title:
    ru: Мир среди забот
    en: Peace amid Cares
    es: Paz en Medio de los Afanes
    uk: Мир серед турбот
  text:
    ru: Отец Небесный, когда заботы и обязанности становятся тяжелыми, помоги мне сохранять
      внутренний мир. Напоминай мне, что Ты держишь под контролем все обстоятельства моей
      жизни. Научи меня трудиться усердно и одновременно доверять Тебе. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, when cares and duties become heavy, help me to keep inner peace.
      Remind me that You hold under Your control all the circumstances of my life. Teach me
      to work diligently and at the same time to trust You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, cuando los afanes y las obligaciones se vuelvan pesados, ayúdame
      a conservar la paz interior. Recuérdame que tienes bajo Tu control todas las circunstancias
      de mi vida. Enséñame a trabajar con diligencia y, a la vez, a confiar en Ti. En el nombre
      de Jesucristo. Amén.
    uk: Отче Небесний, коли турботи й обов'язки стають важкими, допоможи мені зберігати внутрішній
      мир. Нагадуй мені, що Ти тримаєш під контролем усі обставини мого життя. Навчи мене
      працювати старанно й водночас довіряти Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_220
  ref: lk:16:10
  title:
    ru: Верность в малом
    en: Faithfulness in Little
    es: Fidelidad en lo Poco
    uk: Вірність у малому
  text:
    ru: Господи, помоги мне не пренебрегать небольшими обязанностями и простыми возможностями.
      Научи меня быть верным в малом и помнить, что Ты видишь каждое доброе дело. Пусть моя
      верность прославляет Тебя. Во имя Иисуса Христа. Аминь.
    en: Lord, help me not to neglect small duties and simple opportunities. Teach me to be
      faithful in little and to remember that You see every good deed. May my faithfulness
      glorify You. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a no descuidar los pequeños deberes ni las oportunidades sencillas.
      Enséñame a ser fiel en lo poco y a recordar que Tú ves cada buena obra. Que mi fidelidad
      te glorifique. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені не нехтувати невеликими обов'язками й простими можливостями.
      Навчи мене бути вірним у малому й пам'ятати, що Ти бачиш кожну добру справу. Нехай моя
      вірність прославляє Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_221
  ref: ps:90:17
  title:
    ru: Благословение труда
    en: The Blessing of Work
    es: La Bendición del Trabajo
    uk: Благословення праці
  text:
    ru: Отец Небесный, благослови дела моих рук. Помоги мне трудиться с мудростью и благодарностью.
      Если на то есть Твоя воля, даруй успех моим усилиям и используй результаты моего труда
      для добра. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, bless the work of my hands. Help me to work with wisdom and gratitude.
      If it is Your will, grant success to my efforts and use the fruit of my labor for good.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, bendice la obra de mis manos. Ayúdame a trabajar con sabiduría y
      gratitud. Si es Tu voluntad, concede éxito a mis esfuerzos y usa el fruto de mi labor
      para bien. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, благослови діла моїх рук. Допоможи мені працювати з мудрістю й вдячністю.
      Якщо на те є Твоя воля, даруй успіх моїм зусиллям і використовуй плоди моєї праці для
      добра. В ім'я Ісуса Христа. Амінь.
- id: day_222
  ref: 1co:4:7
  title:
    ru: Смирение в успехе
    en: Humility in Success
    es: Humildad en el Éxito
    uk: Смирення в успіху
  text:
    ru: Господи, если Ты даруешь успех и благословение, помоги мне оставаться смиренным. Напоминай
      мне, что все доброе приходит от Тебя. Сохрани мое сердце от гордости и самонадеянности.
      Во имя Иисуса Христа. Аминь.
    en: Lord, when You grant success and blessing, help me to remain humble. Remind me that
      everything good comes from You. Keep my heart from pride and self-reliance. In the name
      of Jesus Christ. Amen.
    es: Señor, cuando concedas éxito y bendición, ayúdame a permanecer humilde. Recuérdame
      que todo lo bueno viene de Ti. Guarda mi corazón del orgullo y la autosuficiencia. En
      el nombre de Jesucristo. Amén.
    uk: Господи, коли Ти даруєш успіх і благословення, допоможи мені залишатися смиренним.
      Нагадуй мені, що все добре приходить від Тебе. Збережи моє серце від гордості й самовпевненості.
      В ім'я Ісуса Христа. Амінь.
- id: day_223
  ref: 2ts:3:13
  title:
    ru: Терпение в процессе
    en: Patience in the Process
    es: Paciencia en el Proceso
    uk: Терпіння в процесі
  text:
    ru: Отец Небесный, помоги мне не разочаровываться, если результаты приходят не сразу.
      Научи меня терпению и постоянству. Укрепляй мою веру и напоминай, что всякое доброе
      семя приносит плод в свое время. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me not to be discouraged when results do not come at once. Teach
      me patience and constancy. Strengthen my faith and remind me that every good seed bears
      fruit in its season. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a no desanimarme cuando los resultados no lleguen de inmediato.
      Enséñame paciencia y constancia. Fortalece mi fe y recuérdame que toda buena semilla
      da fruto a su tiempo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені не розчаровуватися, якщо результати приходять не одразу.
      Навчи мене терпіння й постійності. Зміцнюй мою віру й нагадуй, що всяке добре насіння
      приносить плід свого часу. В ім'я Ісуса Христа. Амінь.
- id: day_224
  ref: mt:5:16
  title:
    ru: Свет на рабочем месте
    en: Light in the Workplace
    es: Luz en el Lugar de Trabajo
    uk: Світло на робочому місці
  text:
    ru: Господи, помоги мне быть светом там, где я нахожусь. Пусть мои слова, поступки и отношение
      к людям отражают Твою любовь и истину. Используй меня для того, чтобы через мою жизнь
      другие могли увидеть Твою благость. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be light wherever I am. May my words, actions, and attitude toward
      people reflect Your love and truth. Use me so that through my life others may see Your
      goodness. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a ser luz dondequiera que esté. Que mis palabras, mis actos y mi actitud
      hacia las personas reflejen Tu amor y Tu verdad. Úsame para que por medio de mi vida
      los demás puedan ver Tu bondad. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бути світлом там, де я перебуваю. Нехай мої слова, вчинки й
      ставлення до людей відображають Твою любов та істину. Використовуй мене, щоб через моє
      життя інші могли побачити Твою доброту. В ім'я Ісуса Христа. Амінь.
- id: day_225
  ref: prv:16:3
  title:
    ru: Посвящение своих планов Богу
    en: Committing My Plans to God
    es: Encomendar mis Planes a Dios
    uk: Посвята своїх планів Богові
  text:
    ru: Отец Небесный, я доверяю Тебе свои планы, мечты и намерения. Если что-то из них не
      соответствует Твоей воле, помоги мне принять Твое руководство. Направляй мои шаги и
      помогай жить так, чтобы моя жизнь приносила славу Тебе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, I entrust to You my plans, dreams, and intentions. If any of them
      do not align with Your will, help me to accept Your guidance. Direct my steps and help
      me to live so that my life brings glory to You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te encomiendo mis planes, mis sueños y mis intenciones. Si algo de
      ellos no concuerda con Tu voluntad, ayúdame a aceptar Tu dirección. Dirige mis pasos
      y ayúdame a vivir de modo que mi vida te dé gloria. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, я довіряю Тобі свої плани, мрії й наміри. Якщо щось із них не відповідає
      Твоїй волі, допоможи мені прийняти Твоє керівництво. Скеровуй мої кроки й допомагай
      жити так, щоб моє життя приносило славу Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_226
  ref: mt:26:41
  title:
    ru: Бодрствующее сердце
    en: A Watchful Heart
    es: Un Corazón Vigilante
    uk: Пильне серце
  text:
    ru: Отец Небесный, помоги мне быть духовно бодрым и внимательным. Не позволяй мне становиться
      равнодушным к Твоему голосу или беспечным в своей вере. Укрепляй мое сердце и помогай
      ежедневно искать Тебя. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be spiritually awake and attentive. Do not let me become
      indifferent to Your voice or careless in my faith. Strengthen my heart and help me to
      seek You each day. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a estar espiritualmente despierto y atento. No permitas que
      me vuelva indiferente a Tu voz ni descuidado en mi fe. Fortalece mi corazón y ayúdame
      a buscarte cada día. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені бути духовно пильним і уважним. Не дозволь мені ставати
      байдужим до Твого голосу чи безтурботним у своїй вірі. Зміцнюй моє серце й допомагай
      щодня шукати Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_227
  ref: 1co:10:13
  title:
    ru: Победа над искушением
    en: Victory over Temptation
    es: Victoria sobre la Tentación
    uk: Перемога над спокусою
  text:
    ru: Господи, Ты знаешь мои слабости и борьбу. Помоги мне распознавать искушения и вовремя
      удаляться от того, что может привести ко греху. Дай мне силы выбирать послушание Тебе
      и хранить чистоту сердца. Во имя Иисуса Христа. Аминь.
    en: Lord, You know my weaknesses and my struggle. Help me to recognize temptations and
      to turn away in time from what could lead to sin. Give me strength to choose obedience
      to You and to keep purity of heart. In the name of Jesus Christ. Amen.
    es: Señor, Tú conoces mis debilidades y mi lucha. Ayúdame a reconocer las tentaciones
      y a apartarme a tiempo de lo que podría llevarme al pecado. Dame fuerzas para escoger
      la obediencia a Ti y para guardar la pureza del corazón. En el nombre de Jesucristo.
      Amén.
    uk: Господи, Ти знаєш мої слабкості й боротьбу. Допоможи мені розпізнавати спокуси й вчасно
      віддалятися від того, що може призвести до гріха. Дай мені сили обирати послух Тобі
      й берегти чистоту серця. В ім'я Ісуса Христа. Амінь.
- id: day_228
  ref: rm:6:14
  title:
    ru: Сила противостоять греху
    en: Strength to Resist Sin
    es: Fuerza para Resistir el Pecado
    uk: Сила протистояти гріху
  text:
    ru: Отец Небесный, помоги мне не мириться с грехом в своей жизни. Показывай мне все, что
      огорчает Тебя, и давай мужество оставлять это. Укрепляй меня Своей благодатью и веди
      по пути праведности. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me not to make peace with sin in my life. Show me everything
      that grieves You and give me the courage to forsake it. Strengthen me by Your grace
      and lead me on the path of righteousness. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a no hacer las paces con el pecado en mi vida. Muéstrame
      todo lo que te entristece y dame el valor de dejarlo. Fortaléceme con Tu gracia y guíame
      por el camino de la justicia. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені не миритися з гріхом у своєму житті. Показуй мені все,
      що засмучує Тебе, і давай мужність залишати це. Зміцнюй мене Своєю благодаттю й веди
      дорогою праведності. В ім'я Ісуса Христа. Амінь.
- id: day_229
  ref: ph:4:8
  title:
    ru: Чистота мыслей
    en: Purity of Mind
    es: Pureza de Pensamiento
    uk: Чистота думок
  text:
    ru: Господи, сохрани мой разум от всего нечистого и бесполезного. Помоги мне наполнять
      свои мысли тем, что истинно, справедливо и достойно похвалы. Пусть мой внутренний мир
      принадлежит Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, keep my mind from everything unclean and worthless. Help me to fill my thoughts
      with what is true, just, and worthy of praise. May my inner world belong to You. In
      the name of Jesus Christ. Amen.
    es: Señor, guarda mi mente de todo lo impuro e inútil. Ayúdame a llenar mis pensamientos
      de lo que es verdadero, justo y digno de alabanza. Que mi mundo interior te pertenezca.
      En el nombre de Jesucristo. Amén.
    uk: Господи, збережи мій розум від усього нечистого й марного. Допоможи мені наповнювати
      свої думки тим, що істинне, справедливе й гідне похвали. Нехай мій внутрішній світ належить
      Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_230
  ref: eph:6:11
  title:
    ru: Божье оружие
    en: God's Armor
    es: La Armadura de Dios
    uk: Божа зброя
  text:
    ru: Отец Небесный, помоги мне ежедневно облекаться во всеоружие Божье. Укрепляй мою веру,
      наполняй истиной и помогай твердо стоять против всякого зла. Пусть Твое Слово будет
      моим оружием и защитой. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me each day to put on the whole armor of God. Strengthen my
      faith, fill me with truth, and help me to stand firm against all evil. May Your Word
      be my weapon and my defense. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame cada día a vestirme con toda la armadura de Dios. Fortalece
      mi fe, lléname de verdad y ayúdame a mantenerme firme contra todo mal. Que Tu Palabra
      sea mi arma y mi defensa. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені щодня вдягатися в усю Божу зброю. Зміцнюй мою віру, наповнюй
      істиною й допомагай твердо стояти проти всякого зла. Нехай Твоє Слово буде моєю зброєю
      й захистом. В ім'я Ісуса Христа. Амінь.
- id: day_231
  ref: jm:4:6
  title:
    ru: Победа над гордостью
    en: Victory over Pride
    es: Victoria sobre el Orgullo
    uk: Перемога над гордістю
  text:
    ru: Господи, сохрани мое сердце от гордости и самонадеянности. Помоги мне помнить, что
      все доброе приходит от Тебя. Научи меня ходить в смирении и полностью зависеть от Твоей
      благодати. Во имя Иисуса Христа. Аминь.
    en: Lord, keep my heart from pride and self-reliance. Help me to remember that everything
      good comes from You. Teach me to walk in humility and to depend wholly on Your grace.
      In the name of Jesus Christ. Amen.
    es: Señor, guarda mi corazón del orgullo y la autosuficiencia. Ayúdame a recordar que
      todo lo bueno viene de Ti. Enséñame a andar en humildad y a depender por completo de
      Tu gracia. En el nombre de Jesucristo. Amén.
    uk: Господи, збережи моє серце від гордості й самовпевненості. Допоможи мені пам'ятати,
      що все добре приходить від Тебе. Навчи мене ходити в смиренні й цілком залежати від
      Твоєї благодаті. В ім'я Ісуса Христа. Амінь.
- id: day_232
  ref: prv:4:23
  title:
    ru: Защита сердца
    en: Guarding the Heart
    es: Guardar el Corazón
    uk: Захист серця
  text:
    ru: Отец Небесный, помоги мне хранить свое сердце, потому что из него источники жизни.
      Не позволяй обидам, зависти, гневу или нечистым желаниям укореняться во мне. Наполняй
      меня Своим миром и любовью. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to guard my heart, for out of it flow the springs of life.
      Do not let offenses, envy, anger, or impure desires take root in me. Fill me with Your
      peace and love. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a guardar mi corazón, porque de él brotan los manantiales
      de la vida. No permitas que las ofensas, la envidia, la ira o los deseos impuros echen
      raíz en mí. Lléname de Tu paz y de Tu amor. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені берегти своє серце, бо з нього джерела життя. Не дозволь
      образам, заздрості, гніву чи нечистим бажанням укорінятися в мені. Наповнюй мене Своїм
      миром і любов'ю. В ім'я Ісуса Христа. Амінь.
- id: day_233
  ref: 1pe:5:7
  title:
    ru: Освобождение от тревоги
    en: Freedom from Anxiety
    es: Libertad de la Ansiedad
    uk: Звільнення від тривоги
  text:
    ru: Господи, когда беспокойство пытается овладеть мной, помоги мне обращаться к Тебе прежде,
      чем к своим страхам. Напоминай мне, что Ты держишь мою жизнь в Своих руках и заботишься
      обо мне. Во имя Иисуса Христа. Аминь.
    en: Lord, when worry tries to take hold of me, help me to turn to You before turning to
      my fears. Remind me that You hold my life in Your hands and care for me. In the name
      of Jesus Christ. Amen.
    es: Señor, cuando la preocupación trate de apoderarse de mí, ayúdame a acudir a Ti antes
      que a mis temores. Recuérdame que sostienes mi vida en Tus manos y cuidas de mí. En
      el nombre de Jesucristo. Amén.
    uk: Господи, коли неспокій намагається заволодіти мною, допоможи мені звертатися до Тебе
      перш, ніж до своїх страхів. Нагадуй мені, що Ти тримаєш моє життя у Своїх руках і дбаєш
      про мене. В ім'я Ісуса Христа. Амінь.
- id: day_234
  ref: 1co:16:13
  title:
    ru: Твердость в вере
    en: Firmness in Faith
    es: Firmeza en la Fe
    uk: Твердість у вірі
  text:
    ru: Отец Небесный, укрепляй мою веру среди испытаний и искушений. Помоги мне твердо держаться
      Твоего Слова и не уклоняться от истины. Пусть мое основание всегда будет во Христе.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, strengthen my faith amid trials and temptations. Help me to hold
      firmly to Your Word and not to turn aside from the truth. May my foundation always be
      in Christ. In the name of Jesus Christ. Amen.
    es: Padre Celestial, fortalece mi fe en medio de las pruebas y las tentaciones. Ayúdame
      a aferrarme firmemente a Tu Palabra y a no apartarme de la verdad. Que mi fundamento
      esté siempre en Cristo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, зміцнюй мою віру серед випробувань і спокус. Допоможи мені твердо триматися
      Твого Слова й не ухилятися від істини. Нехай моя основа завжди буде у Христі. В ім'я
      Ісуса Христа. Амінь.
- id: day_235
  ref: jm:1:19
  title:
    ru: Победа над гневом
    en: Victory over Anger
    es: Victoria sobre la Ira
    uk: Перемога над гнівом
  text:
    ru: Господи, помоги мне владеть своими эмоциями и не поддаваться раздражению. Научи меня
      отвечать с мудростью и кротостью даже тогда, когда меня провоцируют. Пусть Твой мир
      управляет моим сердцем. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to master my emotions and not to give in to irritation. Teach me to
      respond with wisdom and gentleness even when I am provoked. May Your peace rule my heart.
      In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a dominar mis emociones y a no ceder a la irritación. Enséñame a responder
      con sabiduría y mansedumbre aun cuando me provoquen. Que Tu paz gobierne mi corazón.
      En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені володіти своїми емоціями й не піддаватися роздратуванню. Навчи
      мене відповідати з мудрістю й лагідністю навіть тоді, коли мене провокують. Нехай Твій
      мир керує моїм серцем. В ім'я Ісуса Христа. Амінь.
- id: day_236
  ref: 1co:13:4
  title:
    ru: Свобода от зависти
    en: Freedom from Envy
    es: Libertad de la Envidia
    uk: Свобода від заздрості
  text:
    ru: Отец Небесный, сохрани меня от зависти и сравнения себя с другими. Помоги радоваться
      благословениям, которые Ты даешь людям вокруг меня, и быть благодарным за то, что Ты
      даровал мне. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, keep me from envy and from comparing myself with others. Help me
      to rejoice in the blessings You give to those around me and to be thankful for what
      You have given me. In the name of Jesus Christ. Amen.
    es: Padre Celestial, guárdame de la envidia y de compararme con los demás. Ayúdame a alegrarme
      por las bendiciones que das a quienes me rodean y a ser agradecido por lo que me has
      dado. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, збережи мене від заздрості й порівняння себе з іншими. Допоможи радіти
      благословенням, які Ти даєш людям навколо мене, і бути вдячним за те, що Ти дарував
      мені. В ім'я Ісуса Христа. Амінь.
- id: day_237
  ref: re:2:10
  title:
    ru: Верность в борьбе
    en: Faithfulness in the Struggle
    es: Fidelidad en la Lucha
    uk: Вірність у боротьбі
  text:
    ru: Господи, когда духовная борьба становится тяжелой, помоги мне не опускать руки. Напоминай
      мне, что Ты уже одержал победу через Иисуса Христа. Укрепляй меня и учи доверять Тебе
      до конца. Во имя Иисуса Христа. Аминь.
    en: Lord, when the spiritual struggle grows heavy, help me not to drop my hands. Remind
      me that You have already won the victory through Jesus Christ. Strengthen me and teach
      me to trust You to the end. In the name of Jesus Christ. Amen.
    es: Señor, cuando la lucha espiritual se vuelva pesada, ayúdame a no dejar caer las manos.
      Recuérdame que Tú ya has obtenido la victoria por medio de Jesucristo. Fortaléceme y
      enséñame a confiar en Ti hasta el fin. En el nombre de Jesucristo. Amén.
    uk: Господи, коли духовна боротьба стає важкою, допоможи мені не опускати рук. Нагадуй
      мені, що Ти вже здобув перемогу через Ісуса Христа. Зміцнюй мене й навчи довіряти Тобі
      до кінця. В ім'я Ісуса Христа. Амінь.
- id: day_238
  ref: jo:14:15
  title:
    ru: Послушание Богу
    en: Obedience to God
    es: Obediencia a Dios
    uk: Послух Богові
  text:
    ru: Отец Небесный, помоги мне выбирать послушание даже тогда, когда это требует жертвы
      или отказа от собственных желаний. Научи меня доверять Твоей мудрости больше, чем своему
      пониманию. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to choose obedience even when it requires sacrifice or the
      giving up of my own desires. Teach me to trust Your wisdom more than my own understanding.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a escoger la obediencia aun cuando exija sacrificio o la
      renuncia a mis propios deseos. Enséñame a confiar en Tu sabiduría más que en mi propia
      prudencia. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені обирати послух навіть тоді, коли це вимагає жертви чи
      відмови від власних бажань. Навчи мене довіряти Твоїй мудрості більше, ніж своєму розумінню.
      В ім'я Ісуса Христа. Амінь.
- id: day_239
  ref: ps:119:11
  title:
    ru: Победа через Слово Божье
    en: Victory through God's Word
    es: Victoria por la Palabra de Dios
    uk: Перемога через Слово Боже
  text:
    ru: Господи, помоги мне любить и изучать Твое Слово. Пусть оно станет моим руководством,
      защитой и источником силы. Напоминай мне истины Писания в моменты искушений и испытаний.
      Во имя Иисуса Христа. Аминь.
    en: Lord, help me to love and to study Your Word. May it become my guide, my defense,
      and my source of strength. Remind me of the truths of Scripture in moments of temptation
      and trial. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a amar y a estudiar Tu Palabra. Que ella sea mi guía, mi defensa y
      mi fuente de fuerza. Recuérdame las verdades de las Escrituras en los momentos de tentación
      y prueba. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені любити й вивчати Твоє Слово. Нехай воно стане моїм провідником,
      захистом і джерелом сили. Нагадуй мені істини Писання в моменти спокус і випробувань.
      В ім'я Ісуса Христа. Амінь.
- id: day_240
  ref: 1co:15:57
  title:
    ru: Благодарность за победу во Христе
    en: Thanks for Victory in Christ
    es: Gratitud por la Victoria en Cristo
    uk: Подяка за перемогу у Христі
  text:
    ru: Отец Небесный, благодарю Тебя за победу, которую Ты даровал через Иисуса Христа. Даже
      когда борьба продолжается, я знаю, что моя надежда и сила находятся в Тебе. Помоги мне
      жить в этой уверенности каждый день. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the victory You have given through Jesus Christ. Even
      when the struggle continues, I know that my hope and strength are in You. Help me to
      live in this assurance each day. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la victoria que has dado por medio de Jesucristo.
      Aun cuando la lucha continúe, sé que mi esperanza y mi fuerza están en Ti. Ayúdame a
      vivir en esa certeza cada día. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за перемогу, яку Ти дарував через Ісуса Христа. Навіть коли
      боротьба триває, я знаю, що моя надія й сила перебувають у Тобі. Допоможи мені жити
      в цій упевненості щодня. В ім'я Ісуса Христа. Амінь.
- id: day_241
  ref: jm:4:8
  title:
    ru: Жажда общения с Богом
    en: Longing for Fellowship with God
    es: Anhelo de Comunión con Dios
    uk: Спрага за спілкуванням з Богом
  text:
    ru: Отец Небесный, благодарю Тебя за возможность приходить к Тебе в молитве. Разожги во
      мне желание искать Тебя не только в трудностях, но каждый день. Пусть общение с Тобой
      станет моей радостью и потребностью. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the privilege of coming to You in prayer. Kindle in
      me a desire to seek You not only in hardship but every day. May fellowship with You
      become my joy and my need. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por el privilegio de acudir a Ti en oración. Enciende
      en mí el deseo de buscarte no solo en las dificultades, sino cada día. Que la comunión
      contigo llegue a ser mi gozo y mi necesidad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за можливість приходити до Тебе в молитві. Розпали в мені
      бажання шукати Тебе не лише в труднощах, а щодня. Нехай спілкування з Тобою стане моєю
      радістю й потребою. В ім'я Ісуса Христа. Амінь.
- id: day_242
  ref: 1ts:5:17
  title:
    ru: Верность в молитве
    en: Faithfulness in Prayer
    es: Fidelidad en la Oración
    uk: Вірність у молитві
  text:
    ru: Господи, помоги мне быть постоянным в молитве. Не позволяй суете и заботам заглушать
      мое общение с Тобой. Научи меня искать Твое лицо ежедневно и доверять Тебе все обстоятельства
      жизни. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be constant in prayer. Do not let busyness and cares drown out my
      fellowship with You. Teach me to seek Your face daily and to entrust to You all the
      circumstances of life. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a ser constante en la oración. No permitas que el ajetreo y los afanes
      ahoguen mi comunión contigo. Enséñame a buscar Tu rostro cada día y a confiarte todas
      las circunstancias de la vida. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бути постійним у молитві. Не дозволь метушні й турботам заглушувати
      моє спілкування з Тобою. Навчи мене шукати Твого обличчя щодня й довіряти Тобі всі обставини
      життя. В ім'я Ісуса Христа. Амінь.
- id: day_243
  ref: 1ts:5:18
  title:
    ru: Благодарственное сердце
    en: A Thankful Heart
    es: Un Corazón Agradecido
    uk: Вдячне серце
  text:
    ru: Отец Небесный, благодарю Тебя за все благословения, которыми Ты наполняешь мою жизнь.
      Помоги мне замечать Твою доброту каждый день и не принимать Твои дары как должное. Пусть
      благодарность всегда живет в моем сердце. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for all the blessings with which You fill my life. Help
      me to notice Your goodness each day and not to take Your gifts for granted. May gratitude
      always live in my heart. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por todas las bendiciones con que llenas mi vida.
      Ayúdame a notar Tu bondad cada día y a no dar por sentados Tus dones. Que la gratitud
      habite siempre en mi corazón. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за всі благословення, якими Ти наповнюєш моє життя. Допоможи
      мені помічати Твою доброту щодня й не приймати Твої дари як належне. Нехай вдячність
      завжди живе в моєму серці. В ім'я Ісуса Христа. Амінь.
- id: day_244
  ref: ps:62:8
  title:
    ru: Искренность перед Богом
    en: Sincerity before God
    es: Sinceridad delante de Dios
    uk: Щирість перед Богом
  text:
    ru: Господи, помоги мне быть искренним в молитве. Научи открывать перед Тобой свое сердце
      без притворства и страха. Благодарю Тебя за то, что Ты знаешь мои мысли и понимаешь
      мои переживания лучше меня самого. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to be sincere in prayer. Teach me to open my heart before You without
      pretense or fear. Thank You that You know my thoughts and understand my feelings better
      than I do myself. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a ser sincero en la oración. Enséñame a abrir mi corazón delante de
      Ti sin fingimiento ni temor. Te doy gracias porque conoces mis pensamientos y comprendes
      mis sentimientos mejor que yo mismo. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені бути щирим у молитві. Навчи відкривати перед Тобою своє серце
      без удавання й страху. Дякую Тобі за те, що Ти знаєш мої думки й розумієш мої переживання
      краще за мене самого. В ім'я Ісуса Христа. Амінь.
- id: day_245
  ref: ps:29:2
  title:
    ru: Поклонение Господу
    en: Worship of the Lord
    es: Adoración al Señor
    uk: Поклоніння Господеві
  text:
    ru: Отец Небесный, Ты достоин всей славы, чести и поклонения. Помоги мне прославлять Тебя
      не только словами, но и своей жизнью. Пусть мое сердце будет наполнено благоговением
      перед Тобой и радостью от общения с Тобой. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, You are worthy of all glory, honor, and worship. Help me to glorify
      You not only with words but with my life. May my heart be filled with reverence for
      You and with the joy of fellowship with You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, Tú eres digno de toda gloria, honra y adoración. Ayúdame a glorificarte
      no solo con palabras, sino con mi vida. Que mi corazón se llene de reverencia hacia
      Ti y del gozo de la comunión contigo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, Ти достойний усієї слави, честі й поклоніння. Допоможи мені прославляти
      Тебе не лише словами, а й своїм життям. Нехай моє серце буде сповнене благоговіння перед
      Тобою й радості від спілкування з Тобою. В ім'я Ісуса Христа. Амінь.
- id: day_246
  ref: mt:6:10
  title:
    ru: Доверие Божьей воле
    en: Trust in God's Will
    es: Confianza en la Voluntad de Dios
    uk: Довіра Божій волі
  text:
    ru: Господи, помоги мне доверять Твоей воле даже тогда, когда я не понимаю Твоих путей.
      Научи меня искать не только ответы на свои просьбы, но прежде всего Твое руководство.
      Пусть исполнится в моей жизни Твоя добрая воля. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to trust Your will even when I do not understand Your ways. Teach me
      to seek not only answers to my requests but above all Your guidance. May Your good will
      be done in my life. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a confiar en Tu voluntad aun cuando no entienda Tus caminos. Enséñame
      a buscar no solo respuestas a mis peticiones, sino ante todo Tu dirección. Que se haga
      en mi vida Tu buena voluntad. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені довіряти Твоїй волі навіть тоді, коли я не розумію Твоїх доріг.
      Навчи мене шукати не лише відповіді на свої прохання, а передусім Твоє керівництво.
      Нехай у моєму житті здійсниться Твоя добра воля. В ім'я Ісуса Христа. Амінь.
- id: day_247
  ref: jo:10:27
  title:
    ru: Слышать Божий голос
    en: Hearing God's Voice
    es: Escuchar la Voz de Dios
    uk: Чути Божий голос
  text:
    ru: Отец Небесный, помоги мне быть внимательным к Твоему голосу. Через Твое Слово, обстоятельства
      и наставления направляй меня на правильный путь. Сделай мое сердце послушным и открытым
      для Твоей истины. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be attentive to Your voice. Through Your Word, circumstances,
      and instruction, direct me onto the right path. Make my heart obedient and open to Your
      truth. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a estar atento a Tu voz. Por medio de Tu Palabra, las circunstancias
      y la enseñanza, guíame por el camino correcto. Haz mi corazón obediente y abierto a
      Tu verdad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені бути уважним до Твого голосу. Через Твоє Слово, обставини
      й настанови скеровуй мене на правильний шлях. Зроби моє серце слухняним і відкритим
      для Твоєї істини. В ім'я Ісуса Христа. Амінь.
- id: day_248
  ref: ps:16:11
  title:
    ru: Радость Божьего присутствия
    en: The Joy of God's Presence
    es: El Gozo de la Presencia de Dios
    uk: Радість Божої присутності
  text:
    ru: Господи, благодарю Тебя за радость, которую дает общение с Тобой. Когда мир предлагает
      временные удовольствия, напоминай мне, что истинная полнота радости находится только
      в Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for the joy that fellowship with You brings. When the world offers
      fleeting pleasures, remind me that the true fullness of joy is found only in You. In
      the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por el gozo que trae la comunión contigo. Cuando el mundo ofrezca
      placeres pasajeros, recuérdame que la verdadera plenitud de gozo se halla solo en Ti.
      En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за радість, яку дає спілкування з Тобою. Коли світ пропонує тимчасові
      втіхи, нагадуй мені, що справжня повнота радості знаходиться лише в Тобі. В ім'я Ісуса
      Христа. Амінь.
- id: day_249
  ref: ps:63:1
  title:
    ru: Утренний поиск Бога
    en: Seeking God in the Morning
    es: Buscar a Dios por la Mañana
    uk: Ранковий пошук Бога
  text:
    ru: Отец Небесный, помоги мне начинать каждый день с поиска Тебя. Прежде чем обратиться
      к своим заботам и делам, направь мое сердце к молитве и размышлению над Твоим Словом.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to begin each day by seeking You. Before I turn to my cares
      and tasks, direct my heart to prayer and to meditation on Your Word. In the name of
      Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a comenzar cada día buscándote. Antes de volverme a mis afanes
      y tareas, dirige mi corazón a la oración y a la meditación en Tu Palabra. En el nombre
      de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені починати кожен день із пошуку Тебе. Перш ніж звернутися
      до своїх турбот і справ, скеруй моє серце до молитви й роздумів над Твоїм Словом. В
      ім'я Ісуса Христа. Амінь.
- id: day_250
  ref: ps:27:14
  title:
    ru: Терпение в ожидании ответа
    en: Patience in Awaiting an Answer
    es: Paciencia al Esperar la Respuesta
    uk: Терпіння в очікуванні відповіді
  text:
    ru: Господи, когда ответ на молитву задерживается, помоги мне не терять веры. Научи меня
      ожидать Тебя с терпением и надеждой. Напоминай мне, что Твои сроки совершенны и Твои
      решения всегда мудры. Во имя Иисуса Христа. Аминь.
    en: Lord, when the answer to prayer is delayed, help me not to lose faith. Teach me to
      wait on You with patience and hope. Remind me that Your timing is perfect and Your decisions
      are always wise. In the name of Jesus Christ. Amen.
    es: Señor, cuando la respuesta a la oración se demore, ayúdame a no perder la fe. Enséñame
      a esperar en Ti con paciencia y esperanza. Recuérdame que Tu tiempo es perfecto y Tus
      decisiones siempre son sabias. En el nombre de Jesucristo. Amén.
    uk: Господи, коли відповідь на молитву затримується, допоможи мені не втрачати віри. Навчи
      мене очікувати на Тебе з терпінням і надією. Нагадуй мені, що Твої терміни досконалі,
      а Твої рішення завжди мудрі. В ім'я Ісуса Христа. Амінь.
- id: day_251
  ref: jr:29:13
  title:
    ru: Сердце, ищущее Бога
    en: A Heart That Seeks God
    es: Un Corazón que Busca a Dios
    uk: Серце, що шукає Бога
  text:
    ru: Отец Небесный, не позволь мне довольствоваться поверхностной верой. Разожги во мне
      стремление познавать Тебя глубже, любить Тебя сильнее и искать Тебя всем сердцем. Во
      имя Иисуса Христа. Аминь.
    en: Heavenly Father, do not let me be content with a shallow faith. Kindle in me a longing
      to know You more deeply, to love You more fervently, and to seek You with all my heart.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, no permitas que me conforme con una fe superficial. Enciende en mí
      el anhelo de conocerte más hondamente, de amarte con más fervor y de buscarte con todo
      mi corazón. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, не дозволь мені вдовольнятися поверховою вірою. Розпали в мені прагнення
      пізнавати Тебе глибше, любити Тебе палкіше й шукати Тебе всім серцем. В ім'я Ісуса Христа.
      Амінь.
- id: day_252
  ref: ph:4:7
  title:
    ru: Мир в молитве
    en: Peace in Prayer
    es: Paz en la Oración
    uk: Мир у молитві
  text:
    ru: Господи, когда тревоги наполняют мое сердце, помоги мне приносить их к Тебе. Благодарю
      Тебя за мир, который приходит через молитву и доверие Тебе. Успокой мое сердце Своим
      присутствием. Во имя Иисуса Христа. Аминь.
    en: Lord, when anxieties fill my heart, help me to bring them to You. Thank You for the
      peace that comes through prayer and trust in You. Calm my heart with Your presence.
      In the name of Jesus Christ. Amen.
    es: Señor, cuando las inquietudes llenen mi corazón, ayúdame a traerlas a Ti. Te doy gracias
      por la paz que viene por medio de la oración y de la confianza en Ti. Serena mi corazón
      con Tu presencia. En el nombre de Jesucristo. Amén.
    uk: Господи, коли тривоги наповнюють моє серце, допоможи мені приносити їх до Тебе. Дякую
      Тобі за мир, який приходить через молитву й довіру до Тебе. Заспокой моє серце Своєю
      присутністю. В ім'я Ісуса Христа. Амінь.
- id: day_253
  ref: hb:4:16
  title:
    ru: Благодарность за доступ к Богу
    en: Thanks for Access to God
    es: Gratitud por el Acceso a Dios
    uk: Подяка за доступ до Бога
  text:
    ru: Отец Небесный, благодарю Тебя за то, что через Иисуса Христа я могу приходить к Тебе
      с дерзновением. Спасибо за Твою любовь и за то, что двери Твоей милости всегда открыты
      для Твоих детей. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that through Jesus Christ I can come to You with boldness.
      Thank You for Your love and that the doors of Your mercy are always open to Your children.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias porque por medio de Jesucristo puedo acercarme a Ti
      con confianza. Gracias por Tu amor y porque las puertas de Tu misericordia están siempre
      abiertas para Tus hijos. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те, що через Ісуса Христа я можу приходити до Тебе з
      дерзновенням. Дякую за Твою любов і за те, що двері Твоєї милості завжди відчинені для
      Твоїх дітей. В ім'я Ісуса Христа. Амінь.
- id: day_254
  ref: jo:15:4
  title:
    ru: Постоянство в общении с Богом
    en: Constancy in Fellowship with God
    es: Constancia en la Comunión con Dios
    uk: Постійність у спілкуванні з Богом
  text:
    ru: Господи, помоги мне не искать Тебя лишь во время нужды. Научи меня пребывать в общении
      с Тобой ежедневно, делиться с Тобой радостями и трудностями, доверять Тебе каждый шаг
      своей жизни. Во имя Иисуса Христа. Аминь.
    en: Lord, help me not to seek You only in time of need. Teach me to abide in fellowship
      with You daily, to share with You my joys and hardships, and to trust You with every
      step of my life. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a no buscarte solo en tiempo de necesidad. Enséñame a permanecer en
      comunión contigo cada día, a compartir contigo mis alegrías y dificultades, y a confiarte
      cada paso de mi vida. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені не шукати Тебе лише під час потреби. Навчи мене перебувати
      у спілкуванні з Тобою щодня, ділитися з Тобою радощами й труднощами, довіряти Тобі кожен
      крок свого життя. В ім'я Ісуса Христа. Амінь.
- id: day_255
  ref: jm:4:8
  title:
    ru: Близость с Господом
    en: Closeness with the Lord
    es: Cercanía con el Señor
    uk: Близькість із Господом
  text:
    ru: Отец Небесный, благодарю Тебя за величайшую привилегию — знать Тебя и быть Твоим ребенком.
      Помоги мне возрастать в любви к Тебе и жить в осознании Твоего присутствия. Пусть моя
      жизнь будет наполнена близким общением с Тобой каждый день. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the greatest privilege — to know You and to be Your
      child. Help me to grow in love for You and to live aware of Your presence. May my life
      be filled with close fellowship with You each day. In the name of Jesus Christ. Amen.
    es: 'Padre Celestial, te doy gracias por el mayor privilegio: conocerte y ser Tu hijo.
      Ayúdame a crecer en amor hacia Ti y a vivir consciente de Tu presencia. Que mi vida
      se llene de comunión íntima contigo cada día. En el nombre de Jesucristo. Amén.'
    uk: Отче Небесний, дякую Тобі за найбільший привілей — знати Тебе й бути Твоєю дитиною.
      Допоможи мені зростати в любові до Тебе й жити в усвідомленні Твоєї присутності. Нехай
      моє життя буде сповнене близького спілкування з Тобою щодня. В ім'я Ісуса Христа. Амінь.
- id: day_256
  ref: ps:34:8
  title:
    ru: Благодарность за Божью доброту
    en: Thanks for God's Goodness
    es: Gratitud por la Bondad de Dios
    uk: Подяка за Божу доброту
  text:
    ru: Отец Небесный, благодарю Тебя за Твою неизменную доброту. Каждый день я вижу следы
      Твоей заботы и любви в своей жизни. Помоги мне не забывать Твои благодеяния и хранить
      благодарное сердце независимо от обстоятельств. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your unchanging goodness. Every day I see the marks
      of Your care and love in my life. Help me not to forget Your kindnesses and to keep
      a grateful heart regardless of circumstances. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu bondad inmutable. Cada día veo las huellas
      de Tu cuidado y de Tu amor en mi vida. Ayúdame a no olvidar Tus bondades y a guardar
      un corazón agradecido sin importar las circunstancias. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твою незмінну доброту. Щодня я бачу сліди Твоєї турботи
      й любові у своєму житті. Допоможи мені не забувати Твоїх добродійств і зберігати вдячне
      серце незалежно від обставин. В ім'я Ісуса Христа. Амінь.
- id: day_257
  ref: ps:34:1
  title:
    ru: Хвала среди обстоятельств
    en: Praise amid Circumstances
    es: Alabanza en Medio de las Circunstancias
    uk: Хвала серед обставин
  text:
    ru: Господи, я хочу прославлять Тебя не только в радостные дни, но и во время испытаний.
      Помоги мне помнить, что Ты достоин хвалы всегда. Пусть мое сердце будет наполнено благодарностью
      и доверием к Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, I want to praise You not only on joyful days but also in times of trial. Help
      me to remember that You are worthy of praise always. May my heart be filled with gratitude
      and trust in You. In the name of Jesus Christ. Amen.
    es: Señor, quiero alabarte no solo en los días alegres, sino también en los tiempos de
      prueba. Ayúdame a recordar que eres digno de alabanza siempre. Que mi corazón se llene
      de gratitud y de confianza en Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, я хочу прославляти Тебе не лише в радісні дні, а й під час випробувань. Допоможи
      мені пам'ятати, що Ти достойний хвали завжди. Нехай моє серце буде сповнене вдячності
      й довіри до Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_258
  ref: 2co:9:15
  title:
    ru: Благодарность за спасение
    en: Thanks for Salvation
    es: Gratitud por la Salvación
    uk: Подяка за спасіння
  text:
    ru: Отец Небесный, благодарю Тебя за величайший дар — спасение через Иисуса Христа. Спасибо
      за прощение грехов, новую жизнь и надежду вечности. Помоги мне никогда не терять удивления
      перед Твоей благодатью. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the greatest gift — salvation through Jesus Christ.
      Thank You for the forgiveness of sins, new life, and the hope of eternity. Help me never
      to lose my wonder at Your grace. In the name of Jesus Christ. Amen.
    es: 'Padre Celestial, te doy gracias por el mayor regalo: la salvación por medio de Jesucristo.
      Gracias por el perdón de los pecados, la vida nueva y la esperanza de la eternidad.
      Ayúdame a no perder nunca el asombro ante Tu gracia. En el nombre de Jesucristo. Amén.'
    uk: Отче Небесний, дякую Тобі за найбільший дар — спасіння через Ісуса Христа. Дякую за
      прощення гріхів, нове життя й надію вічності. Допоможи мені ніколи не втрачати подиву
      перед Твоєю благодаттю. В ім'я Ісуса Христа. Амінь.
- id: day_259
  ref: jo:4:24
  title:
    ru: Поклонение сердцем
    en: Worship from the Heart
    es: Adoración de Corazón
    uk: Поклоніння серцем
  text:
    ru: Господи, научи меня поклоняться Тебе не только словами, но всем сердцем. Пусть моя
      жизнь, мои мысли и поступки прославляют Тебя. Помоги мне жить с осознанием Твоего величия
      и святости. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to worship You not only with words but with all my heart. May my life,
      my thoughts, and my actions glorify You. Help me to live aware of Your majesty and holiness.
      In the name of Jesus Christ. Amen.
    es: Señor, enséñame a adorarte no solo con palabras, sino con todo mi corazón. Que mi
      vida, mis pensamientos y mis actos te glorifiquen. Ayúdame a vivir consciente de Tu
      majestad y santidad. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене поклонятися Тобі не лише словами, а всім серцем. Нехай моє життя,
      мої думки й вчинки прославляють Тебе. Допоможи мені жити з усвідомленням Твоєї величі
      й святості. В ім'я Ісуса Христа. Амінь.
- id: day_260
  ref: ps:118:24
  title:
    ru: Благодарность за каждый день
    en: Thanks for Every Day
    es: Gratitud por Cada Día
    uk: Подяка за кожен день
  text:
    ru: Отец Небесный, благодарю Тебя за сегодняшний день. Спасибо за жизнь, здоровье, пищу,
      кров и множество благословений, которые я часто принимаю как должное. Открой мои глаза
      видеть Твою руку в самых простых вещах. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for this day. Thank You for life, health, food, shelter,
      and the many blessings I often take for granted. Open my eyes to see Your hand in the
      simplest things. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por el día de hoy. Gracias por la vida, la salud,
      el alimento, el techo y las muchas bendiciones que a menudo doy por sentadas. Abre mis
      ojos para ver Tu mano en las cosas más sencillas. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за сьогоднішній день. Дякую за життя, здоров'я, їжу, дах
      і безліч благословень, які я часто приймаю як належне. Відкрий мої очі бачити Твою руку
      в найпростіших речах. В ім'я Ісуса Христа. Амінь.
- id: day_261
  ref: ps:145:3
  title:
    ru: Господь достоин славы
    en: The Lord Is Worthy of Glory
    es: El Señor Es Digno de Gloria
    uk: Господь достойний слави
  text:
    ru: Господи, Ты достоин всей славы, чести и поклонения. Благодарю Тебя за Твою мудрость,
      силу и любовь. Помоги мне жить так, чтобы моя жизнь указывала на Тебя и прославляла
      Твое имя. Во имя Иисуса Христа. Аминь.
    en: Lord, You are worthy of all glory, honor, and worship. Thank You for Your wisdom,
      power, and love. Help me to live so that my life points to You and glorifies Your name.
      In the name of Jesus Christ. Amen.
    es: Señor, Tú eres digno de toda gloria, honra y adoración. Gracias por Tu sabiduría,
      Tu poder y Tu amor. Ayúdame a vivir de modo que mi vida señale hacia Ti y glorifique
      Tu nombre. En el nombre de Jesucristo. Amén.
    uk: Господи, Ти достойний усієї слави, честі й поклоніння. Дякую Тобі за Твою мудрість,
      силу й любов. Допоможи мені жити так, щоб моє життя вказувало на Тебе й прославляло
      Твоє ім'я. В ім'я Ісуса Христа. Амінь.
- id: day_262
  ref: ps:103:8
  title:
    ru: Благодарность за милость
    en: Thanks for Mercy
    es: Gratitud por la Misericordia
    uk: Подяка за милість
  text:
    ru: Отец Небесный, благодарю Тебя за милость, которую Ты проявляешь ко мне каждый день.
      Несмотря на мои ошибки и слабости, Ты продолжаешь любить и поддерживать меня. Помоги
      мне также проявлять милость к другим людям. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the mercy You show me each day. Despite my mistakes
      and weaknesses, You keep loving and upholding me. Help me also to show mercy to other
      people. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la misericordia que me muestras cada día. A pesar
      de mis errores y mis debilidades, sigues amándome y sosteniéndome. Ayúdame a mostrar
      también misericordia a las demás personas. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за милість, яку Ти виявляєш до мене щодня. Попри мої помилки
      й слабкості, Ти продовжуєш любити й підтримувати мене. Допоможи мені також виявляти
      милість до інших людей. В ім'я Ісуса Христа. Амінь.
- id: day_263
  ref: ph:4:4
  title:
    ru: Радость в Господе
    en: Joy in the Lord
    es: Gozo en el Señor
    uk: Радість у Господі
  text:
    ru: Господи, наполни мое сердце радостью, которая не зависит от обстоятельств. Помоги
      мне находить счастье в Тебе, а не в временных вещах этого мира. Пусть радость о Тебе
      будет моей силой каждый день. Во имя Иисуса Христа. Аминь.
    en: Lord, fill my heart with a joy that does not depend on circumstances. Help me to find
      happiness in You and not in the temporary things of this world. May the joy of You be
      my strength each day. In the name of Jesus Christ. Amen.
    es: Señor, llena mi corazón de un gozo que no dependa de las circunstancias. Ayúdame a
      hallar la felicidad en Ti y no en las cosas pasajeras de este mundo. Que el gozo en
      Ti sea mi fuerza cada día. En el nombre de Jesucristo. Amén.
    uk: Господи, наповни моє серце радістю, яка не залежить від обставин. Допоможи мені знаходити
      щастя в Тобі, а не в тимчасових речах цього світу. Нехай радість про Тебе буде моєю
      силою щодня. В ім'я Ісуса Христа. Амінь.
- id: day_264
  ref: ps:145:13
  title:
    ru: Благодарность за Божью верность
    en: Thanks for God's Faithfulness
    es: Gratitud por la Fidelidad de Dios
    uk: Подяка за Божу вірність
  text:
    ru: Отец Небесный, благодарю Тебя за Твою верность на протяжении всей моей жизни. Ты не
      оставлял меня в трудностях и всегда исполнял Свои обещания. Помоги мне помнить Твои
      благодеяния и укрепляться в вере. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your faithfulness throughout my whole life. You have
      not abandoned me in difficulties and have always kept Your promises. Help me to remember
      Your kindnesses and to be strengthened in faith. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu fidelidad a lo largo de toda mi vida. No me
      has abandonado en las dificultades y siempre has cumplido Tus promesas. Ayúdame a recordar
      Tus bondades y a ser fortalecido en la fe. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твою вірність упродовж усього мого життя. Ти не залишав
      мене в труднощах і завжди виконував Свої обітниці. Допоможи мені пам'ятати Твої добродійства
      й зміцнюватися у вірі. В ім'я Ісуса Христа. Амінь.
- id: day_265
  ref: ps:40:3
  title:
    ru: Песнь хвалы
    en: A Song of Praise
    es: Un Cántico de Alabanza
    uk: Пісня хвали
  text:
    ru: Господи, вложи в мое сердце новую песнь хвалы. Помоги мне чаще размышлять о Твоих
      делах и говорить о Твоей доброте. Пусть благодарение станет естественной частью моей
      жизни. Во имя Иисуса Христа. Аминь.
    en: Lord, put in my heart a new song of praise. Help me to meditate more often on Your
      works and to speak of Your goodness. May thanksgiving become a natural part of my life.
      In the name of Jesus Christ. Amen.
    es: Señor, pon en mi corazón un cántico nuevo de alabanza. Ayúdame a meditar más a menudo
      en Tus obras y a hablar de Tu bondad. Que la acción de gracias llegue a ser una parte
      natural de mi vida. En el nombre de Jesucristo. Amén.
    uk: Господи, вклади в моє серце нову пісню хвали. Допоможи мені частіше роздумувати про
      Твої діла й говорити про Твою доброту. Нехай подяка стане природною частиною мого життя.
      В ім'я Ісуса Христа. Амінь.
- id: day_266
  ref: hb:13:5
  title:
    ru: Благодарность за Божье присутствие
    en: Thanks for God's Presence
    es: Gratitud por la Presencia de Dios
    uk: Подяка за Божу присутність
  text:
    ru: Отец Небесный, благодарю Тебя за то, что Ты всегда рядом. Спасибо за Твое присутствие
      в радости и скорби, в успехах и испытаниях. Помоги мне жить в осознании Твоей близости
      каждый день. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that You are always near. Thank You for Your presence in
      joy and in sorrow, in successes and in trials. Help me to live aware of Your nearness
      each day. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias porque siempre estás cerca. Gracias por Tu presencia
      en el gozo y en la tristeza, en los éxitos y en las pruebas. Ayúdame a vivir consciente
      de Tu cercanía cada día. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те, що Ти завжди поруч. Дякую за Твою присутність у радості
      й скорботі, в успіхах і випробуваннях. Допоможи мені жити в усвідомленні Твоєї близькості
      щодня. В ім'я Ісуса Христа. Амінь.
- id: day_267
  ref: prv:9:10
  title:
    ru: Благоговение перед Богом
    en: Reverence before God
    es: Reverencia delante de Dios
    uk: Благоговіння перед Богом
  text:
    ru: Господи, помоги мне никогда не терять благоговения перед Тобой. Напоминай мне о Твоем
      величии, святости и могуществе. Пусть мое сердце будет наполнено уважением, любовью
      и поклонением Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, help me never to lose my reverence before You. Remind me of Your majesty, holiness,
      and might. May my heart be filled with respect, love, and worship of You. In the name
      of Jesus Christ. Amen.
    es: Señor, ayúdame a no perder nunca la reverencia delante de Ti. Recuérdame Tu majestad,
      Tu santidad y Tu poder. Que mi corazón se llene de respeto, amor y adoración hacia Ti.
      En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені ніколи не втрачати благоговіння перед Тобою. Нагадуй мені про
      Твою велич, святість і могутність. Нехай моє серце буде сповнене поваги, любові й поклоніння
      Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_268
  ref: hb:10:24
  title:
    ru: Благодарность за Церковь
    en: Thanks for the Church
    es: Gratitud por la Iglesia
    uk: Подяка за Церкву
  text:
    ru: Отец Небесный, благодарю Тебя за Церковь Христову и за верующих, которых Ты поставил
      рядом со мной. Помоги нам поддерживать друг друга, возрастать в любви и вместе прославлять
      Тебя. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the Church of Christ and for the believers You have
      placed beside me. Help us to support one another, to grow in love, and together to glorify
      You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la Iglesia de Cristo y por los creyentes que has
      puesto a mi lado. Ayúdanos a apoyarnos mutuamente, a crecer en amor y a glorificarte
      juntos. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Церкву Христову і за віруючих, яких Ти поставив поруч
      зі мною. Допоможи нам підтримувати одне одного, зростати в любові й разом прославляти
      Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_269
  ref: ps:28:7
  title:
    ru: Господь — моя радость
    en: The Lord Is My Joy
    es: El Señor Es mi Gozo
    uk: Господь — моя радість
  text:
    ru: Господи, благодарю Тебя за то, что Ты являешься источником моей радости и надежды.
      Когда обстоятельства меняются, помоги мне находить утешение и силу в Тебе. Пусть мое
      сердце всегда радуется о Твоем спасении. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that You are the source of my joy and hope. When circumstances change,
      help me to find comfort and strength in You. May my heart always rejoice in Your salvation.
      In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque eres la fuente de mi gozo y mi esperanza. Cuando las
      circunstancias cambien, ayúdame a hallar consuelo y fuerza en Ti. Que mi corazón se
      goce siempre en Tu salvación. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти є джерелом моєї радості й надії. Коли обставини змінюються,
      допоможи мені знаходити втіху й силу в Тобі. Нехай моє серце завжди радіє про Твоє спасіння.
      В ім'я Ісуса Христа. Амінь.
- id: day_270
  ref: ps:136:1
  title:
    ru: Хвала за всё
    en: Praise for Everything
    es: Alabanza por Todo
    uk: Хвала за все
  text:
    ru: Отец Небесный, благодарю Тебя за все, что Ты совершаешь в моей жизни. За радости и
      уроки, за ответы и ожидание, за победы и испытания. Помоги мне видеть Твою руку во всем
      и прославлять Тебя во всякое время. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for all that You do in my life — for joys and lessons,
      for answers and waiting, for victories and trials. Help me to see Your hand in everything
      and to glorify You at all times. In the name of Jesus Christ. Amen.
    es: 'Padre Celestial, te doy gracias por todo lo que haces en mi vida: por las alegrías
      y las lecciones, por las respuestas y la espera, por las victorias y las pruebas. Ayúdame
      a ver Tu mano en todo y a glorificarte en todo tiempo. En el nombre de Jesucristo. Amén.'
    uk: Отче Небесний, дякую Тобі за все, що Ти звершуєш у моєму житті, — за радощі й уроки,
      за відповіді й очікування, за перемоги й випробування. Допоможи мені бачити Твою руку
      в усьому й прославляти Тебе повсякчас. В ім'я Ісуса Христа. Амінь.
- id: day_271
  ref: prv:3:5
  title:
    ru: Доверие Богу всем сердцем
    en: Trusting God with All My Heart
    es: Confiar en Dios de Todo Corazón
    uk: Довіра Богові всім серцем
  text:
    ru: Отец Небесный, помоги мне доверять Тебе всем сердцем. Когда я не понимаю происходящего
      и не вижу дальнейшего пути, напоминай мне, что Ты знаешь конец от начала. Научи меня
      полагаться не на собственную мудрость, а на Твою верность и любовь. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, help me to trust You with all my heart. When I do not understand
      what is happening and cannot see the way ahead, remind me that You know the end from
      the beginning. Teach me to rely not on my own wisdom but on Your faithfulness and love.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a confiar en Ti de todo corazón. Cuando no entienda lo que
      sucede ni vea el camino por delante, recuérdame que Tú conoces el fin desde el principio.
      Enséñame a apoyarme no en mi propia sabiduría, sino en Tu fidelidad y Tu amor. En el
      nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені довіряти Тобі всім серцем. Коли я не розумію того, що
      відбувається, і не бачу подальшого шляху, нагадуй мені, що Ти знаєш кінець від початку.
      Навчи мене покладатися не на власну мудрість, а на Твою вірність і любов. В ім'я Ісуса
      Христа. Амінь.
- id: day_272
  ref: 2co:5:7
  title:
    ru: Вера среди неопределенности
    en: Faith amid Uncertainty
    es: Fe en Medio de la Incertidumbre
    uk: Віра серед невизначеності
  text:
    ru: Господи, когда будущее кажется неизвестным, помоги мне жить верой, а не страхом. Укрепляй
      мое сердце и напоминай, что Ты держишь в Своих руках каждый день моей жизни. Во имя
      Иисуса Христа. Аминь.
    en: Lord, when the future seems unknown, help me to live by faith and not by fear. Strengthen
      my heart and remind me that You hold in Your hands every day of my life. In the name
      of Jesus Christ. Amen.
    es: Señor, cuando el futuro parezca incierto, ayúdame a vivir por fe y no por temor. Fortalece
      mi corazón y recuérdame que sostienes en Tus manos cada día de mi vida. En el nombre
      de Jesucristo. Amén.
    uk: Господи, коли майбутнє видається невідомим, допоможи мені жити вірою, а не страхом.
      Зміцнюй моє серце й нагадуй, що Ти тримаєш у Своїх руках кожен день мого життя. В ім'я
      Ісуса Христа. Амінь.
- id: day_273
  ref: ps:32:8
  title:
    ru: Господь знает путь
    en: The Lord Knows the Way
    es: El Señor Conoce el Camino
    uk: Господь знає шлях
  text:
    ru: Отец Небесный, благодарю Тебя за то, что мне не нужно знать все ответы, потому что
      Ты знаешь все. Помоги мне доверять Твоему водительству и спокойно следовать туда, куда
      Ты ведешь меня. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that I do not need to know all the answers, because You
      know everything. Help me to trust Your guidance and to follow calmly wherever You lead
      me. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias porque no necesito saber todas las respuestas, pues
      Tú lo sabes todo. Ayúdame a confiar en Tu dirección y a seguir con calma adondequiera
      que me lleves. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те, що мені не потрібно знати всіх відповідей, бо Ти
      знаєш усе. Допоможи мені довіряти Твоєму керівництву й спокійно йти туди, куди Ти ведеш
      мене. В ім'я Ісуса Христа. Амінь.
- id: day_274
  ref: hb:10:23
  title:
    ru: Вера в Божьи обещания
    en: Faith in God's Promises
    es: Fe en las Promesas de Dios
    uk: Віра в Божі обітниці
  text:
    ru: Господи, помоги мне крепко держаться за Твои обещания. Когда обстоятельства говорят
      обратное, напоминай мне, что Твое Слово истинно и надежно. Укрепляй мою веру и учи меня
      ожидать исполнения Твоей воли. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to hold firmly to Your promises. When circumstances say the opposite,
      remind me that Your Word is true and reliable. Strengthen my faith and teach me to wait
      for the fulfillment of Your will. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a aferrarme firmemente a Tus promesas. Cuando las circunstancias digan
      lo contrario, recuérdame que Tu Palabra es verdadera y segura. Fortalece mi fe y enséñame
      a esperar el cumplimiento de Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені міцно триматися Твоїх обітниць. Коли обставини говорять протилежне,
      нагадуй мені, що Твоє Слово істинне й надійне. Зміцнюй мою віру й навчи мене очікувати
      виконання Твоєї волі. В ім'я Ісуса Христа. Амінь.
- id: day_275
  ref: ps:62:1
  title:
    ru: Спокойствие в Божьих руках
    en: Calm in God's Hands
    es: Calma en las Manos de Dios
    uk: Спокій у Божих руках
  text:
    ru: Отец Небесный, помоги мне успокоить свое сердце и полностью довериться Тебе. Когда
      тревоги пытаются овладеть мной, напоминай мне, что Ты заботишься обо мне лучше, чем
      я сам могу позаботиться о себе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to calm my heart and to trust You completely. When anxieties
      try to take hold of me, remind me that You care for me better than I can care for myself.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a calmar mi corazón y a confiar plenamente en Ti. Cuando
      las inquietudes traten de apoderarse de mí, recuérdame que Tú cuidas de mí mejor de
      lo que yo mismo puedo hacerlo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені заспокоїти своє серце й цілком довіритися Тобі. Коли
      тривоги намагаються заволодіти мною, нагадуй мені, що Ти дбаєш про мене краще, ніж я
      сам можу подбати про себе. В ім'я Ісуса Христа. Амінь.
- id: day_276
  ref: is:40:31
  title:
    ru: Вера во время ожидания
    en: Faith during Waiting
    es: Fe en la Espera
    uk: Віра під час очікування
  text:
    ru: Господи, научи меня ожидать Тебя с терпением. Когда ответы на молитвы задерживаются,
      помоги мне не терять надежду. Пусть время ожидания укрепляет мою веру и делает меня
      ближе к Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, teach me to wait on You with patience. When answers to prayer are delayed, help
      me not to lose hope. May the time of waiting strengthen my faith and draw me nearer
      to You. In the name of Jesus Christ. Amen.
    es: Señor, enséñame a esperar en Ti con paciencia. Cuando las respuestas a la oración
      se demoren, ayúdame a no perder la esperanza. Que el tiempo de espera fortalezca mi
      fe y me acerque más a Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене очікувати на Тебе з терпінням. Коли відповіді на молитви затримуються,
      допоможи мені не втрачати надії. Нехай час очікування зміцнює мою віру й робить мене
      ближчим до Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_277
  ref: rm:8:28
  title:
    ru: Бог управляет обстоятельствами
    en: God Governs the Circumstances
    es: Dios Gobierna las Circunstancias
    uk: Бог керує обставинами
  text:
    ru: Отец Небесный, благодарю Тебя за то, что ничто не выходит из-под Твоего контроля.
      Даже когда я не понимаю происходящего, помоги мне помнить, что Ты продолжаешь действовать.
      Научи меня доверять Твоему замыслу. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that nothing is beyond Your control. Even when I do not
      understand what is happening, help me to remember that You are still at work. Teach
      me to trust Your design. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias porque nada está fuera de Tu control. Aun cuando no
      entienda lo que sucede, ayúdame a recordar que sigues obrando. Enséñame a confiar en
      Tu propósito. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те, що ніщо не виходить з-під Твого контролю. Навіть
      коли я не розумію того, що відбувається, допоможи мені пам'ятати, що Ти продовжуєш діяти.
      Навчи мене довіряти Твоєму задумові. В ім'я Ісуса Христа. Амінь.
- id: day_278
  ref: mk:9:24
  title:
    ru: Маленькая вера — великий Бог
    en: Small Faith — a Great God
    es: Fe Pequeña, Dios Grande
    uk: Мала віра — великий Бог
  text:
    ru: Господи, иногда моя вера кажется слабой. Но я благодарю Тебя, что моя надежда основана
      не на силе моей веры, а на Твоем могуществе. Укрепляй меня и помогай возрастать в доверии
      Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, sometimes my faith seems weak. But I thank You that my hope rests not on the
      strength of my faith but on Your might. Strengthen me and help me to grow in trust toward
      You. In the name of Jesus Christ. Amen.
    es: Señor, a veces mi fe parece débil. Pero te doy gracias porque mi esperanza no descansa
      en la fuerza de mi fe, sino en Tu poder. Fortaléceme y ayúdame a crecer en la confianza
      hacia Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, інколи моя віра здається слабкою. Але я дякую Тобі, що моя надія заснована
      не на силі моєї віри, а на Твоїй могутності. Зміцнюй мене й допомагай зростати в довірі
      до Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_279
  ref: rm:5:5
  title:
    ru: Надежда, которая не постыжает
    en: A Hope That Does Not Disappoint
    es: Una Esperanza que No Avergüenza
    uk: Надія, що не засоромлює
  text:
    ru: Отец Небесный, благодарю Тебя за надежду, которую Ты даешь Своим детям. Помоги мне
      не искать опоры в изменчивых вещах этого мира, но строить свою жизнь на Тебе. Во имя
      Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the hope You give to Your children. Help me not to
      seek support in the changeable things of this world but to build my life on You. In
      the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la esperanza que das a Tus hijos. Ayúdame a no
      buscar apoyo en las cosas cambiantes de este mundo, sino a edificar mi vida sobre Ti.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за надію, яку Ти даєш Своїм дітям. Допоможи мені не шукати
      опори в мінливих речах цього світу, а будувати своє життя на Тобі. В ім'я Ісуса Христа.
      Амінь.
- id: day_280
  ref: ps:28:7
  title:
    ru: Господь — моя крепость
    en: The Lord Is My Stronghold
    es: El Señor Es mi Fortaleza
    uk: Господь — моя твердиня
  text:
    ru: Господи, когда я чувствую слабость, напоминай мне, что моя сила находится в Тебе.
      Укрепляй меня для всех испытаний и задач сегодняшнего дня. Помоги мне полностью зависеть
      от Тебя. Во имя Иисуса Христа. Аминь.
    en: Lord, when I feel weak, remind me that my strength is in You. Strengthen me for all
      the trials and tasks of this day. Help me to depend fully on You. In the name of Jesus
      Christ. Amen.
    es: Señor, cuando me sienta débil, recuérdame que mi fuerza está en Ti. Fortaléceme para
      todas las pruebas y tareas de este día. Ayúdame a depender por completo de Ti. En el
      nombre de Jesucristo. Amén.
    uk: Господи, коли я почуваюся слабким, нагадуй мені, що моя сила в Тобі. Зміцнюй мене
      для всіх випробувань і завдань цього дня. Допоможи мені цілком залежати від Тебе. В
      ім'я Ісуса Христа. Амінь.
- id: day_281
  ref: jm:1:5
  title:
    ru: Вера перед трудным выбором
    en: Faith before a Hard Choice
    es: Fe ante una Decisión Difícil
    uk: Віра перед важким вибором
  text:
    ru: Отец Небесный, когда мне нужно принимать важные решения, помоги мне искать Твою мудрость.
      Не позволяй страху или сомнениям руководить мной. Направляй мои шаги и веди меня по
      Своему пути. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, when I have to make important decisions, help me to seek Your wisdom.
      Do not let fear or doubt rule me. Direct my steps and lead me on Your path. In the name
      of Jesus Christ. Amen.
    es: Padre Celestial, cuando deba tomar decisiones importantes, ayúdame a buscar Tu sabiduría.
      No permitas que el temor o la duda me gobiernen. Dirige mis pasos y guíame por Tu camino.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, коли мені потрібно приймати важливі рішення, допоможи мені шукати Твою
      мудрість. Не дозволь страхові чи сумнівам керувати мною. Скеровуй мої кроки й веди мене
      Своєю дорогою. В ім'я Ісуса Христа. Амінь.
- id: day_282
  ref: hb:13:8
  title:
    ru: Божья верность во все времена
    en: God's Faithfulness in All Times
    es: La Fidelidad de Dios en Todo Tiempo
    uk: Божа вірність повсякчас
  text:
    ru: Господи, благодарю Тебя за то, что Ты остаешься верным во все времена моей жизни.
      В радости и скорби, в достатке и нужде Ты остаешься тем же. Помоги мне всегда помнить
      об этом. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that You remain faithful in all the seasons of my life. In joy and
      sorrow, in plenty and in need, You remain the same. Help me always to remember this.
      In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque permaneces fiel en todas las etapas de mi vida. En el
      gozo y en la tristeza, en la abundancia y en la necesidad, permaneces el mismo. Ayúdame
      a recordarlo siempre. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти залишаєшся вірним у всі часи мого життя. У радості
      й скорботі, у достатку й нужді Ти залишаєшся тим самим. Допоможи мені завжди пам'ятати
      про це. В ім'я Ісуса Христа. Амінь.
- id: day_283
  ref: ps:121:1
  title:
    ru: Смотреть на Господа
    en: Looking to the Lord
    es: Mirar al Señor
    uk: Дивитися на Господа
  text:
    ru: Отец Небесный, помоги мне смотреть не на проблемы, а на Тебя. Когда трудности кажутся
      большими, напоминай мне, насколько велик Ты. Наполни мое сердце верой и миром. Во имя
      Иисуса Христа. Аминь.
    en: Heavenly Father, help me to look not at my problems but at You. When difficulties
      seem great, remind me how great You are. Fill my heart with faith and peace. In the
      name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a mirar no a mis problemas, sino a Ti. Cuando las dificultades
      parezcan grandes, recuérdame cuán grande eres Tú. Llena mi corazón de fe y paz. En el
      nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені дивитися не на проблеми, а на Тебе. Коли труднощі видаються
      великими, нагадуй мені, наскільки великий Ти. Наповни моє серце вірою й миром. В ім'я
      Ісуса Христа. Амінь.
- id: day_284
  ref: rm:8:38
  title:
    ru: Уверенность в Божьей любви
    en: Assurance of God's Love
    es: Certeza del Amor de Dios
    uk: Упевненість у Божій любові
  text:
    ru: Господи, благодарю Тебя за любовь, которая никогда не заканчивается. Помоги мне жить
      в уверенности, что ничто не может отлучить меня от Твоей любви во Христе Иисусе. Во
      имя Иисуса Христа. Аминь.
    en: Lord, thank You for a love that never ends. Help me to live in the assurance that
      nothing can separate me from Your love in Christ Jesus. In the name of Jesus Christ.
      Amen.
    es: Señor, te doy gracias por un amor que nunca termina. Ayúdame a vivir con la certeza
      de que nada puede separarme de Tu amor en Cristo Jesús. En el nombre de Jesucristo.
      Amén.
    uk: Господи, дякую Тобі за любов, яка ніколи не закінчується. Допоможи мені жити з упевненістю,
      що ніщо не може відлучити мене від Твоєї любові у Христі Ісусі. В ім'я Ісуса Христа.
      Амінь.
- id: day_285
  ref: rm:1:17
  title:
    ru: Верой до конца
    en: By Faith to the End
    es: Por Fe hasta el Fin
    uk: Вірою до кінця
  text:
    ru: Отец Небесный, помоги мне сохранить веру до конца моего пути. Независимо от обстоятельств,
      испытаний или перемен, укрепляй мое сердце и напоминай, что Ты достоин полного доверия.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to keep faith to the end of my journey. Regardless of circumstances,
      trials, or changes, strengthen my heart and remind me that You are worthy of complete
      trust. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a guardar la fe hasta el fin de mi camino. Sin importar las
      circunstancias, las pruebas o los cambios, fortalece mi corazón y recuérdame que eres
      digno de plena confianza. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені зберегти віру до кінця мого шляху. Незалежно від обставин,
      випробувань чи змін, зміцнюй моє серце й нагадуй, що Ти достойний повної довіри. В ім'я
      Ісуса Христа. Амінь.
- id: day_286
  ref: ph:3:20
  title:
    ru: Небесная надежда
    en: Heavenly Hope
    es: Esperanza Celestial
    uk: Небесна надія
  text:
    ru: Отец Небесный, благодарю Тебя за надежду, которую Ты даровал мне через Иисуса Христа.
      Помоги мне помнить, что моя жизнь не ограничивается земными днями. Когда я сталкиваюсь
      с трудностями, направляй мой взгляд к вечности и напоминай о Твоих обещаниях. Во имя
      Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the hope You have given me through Jesus Christ. Help
      me to remember that my life is not limited to my earthly days. When I face difficulties,
      direct my gaze to eternity and remind me of Your promises. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, te doy gracias por la esperanza que me has dado por medio de Jesucristo.
      Ayúdame a recordar que mi vida no se limita a mis días terrenales. Cuando enfrente dificultades,
      dirige mi mirada a la eternidad y recuérdame Tus promesas. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, дякую Тобі за надію, яку Ти дарував мені через Ісуса Христа. Допоможи
      мені пам'ятати, що моє життя не обмежується земними днями. Коли я стикаюся з труднощами,
      скеровуй мій погляд до вічності й нагадуй про Твої обітниці. В ім'я Ісуса Христа. Амінь.
- id: day_287
  ref: mt:6:20
  title:
    ru: Собирать сокровища на небе
    en: Storing Up Treasure in Heaven
    es: Atesorar en el Cielo
    uk: Збирати скарби на небі
  text:
    ru: Господи, помоги мне правильно расставлять приоритеты в жизни. Не позволь моему сердцу
      слишком привязаться к временному и проходящему. Научи меня искать прежде всего Твое
      Царство и собирать сокровища, которые имеют вечную ценность. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to set right priorities in my life. Do not let my heart become too attached
      to what is temporary and passing. Teach me to seek first Your Kingdom and to store up
      treasure that has eternal value. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a poner las prioridades correctas en mi vida. No permitas que mi corazón
      se apegue demasiado a lo temporal y pasajero. Enséñame a buscar primero Tu Reino y a
      atesorar lo que tiene valor eterno. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені правильно розставляти пріоритети в житті. Не дозволь моєму
      серцю надто прив'язуватися до тимчасового й минущого. Навчи мене шукати передусім Твого
      Царства й збирати скарби, які мають вічну цінність. В ім'я Ісуса Христа. Амінь.
- id: day_288
  ref: mt:24:42
  title:
    ru: Ожидание Господа
    en: Awaiting the Lord
    es: Esperar al Señor
    uk: Очікування Господа
  text:
    ru: Отец Небесный, помоги мне жить в ожидании возвращения Иисуса Христа. Пусть эта надежда
      побуждает меня к верности, чистоте и посвящению Тебе. Научи меня быть готовым встретить
      Господа в любой день. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to live in expectation of the return of Jesus Christ. May
      this hope move me to faithfulness, purity, and devotion to You. Teach me to be ready
      to meet the Lord on any day. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a vivir esperando el regreso de Jesucristo. Que esta esperanza
      me mueva a la fidelidad, la pureza y la entrega a Ti. Enséñame a estar listo para encontrarme
      con el Señor cualquier día. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені жити в очікуванні повернення Ісуса Христа. Нехай ця надія
      спонукає мене до вірності, чистоти й посвяти Тобі. Навчи мене бути готовим зустріти
      Господа будь-якого дня. В ім'я Ісуса Христа. Амінь.
- id: day_289
  ref: 2co:4:18
  title:
    ru: Временное и вечное
    en: The Temporary and the Eternal
    es: Lo Temporal y lo Eterno
    uk: Тимчасове і вічне
  text:
    ru: Господи, помоги мне помнить, что все земное временно. Когда заботы этого мира пытаются
      завладеть моим сердцем, напоминай мне о вечности. Научи меня жить ради того, что имеет
      значение перед Тобой. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to remember that everything earthly is temporary. When the cares of
      this world try to seize my heart, remind me of eternity. Teach me to live for what matters
      before You. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a recordar que todo lo terrenal es temporal. Cuando los afanes de este
      mundo traten de apoderarse de mi corazón, recuérdame la eternidad. Enséñame a vivir
      para lo que importa delante de Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені пам'ятати, що все земне тимчасове. Коли турботи цього світу
      намагаються заволодіти моїм серцем, нагадуй мені про вічність. Навчи мене жити заради
      того, що має значення перед Тобою. В ім'я Ісуса Христа. Амінь.
- id: day_290
  ref: 1ts:4:17
  title:
    ru: Радость будущей встречи
    en: The Joy of the Coming Meeting
    es: El Gozo del Encuentro Venidero
    uk: Радість майбутньої зустрічі
  text:
    ru: Отец Небесный, благодарю Тебя за обещание вечной жизни с Тобой. Наполняй мое сердце
      радостью и ожиданием того дня, когда я увижу Тебя лицом к лицу. Помоги мне оставаться
      верным до конца своего пути. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the promise of eternal life with You. Fill my heart
      with joy and with expectation of the day when I will see You face to face. Help me to
      remain faithful to the end of my journey. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la promesa de la vida eterna contigo. Llena mi
      corazón de gozo y de expectativa por el día en que te veré cara a cara. Ayúdame a permanecer
      fiel hasta el fin de mi camino. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за обіцянку вічного життя з Тобою. Наповнюй моє серце радістю
      й очікуванням того дня, коли я побачу Тебе лицем до лиця. Допоможи мені залишатися вірним
      до кінця свого шляху. В ім'я Ісуса Христа. Амінь.
- id: day_291
  ref: mt:6:33
  title:
    ru: Гражданин Небесного Царства
    en: A Citizen of the Heavenly Kingdom
    es: Ciudadano del Reino Celestial
    uk: Громадянин Небесного Царства
  text:
    ru: Господи, помоги мне помнить, что я принадлежу Твоему Царству. Научи меня жить по небесным
      ценностям, даже когда мир предлагает другие пути. Пусть моя жизнь отражает характер
      Твоего Царства. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to remember that I belong to Your Kingdom. Teach me to live by heavenly
      values, even when the world offers other ways. May my life reflect the character of
      Your Kingdom. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a recordar que pertenezco a Tu Reino. Enséñame a vivir según los valores
      celestiales, aun cuando el mundo ofrezca otros caminos. Que mi vida refleje el carácter
      de Tu Reino. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені пам'ятати, що я належу до Твого Царства. Навчи мене жити за
      небесними цінностями, навіть коли світ пропонує інші дороги. Нехай моє життя відображає
      характер Твого Царства. В ім'я Ісуса Христа. Амінь.
- id: day_292
  ref: re:2:10
  title:
    ru: Верность до конца
    en: Faithfulness to the End
    es: Fidelidad hasta el Fin
    uk: Вірність до кінця
  text:
    ru: Отец Небесный, укрепляй меня в вере и помогай не сходить с Твоего пути. Когда приходят
      испытания и трудности, напоминай мне о награде, которую Ты приготовил любящим Тебя.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, strengthen me in faith and help me not to leave Your path. When trials
      and hardships come, remind me of the reward You have prepared for those who love You.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, fortaléceme en la fe y ayúdame a no apartarme de Tu camino. Cuando
      lleguen las pruebas y las dificultades, recuérdame el galardón que has preparado para
      los que te aman. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, зміцнюй мене у вірі й допоможи не сходити з Твоєї дороги. Коли приходять
      випробування й труднощі, нагадуй мені про нагороду, яку Ти приготував тим, хто любить
      Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_293
  ref: ps:16:11
  title:
    ru: Вечная радость
    en: Eternal Joy
    es: Gozo Eterno
    uk: Вічна радість
  text:
    ru: Господи, благодарю Тебя за обещание вечной радости в Твоем присутствии. Когда земная
      жизнь приносит печаль или разочарование, помоги мне помнить о будущем, которое Ты приготовил
      для Своих детей. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for the promise of eternal joy in Your presence. When earthly life
      brings sorrow or disappointment, help me to remember the future You have prepared for
      Your children. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por la promesa del gozo eterno en Tu presencia. Cuando la vida
      terrenal traiga tristeza o decepción, ayúdame a recordar el futuro que has preparado
      para Tus hijos. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за обіцянку вічної радості у Твоїй присутності. Коли земне життя
      приносить смуток чи розчарування, допоможи мені пам'ятати про майбутнє, яке Ти приготував
      для Своїх дітей. В ім'я Ісуса Христа. Амінь.
- id: day_294
  ref: mt:24:46
  title:
    ru: Готовое сердце
    en: A Ready Heart
    es: Un Corazón Preparado
    uk: Готове серце
  text:
    ru: Отец Небесный, помоги мне жить так, чтобы каждый день быть готовым предстать перед
      Тобой. Научи меня хранить чистую совесть, любить людей и исполнять Твою волю. Во имя
      Иисуса Христа. Аминь.
    en: Heavenly Father, help me to live so that each day I am ready to stand before You.
      Teach me to keep a clear conscience, to love people, and to do Your will. In the name
      of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a vivir de modo que cada día esté preparado para presentarme
      ante Ti. Enséñame a guardar una conciencia limpia, a amar a las personas y a cumplir
      Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені жити так, щоб кожного дня бути готовим стати перед Тобою.
      Навчи мене зберігати чисте сумління, любити людей і виконувати Твою волю. В ім'я Ісуса
      Христа. Амінь.
- id: day_295
  ref: 1co:15:58
  title:
    ru: Вечная награда
    en: An Eternal Reward
    es: Una Recompensa Eterna
    uk: Вічна нагорода
  text:
    ru: Господи, помоги мне помнить, что труд для Тебя никогда не бывает напрасным. Даже если
      результаты не всегда видны людям, Ты видишь каждое доброе дело. Научи меня служить Тебе
      с верностью и любовью. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to remember that labor for You is never in vain. Even when the results
      are not always visible to people, You see every good deed. Teach me to serve You with
      faithfulness and love. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a recordar que el trabajo para Ti nunca es en vano. Aun cuando los
      resultados no siempre sean visibles a las personas, Tú ves cada buena obra. Enséñame
      a servirte con fidelidad y amor. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені пам'ятати, що праця для Тебе ніколи не буває марною. Навіть
      коли результати не завжди видно людям, Ти бачиш кожну добру справу. Навчи мене служити
      Тобі з вірністю й любов'ю. В ім'я Ісуса Христа. Амінь.
- id: day_296
  ref: re:21:2
  title:
    ru: Новый Иерусалим
    en: The New Jerusalem
    es: La Nueva Jerusalén
    uk: Новий Єрусалим
  text:
    ru: Отец Небесный, благодарю Тебя за славное будущее, которое Ты приготовил для Своего
      народа. Напоминай мне о Твоих обещаниях и помогай жить с надеждой, которая превосходит
      все земные переживания. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the glorious future You have prepared for Your people.
      Remind me of Your promises and help me to live with a hope that surpasses all earthly
      trials. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por el glorioso futuro que has preparado para Tu pueblo.
      Recuérdame Tus promesas y ayúdame a vivir con una esperanza que supere todas las pruebas
      terrenales. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за славне майбутнє, яке Ти приготував для Свого народу.
      Нагадуй мені про Твої обітниці й допомагай жити з надією, яка перевершує всі земні переживання.
      В ім'я Ісуса Христа. Амінь.
- id: day_297
  ref: mt:6:21
  title:
    ru: Смотреть на вечное
    en: Looking at the Eternal
    es: Mirar lo Eterno
    uk: Дивитися на вічне
  text:
    ru: Господи, помоги мне принимать решения в свете вечности. Научи меня ценить то, что
      важно для Тебя, и не тратить свою жизнь на пустое и проходящее. Во имя Иисуса Христа.
      Аминь.
    en: Lord, help me to make decisions in the light of eternity. Teach me to value what is
      important to You and not to waste my life on what is empty and passing. In the name
      of Jesus Christ. Amen.
    es: Señor, ayúdame a tomar decisiones a la luz de la eternidad. Enséñame a valorar lo
      que es importante para Ti y a no malgastar mi vida en lo vacío y pasajero. En el nombre
      de Jesucristo. Amén.
    uk: Господи, допоможи мені приймати рішення у світлі вічності. Навчи мене цінувати те,
      що важливе для Тебе, і не витрачати своє життя на порожнє й минуще. В ім'я Ісуса Христа.
      Амінь.
- id: day_298
  ref: 1co:15:55
  title:
    ru: Победа над смертью
    en: Victory over Death
    es: Victoria sobre la Muerte
    uk: Перемога над смертю
  text:
    ru: Отец Небесный, благодарю Тебя за победу Иисуса Христа над смертью. Благодаря Ему я
      имею надежду воскресения и вечной жизни. Помоги мне жить в радости этой великой истины.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the victory of Jesus Christ over death. Because of
      Him I have the hope of resurrection and eternal life. Help me to live in the joy of
      this great truth. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la victoria de Jesucristo sobre la muerte. Gracias
      a Él tengo la esperanza de la resurrección y la vida eterna. Ayúdame a vivir en el gozo
      de esta gran verdad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за перемогу Ісуса Христа над смертю. Завдяки Йому я маю
      надію воскресіння й вічного життя. Допоможи мені жити в радості цієї великої істини.
      В ім'я Ісуса Христа. Амінь.
- id: day_299
  ref: rm:8:18
  title:
    ru: Ожидание славы Божьей
    en: Awaiting the Glory of God
    es: Esperar la Gloria de Dios
    uk: Очікування Божої слави
  text:
    ru: Господи, помоги мне терпеливо проходить через временные трудности, помня о славе,
      которая ожидает Твоих детей. Укрепляй мою веру и направляй мой взгляд к вечному. Во
      имя Иисуса Христа. Аминь.
    en: Lord, help me to go patiently through temporary difficulties, remembering the glory
      that awaits Your children. Strengthen my faith and direct my gaze to the eternal. In
      the name of Jesus Christ. Amen.
    es: Señor, ayúdame a atravesar con paciencia las dificultades temporales, recordando la
      gloria que espera a Tus hijos. Fortalece mi fe y dirige mi mirada a lo eterno. En el
      nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені терпляче проходити через тимчасові труднощі, пам'ятаючи про
      славу, яка очікує Твоїх дітей. Зміцнюй мою віру й скеровуй мій погляд до вічного. В
      ім'я Ісуса Христа. Амінь.
- id: day_300
  ref: 1ts:4:18
  title:
    ru: Вечность с Богом
    en: Eternity with God
    es: Eternidad con Dios
    uk: Вічність із Богом
  text:
    ru: Отец Небесный, благодарю Тебя за обещание вечной жизни. Помоги мне жить так, чтобы
      каждый день приближал меня к Тебе. Пусть надежда на вечность вдохновляет меня на верность,
      любовь и послушание Твоей воле. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the promise of eternal life. Help me to live so that
      each day draws me nearer to You. May the hope of eternity inspire me to faithfulness,
      love, and obedience to Your will. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la promesa de la vida eterna. Ayúdame a vivir
      de modo que cada día me acerque más a Ti. Que la esperanza de la eternidad me inspire
      a la fidelidad, el amor y la obediencia a Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за обіцянку вічного життя. Допоможи мені жити так, щоб кожен
      день наближав мене до Тебе. Нехай надія на вічність надихає мене на вірність, любов
      і послух Твоїй волі. В ім'я Ісуса Христа. Амінь.
- id: day_301
  ref: jr:31:3
  title:
    ru: Божья любовь неизменна
    en: God's Love Is Unchanging
    es: El Amor de Dios Es Inmutable
    uk: Божа любов незмінна
  text:
    ru: Отец Небесный, благодарю Тебя за Твою любовь, которая не зависит от моих успехов или
      неудач. Когда я слаб, Ты продолжаешь любить меня. Помоги мне жить в уверенности Твоей
      любви и делиться этой любовью с окружающими. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your love, which does not depend on my successes or
      failures. When I am weak, You keep loving me. Help me to live in the assurance of Your
      love and to share that love with those around me. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu amor, que no depende de mis éxitos ni de mis
      fracasos. Cuando soy débil, Tú sigues amándome. Ayúdame a vivir en la certeza de Tu
      amor y a compartir ese amor con quienes me rodean. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твою любов, яка не залежить від моїх успіхів чи невдач.
      Коли я слабкий, Ти продовжуєш любити мене. Допоможи мені жити в упевненості Твоєї любові
      й ділитися цією любов'ю з оточенням. В ім'я Ісуса Христа. Амінь.
- id: day_302
  ref: 2co:12:9
  title:
    ru: Благодать на каждый день
    en: Grace for Every Day
    es: Gracia para Cada Día
    uk: Благодать на кожен день
  text:
    ru: Господи, благодарю Тебя за благодать, которой Ты поддерживаешь меня ежедневно. Когда
      я ошибаюсь и падаю, помоги мне не оставаться в поражении, но приходить к Тебе за прощением
      и обновлением. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for the grace by which You sustain me each day. When I err and fall,
      help me not to remain in defeat but to come to You for forgiveness and renewal. In the
      name of Jesus Christ. Amen.
    es: Señor, te doy gracias por la gracia con que me sostienes cada día. Cuando me equivoque
      y caiga, ayúdame a no quedarme en la derrota, sino a acudir a Ti en busca de perdón
      y renovación. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за благодать, якою Ти підтримуєш мене щодня. Коли я помиляюся
      й падаю, допоможи мені не залишатися в поразці, а приходити до Тебе за прощенням і оновленням.
      В ім'я Ісуса Христа. Амінь.
- id: day_303
  ref: ps:103:17
  title:
    ru: Милость Господня
    en: The Mercy of the Lord
    es: La Misericordia del Señor
    uk: Милість Господня
  text:
    ru: Отец Небесный, благодарю Тебя за милость, которую Ты проявляешь ко мне каждый день.
      Я не заслуживаю Твоей доброты, но Ты продолжаешь прощать, поддерживать и вести меня.
      Помоги мне быть милостивым к другим людям. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the mercy You show me each day. I do not deserve Your
      goodness, yet You keep forgiving, upholding, and leading me. Help me to be merciful
      to other people. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la misericordia que me muestras cada día. No merezco
      Tu bondad, pero sigues perdonándome, sosteniéndome y guiándome. Ayúdame a ser misericordioso
      con los demás. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за милість, яку Ти виявляєш до мене щодня. Я не заслуговую
      на Твою доброту, але Ти продовжуєш прощати, підтримувати й вести мене. Допоможи мені
      бути милостивим до інших людей. В ім'я Ісуса Христа. Амінь.
- id: day_304
  ref: 1jo:3:1
  title:
    ru: Любовь Отца
    en: The Father's Love
    es: El Amor del Padre
    uk: Любов Отця
  text:
    ru: Господи, благодарю Тебя за то, что через Иисуса Христа я могу называть Тебя своим
      Отцом. Спасибо за заботу, принятие и верность. Помоги мне жить как Твоему ребенку и
      доверять Тебе во всем. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You that through Jesus Christ I can call You my Father. Thank You for
      Your care, acceptance, and faithfulness. Help me to live as Your child and to trust
      You in everything. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque por medio de Jesucristo puedo llamarte mi Padre. Gracias
      por Tu cuidado, Tu aceptación y Tu fidelidad. Ayúdame a vivir como hijo Tuyo y a confiar
      en Ti en todo. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що через Ісуса Христа я можу називати Тебе своїм Отцем.
      Дякую за турботу, прийняття й вірність. Допоможи мені жити як Твоїй дитині й довіряти
      Тобі в усьому. В ім'я Ісуса Христа. Амінь.
- id: day_305
  ref: cl:1:14
  title:
    ru: Прощение через Христа
    en: Forgiveness through Christ
    es: Perdón por Medio de Cristo
    uk: Прощення через Христа
  text:
    ru: Отец Небесный, благодарю Тебя за прощение, которое я имею через Иисуса Христа. Спасибо,
      что Ты не вспоминаешь мои грехи и даруешь мне новую жизнь. Помоги мне жить в благодарности
      за этот великий дар. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the forgiveness I have through Jesus Christ. Thank
      You that You remember my sins no more and grant me new life. Help me to live in gratitude
      for this great gift. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por el perdón que tengo por medio de Jesucristo. Gracias
      porque no recuerdas más mis pecados y me concedes vida nueva. Ayúdame a vivir agradecido
      por este gran regalo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за прощення, яке я маю через Ісуса Христа. Дякую, що Ти
      не згадуєш моїх гріхів і даруєш мені нове життя. Допоможи мені жити у вдячності за цей
      великий дар. В ім'я Ісуса Христа. Амінь.
- id: day_306
  ref: ps:34:8
  title:
    ru: Божья доброта
    en: God's Goodness
    es: La Bondad de Dios
    uk: Божа доброта
  text:
    ru: Господи, открой мои глаза видеть Твою доброту в каждом дне. Даже в простых событиях
      напоминай мне о Своей заботе и любви. Пусть благодарность за Твою благость всегда наполняет
      мое сердце. Во имя Иисуса Христа. Аминь.
    en: Lord, open my eyes to see Your goodness in every day. Even in simple events, remind
      me of Your care and love. May gratitude for Your goodness always fill my heart. In the
      name of Jesus Christ. Amen.
    es: Señor, abre mis ojos para ver Tu bondad en cada día. Aun en los acontecimientos sencillos,
      recuérdame Tu cuidado y Tu amor. Que la gratitud por Tu bondad llene siempre mi corazón.
      En el nombre de Jesucristo. Amén.
    uk: Господи, відкрий мої очі бачити Твою доброту в кожному дні. Навіть у простих подіях
      нагадуй мені про Свою турботу й любов. Нехай вдячність за Твою доброту завжди наповнює
      моє серце. В ім'я Ісуса Христа. Амінь.
- id: day_307
  ref: jo:15:12
  title:
    ru: Любить как Христос
    en: To Love as Christ
    es: Amar como Cristo
    uk: Любити, як Христос
  text:
    ru: Отец Небесный, научи меня любить людей так, как Христос возлюбил меня. Помоги мне
      быть терпеливым, добрым и милосердным. Удали из моего сердца эгоизм и помоги отражать
      Твою любовь в отношениях с окружающими. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, teach me to love people as Christ loved me. Help me to be patient,
      kind, and merciful. Remove selfishness from my heart and help me to reflect Your love
      in my relationships with others. In the name of Jesus Christ. Amen.
    es: Padre Celestial, enséñame a amar a las personas como Cristo me amó. Ayúdame a ser
      paciente, bondadoso y misericordioso. Quita el egoísmo de mi corazón y ayúdame a reflejar
      Tu amor en mis relaciones con los demás. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, навчи мене любити людей так, як Христос полюбив мене. Допоможи мені
      бути терплячим, добрим і милосердним. Усунь з мого серця егоїзм і допоможи відображати
      Твою любов у стосунках з оточенням. В ім'я Ісуса Христа. Амінь.
- id: day_308
  ref: rm:8:1
  title:
    ru: Милость сильнее осуждения
    en: Mercy Stronger than Condemnation
    es: La Misericordia Más Fuerte que la Condenación
    uk: Милість сильніша за осуд
  text:
    ru: Господи, помоги мне помнить, что Твоя милость больше моих ошибок. Когда враг напоминает
      мне о прошлом, направляй мой взгляд на крест Христов и на Твое прощение. Укрепляй меня
      в надежде и вере. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to remember that Your mercy is greater than my mistakes. When the enemy
      reminds me of the past, direct my gaze to the cross of Christ and to Your forgiveness.
      Strengthen me in hope and faith. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a recordar que Tu misericordia es mayor que mis errores. Cuando el
      enemigo me recuerde el pasado, dirige mi mirada a la cruz de Cristo y a Tu perdón. Fortaléceme
      en la esperanza y la fe. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені пам'ятати, що Твоя милість більша за мої помилки. Коли ворог
      нагадує мені про минуле, скеровуй мій погляд на хрест Христів і на Твоє прощення. Зміцнюй
      мене в надії й вірі. В ім'я Ісуса Христа. Амінь.
- id: day_309
  ref: ps:103:8
  title:
    ru: Божье сострадание
    en: God's Compassion
    es: La Compasión de Dios
    uk: Боже співчуття
  text:
    ru: Отец Небесный, благодарю Тебя за Твое сострадание. Ты видишь мои переживания, понимаешь
      мою боль и не остаешься безучастным. Помоги мне также проявлять сострадание к людям
      вокруг меня. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your compassion. You see my struggles, understand my
      pain, and do not remain indifferent. Help me also to show compassion to the people around
      me. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu compasión. Tú ves mis luchas, comprendes mi
      dolor y no permaneces indiferente. Ayúdame a mostrar también compasión a las personas
      que me rodean. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твоє співчуття. Ти бачиш мої переживання, розумієш мій
      біль і не залишаєшся байдужим. Допоможи мені також виявляти співчуття до людей навколо
      мене. В ім'я Ісуса Христа. Амінь.
- id: day_310
  ref: hb:13:5
  title:
    ru: Любовь, которая не оставляет
    en: A Love That Does Not Forsake
    es: Un Amor que No Abandona
    uk: Любов, яка не покидає
  text:
    ru: Господи, благодарю Тебя за любовь, которая остается со мной во все времена жизни.
      Когда я прохожу через трудности, напоминай мне, что Ты рядом. Помоги мне находить покой
      в уверенности Твоей любви. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for a love that stays with me in all the seasons of life. When I go
      through difficulties, remind me that You are near. Help me to find rest in the assurance
      of Your love. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por un amor que permanece conmigo en todas las etapas de la
      vida. Cuando atraviese dificultades, recuérdame que estás cerca. Ayúdame a hallar descanso
      en la certeza de Tu amor. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за любов, яка залишається зі мною в усі часи життя. Коли я проходжу
      через труднощі, нагадуй мені, що Ти поруч. Допоможи мені знаходити спокій в упевненості
      Твоєї любові. В ім'я Ісуса Христа. Амінь.
- id: day_311
  ref: rm:5:8
  title:
    ru: Благодарность за крест
    en: Thanks for the Cross
    es: Gratitud por la Cruz
    uk: Подяка за хрест
  text:
    ru: Отец Небесный, благодарю Тебя за жертву Иисуса Христа. Через крест я получил прощение,
      мир с Богом и надежду вечной жизни. Помоги мне никогда не забывать цену моего спасения.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the sacrifice of Jesus Christ. Through the cross I
      have received forgiveness, peace with God, and the hope of eternal life. Help me never
      to forget the price of my salvation. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por el sacrificio de Jesucristo. Por medio de la cruz
      he recibido perdón, paz con Dios y la esperanza de la vida eterna. Ayúdame a no olvidar
      nunca el precio de mi salvación. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за жертву Ісуса Христа. Через хрест я отримав прощення,
      мир з Богом і надію вічного життя. Допоможи мені ніколи не забувати ціну мого спасіння.
      В ім'я Ісуса Христа. Амінь.
- id: day_312
  ref: eph:2:8
  title:
    ru: Жить в благодати
    en: Living in Grace
    es: Vivir en la Gracia
    uk: Жити в благодаті
  text:
    ru: Господи, помоги мне не полагаться на собственные заслуги, но жить в благодарности
      за Твою благодать. Напоминай мне, что все доброе приходит от Тебя. Во имя Иисуса Христа.
      Аминь.
    en: Lord, help me not to rely on my own merits but to live in gratitude for Your grace.
      Remind me that everything good comes from You. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a no apoyarme en mis propios méritos, sino a vivir agradecido por Tu
      gracia. Recuérdame que todo lo bueno viene de Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені не покладатися на власні заслуги, а жити у вдячності за Твою
      благодать. Нагадуй мені, що все добре приходить від Тебе. В ім'я Ісуса Христа. Амінь.
- id: day_313
  ref: ps:136:1
  title:
    ru: Верность Божьей любви
    en: The Faithfulness of God's Love
    es: La Fidelidad del Amor de Dios
    uk: Вірність Божої любові
  text:
    ru: Отец Небесный, благодарю Тебя за то, что Твоя любовь никогда не иссякает. Люди могут
      подвести, обстоятельства могут измениться, но Ты остаешься верным. Помоги мне полностью
      доверять Тебе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You that Your love never runs dry. People may fail, circumstances
      may change, but You remain faithful. Help me to trust You completely. In the name of
      Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias porque Tu amor nunca se agota. Las personas pueden
      fallar, las circunstancias pueden cambiar, pero Tú permaneces fiel. Ayúdame a confiar
      plenamente en Ti. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за те, що Твоя любов ніколи не вичерпується. Люди можуть
      підвести, обставини можуть змінитися, але Ти залишаєшся вірним. Допоможи мені цілком
      довіряти Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_314
  ref: 1jo:4:19
  title:
    ru: Отражать Божью любовь
    en: Reflecting God's Love
    es: Reflejar el Amor de Dios
    uk: Відображати Божу любов
  text:
    ru: Господи, сделай меня проводником Твоей любви в этом мире. Помоги мне замечать нужды
      людей, поддерживать слабых и утешать скорбящих. Пусть через мою жизнь другие увидят
      Твою доброту. Во имя Иисуса Христа. Аминь.
    en: Lord, make me a channel of Your love in this world. Help me to notice people's needs,
      to support the weak, and to comfort the grieving. May others see Your goodness through
      my life. In the name of Jesus Christ. Amen.
    es: Señor, hazme un canal de Tu amor en este mundo. Ayúdame a notar las necesidades de
      las personas, a sostener a los débiles y a consolar a los afligidos. Que los demás vean
      Tu bondad por medio de mi vida. En el nombre de Jesucristo. Amén.
    uk: Господи, зроби мене провідником Твоєї любові в цьому світі. Допоможи мені помічати
      потреби людей, підтримувати слабких і втішати тих, хто сумує. Нехай інші бачать Твою
      доброту через моє життя. В ім'я Ісуса Христа. Амінь.
- id: day_315
  ref: ps:145:9
  title:
    ru: Благодарность за Божье сердце
    en: Thanks for God's Heart
    es: Gratitud por el Corazón de Dios
    uk: Подяка за Боже серце
  text:
    ru: Отец Небесный, благодарю Тебя за Твое любящее сердце. Спасибо за Твою милость, благодать,
      терпение и верность. Помоги мне жить каждый день в ответ на Твою любовь и прославлять
      Тебя всей своей жизнью. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your loving heart. Thank You for Your mercy, grace,
      patience, and faithfulness. Help me to live each day in response to Your love and to
      glorify You with my whole life. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu corazón lleno de amor. Gracias por Tu misericordia,
      Tu gracia, Tu paciencia y Tu fidelidad. Ayúdame a vivir cada día en respuesta a Tu amor
      y a glorificarte con toda mi vida. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твоє люблячe серце. Дякую за Твою милість, благодать,
      терпіння й вірність. Допоможи мені жити кожен день у відповідь на Твою любов і прославляти
      Тебе всім своїм життям. В ім'я Ісуса Христа. Амінь.
- id: day_316
  ref: jm:1:5
  title:
    ru: Мудрость свыше
    en: Wisdom from Above
    es: Sabiduría de lo Alto
    uk: Мудрість згори
  text:
    ru: Отец Небесный, даруй мне мудрость, которая приходит от Тебя. Помоги мне смотреть на
      обстоятельства не только глазами разума, но и глазами веры. Научи меня принимать решения,
      которые будут угодны Тебе и принесут добрый плод. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, grant me the wisdom that comes from You. Help me to look at circumstances
      not only with the eyes of reason but also with the eyes of faith. Teach me to make decisions
      that please You and bear good fruit. In the name of Jesus Christ. Amen.
    es: Padre Celestial, concédeme la sabiduría que viene de Ti. Ayúdame a mirar las circunstancias
      no solo con los ojos de la razón, sino también con los ojos de la fe. Enséñame a tomar
      decisiones que te agraden y den buen fruto. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, даруй мені мудрість, яка приходить від Тебе. Допоможи мені дивитися
      на обставини не лише очима розуму, а й очима віри. Навчи мене приймати рішення, які
      будуть угодні Тобі й принесуть добрий плід. В ім'я Ісуса Христа. Амінь.
- id: day_317
  ref: ps:119:35
  title:
    ru: Следовать Божьим путям
    en: Following God's Ways
    es: Seguir los Caminos de Dios
    uk: Іти Божими дорогами
  text:
    ru: Господи, помоги мне не искать собственных путей, но следовать за Тобой. Когда передо
      мной открываются разные дороги, направляй мои шаги и учи выбирать то, что соответствует
      Твоей воле. Во имя Иисуса Христа. Аминь.
    en: Lord, help me not to seek my own ways but to follow You. When different roads open
      before me, direct my steps and teach me to choose what aligns with Your will. In the
      name of Jesus Christ. Amen.
    es: Señor, ayúdame a no buscar mis propios caminos, sino a seguirte a Ti. Cuando se abran
      ante mí distintos caminos, dirige mis pasos y enséñame a elegir lo que concuerda con
      Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені не шукати власних доріг, а йти за Тобою. Коли переді мною відкриваються
      різні дороги, скеровуй мої кроки й навчи обирати те, що відповідає Твоїй волі. В ім'я
      Ісуса Христа. Амінь.
- id: day_318
  ref: prv:9:10
  title:
    ru: Страх Господень
    en: The Fear of the Lord
    es: El Temor del Señor
    uk: Страх Господній
  text:
    ru: Отец Небесный, помоги мне жить в благоговении перед Тобой. Пусть уважение к Тебе влияет
      на мои решения, слова и поступки. Научи меня ненавидеть зло и любить праведность. Во
      имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to live in reverence before You. May my respect for You shape
      my decisions, my words, and my actions. Teach me to hate evil and to love righteousness.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a vivir en reverencia delante de Ti. Que mi respeto hacia
      Ti modele mis decisiones, mis palabras y mis actos. Enséñame a aborrecer el mal y a
      amar la justicia. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені жити в благоговінні перед Тобою. Нехай повага до Тебе
      впливає на мої рішення, слова й вчинки. Навчи мене ненавидіти зло й любити праведність.
      В ім'я Ісуса Христа. Амінь.
- id: day_319
  ref: jm:1:22
  title:
    ru: Послушное сердце
    en: An Obedient Heart
    es: Un Corazón Obediente
    uk: Слухняне серце
  text:
    ru: Господи, дай мне сердце, готовое повиноваться Тебе. Помоги не спорить с Твоей волей
      и не откладывать исполнение того, что Ты открываешь через Свое Слово. Научи меня доверять
      Тебе полностью. Во имя Иисуса Христа. Аминь.
    en: Lord, give me a heart ready to obey You. Help me not to argue with Your will or to
      delay doing what You reveal through Your Word. Teach me to trust You fully. In the name
      of Jesus Christ. Amen.
    es: Señor, dame un corazón dispuesto a obedecerte. Ayúdame a no discutir con Tu voluntad
      ni a posponer el cumplimiento de lo que revelas por medio de Tu Palabra. Enséñame a
      confiar plenamente en Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, дай мені серце, готове коритися Тобі. Допоможи не сперечатися з Твоєю волею
      й не відкладати виконання того, що Ти відкриваєш через Своє Слово. Навчи мене довіряти
      Тобі цілком. В ім'я Ісуса Христа. Амінь.
- id: day_320
  ref: prv:3:6
  title:
    ru: Божье руководство
    en: God's Guidance
    es: La Guía de Dios
    uk: Боже керівництво
  text:
    ru: Отец Небесный, благодарю Тебя за обещание направлять Своих детей. Помоги мне искать
      Твоего совета прежде, чем принимать решения. Веди меня путями мира, истины и праведности.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the promise to guide Your children. Help me to seek
      Your counsel before making decisions. Lead me in the ways of peace, truth, and righteousness.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por la promesa de guiar a Tus hijos. Ayúdame a buscar
      Tu consejo antes de tomar decisiones. Guíame por los caminos de la paz, la verdad y
      la justicia. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за обіцянку скеровувати Своїх дітей. Допоможи мені шукати
      Твоєї поради перш, ніж приймати рішення. Веди мене дорогами миру, істини й праведності.
      В ім'я Ісуса Христа. Амінь.
- id: day_321
  ref: eph:5:16
  title:
    ru: Управление временем
    en: Stewardship of Time
    es: Administración del Tiempo
    uk: Розпорядження часом
  text:
    ru: Господи, научи меня мудро использовать время, которое Ты мне даровал. Помоги не тратить
      дни впустую, но жить осмысленно и посвящать силы тому, что действительно важно. Во имя
      Иисуса Христа. Аминь.
    en: Lord, teach me to use wisely the time You have given me. Help me not to waste my days
      in vain but to live with purpose and to devote my strength to what truly matters. In
      the name of Jesus Christ. Amen.
    es: Señor, enséñame a usar con sabiduría el tiempo que me has dado. Ayúdame a no malgastar
      mis días en vano, sino a vivir con propósito y a dedicar mis fuerzas a lo que de verdad
      importa. En el nombre de Jesucristo. Amén.
    uk: Господи, навчи мене мудро використовувати час, який Ти дарував мені. Допоможи не марнувати
      днів даремно, а жити осмислено й присвячувати сили тому, що справді важливе. В ім'я
      Ісуса Христа. Амінь.
- id: day_322
  ref: ph:4:8
  title:
    ru: Чистота мыслей
    en: Purity of Mind
    es: Pureza de Pensamiento
    uk: Чистота думок
  text:
    ru: Отец Небесный, сохрани мой разум от всего, что не приносит пользы душе. Помоги мне
      наполнять свои мысли истиной Твоего Слова и размышлять о том, что угодно Тебе. Во имя
      Иисуса Христа. Аминь.
    en: Heavenly Father, keep my mind from everything that brings no good to my soul. Help
      me to fill my thoughts with the truth of Your Word and to meditate on what is pleasing
      to You. In the name of Jesus Christ. Amen.
    es: Padre Celestial, guarda mi mente de todo lo que no aporta bien a mi alma. Ayúdame
      a llenar mis pensamientos con la verdad de Tu Palabra y a meditar en lo que te agrada.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, збережи мій розум від усього, що не приносить користі душі. Допоможи
      мені наповнювати свої думки істиною Твого Слова й роздумувати про те, що угодне Тобі.
      В ім'я Ісуса Христа. Амінь.
- id: day_323
  ref: ps:141:3
  title:
    ru: Мудрость в словах
    en: Wisdom in Words
    es: Sabiduría en las Palabras
    uk: Мудрість у словах
  text:
    ru: Господи, поставь стражу у моих уст. Помоги мне говорить вовремя, с любовью и рассудительностью.
      Сохрани меня от пустых, резких и необдуманных слов. Во имя Иисуса Христа. Аминь.
    en: Lord, set a guard over my lips. Help me to speak at the right time, with love and
      discernment. Keep me from empty, harsh, and thoughtless words. In the name of Jesus
      Christ. Amen.
    es: Señor, pon guarda a mis labios. Ayúdame a hablar en el momento oportuno, con amor
      y discernimiento. Guárdame de las palabras vanas, ásperas e irreflexivas. En el nombre
      de Jesucristo. Amén.
    uk: Господи, постав сторожу біля моїх уст. Допоможи мені говорити вчасно, з любов'ю та
      розсудливістю. Збережи мене від порожніх, різких і необдуманих слів. В ім'я Ісуса Христа.
      Амінь.
- id: day_324
  ref: lk:16:10
  title:
    ru: Верность в малом
    en: Faithfulness in Little
    es: Fidelidad en lo Poco
    uk: Вірність у малому
  text:
    ru: Отец Небесный, помоги мне быть ответственным в том, что Ты доверил мне сегодня. Научи
      меня не пренебрегать малыми обязанностями и помнить, что верность начинается с небольших
      шагов. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be responsible in what You have entrusted to me today.
      Teach me not to neglect small duties and to remember that faithfulness begins with little
      steps. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a ser responsable en lo que me has confiado hoy. Enséñame
      a no descuidar los pequeños deberes y a recordar que la fidelidad comienza con pasos
      pequeños. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені бути відповідальним у тому, що Ти довірив мені сьогодні.
      Навчи мене не нехтувати малими обов'язками й пам'ятати, що вірність починається з невеликих
      кроків. В ім'я Ісуса Христа. Амінь.
- id: day_325
  ref: ps:143:10
  title:
    ru: Сердце ученика
    en: A Disciple's Heart
    es: Un Corazón de Discípulo
    uk: Серце учня
  text:
    ru: Господи, сохрани во мне желание учиться и возрастать. Помоги мне принимать наставления,
      исправление и мудрые советы. Научи меня быть учеником Христа каждый день моей жизни.
      Во имя Иисуса Христа. Аминь.
    en: Lord, keep alive in me the desire to learn and to grow. Help me to receive instruction,
      correction, and wise counsel. Teach me to be a disciple of Christ every day of my life.
      In the name of Jesus Christ. Amen.
    es: Señor, mantén vivo en mí el deseo de aprender y crecer. Ayúdame a recibir enseñanza,
      corrección y consejo sabio. Enséñame a ser discípulo de Cristo todos los días de mi
      vida. En el nombre de Jesucristo. Amén.
    uk: Господи, збережи в мені бажання вчитися й зростати. Допоможи мені приймати настанови,
      виправлення й мудрі поради. Навчи мене бути учнем Христа кожного дня мого життя. В ім'я
      Ісуса Христа. Амінь.
- id: day_326
  ref: prv:14:29
  title:
    ru: Терпение в принятии решений
    en: Patience in Making Decisions
    es: Paciencia al Tomar Decisiones
    uk: Терпіння в прийнятті рішень
  text:
    ru: Отец Небесный, помоги мне не спешить там, где нужна мудрость. Научи меня ожидать Твоего
      руководства и не действовать под влиянием страха или эмоций. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me not to hurry where wisdom is needed. Teach me to wait for
      Your guidance and not to act under the sway of fear or emotion. In the name of Jesus
      Christ. Amen.
    es: Padre Celestial, ayúdame a no apresurarme donde hace falta sabiduría. Enséñame a esperar
      Tu dirección y a no actuar bajo el dominio del temor o las emociones. En el nombre de
      Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені не поспішати там, де потрібна мудрість. Навчи мене очікувати
      Твого керівництва й не діяти під впливом страху чи емоцій. В ім'я Ісуса Христа. Амінь.
- id: day_327
  ref: jo:17:17
  title:
    ru: Хождение в истине
    en: Walking in the Truth
    es: Andar en la Verdad
    uk: Ходіння в істині
  text:
    ru: Господи, помоги мне жить согласно Твоему Слову. Пусть истина будет основанием моих
      решений, отношений и поступков. Сохрани меня от компромиссов с совестью и Твоей волей.
      Во имя Иисуса Христа. Аминь.
    en: Lord, help me to live according to Your Word. May truth be the foundation of my decisions,
      relationships, and actions. Keep me from compromising my conscience and Your will. In
      the name of Jesus Christ. Amen.
    es: Señor, ayúdame a vivir conforme a Tu Palabra. Que la verdad sea el fundamento de mis
      decisiones, mis relaciones y mis actos. Guárdame de transigir con mi conciencia y con
      Tu voluntad. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені жити згідно з Твоїм Словом. Нехай істина буде основою моїх
      рішень, стосунків і вчинків. Збережи мене від компромісів із сумлінням і Твоєю волею.
      В ім'я Ісуса Христа. Амінь.
- id: day_328
  ref: jm:1:19
  title:
    ru: Мудрость в отношениях
    en: Wisdom in Relationships
    es: Sabiduría en las Relaciones
    uk: Мудрість у стосунках
  text:
    ru: Отец Небесный, помоги мне строить отношения с людьми по Твоим принципам. Научи меня
      слушать внимательно, говорить с любовью и проявлять терпение. Пусть через мое отношение
      к людям прославляется Твое имя. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to build my relationships with people according to Your principles.
      Teach me to listen carefully, to speak with love, and to show patience. May Your name
      be glorified through the way I treat people. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a edificar mis relaciones con las personas según Tus principios.
      Enséñame a escuchar con atención, a hablar con amor y a mostrar paciencia. Que Tu nombre
      sea glorificado por mi manera de tratar a los demás. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені будувати стосунки з людьми за Твоїми принципами. Навчи
      мене слухати уважно, говорити з любов'ю й виявляти терпіння. Нехай через моє ставлення
      до людей прославляється Твоє ім'я. В ім'я Ісуса Христа. Амінь.
- id: day_329
  ref: 2pe:3:18
  title:
    ru: Возрастание в зрелости
    en: Growing in Maturity
    es: Crecer en Madurez
    uk: Зростання у зрілості
  text:
    ru: Господи, помоги мне возрастать духовно и не оставаться младенцем в вере. Формируй
      мой характер через Твое Слово и жизненные обстоятельства. Делай меня более похожим на
      Иисуса Христа. Во имя Его. Аминь.
    en: Lord, help me to grow spiritually and not to remain an infant in the faith. Shape
      my character through Your Word and through life's circumstances. Make me more like Jesus
      Christ. In His name. Amen.
    es: Señor, ayúdame a crecer espiritualmente y a no quedarme como un niño en la fe. Forma
      mi carácter por medio de Tu Palabra y de las circunstancias de la vida. Hazme más semejante
      a Jesucristo. En Su nombre. Amén.
    uk: Господи, допоможи мені зростати духовно й не залишатися немовлям у вірі. Формуй мій
      характер через Твоє Слово й життєві обставини. Роби мене подібнішим до Ісуса Христа.
      В ім'я Його. Амінь.
- id: day_330
  ref: eph:5:15
  title:
    ru: Мудрая жизнь перед Богом
    en: A Wise Life before God
    es: Una Vida Sabia delante de Dios
    uk: Мудре життя перед Богом
  text:
    ru: Отец Небесный, благодарю Тебя за все уроки, которые Ты преподаешь мне на жизненном
      пути. Помоги мне жить мудро, принимать правильные решения и оставаться верным Тебе до
      конца. Пусть каждый мой день приносит славу Твоему имени. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for all the lessons You teach me along life's path. Help
      me to live wisely, to make right decisions, and to remain faithful to You to the end.
      May each of my days bring glory to Your name. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por todas las lecciones que me enseñas en el camino
      de la vida. Ayúdame a vivir con sabiduría, a tomar decisiones correctas y a permanecer
      fiel a Ti hasta el fin. Que cada uno de mis días dé gloria a Tu nombre. En el nombre
      de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за всі уроки, які Ти подаєш мені на життєвому шляху. Допоможи
      мені жити мудро, приймати правильні рішення й залишатися вірним Тобі до кінця. Нехай
      кожен мій день приносить славу Твоєму імені. В ім'я Ісуса Христа. Амінь.
- id: day_331
  ref: mt:5:16
  title:
    ru: Быть светом миру
    en: To Be Light to the World
    es: Ser Luz para el Mundo
    uk: Бути світлом світу
  text:
    ru: Отец Небесный, помоги мне быть светом в этом мире. Пусть мои слова, поступки и отношение
      к людям отражают Твою любовь и истину. Используй мою жизнь для того, чтобы другие могли
      увидеть Тебя и прославить Твое имя. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be light in this world. May my words, actions, and attitude
      toward people reflect Your love and truth. Use my life so that others may see You and
      glorify Your name. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a ser luz en este mundo. Que mis palabras, mis actos y mi
      actitud hacia las personas reflejen Tu amor y Tu verdad. Usa mi vida para que los demás
      puedan verte y glorifiquen Tu nombre. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені бути світлом у цьому світі. Нехай мої слова, вчинки й
      ставлення до людей відображають Твою любов та істину. Використовуй моє життя, щоб інші
      могли побачити Тебе й прославити Твоє ім'я. В ім'я Ісуса Христа. Амінь.
- id: day_332
  ref: mk:10:45
  title:
    ru: Сердце служителя
    en: A Servant's Heart
    es: Un Corazón de Siervo
    uk: Серце служителя
  text:
    ru: Господи, освободи меня от стремления жить только для себя. Научи меня замечать нужды
      окружающих и быть готовым служить им с радостью и любовью. Помоги мне следовать примеру
      Иисуса Христа. Во имя Иисуса Христа. Аминь.
    en: Lord, free me from the urge to live only for myself. Teach me to notice the needs
      of those around me and to be ready to serve them with joy and love. Help me to follow
      the example of Jesus Christ. In the name of Jesus Christ. Amen.
    es: Señor, líbrame del afán de vivir solo para mí mismo. Enséñame a notar las necesidades
      de quienes me rodean y a estar dispuesto a servirles con gozo y amor. Ayúdame a seguir
      el ejemplo de Jesucristo. En el nombre de Jesucristo. Amén.
    uk: Господи, звільни мене від прагнення жити лише для себе. Навчи мене помічати потреби
      оточення й бути готовим служити їм з радістю та любов'ю. Допоможи мені йти за прикладом
      Ісуса Христа. В ім'я Ісуса Христа. Амінь.
- id: day_333
  ref: 1co:7:17
  title:
    ru: Верность своему призванию
    en: Faithfulness to One's Calling
    es: Fidelidad al Propio Llamado
    uk: Вірність своєму покликанню
  text:
    ru: Отец Небесный, благодарю Тебя за призвание, которое Ты приготовил для меня. Помоги
      мне быть верным в том месте, куда Ты меня поставил. Не позволяй мне сравнивать себя
      с другими, но научи исполнять Твою волю с радостью. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the calling You have prepared for me. Help me to be
      faithful in the place where You have set me. Do not let me compare myself with others,
      but teach me to do Your will with joy. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por el llamado que has preparado para mí. Ayúdame
      a ser fiel en el lugar donde me has puesto. No permitas que me compare con los demás,
      sino enséñame a cumplir Tu voluntad con gozo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за покликання, яке Ти приготував для мене. Допоможи мені
      бути вірним у тому місці, куди Ти мене поставив. Не дозволь мені порівнювати себе з
      іншими, а навчи виконувати Твою волю з радістю. В ім'я Ісуса Христа. Амінь.
- id: day_334
  ref: mt:5:16
  title:
    ru: Добрые дела для славы Божьей
    en: Good Deeds for God's Glory
    es: Buenas Obras para la Gloria de Dios
    uk: Добрі справи для слави Божої
  text:
    ru: Господи, помоги мне совершать добро не ради похвалы людей, а ради Твоей славы. Научи
      меня быть щедрым, отзывчивым и внимательным к нуждам других. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to do good not for the praise of people but for Your glory. Teach me
      to be generous, responsive, and attentive to the needs of others. In the name of Jesus
      Christ. Amen.
    es: Señor, ayúdame a hacer el bien no por la alabanza de las personas, sino para Tu gloria.
      Enséñame a ser generoso, solícito y atento a las necesidades de los demás. En el nombre
      de Jesucristo. Amén.
    uk: Господи, допоможи мені робити добро не заради похвали людей, а заради Твоєї слави.
      Навчи мене бути щедрим, чуйним і уважним до потреб інших. В ім'я Ісуса Христа. Амінь.
- id: day_335
  ref: gl:6:2
  title:
    ru: Благословение для окружающих
    en: A Blessing to Those Around Me
    es: Bendición para los que Me Rodean
    uk: Благословення для оточення
  text:
    ru: Отец Небесный, сделай меня благословением для людей, которых Ты приводишь в мою жизнь.
      Помоги мне ободрять уставших, поддерживать слабых и утешать скорбящих. Используй меня
      как инструмент Твоей любви. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, make me a blessing to the people You bring into my life. Help me
      to encourage the weary, support the weak, and comfort the grieving. Use me as an instrument
      of Your love. In the name of Jesus Christ. Amen.
    es: Padre Celestial, hazme una bendición para las personas que traes a mi vida. Ayúdame
      a animar a los cansados, sostener a los débiles y consolar a los afligidos. Úsame como
      instrumento de Tu amor. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, зроби мене благословенням для людей, яких Ти приводиш у моє життя.
      Допоможи мені підбадьорювати втомлених, підтримувати слабких і втішати тих, хто сумує.
      Використовуй мене як знаряддя Твоєї любові. В ім'я Ісуса Христа. Амінь.
- id: day_336
  ref: 1pe:3:15
  title:
    ru: Мудрость в свидетельстве
    en: Wisdom in Witness
    es: Sabiduría al Testificar
    uk: Мудрість у свідченні
  text:
    ru: Господи, дай мне мудрость говорить о Тебе так, чтобы мои слова приносили пользу и
      надежду людям. Помоги мне не стыдиться Евангелия и быть готовым рассказать о вере каждому,
      кто спрашивает. Во имя Иисуса Христа. Аминь.
    en: Lord, give me wisdom to speak of You in such a way that my words bring benefit and
      hope to people. Help me not to be ashamed of the Gospel and to be ready to tell about
      my faith to everyone who asks. In the name of Jesus Christ. Amen.
    es: Señor, dame sabiduría para hablar de Ti de manera que mis palabras traigan provecho
      y esperanza a las personas. Ayúdame a no avergonzarme del Evangelio y a estar dispuesto
      a hablar de mi fe a todo el que pregunte. En el nombre de Jesucristo. Amén.
    uk: Господи, дай мені мудрість говорити про Тебе так, щоб мої слова приносили користь
      і надію людям. Допоможи мені не соромитися Євангелії й бути готовим розповісти про віру
      кожному, хто запитує. В ім'я Ісуса Христа. Амінь.
- id: day_337
  ref: 1pe:4:10
  title:
    ru: Использовать данные Богом дары
    en: Using the Gifts God Has Given
    es: Usar los Dones que Dios Ha Dado
    uk: Використовувати дані Богом дари
  text:
    ru: Отец Небесный, благодарю Тебя за способности и таланты, которые Ты доверил мне. Помоги
      использовать их мудро и для пользы других людей. Сохрани меня от гордости и научи быть
      хорошим управителем Твоих даров. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for the abilities and talents You have entrusted to me.
      Help me to use them wisely and for the good of others. Keep me from pride and teach
      me to be a good steward of Your gifts. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por las capacidades y talentos que me has confiado.
      Ayúdame a usarlos con sabiduría y para el bien de los demás. Guárdame del orgullo y
      enséñame a ser buen administrador de Tus dones. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за здібності й таланти, які Ти довірив мені. Допоможи використовувати
      їх мудро й на користь інших людей. Збережи мене від гордості й навчи бути добрим управителем
      Твоїх дарів. В ім'я Ісуса Христа. Амінь.
- id: day_338
  ref: 1jo:3:18
  title:
    ru: Любовь в действии
    en: Love in Action
    es: El Amor en Acción
    uk: Любов у дії
  text:
    ru: Господи, помоги мне проявлять любовь не только словами, но и делами. Открой мои глаза
      на нужды людей вокруг меня и дай готовность помогать там, где это возможно. Во имя Иисуса
      Христа. Аминь.
    en: Lord, help me to show love not only with words but also with deeds. Open my eyes to
      the needs of the people around me and give me a readiness to help wherever it is possible.
      In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a mostrar amor no solo con palabras, sino también con obras. Abre mis
      ojos a las necesidades de las personas que me rodean y dame disposición para ayudar
      dondequiera que sea posible. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені виявляти любов не лише словами, а й ділами. Відкрий мої очі
      на потреби людей навколо мене й дай готовність допомагати там, де це можливо. В ім'я
      Ісуса Христа. Амінь.
- id: day_339
  ref: gl:6:9
  title:
    ru: Верность в служении
    en: Faithfulness in Service
    es: Fidelidad en el Servicio
    uk: Вірність у служінні
  text:
    ru: Отец Небесный, помоги мне не уставать делать добро. Когда результаты не видны сразу,
      укрепляй мою веру и напоминай, что всякий труд для Тебя имеет значение. Во имя Иисуса
      Христа. Аминь.
    en: Heavenly Father, help me not to grow weary in doing good. When the results are not
      seen at once, strengthen my faith and remind me that all labor for You has meaning.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a no cansarme de hacer el bien. Cuando los resultados no
      se vean de inmediato, fortalece mi fe y recuérdame que todo trabajo para Ti tiene significado.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені не втомлюватися робити добро. Коли результати не видно
      одразу, зміцнюй мою віру й нагадуй, що всяка праця для Тебе має значення. В ім'я Ісуса
      Христа. Амінь.
- id: day_340
  ref: act:20:35
  title:
    ru: Сердце, готовое помочь
    en: A Heart Ready to Help
    es: Un Corazón Dispuesto a Ayudar
    uk: Серце, готове допомогти
  text:
    ru: Господи, сделай меня внимательным к людям. Помоги замечать тех, кто нуждается в поддержке,
      добром слове или молитве. Научи меня быть отзывчивым и щедрым. Во имя Иисуса Христа.
      Аминь.
    en: Lord, make me attentive to people. Help me to notice those who need support, a kind
      word, or a prayer. Teach me to be responsive and generous. In the name of Jesus Christ.
      Amen.
    es: Señor, hazme atento a las personas. Ayúdame a notar a quienes necesitan apoyo, una
      palabra amable o una oración. Enséñame a ser solícito y generoso. En el nombre de Jesucristo.
      Amén.
    uk: Господи, зроби мене уважним до людей. Допоможи мені помічати тих, хто потребує підтримки,
      доброго слова чи молитви. Навчи мене бути чуйним і щедрим. В ім'я Ісуса Христа. Амінь.
- id: day_341
  ref: 1tm:4:12
  title:
    ru: Влияние через пример
    en: Influence through Example
    es: Influir con el Ejemplo
    uk: Вплив через приклад
  text:
    ru: Отец Небесный, помоги мне быть добрым примером для окружающих. Пусть моя жизнь свидетельствует
      о Твоей работе во мне. Сохрани меня от лицемерия и научи жить согласно тому, чему я
      верю. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to be a good example to those around me. May my life bear
      witness to Your work in me. Keep me from hypocrisy and teach me to live according to
      what I believe. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a ser un buen ejemplo para quienes me rodean. Que mi vida
      dé testimonio de Tu obra en mí. Guárdame de la hipocresía y enséñame a vivir conforme
      a lo que creo. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені бути добрим прикладом для оточення. Нехай моє життя свідчить
      про Твою працю в мені. Збережи мене від лицемірства й навчи жити згідно з тим, у що
      я вірю. В ім'я Ісуса Христа. Амінь.
- id: day_342
  ref: eph:4:32
  title:
    ru: Сострадание к людям
    en: Compassion for People
    es: Compasión por las Personas
    uk: Співчуття до людей
  text:
    ru: Господи, наполни мое сердце состраданием. Помоги мне видеть людей Твоими глазами и
      относиться к ним с милостью и терпением. Научи меня отражать Твое сердце в повседневной
      жизни. Во имя Иисуса Христа. Аминь.
    en: Lord, fill my heart with compassion. Help me to see people through Your eyes and to
      treat them with mercy and patience. Teach me to reflect Your heart in everyday life.
      In the name of Jesus Christ. Amen.
    es: Señor, llena mi corazón de compasión. Ayúdame a ver a las personas con Tus ojos y
      a tratarlas con misericordia y paciencia. Enséñame a reflejar Tu corazón en la vida
      cotidiana. En el nombre de Jesucristo. Amén.
    uk: Господи, наповни моє серце співчуттям. Допоможи мені бачити людей Твоїми очима й ставитися
      до них з милістю та терпінням. Навчи мене відображати Твоє серце в повсякденному житті.
      В ім'я Ісуса Христа. Амінь.
- id: day_343
  ref: re:2:10
  title:
    ru: Верность до конца
    en: Faithfulness to the End
    es: Fidelidad hasta el Fin
    uk: Вірність до кінця
  text:
    ru: Отец Небесный, помоги мне оставаться верным в служении, которое Ты доверил мне. Не
      позволяй трудностям или усталости остановить меня. Укрепляй меня и веди вперед Своей
      рукой. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to remain faithful in the service You have entrusted to me.
      Do not let difficulties or weariness stop me. Strengthen me and lead me forward by Your
      hand. In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a permanecer fiel en el servicio que me has confiado. No
      permitas que las dificultades o el cansancio me detengan. Fortaléceme y guíame hacia
      adelante con Tu mano. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені залишатися вірним у служінні, яке Ти довірив мені. Не
      дозволь труднощам чи втомі зупинити мене. Зміцнюй мене й веди вперед Своєю рукою. В
      ім'я Ісуса Христа. Амінь.
- id: day_344
  ref: 1co:6:20
  title:
    ru: Прославлять Бога своей жизнью
    en: Glorifying God with My Life
    es: Glorificar a Dios con mi Vida
    uk: Прославляти Бога своїм життям
  text:
    ru: Господи, пусть моя жизнь будет свидетельством Твоей благодати. Помоги мне жить так,
      чтобы люди видели не меня, а Тебя. Направляй мои слова, решения и поступки для Твоей
      славы. Во имя Иисуса Христа. Аминь.
    en: Lord, may my life be a testimony of Your grace. Help me to live so that people see
      not me but You. Direct my words, decisions, and actions for Your glory. In the name
      of Jesus Christ. Amen.
    es: Señor, que mi vida sea un testimonio de Tu gracia. Ayúdame a vivir de modo que las
      personas no me vean a mí, sino a Ti. Dirige mis palabras, decisiones y actos para Tu
      gloria. En el nombre de Jesucristo. Amén.
    uk: Господи, нехай моє життя буде свідченням Твоєї благодаті. Допоможи мені жити так,
      щоб люди бачили не мене, а Тебе. Скеровуй мої слова, рішення й вчинки для Твоєї слави.
      В ім'я Ісуса Христа. Амінь.
- id: day_345
  ref: jo:15:8
  title:
    ru: Плодотворная жизнь
    en: A Fruitful Life
    es: Una Vida Fructífera
    uk: Плідне життя
  text:
    ru: Отец Небесный, благодарю Тебя за возможность участвовать в Твоем деле. Помоги мне
      прожить жизнь не напрасно, но приносить плод, который прославляет Тебя и приносит пользу
      людям. Пусть все, что я делаю, будет совершаться в любви и верности Тебе. Во имя Иисуса
      Христа. Аминь.
    en: Heavenly Father, thank You for the opportunity to take part in Your work. Help me
      not to live my life in vain but to bear fruit that glorifies You and benefits people.
      May all that I do be done in love and faithfulness to You. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, te doy gracias por la oportunidad de participar en Tu obra. Ayúdame
      a no vivir mi vida en vano, sino a llevar fruto que te glorifique y sea de provecho
      para las personas. Que todo lo que haga lo haga con amor y fidelidad a Ti. En el nombre
      de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за можливість брати участь у Твоїй справі. Допоможи мені
      прожити життя не марно, а приносити плід, який прославляє Тебе й приносить користь людям.
      Нехай усе, що я роблю, звершується в любові й вірності Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_346
  ref: prv:16:3
  title:
    ru: Посвящение нового дня
    en: Dedicating a New Day
    es: Consagrar un Nuevo Día
    uk: Посвята нового дня
  text:
    ru: Отец Небесный, благодарю Тебя за этот день и за дыхание жизни, которое Ты даровал
      мне. Я посвящаю Тебе свои мысли, слова, дела и решения. Веди меня Своим путем и помоги
      прожить этот день так, чтобы он принес славу Твоему имени. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for this day and for the breath of life You have given
      me. I dedicate to You my thoughts, words, deeds, and decisions. Lead me in Your way
      and help me to live this day so that it brings glory to Your name. In the name of Jesus
      Christ. Amen.
    es: Padre Celestial, te doy gracias por este día y por el aliento de vida que me has dado.
      Te consagro mis pensamientos, palabras, obras y decisiones. Guíame por Tu camino y ayúdame
      a vivir este día de modo que dé gloria a Tu nombre. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за цей день і за подих життя, який Ти дарував мені. Я посвячую
      Тобі свої думки, слова, справи й рішення. Веди мене Своєю дорогою й допоможи прожити
      цей день так, щоб він приніс славу Твоєму імені. В ім'я Ісуса Христа. Амінь.
- id: day_347
  ref: re:2:10
  title:
    ru: Верность на жизненном пути
    en: Faithfulness on Life's Path
    es: Fidelidad en el Camino de la Vida
    uk: Вірність на життєвому шляху
  text:
    ru: Господи, помоги мне оставаться верным Тебе независимо от обстоятельств. Когда путь
      становится трудным, укрепляй мое сердце и напоминай о Твоих обещаниях. Научи меня доверять
      Тебе до конца. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to remain faithful to You regardless of circumstances. When the way
      becomes hard, strengthen my heart and remind me of Your promises. Teach me to trust
      You to the end. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a permanecer fiel a Ti sin importar las circunstancias. Cuando el camino
      se vuelva difícil, fortalece mi corazón y recuérdame Tus promesas. Enséñame a confiar
      en Ti hasta el fin. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені залишатися вірним Тобі незалежно від обставин. Коли шлях стає
      важким, зміцнюй моє серце й нагадуй про Твої обітниці. Навчи мене довіряти Тобі до кінця.
      В ім'я Ісуса Христа. Амінь.
- id: day_348
  ref: ps:103:2
  title:
    ru: Благодарность за пройденный путь
    en: Thanks for the Road Traveled
    es: Gratitud por el Camino Recorrido
    uk: Подяка за пройдений шлях
  text:
    ru: Отец Небесный, благодарю Тебя за все дни моей жизни. Спасибо за радости и трудности,
      через которые Ты вел меня. Помоги мне помнить Твою верность и никогда не забывать Твои
      благодеяния. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for all the days of my life. Thank You for the joys and
      the hardships through which You have led me. Help me to remember Your faithfulness and
      never to forget Your kindnesses. In the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por todos los días de mi vida. Gracias por las alegrías
      y las dificultades por las que me has guiado. Ayúdame a recordar Tu fidelidad y a no
      olvidar nunca Tus bondades. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за всі дні мого життя. Дякую за радощі й труднощі, через
      які Ти вів мене. Допоможи мені пам'ятати Твою вірність і ніколи не забувати Твоїх добродійств.
      В ім'я Ісуса Христа. Амінь.
- id: day_349
  ref: prv:3:5
  title:
    ru: Сердце, доверяющее Богу
    en: A Heart That Trusts God
    es: Un Corazón que Confía en Dios
    uk: Серце, що довіряє Богові
  text:
    ru: Господи, помоги мне доверять Тебе больше с каждым днем. Даже когда я не понимаю происходящего,
      научи меня покоиться в уверенности, что Ты все держишь под Своим контролем. Во имя Иисуса
      Христа. Аминь.
    en: Lord, help me to trust You more each day. Even when I do not understand what is happening,
      teach me to rest in the assurance that You hold everything under Your control. In the
      name of Jesus Christ. Amen.
    es: Señor, ayúdame a confiar en Ti más cada día. Aun cuando no entienda lo que sucede,
      enséñame a descansar en la certeza de que tienes todo bajo Tu control. En el nombre
      de Jesucristo. Amén.
    uk: Господи, допоможи мені довіряти Тобі більше з кожним днем. Навіть коли я не розумію
      того, що відбувається, навчи мене спочивати в упевненості, що Ти тримаєш усе під Своїм
      контролем. В ім'я Ісуса Христа. Амінь.
- id: day_350
  ref: ps:51:12
  title:
    ru: Радость спасения
    en: The Joy of Salvation
    es: El Gozo de la Salvación
    uk: Радість спасіння
  text:
    ru: Отец Небесный, обнови во мне радость спасения. Не позволь заботам и суете затмить
      величие того, что Ты сделал для меня через Иисуса Христа. Пусть благодарность всегда
      живет в моем сердце. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, renew in me the joy of salvation. Do not let cares and busyness overshadow
      the greatness of what You have done for me through Jesus Christ. May gratitude always
      live in my heart. In the name of Jesus Christ. Amen.
    es: Padre Celestial, renueva en mí el gozo de la salvación. No permitas que los afanes
      y el ajetreo opaquen la grandeza de lo que has hecho por mí por medio de Jesucristo.
      Que la gratitud habite siempre en mi corazón. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, онови в мені радість спасіння. Не дозволь турботам і метушні затьмарити
      велич того, що Ти зробив для мене через Ісуса Христа. Нехай вдячність завжди живе в
      моєму серці. В ім'я Ісуса Христа. Амінь.
- id: day_351
  ref: ps:145:13
  title:
    ru: Божья верность
    en: God's Faithfulness
    es: La Fidelidad de Dios
    uk: Божа вірність
  text:
    ru: Господи, благодарю Тебя за Твою неизменную верность. Ты был со мной вчера, Ты со мной
      сегодня и останешься со мной во все дни моей жизни. Помоги мне всегда помнить об этом
      и жить с уверенностью в Тебе. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for Your unchanging faithfulness. You were with me yesterday, You
      are with me today, and You will remain with me all the days of my life. Help me always
      to remember this and to live with confidence in You. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por Tu fidelidad inmutable. Estuviste conmigo ayer, estás conmigo
      hoy y permanecerás conmigo todos los días de mi vida. Ayúdame a recordarlo siempre y
      a vivir con confianza en Ti. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за Твою незмінну вірність. Ти був зі мною вчора, Ти зі мною сьогодні
      й залишишся зі мною в усі дні мого життя. Допоможи мені завжди пам'ятати про це й жити
      з упевненістю в Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_352
  ref: 1co:10:31
  title:
    ru: Жизнь для Божьей славы
    en: A Life for God's Glory
    es: Una Vida para la Gloria de Dios
    uk: Життя для Божої слави
  text:
    ru: Отец Небесный, помоги мне жить так, чтобы моя жизнь прославляла Тебя. Пусть мои решения,
      отношения и поступки отражают Твою любовь и истину. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to live so that my life glorifies You. May my decisions,
      relationships, and actions reflect Your love and truth. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, ayúdame a vivir de modo que mi vida te glorifique. Que mis decisiones,
      mis relaciones y mis actos reflejen Tu amor y Tu verdad. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, допоможи мені жити так, щоб моє життя прославляло Тебе. Нехай мої рішення,
      стосунки й вчинки відображають Твою любов та істину. В ім'я Ісуса Христа. Амінь.
- id: day_353
  ref: ph:4:7
  title:
    ru: Мир в сердце
    en: Peace in the Heart
    es: Paz en el Corazón
    uk: Мир у серці
  text:
    ru: Господи, наполни мое сердце Своим миром. Когда возникают тревоги и волнения, напоминай
      мне о Своем присутствии и заботе. Помоги мне отдыхать в Твоей любви. Во имя Иисуса Христа.
      Аминь.
    en: Lord, fill my heart with Your peace. When anxieties and worries arise, remind me of
      Your presence and care. Help me to rest in Your love. In the name of Jesus Christ. Amen.
    es: Señor, llena mi corazón de Tu paz. Cuando surjan las inquietudes y los afanes, recuérdame
      Tu presencia y Tu cuidado. Ayúdame a descansar en Tu amor. En el nombre de Jesucristo.
      Amén.
    uk: Господи, наповни моє серце Своїм миром. Коли виникають тривоги й хвилювання, нагадуй
      мені про Свою присутність і турботу. Допоможи мені спочивати у Твоїй любові. В ім'я
      Ісуса Христа. Амінь.
- id: day_354
  ref: hb:10:24
  title:
    ru: Благодарность за Церковь
    en: Thanks for the Church
    es: Gratitud por la Iglesia
    uk: Подяка за Церкву
  text:
    ru: Отец Небесный, благодарю Тебя за Твою Церковь и за людей, которых Ты поставил рядом
      со мной. Помоги нам поддерживать друг друга, возрастать в любви и вместе прославлять
      Тебя. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for Your Church and for the people You have placed beside
      me. Help us to support one another, to grow in love, and together to glorify You. In
      the name of Jesus Christ. Amen.
    es: Padre Celestial, te doy gracias por Tu Iglesia y por las personas que has puesto a
      mi lado. Ayúdanos a apoyarnos mutuamente, a crecer en amor y a glorificarte juntos.
      En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, дякую Тобі за Твою Церкву і за людей, яких Ти поставив поруч зі мною.
      Допоможи нам підтримувати одне одного, зростати в любові й разом прославляти Тебе. В
      ім'я Ісуса Христа. Амінь.
- id: day_355
  ref: 1pe:1:3
  title:
    ru: Надежда во Христе
    en: Hope in Christ
    es: Esperanza en Cristo
    uk: Надія у Христі
  text:
    ru: Господи, благодарю Тебя за живую надежду, которую я имею через Иисуса Христа. Помоги
      мне смотреть дальше временных трудностей и помнить о вечной жизни, которую Ты приготовил
      для Своих детей. Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for the living hope I have through Jesus Christ. Help me to look beyond
      temporary difficulties and to remember the eternal life You have prepared for Your children.
      In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por la esperanza viva que tengo por medio de Jesucristo. Ayúdame
      a mirar más allá de las dificultades temporales y a recordar la vida eterna que has
      preparado para Tus hijos. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за живу надію, яку я маю через Ісуса Христа. Допоможи мені дивитися
      далі тимчасових труднощів і пам'ятати про вічне життя, яке Ти приготував для Своїх дітей.
      В ім'я Ісуса Христа. Амінь.
- id: day_356
  ref: mt:22:37
  title:
    ru: Любовь к Богу
    en: Love for God
    es: Amor a Dios
    uk: Любов до Бога
  text:
    ru: Отец Небесный, помоги мне любить Тебя всем сердцем, всей душой и всем разумением.
      Пусть никакие земные вещи не займут в моей жизни место, которое принадлежит только Тебе.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to love You with all my heart, with all my soul, and with
      all my mind. May no earthly thing take the place in my life that belongs to You alone.
      In the name of Jesus Christ. Amen.
    es: Padre Celestial, ayúdame a amarte con todo mi corazón, con toda mi alma y con toda
      mi mente. Que ninguna cosa terrenal ocupe en mi vida el lugar que solo te pertenece
      a Ti. En el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені любити Тебе всім серцем, усією душею і всім розумом.
      Нехай жодна земна річ не займе в моєму житті місце, яке належить лише Тобі. В ім'я Ісуса
      Христа. Амінь.
- id: day_357
  ref: eph:2:8
  title:
    ru: Благодарность за благодать
    en: Thanks for Grace
    es: Gratitud por la Gracia
    uk: Подяка за благодать
  text:
    ru: Господи, благодарю Тебя за благодать, которая сопровождает меня каждый день. Спасибо
      за прощение, поддержку и надежду. Помоги мне жить в ответ на Твою любовь и милость.
      Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for the grace that accompanies me each day. Thank You for forgiveness,
      support, and hope. Help me to live in response to Your love and mercy. In the name of
      Jesus Christ. Amen.
    es: Señor, te doy gracias por la gracia que me acompaña cada día. Gracias por el perdón,
      el sostén y la esperanza. Ayúdame a vivir en respuesta a Tu amor y Tu misericordia.
      En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за благодать, яка супроводжує мене щодня. Дякую за прощення, підтримку
      й надію. Допоможи мені жити у відповідь на Твою любов і милість. В ім'я Ісуса Христа.
      Амінь.
- id: day_358
  ref: jr:29:11
  title:
    ru: Доверить Богу будущее
    en: Entrusting the Future to God
    es: Confiar el Futuro a Dios
    uk: Довірити Богові майбутнє
  text:
    ru: Отец Небесный, я доверяю Тебе свое будущее. Все мои планы, мечты и ожидания находятся
      в Твоих руках. Помоги мне идти вперед с верой и спокойствием. Во имя Иисуса Христа.
      Аминь.
    en: Heavenly Father, I entrust my future to You. All my plans, dreams, and expectations
      are in Your hands. Help me to go forward with faith and calm. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, te confío mi futuro. Todos mis planes, sueños y expectativas están
      en Tus manos. Ayúdame a seguir adelante con fe y calma. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, я довіряю Тобі своє майбутнє. Усі мої плани, мрії й очікування перебувають
      у Твоїх руках. Допоможи мені йти вперед з вірою й спокоєм. В ім'я Ісуса Христа. Амінь.
- id: day_359
  ref: ps:28:7
  title:
    ru: Господь — моя крепость
    en: The Lord Is My Stronghold
    es: El Señor Es mi Fortaleza
    uk: Господь — моя твердиня
  text:
    ru: Господи, благодарю Тебя за то, что Ты являешься моей крепостью и убежищем. Когда мои
      силы заканчиваются, напоминай мне, что Твоя сила никогда не иссякает. Во имя Иисуса
      Христа. Аминь.
    en: Lord, thank You that You are my stronghold and my refuge. When my strength runs out,
      remind me that Your strength never fails. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias porque eres mi fortaleza y mi refugio. Cuando mis fuerzas se
      agoten, recuérdame que Tu fuerza nunca falla. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за те, що Ти моя твердиня й пристановище. Коли мої сили вичерпуються,
      нагадуй мені, що Твоя сила ніколи не вичерпується. В ім'я Ісуса Христа. Амінь.
- id: day_360
  ref: ph:3:20
  title:
    ru: Ожидание вечности
    en: Awaiting Eternity
    es: Esperar la Eternidad
    uk: Очікування вічності
  text:
    ru: Отец Небесный, помоги мне жить с взглядом, обращенным к вечности. Напоминай мне, что
      моя настоящая родина находится у Тебя. Пусть эта надежда укрепляет меня каждый день.
      Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, help me to live with my gaze turned toward eternity. Remind me that
      my true homeland is with You. May this hope strengthen me each day. In the name of Jesus
      Christ. Amen.
    es: Padre Celestial, ayúdame a vivir con la mirada puesta en la eternidad. Recuérdame
      que mi verdadera patria está contigo. Que esta esperanza me fortalezca cada día. En
      el nombre de Jesucristo. Amén.
    uk: Отче Небесний, допоможи мені жити з поглядом, спрямованим до вічності. Нагадуй мені,
      що моя справжня батьківщина — у Тебе. Нехай ця надія зміцнює мене щодня. В ім'я Ісуса
      Христа. Амінь.
- id: day_361
  ref: ph:4:4
  title:
    ru: Радость в Господе
    en: Joy in the Lord
    es: Gozo en el Señor
    uk: Радість у Господі
  text:
    ru: Господи, наполни мое сердце радостью, которая исходит от Тебя. Помоги мне радоваться
      не только благословениям, но прежде всего Твоему присутствию в моей жизни. Во имя Иисуса
      Христа. Аминь.
    en: Lord, fill my heart with the joy that comes from You. Help me to rejoice not only
      in blessings but above all in Your presence in my life. In the name of Jesus Christ.
      Amen.
    es: Señor, llena mi corazón del gozo que viene de Ti. Ayúdame a gozarme no solo en las
      bendiciones, sino ante todo en Tu presencia en mi vida. En el nombre de Jesucristo.
      Amén.
    uk: Господи, наповни моє серце радістю, яка походить від Тебе. Допоможи мені радіти не
      лише благословенням, а передусім Твоїй присутності в моєму житті. В ім'я Ісуса Христа.
      Амінь.
- id: day_362
  ref: rm:1:17
  title:
    ru: Верность до конца пути
    en: Faithfulness to the End of the Road
    es: Fidelidad hasta el Fin del Camino
    uk: Вірність до кінця шляху
  text:
    ru: Отец Небесный, укрепляй меня на жизненном пути. Помоги не уклоняться от Твоей истины
      и сохранять верность Тебе во всех обстоятельствах. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, strengthen me on life's path. Help me not to turn aside from Your
      truth and to keep faithfulness to You in all circumstances. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, fortaléceme en el camino de la vida. Ayúdame a no apartarme de Tu
      verdad y a guardar fidelidad a Ti en toda circunstancia. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, зміцнюй мене на життєвому шляху. Допоможи не ухилятися від Твоєї істини
      й зберігати вірність Тобі за всіх обставин. В ім'я Ісуса Христа. Амінь.
- id: day_363
  ref: 2co:9:15
  title:
    ru: Благодарность за Иисуса Христа
    en: Thanks for Jesus Christ
    es: Gratitud por Jesucristo
    uk: Подяка за Ісуса Христа
  text:
    ru: Господи, благодарю Тебя за Иисуса Христа — моего Спасителя и Господа. Спасибо за крест,
      за воскресение и за надежду вечной жизни. Помоги мне жить достойно этого великого дара.
      Во имя Иисуса Христа. Аминь.
    en: Lord, thank You for Jesus Christ — my Savior and Lord. Thank You for the cross, for
      the resurrection, and for the hope of eternal life. Help me to live worthy of this great
      gift. In the name of Jesus Christ. Amen.
    es: Señor, te doy gracias por Jesucristo, mi Salvador y Señor. Gracias por la cruz, por
      la resurrección y por la esperanza de la vida eterna. Ayúdame a vivir de manera digna
      de este gran regalo. En el nombre de Jesucristo. Amén.
    uk: Господи, дякую Тобі за Ісуса Христа — мого Спасителя й Господа. Дякую за хрест, за
      воскресіння й за надію вічного життя. Допоможи мені жити гідно цього великого дару.
      В ім'я Ісуса Христа. Амінь.
- id: day_364
  ref: 1ts:5:18
  title:
    ru: Хвала Богу за всё
    en: Praise to God for Everything
    es: Alabanza a Dios por Todo
    uk: Хвала Богові за все
  text:
    ru: Отец Небесный, благодарю Тебя за каждый день, который Ты мне даровал. За радости и
      испытания, за победы и уроки, за Твою любовь и верность. Пусть моя жизнь будет постоянной
      хвалой Тебе. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, thank You for every day You have given me — for joys and trials,
      for victories and lessons, for Your love and faithfulness. May my life be a constant
      praise to You. In the name of Jesus Christ. Amen.
    es: 'Padre Celestial, te doy gracias por cada día que me has dado: por las alegrías y
      las pruebas, por las victorias y las lecciones, por Tu amor y Tu fidelidad. Que mi vida
      sea una alabanza constante a Ti. En el nombre de Jesucristo. Amén.'
    uk: Отче Небесний, дякую Тобі за кожен день, який Ти мені дарував, — за радощі й випробування,
      за перемоги й уроки, за Твою любов і вірність. Нехай моє життя буде постійною хвалою
      Тобі. В ім'я Ісуса Христа. Амінь.
- id: day_365
  ref: 1ts:4:17
  title:
    ru: До встречи с Господом
    en: Until I Meet the Lord
    es: Hasta Encontrarme con el Señor
    uk: До зустрічі з Господом
  text:
    ru: Господи, помоги мне проживать каждый день в вере, любви и надежде. Укрепляй меня до
      самого конца моего земного пути и сохрани верным Тебе. Пусть моя жизнь будет приготовлением
      к встрече с Тобой. Во имя Иисуса Христа. Аминь.
    en: Lord, help me to live each day in faith, love, and hope. Strengthen me to the very
      end of my earthly journey and keep me faithful to You. May my life be a preparation
      for meeting You. In the name of Jesus Christ. Amen.
    es: Señor, ayúdame a vivir cada día en fe, amor y esperanza. Fortaléceme hasta el final
      mismo de mi camino terrenal y guárdame fiel a Ti. Que mi vida sea una preparación para
      encontrarme contigo. En el nombre de Jesucristo. Amén.
    uk: Господи, допоможи мені проживати кожен день у вірі, любові й надії. Зміцнюй мене до
      самого кінця мого земного шляху й збережи вірним Тобі. Нехай моє життя буде приготуванням
      до зустрічі з Тобою. В ім'я Ісуса Христа. Амінь.
- id: day_366
  ref: 2pe:3:18
  title:
    ru: Вся слава Богу
    en: All Glory to God
    es: Toda la Gloria a Dios
    uk: Вся слава Богові
  text:
    ru: Отец Небесный, завершая этот путь молитвы, я благодарю Тебя за Твою любовь, милость
      и верность. Спасибо за каждый день, в который Ты учил, исправлял, укреплял и вел меня.
      Помоги мне продолжать искать Тебя всем сердцем и жить для Твоей славы. Пусть вся моя
      жизнь будет посвящена Тебе — сегодня и во веки веков. Во имя Иисуса Христа. Аминь.
    en: Heavenly Father, as I finish this journey of prayer, I thank You for Your love, mercy,
      and faithfulness. Thank You for every day in which You taught, corrected, strengthened,
      and led me. Help me to keep seeking You with all my heart and to live for Your glory.
      May my whole life be devoted to You — today and forever. In the name of Jesus Christ.
      Amen.
    es: Padre Celestial, al terminar este camino de oración, te doy gracias por Tu amor, Tu
      misericordia y Tu fidelidad. Gracias por cada día en que me enseñaste, corregiste, fortaleciste
      y guiaste. Ayúdame a seguir buscándote con todo mi corazón y a vivir para Tu gloria.
      Que toda mi vida esté consagrada a Ti, hoy y para siempre. En el nombre de Jesucristo.
      Amén.
    uk: Отче Небесний, завершуючи цей шлях молитви, я дякую Тобі за Твою любов, милість і
      вірність. Дякую за кожен день, у який Ти навчав, виправляв, зміцнював і вів мене. Допоможи
      мені й далі шукати Тебе всім серцем і жити для Твоєї слави. Нехай усе моє життя буде
      присвячене Тобі — сьогодні й навіки-віків. В ім'я Ісуса Христа. Амінь.
