- id: day_033
  ref: 1pe:5:7
  title:
    ru: Победа над тревогой
    en: Победа над тревогой
    es: Победа над тревогой
    uk: Победа над тревогой
  text:
    ru: Господи, Ты знаешь все мои переживания и заботы. Помоги мне не носить их в одиночку,
      а доверять их Тебе. Напомни мне, что Ты заботишься обо мне и держишь мою жизнь в Своих
      руках. Наполни мое сердце миром и уверенностью в Твоей любви. Во имя Иисуса Христа.
      Аминь.
    en: Господи, Ты знаешь все мои переживания и заботы. Помоги мне не носить их в одиночку,
      а доверять их Тебе. Напомни мне, что Ты заботишься обо мне и держишь мою жизнь в Своих
      руках. Наполни мое сердце миром и уверенностью в Твоей любви. Во имя Иисуса Христа.
      Аминь.
    es: Господи, Ты знаешь все мои переживания и заботы. Помоги мне не носить их в одиночку,
      а доверять их Тебе. Напомни мне, что Ты заботишься обо мне и держишь мою жизнь в Своих
      руках. Наполни мое сердце миром и уверенностью в Твоей любви. Во имя Иисуса Христа.
      Аминь.
