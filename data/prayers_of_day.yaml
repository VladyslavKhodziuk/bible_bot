    es: Вся слава Богу
    uk: Вся слава Богу
  text:
    ru: Отец Небесный, завершая этот путь молитвы, я благодарю Тебя за Твою любовь, милость
      и верность. Спасибо за каждый день, в который Ты учил, исправлял, укреплял и вел меня.
      Помоги мне продолжать искать Тебя всем сердцем и жить для Твоей славы. Пусть вся моя
      жизнь будет посвящена Тебе — сегодня и во веки веков. Во имя Иисуса Христа. Аминь.
