ai_pastor:
  consent_text: |
    🕊️ <b>Compañero espiritual</b>

    Soy un compañero IA que te escuchará y te ofrecerá un versículo bíblico para reflexionar.

    <b>Es importante entender:</b>
    • <b>No</b> soy pastor, sacerdote, médico ni psicólogo.
    • Soy tu compañero espiritual, buscando una Palabra para tu situación.
    • Para temas serios (salud, crisis, violencia) — acude a un especialista o a una línea de ayuda.
    • Límite — <b>3 consultas al día</b>.

    Al pulsar «Acepto» confirmas que lo entiendes.
  consent_agree: "✅ Acepto, continuar"
  prompt: |
    💬 <b>Cuéntame qué llevas en el corazón</b>

    Describe tu situación, pregunta o sentimiento en un solo mensaje.
    Intentaré ofrecerte un versículo y un pensamiento para reflexionar.

    ⏳ <i>Preparar la respuesta suele tomar unos 10 segundos.</i>

    <i>Consultas restantes hoy: {remaining} de {limit}</i>
  thinking: "🙏 Leyendo y preparando una respuesta para ti…"
  cancel: "← Cancelar"
  ask_more: "💬 Hacer otra pregunta"
  too_short: "⚠️ Por favor, escribe un poco más — al menos un par de frases."
  too_long: "⚠️ El mensaje es demasiado largo. Resume en menos de {max} caracteres."
  limit_reached: |
    🙏 Has alcanzado el límite de consultas de hoy ({limit} al día).

    Vuelve mañana — aquí estaré de nuevo.
