  last_used: "Esa fue tu última consulta de hoy ({limit}/{limit})"
  crisis_header: "💛 <b>No estás solo. Por favor, lee con atención.</b>"
  error: "🙏 Algo salió mal. Inténtalo de nuevo en un minuto."