  repentance:
    teaser: "🕊️ ¿Es tu primera vez acercándote a Dios?\nEmpieza con una oración de arrepentimiento."
    button: "🙏 Oración de arrepentimiento"
    done_button: "🙏 Ya oré"
    card: |-
      <b>🙏 Oración de arrepentimiento</b>

      <blockquote>Señor Jesucristo, vengo a Ti tal como soy. Reconozco que he pecado contra Ti y te pido que me perdones todos mis pecados. Creo que moriste por mí en la cruz y resucitaste para mi justificación.

      Hoy te abro mi corazón y te recibo como mi Señor y Salvador. Entra en mi vida, cámbiame, enséñame a seguirte y a hacer Tu voluntad. Gracias por el perdón, la salvación y el don de la vida eterna.

      En el nombre de Jesucristo. Amén.</blockquote>

      📖 Romanos 10:13 · «Porque todo aquel que invocare el nombre del Señor, será salvo.»
    congrats: |-
      🎉 <b>¡Felicidades!</b>

      Si te has vuelto con sinceridad al Señor Jesucristo, has dado el paso más importante de tu vida. Dios escucha a todo el que viene a Él con fe y arrepentimiento.

      <i>«Porque todo aquel que invocare el nombre del Señor, será salvo.» (Romanos 10:13)</i>

      Ahora comienza tu camino de seguir a Cristo. Aquí tienes algunos pasos importantes:

      📖 <b>Lee la Biblia cada día</b>
      Empieza con el Evangelio de Juan para conocer mejor a Jesucristo y Su enseñanza.

      🙏 <b>Ora a Dios con regularidad</b>
      Cuéntale lo que estás viviendo, dale gracias y pídele sabiduría cada día.

      ⛪ <b>Encuentra una iglesia fiel a la Biblia</b>
      La comunión con otros creyentes te ayudará a crecer espiritualmente y a fortalecerte en la fe.

      🛡️ <b>No te sorprendas ante las dificultades</b>
      Después del arrepentimiento pueden venir dudas y tentaciones. Confía en la Palabra de Dios y no en tus sentimientos.

      ❤️ <b>Procura vivir conforme a la voluntad de Dios</b>
      No intentes cambiar con tus propias fuerzas. Pídele al Señor cada día que transforme tu corazón y tu carácter.

      🌱 <b>Sigue creciendo espiritualmente</b>
      La vida cristiana es un camino. Hazlo paso a paso, confiando en Dios y siguiéndole.

      ¡Que el Señor te bendiga, te fortalezca en la fe y llene tu vida de Su paz y alegría!
  topics_title: "<b>📁 Oraciones por temas</b>"
