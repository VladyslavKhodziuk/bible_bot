    <b>Qué puedo hacer:</b>
    🕊️ Compañero espiritual (IA) — escucha y busca un versículo
    📖 Leer la Biblia en distintas traducciones
    🙏 Una oración para cada día con recordatorios
    🔍 Buscar versículos por palabras y temas
    💭 Encontrar la Palabra según cómo te sientes
    🎲 Versículo al azar, versículo del día y Sabiduría
    📚 Planes de lectura con recordatorios
