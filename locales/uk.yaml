faq:
  title: |-
    ❓ <b>Відповіді на часті запитання</b>

    Обери запитання — розкажу, чим стану в пригоді:
  back: "← До запитань"
  q:
    can_do: "Що вміє цей бот?"
    help_me: "Чим він може мені допомогти?"
    what_here: "Що я можу тут робити?"
    progress: "Що показує «Мій прогрес»?"
    free: "Це безкоштовно?"
    start: "З чого почати?"
  a:
    can_do: |-
      📖 <b>Я — твій супутник у Слові.</b>

      Ось що я вмію:
      • 📖 Читати Біблію в 7 перекладах
      • 🔍 Шукати вірші за словами
      • 💭 Добирати Слово під настрій
      • 📚 Вести плани читання з нагадуваннями
      • 🕊️ Духовний співрозмовник (ШІ) — вислухає і добере вірш
      • 🙏 Молитви на кожен день
      • 🎲 Вірш дня та випадковий вірш
      • ⭐ Закладки улюблених місць
      • 💡 Мудрості

      Усе — просто в Telegram і безкоштовно.
    help_me: |-
      🤍 <b>Я допоможу бути ближче до Бога щодня.</b>

      • Тривожно, сумно чи радісно — доберу вірш під твій стан (💭 За настроєм)
      • Є запитання про віру чи життя — вислухає 🕊️ духовний співрозмовник (ШІ)
      • Хочеш читати регулярно — план читання з нагадуваннями не дасть забути
      • Потрібні слова для молитви — знайдеш готові молитви на кожен день

      Я поруч, коли це потрібно.
    what_here: |-
      ✨ <b>Тут ти можеш:</b>

      • Відкрити будь-яку книгу і розділ Біблії
      • Знайти вірш за словом або темою
      • Отримати вірш дня й поділитися ним з близькими
      • Почати план читання і йти ним день за днем
      • Поговорити з духовним співрозмовником
      • Помолитися й відзначити день у молитві
      • Зберігати улюблені вірші в закладки

      Просто користуйся кнопками меню — усе під рукою.
    progress: |-
      📊 <b>«Мій прогрес» — це два лічильники твого шляху з Богом.</b>

      📖 <b>Зі Словом</b> — скільки всього днів ти був зі Словом. День зараховується, коли ти читаєш розділ Біблії, відкриваєш вірш дня, випадковий вірш або проходиш день плану читання.

      🙏 <b>У молитві</b> — скільки всього днів ти молився. День зараховується, коли ти натискаєш «Амінь» під молитвою дня.

      Обидва лічильники <b>лише зростають</b>: пропустив день, тиждень чи більше — ніщо не скидається й не згорає. За день зараховується максимум +1, скільки б разів ти не заходив.

      Це не гонка й не змагання з кимось — просто м’яке нагадування про твій шлях із Богом 🌱
    free: |-
      💚 <b>Так, повністю безкоштовно.</b>

      Читання, пошук, плани, молитви, духовний співрозмовник — усе доступно без оплати й без реклами.

      Проєкт живе на добровільні пожертви. Якщо він тобі допомагає, можна підтримати його кнопкою «❤️ Підтримати проєкт» — але це завжди за бажанням.
    start: |-
      🌱 <b>Почати просто:</b>

      1️⃣ Відкрий «🏠 Головне меню»
      2️⃣ Натисни «📖 Читати Біблію» або отримай 🎲 вірш дня
      3️⃣ Увімкни план читання, щоб читати регулярно
      4️⃣ Завітай до 🕊️ духовного співрозмовника, якщо є запитання

      Порада: у ⚙️ Налаштуваннях обери переклад, мову і час для вірша дня.
  ask:
    button: "✍️ Задати питання автору"
    prompt: |-
      <b>✍️ Запитай автора</b>

      Напиши, що хочеш запитати — я передам автору. Він постарається відповісти тобі особисто тут.
    sent: "✅ Дякую! Питання надіслано автору. Якщо він відповість — побачиш повідомлення прямо тут."
    reply_prefix: "💌 <b>Відповідь автора:</b>"
    delivery_ok: "✅ Доставлено користувачу."
    delivery_failed: "⚠️ Не вдалося доставити: користувач закрив ЛС або заблокував бота."

