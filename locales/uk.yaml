  repentance:
    teaser: "🕊️ Вперше звертаєтеся до Бога?\nПочніть з молитви покаяння."
    button: "🙏 Молитва покаяння"
    done_button: "🙏 Я помолився"
    card: |-
      <b>🙏 Молитва покаяння</b>

      <blockquote>Господи Ісусе Христе, я приходжу до Тебе таким, який я є. Я визнаю, що згрішив перед Тобою, і прошу прости мене за всі мої гріхи. Я вірю, що Ти помер за мене на хресті й воскрес для мого виправдання.

      Сьогодні я відкриваю Тобі своє серце і приймаю Тебе як свого Господа і Спасителя. Увійди в моє життя, зміни мене, навчи йти за Тобою і виконувати Твою волю. Дякую Тобі за прощення, спасіння і дар вічного життя.

      В ім'я Ісуса Христа. Амінь.</blockquote>

      📖 Римлян 10:13 · «Бо кожен, хто покличе Господнє Ім'я, буде спасений.»
    congrats: |-
      🎉 <b>Вітаємо!</b>

      Якщо ви щиро звернулися до Господа Ісуса Христа, то зробили найважливіший крок у своєму житті. Бог чує кожного, хто приходить до Нього з вірою і покаянням.

      <i>«Бо кожен, хто покличе Господнє Ім'я, буде спасений.» (Римлян 10:13)</i>

      Тепер починається ваш шлях наслідування Христа. Ось кілька важливих кроків:

      📖 <b>Читайте Біблію щодня</b>
      Почніть з Євангелія від Івана, щоб краще пізнати Ісуса Христа і Його вчення.

      🙏 <b>Моліться Богові регулярно</b>
      Розповідайте Йому про свої переживання, дякуйте Йому і просіть мудрості в кожному дні.

      ⛪ <b>Знайдіть біблійну церкву</b>
      Спілкування з іншими віруючими допоможе вам духовно зростати і зміцнюватися у вірі.

      🛡️ <b>Не дивуйтеся труднощам</b>
      Після покаяння можуть приходити сумніви та спокуси. Довіряйте Божому Слову, а не своїм почуттям.

      ❤️ <b>Прагніть жити за волею Бога</b>
      Не намагайтеся змінитися власними силами. Просіть Господа щодня перемінювати ваше серце і характер.

      🌱 <b>Продовжуйте зростати духовно</b>
      Християнське життя — це шлях. Робіть крок за кроком, довіряючи Богові й ідучи за Ним.

      Нехай Господь благословить вас, зміцнить у вірі й наповнить ваше життя Своїм миром і радістю!
