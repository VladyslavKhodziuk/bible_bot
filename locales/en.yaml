ai_pastor:
  consent_text: |
    🕊️ <b>Spiritual companion</b>

    This is an AI companion who will listen and offer a relevant Bible verse to reflect on.

    <b>Please understand:</b>
    • I am <b>not</b> a pastor, priest, doctor, or psychologist.
    • I am your spiritual companion, looking for a Word that fits your situation.
    • For serious matters (health, crisis, abuse) — reach out to a specialist or a helpline.
    • Limit — <b>3 requests per day</b>.

    By tapping "I agree" you confirm you understand this.
  consent_agree: "✅ I agree, continue"
  prompt: |
    💬 <b>Tell me what's on your heart</b>

    Describe your situation, question or feeling in one message.
    I'll try to offer a verse and a thought to reflect on.

    ⏳ <i>Preparing a response usually takes about 10 seconds.</i>

    <i>Requests left today: {remaining} of {limit}</i>
  thinking: "🙏 Reading and preparing a response for you…"
  cancel: "← Cancel"
  ask_more: "💬 Ask another question"
  too_short: "⚠️ Please write a bit more — at least a couple of sentences."
  too_long: "⚠️ The message is too long. Please keep it under {max} characters."
  limit_reached: |
    🙏 You've used today's request limit ({limit} per day).

    Come back tomorrow — I'll be here again.
  remaining: "Requests left today: {remaining} of {limit}"
  last_used: "That was your last request for today ({limit}/{limit})"
  crisis_header: "💛 <b>You are not alone. Please read carefully.</b>"
  error: "🙏 Something went wrong. Please try again in a minute."