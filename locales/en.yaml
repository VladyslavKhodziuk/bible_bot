  repentance:
    teaser: "🕊️ First time turning to God?\nStart with a prayer of repentance."
    button: "🙏 Prayer of repentance"
    done_button: "🙏 I have prayed"
    card: |-
      <b>🙏 Prayer of Repentance</b>

      <blockquote>Lord Jesus Christ, I come to You just as I am. I confess that I have sinned against You, and I ask You to forgive me for all my sins. I believe that You died for me on the cross and rose again for my justification.

      Today I open my heart to You and receive You as my Lord and Savior. Come into my life, change me, teach me to follow You and to do Your will. Thank You for forgiveness, salvation, and the gift of eternal life.

      In the name of Jesus Christ. Amen.</blockquote>

      📖 Romans 10:13 · «For whosoever shall call upon the name of the Lord shall be saved.»
    congrats: |-
      🎉 <b>Congratulations!</b>

      If you have sincerely turned to the Lord Jesus Christ, you have taken the most important step of your life. God hears everyone who comes to Him with faith and repentance.

      <i>«For whosoever shall call upon the name of the Lord shall be saved.» (Romans 10:13)</i>

      Now your journey of following Christ begins. Here are a few important steps:

      📖 <b>Read the Bible every day</b>
      Start with the Gospel of John to get to know Jesus Christ and His teaching better.

      🙏 <b>Pray to God regularly</b>
      Tell Him about what you are going through, thank Him, and ask for wisdom each day.

      ⛪ <b>Find a Bible-believing church</b>
      Fellowship with other believers will help you grow spiritually and be strengthened in faith.

      🛡️ <b>Don't be surprised by hardships</b>
      After repentance, doubts and temptations may come. Trust God's Word rather than your feelings.

      ❤️ <b>Seek to live by God's will</b>
      Don't try to change by your own strength. Ask the Lord every day to transform your heart and character.

      🌱 <b>Keep growing spiritually</b>
      The Christian life is a journey. Take it step by step, trusting God and following Him.

      May the Lord bless you, strengthen you in faith, and fill your life with His peace and joy!
  topics_title: "<b>📁 Prayers by topic</b>"
  topics_intro: "📖 Ready prayers for different life situations.\n\nChoose a topic below:"
