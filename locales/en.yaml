help:
  text: |
    📖 <b>Bible Way — Help</b>

    <b>Commands:</b>
    /start — launch the bot
    /menu — main menu
    /verse — verse of the day
    /settings — settings
    /help — this screen

    <b>What I can do:</b>
    🕊️ Spiritual companion (AI) — listens and finds a verse
    📖 Read the Bible in different translations
    🙏 A prayer for every day with reminders
    🔍 Search verses by words and topics
    💭 Find the Word for how you feel
    🎲 Random verse, verse of the day and Wisdom
    📚 Reading plans with reminders
    🔥 Day counters for the Word and prayer
    ⭐ Bookmark favorite passages
    ⚙️ Settings: language, translation, timezone and notifications

    Need help or have an idea? Open «❓ FAQ» or write to us via «👤 My account».

reply:
  main_menu: "🏠 Main menu"
  settings: "⚙️ Settings"
  faq: "❓ FAQ"
  support: "❤️ Support the project"
  intro: "👇 The buttons below are always at hand — open the menu, read the FAQ or support the project anytime."

faq:
  title: |-
    ❓ <b>Frequently asked questions</b>

    Pick a question — I'll tell you how I can help:
  back: "← To questions"
  q:
    can_do: "What can this bot do?"
    help_me: "How can it help me?"
    what_here: "What can I do here?"
    progress: "What does “My progress” show?"
    free: "Is it free?"
    start: "Where do I start?"
  a:
    can_do: |-
      📖 <b>I'm your companion in the Word.</b>

      Here's what I can do:
      • 📖 Read the Bible in 7 translations
      • 🔍 Search verses by words
      • 💭 Find the Word for how you feel
      • 📚 Keep reading plans with reminders
      • 🕊️ Spiritual companion (AI) — listens and finds a verse
      • 🙏 Prayers for every day
      • 🎲 Verse of the day and a random verse
      • ⭐ Bookmark favorite passages
      • 💡 Wisdom

      All right inside Telegram, and free.
    help_me: |-
      🤍 <b>I'll help you stay close to God every day.</b>

      • Anxious, sad or joyful — I'll find a verse for how you feel (💭 By mood)
      • Have a question about faith or life — the 🕊️ spiritual companion (AI) will listen
      • Want to read regularly — a reading plan with reminders keeps you on track
      • Need words to pray — you'll find ready prayers for every day

      I'm here when you need me.
    what_here: |-
      ✨ <b>Here you can:</b>

      • Open any book and chapter of the Bible
      • Find a verse by word or topic
      • Get the verse of the day and share it with loved ones
      • Start a reading plan and follow it day by day
      • Talk with the spiritual companion
      • Pray and mark a day in prayer
      • Save favorite verses to bookmarks

      Just use the menu buttons — everything's at hand.
    progress: |-
      📊 <b>“My progress” is two counters of your journey with God.</b>

      📖 <b>In the Word</b> — how many days in total you've spent with the Word. A day counts when you read a Bible chapter, open the verse of the day, a random verse, or complete a day of a reading plan.

      🙏 <b>In prayer</b> — how many days in total you've prayed. A day counts when you tap “Amen” under the prayer of the day.

      Both counters <b>only grow</b>: miss a day, a week or more — nothing resets or burns out. At most +1 per day, no matter how many times you come in.

      It's not a race or a competition with anyone — just a gentle reminder of your journey with God 🌱
    free: |-
      💚 <b>Yes, completely free.</b>

      Reading, search, plans, prayers, the spiritual companion — all available with no payment and no ads.

      The project runs on voluntary donations. If it helps you, you can support it with the “❤️ Support the project” button — but that's always optional.
    start: |-
      🌱 <b>Getting started is simple:</b>

      1️⃣ Open “🏠 Main menu”
      2️⃣ Tap “📖 Read the Bible” or get the 🎲 verse of the day
      3️⃣ Turn on a reading plan to read regularly
      4️⃣ Drop by the 🕊️ spiritual companion if you have a question

      Tip: in ⚙️ Settings pick your translation, language and the time for the verse of the day.

